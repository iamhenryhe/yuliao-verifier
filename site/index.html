<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语料查证器</title>
  <style>
    :root {
      --背景: #f5f5f7;
      --面板: #ffffff;
      --面板浅: #fbfbfd;
      --边框: #d2d2d7;
      --边框强: #c7c7cc;
      --文字: #1d1d1f;
      --次要: rgba(29,29,31,0.72);
      --强调: #0071e3;
      --强调浅: #e8f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--背景);
      color: var(--文字);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .页面 {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .侧栏 {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--边框);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .标题块, .侧块, .主块 {
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .标题块 {
      padding: 18px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }
    .侧块 {
      margin-top: 16px;
      padding: 14px;
    }
    .侧块标题 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }
    .排行列表 {
      display: grid;
      gap: 8px;
    }
    .排行按钮 {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
      color: var(--文字);
      text-align: left;
      cursor: pointer;
    }
    .排行按钮.选中 {
      border-color: var(--强调);
      background: var(--强调浅);
    }
    .排行主行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 620;
    }
    .排行副行 {
      margin-top: 6px;
      font-size: 12px;
      color: var(--次要);
    }
    .主体 {
      min-width: 0;
      padding: 22px;
    }
    .工具条 {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-bottom: 14px;
      background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.9) 75%, rgba(245,245,247,0) 100%);
    }
    .工具格 {
      display: grid;
      grid-template-columns: minmax(260px, .7fr) minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .字段 {
      display: grid;
      gap: 6px;
    }
    .字段标签 {
      font-size: 13px;
      color: var(--次要);
    }
    .输入框, .下拉框, .按钮 {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 14px;
      outline: none;
    }
    .输入框:focus, .下拉框:focus {
      border-color: var(--强调);
      box-shadow: 0 0 0 3px rgba(0,113,227,.16);
    }
    .按钮 {
      cursor: pointer;
      font-weight: 620;
    }
    .按钮.主按钮 {
      background: var(--强调);
      border-color: var(--强调);
      color: #ffffff;
    }
    .统计栏 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .统计卡 {
      padding: 14px;
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .统计名 {
      font-size: 12px;
      color: var(--次要);
      margin-bottom: 8px;
    }
    .统计值 {
      font-size: 28px;
      font-weight: 700;
    }
    .主块 {
      padding: 18px;
    }
    .主块标题行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .主块标题 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .结果数 {
      color: var(--次要);
      font-size: 15px;
    }
    .语料列表 {
      display: grid;
      gap: 14px;
    }
    .语料卡 {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
    }
    .语料头 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }
    .语料编号 {
      font-size: 16px;
      font-weight: 650;
    }
    .语料统计 {
      color: var(--次要);
      font-size: 13px;
    }
    .信息行 {
      margin: 8px 0 0;
      line-height: 1.7;
      font-size: 14px;
      color: var(--文字);
    }
    .信息标题 {
      color: var(--次要);
    }
    .正文 {
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.78;
      font-size: 15px;
      color: var(--文字);
      max-height: 9.2em;
      overflow: hidden;
      position: relative;
    }
    .语料卡.展开 .正文 {
      max-height: none;
    }
    .正文::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(251,251,253,0), rgba(251,251,253,1));
    }
    .语料卡.展开 .正文::after {
      display: none;
    }
    .操作行 {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .小按钮 {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 13px;
      cursor: pointer;
    }
    .空状态 {
      padding: 28px;
      text-align: center;
      border-radius: 8px;
      border: 1px dashed var(--边框强);
      color: var(--次要);
    }
    @media (max-width: 1200px) {
      .页面 {
        grid-template-columns: 1fr;
      }
      .侧栏 {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--边框);
      }
      .工具格 {
        grid-template-columns: 1fr;
      }
      .统计栏 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      .统计栏 {
        grid-template-columns: 1fr;
      }
      .主体, .侧栏 {
        padding: 16px;
      }
    }
  </style>
</head>

ce-353", "content": "20260602今日段子汇总\n...\n20260602今日段子汇总\n1、龙磁科技：永磁铁氧体龙头企业，金属软磁粉芯业务通过英飞凌等国际客户认证。公司在磁性材料配方与生产工艺上具备深厚积累，金属软磁粉芯产能逐步释放，受益于 AI 与新能源双轮驱动，实现从传统磁性材料向高端领域的战略升级\n2、裕太微：公司车载以太网物理层芯片已进入广汽、北汽、上汽、吉利、一汽红旗等汽车行业知名客户供应链\n3、世纪恒通：公司是腾讯微信公众号与视频号的信息及安全审核的核心供应商之一,公司也是腾讯云的战略伙伴。关于deepseek相关技术，公司已开展相关技术研究并接入部署，目前处于测试阶段，预计后续可应用于公司信息审核、ETC客服、小兔驾考等相关产品中\n4、华锡有色：据央视报道，AI算力爆发驱动半导体先进封装用锡消耗激增，AI单台服务器用锡量为传统服务器3倍以上，全球锡矿仅够开采15年，国内锡矿仅够开采12年左右，公司主营业务为有色金属勘探、开采、选矿以及工程监理等业务，主要产品为锡、锌、铅锑、铅、铜精矿和锡、铟等深加工产品\n5、节能铁汉：公司拟出售除保留资产负债以外的公司其他资产及负债，资产出售交易对方为中国节能集团或其他市场主体。同时，公司拟以支付现金方式向关联方购买股权类资产，购买的标的公司属于节能环保及设备制造行业。\n6、金房能源：公司业务包括IDC机房和智算中心液冷技术与蓄冷相变材料\n7、中京电子：公司主营柔性电路板（FPC）等，部分产品有直接或间接配套人形机器人的研发、生产等，此前已获得AI PC的小批量订单\n8、方大集团：国内幕墙行业龙头，国内最早从事节能幕墙业务的企业之一，产品覆盖单元式幕墙、太阳能光伏发电幕墙等\n9、金时科技：1、公司主营储能系统设备、混合储能系列、超级电容炭及储能消防装置，开发新型号产品(如3000F低内阻超级电容器)保持技术领先；2、公司通过智芯一号股权基金（持股99%）间接投资了苏州易缆微半导体技术有限公司；易缆微半导体是一家光纤通信产品研发生产商，致力于光纤通信系统、光网络系统、光电传感系统、物联网系统技术研究和试验发展及进出口业务\n10、大有能源：河南能源集团旗下煤炭企业；此前河南省委、省政府决定对间接控股股东河南能源集团和中国平煤神马控股集团实施战略重组\n11、福达合金：公司低压电接触材料销售额国内第一，高分断能力焊接触头组件已配套施耐德、西门子、ABB等全球头部客户，北美数据中心低压配套业务在关税压力下逆势增长\n12、红星发展：康宁为公司直接客户\n13、天洋新材：1、公司是国内最大的热熔胶生产企业之一，生产太阳能电池封装用EVA胶膜，拟定增12亿元扩产光伏胶膜；2、控股子公司烟台信友作为华为的二级供应商，在手机摄像头，手机结构防水，笔记本电池控制板的保护等方面为华为的产品提供胶黏剂的应用和解决方案\n14、火炬电子：国内特种 MLCC (片式多层陶瓷电容器) 领先企业；公司正积极拓展商业航天、低空经济供应链，已参与部分客户在商业航天领域的产品配套\n15、郑州煤电：1、实控人河南省国资委；公司是郑州煤炭龙头，拥有部分火电业务，参股公司复晟铝业（持股40%）拥有氧化铝粉产能；2、两大煤矿有望注入公司，未来或新增可采储量16.2亿吨\"\n16、达实智能：1、公司液冷全局优化节能控制系统已用于深圳光明生命科学城大数据中心，并中标国能商贸云计算中心、前海信息枢纽等项目；2、公司达实久信医用物流机器人目前已在多个试点医院落地运行；3、公司与华为在智慧空间领域一直保持着深度合作\n17、鸿远电子：公司为航天领域多层瓷介电容器（MLCC）的主要供应商之一\n18、长飞光纤：全球光纤光缆行业的领先企业；公司空芯技术产能水平领先，并已在相关项目中标\n19、中化国际：公司拟收购南通星辰100%股权，标的核心业务为环氧树脂和工程塑料，主营产品包括双酚A、环氧树脂、聚苯醚（PPE）、聚对苯二甲酸丁二酯（PBT）及系列改性工程塑料\n20、宇环数控：公司智能装备包括工业机器人及智能化成套装备等，为客户提供数字化、网络化的智能制造技术综合解决方案\n21、群兴玩具：公司孙公司图灵引擎科技与腾讯签订了《算力服务协议》，拟向腾讯提供集群算力服务；一季度业绩同比减亏\n22、安邦护卫：1、公司联合温州理工学院科研团队打造了“智能安防中枢平台”，创新性地应用四足机器人技术；2、下属子公司衢州安邦和衢州通航开展的无人机业务包含无人机驾驶员培训（民航培训、警航培训）、低空管制服务、无人机测绘等，公司自主研发的“零距离”空地一体无人机5G飞行平台还运用到消防救援等，均为低空经济范畴\n23、友发集团：公司全资子公司唐山友发参与投资了砺思星沐基金，砺思星沐基金持有沐曦集成电路公开发行前股份632.15万股，持股比例为1.76%\n24、华盛昌：公司拟收购伽蓝特100%股权，后者专注光通信模块和光芯片测试\n25、中大力德：公司核心零部件减速器主要运用于工业机器人和工业自动化场景，包括RV、谐波减速器\n26、深圳华强：公司是华为海思全系列产品代理商\n27、云汉芯城：目前大多数元器件品类价格处于上涨通道，包括存储、MLCC等，公司凭借全球供应网络及与供应商的长期合作，在涨价行情下能优先获取货源并从中受益\n28、东杰智能：公司智能物流装备融合AI、5G技术，已批量应用物流搬运机器人，助力客户打造无人工厂\n29、实益达：1、公司向ASM PT等全球头部客户提供半导体封装测试设备部件，并切入ABL、Signify供应链；2、公司主营LED智能照明产品、智能可穿戴等产品，海外销售占比超7成\n30、长江通信：1、参股公司长飞光纤是世界领先的光纤预制棒、光纤及光缆供应商之一；2、低轨卫星通信是公司重点开拓的新行业之一，公司背靠中国信科，其在星地融合标准制定上发挥了突出的贡献，自R18开始首次实现中国在3GPPNTN的标准立项，目前已累计牵头16项，是全球牵头卫星NTN立项最多的公司\n31、五方光电：公司表示拓展TGV技术在光学领域的应用\n32、阿莱德：公司主营通信设备零部件， 为5G应用开发的零部件产品拥有业内领先的性能，提供的产品包括射频与透波防护器件、 EMI及IP防护器件和电子导热散热器件等，可应用于光模块\n33、东山精密：全球第三的印刷电路板企业、全球第二的柔性线路板企业；在电子电路领域，公司专注于为行业领先的客户提供全方位电子电路（PCB）产品及服务，PCB 业务涵盖刚性、柔性、刚挠结合板等全系列产品\n34、太极实业：DRAM封装龙头；子公司海太半导体的封测业务主要是为SK海力士的DRAM产品提供后工序服务，对12英寸1Z纳米级晶圆进行集成电路封装\n35、博杰股份：1、子公司博捷芯（深圳）半导体有限公司的划片机具备切割玻璃基板的技术能力，划片机已实现微米级定位精度，崩边率控制在1%以内，支持分层划切工艺，可针对不同厚度的玻璃基板提供定制化解决方案；2、子公司博捷芯（深圳）半导体有限公司的划片机已适用于光通信行业，具备磷化铟衬底切割技术能力；参股公司珠海鼎泰芯源产品主要应用于光纤通信、光探测器等领域；3、公司自研液冷散热方案已植入GPU测试设备，面向英伟达、微软、阿里等全球头部服务器厂商供货，并推进从设备向零部件供应的战略转型\n36、XD博威合：公司开发的高强高导高速连接器材料是目前算力服务器所用铜连接的核心材料\n37、继峰股份：公司为国内乘用车座椅头枕细分市场龙头之一，近日成为某新能源汽车主机厂的座椅总成供应商\n38、锡业股份：1、公司从事锡、铜、锌矿的开采、选矿以及锡、铜、锌金属的冶炼和锡的深加工；2、另外拥有铟资源储量5987吨，铟冶炼产能60吨/年\n39、南山控股：房地产+产城综合性开发商\n40、贵研铂业：云南国资委旗下，国内全产业链铂族贵金属相关产品龙头；全资子公司贵研黄金（云南）有限公司主要从事以黄金为主的加工、销售、仓储及租赁服务等业务\n41、金海高科：公司控股股东拟变更为游戏大佬金丹良\n42、江西铜业：公司为国内最大铜精矿和铜加工厂商，主营业务为铜和黄金的采选、冶炼与加工\n43、模塑科技：公司与国内某机器人公司签订采购框架协议并正式获得人形机器人外覆盖件小批量订单，业务正式切入人形机器人赛道\n44、汇源通信：公司光纤、光缆及相关产品业务主要包括研发生产销售ADSS、OPGW特种光缆、预制光缆、气吹微缆、非金属光缆等\n45、永鼎股份：1、公司已经实现了从光芯片-光器件-光模块-系统集成的全产业链布局；2、公司高温超导带材已应用于超导感应加热、超导磁拉单晶、可控核聚变磁体、超导电力装备等领域\"\n46、韶能股份：子公司韶能算电拟出资10亿元设立乐昌全资孙公司开展源网荷储电源业务\n47、三利谱：国内偏光片行业龙头企业之一，国内少数具备TFT-LCD用偏光片生产能力的企业之一，是华为等全球著名终端品牌显示屏材料供应商\n48、凯迪股份：公司是线性驱动系统龙头，网传资料显示，公司招聘电机研发工程师，工作让内容包括负责机器人用伺服电机电磁方案分析及结构方案设计\n49、大胜达：公司与芯瞳半导体及其原股东已于5月19日正式签署Pre-B轮增资及股权转让协议，公司以5.5亿元取得芯瞳半导体22.9831%股权，标的公司是国内专注于通用高性能图形处理器芯片设计研发与销售的先驱企业\n50、金字火腿：全资子公司拟不超过3亿元取得中晟微电子不超过20%股权，后者专注于高速光模块核心电芯片的研发设计\n51、亨通光电：公司收购J-Fiber，部署特种光纤和数据中心多模光纤产能。公司空芯光纤也在2025年供应链博览会和联通合作伙伴大会展出，性能达到业内领先水平\n52、科瑞技术：公司为国内外客户提供超高精密部件、光耦合设备、共晶设备等多款半导体封装及测试设备，光耦合、共晶、芯片AOI设备均已量产\n53、华锋股份：国内少数能向国际市场出口低压化成箔产品的企业之一；公司在超级电容用材料的研发方面有一定的技术储备\n54、美迪凯：1、公司自主开发TGV 玻璃通孔工艺，通过激光诱导与湿法腐蚀实现最小10μm孔径加工，为半导体封测、MEMS及AI芯片3D堆叠提供核心玻璃基板制程能力；2、公司开发了光刻用掩模版衬底并已开始送样，这是光刻工序中的关键耗材。同时，公司为生产需要引进了先进的光刻设备（如用于新产品开发的12英寸90nm节点KrF光刻机）\n55、东睦股份：公司已布局轴向磁通电机，该类电机适用于人形机器人、四足机器狗等领域\n56、华微电子：公司集功率半导体器件设计研发、芯片加工、封装测试及产品营销为一体，拥有多条功率半导体分立器件及 IC 芯片生产线，产品种类覆盖功率半导体器件全部范围\n57、远东股份：1、公司一季报净利润同比增长110.36%，拟定增募资不超20亿元加码AIDC光纤预制棒项目；2、公司为环首都太行山能源信息技术产业基地项目、“全国一体化算力网络”和林格尔数据中心集群绿色能源供给示范项目、阿里巴巴张北云计算数据中心工程等提供高效、节能、安全、环保的创新解决方案；3、公司人形机器人线缆已应用于优必选产品，并送样智元机器人，采用高柔韧性材料，具备抗弯折和扭转性能\n58、鑫科材料：公司布局高速铜连接领域，产品涵盖800G-1.6T的ACC/AEC高速铜连接，并在研1.6T及3.2T高速铜连接项目，为AI与算力中心提供连接解决方案\n59、达利凯普：公司射频微波MLCC市占率全球前五、中国第一\n60、麦格米特：英伟达给钱联合开发下一代液冷电源&规模突破北美主流CSP和国内前三互联网大厂&在英伟达rubin配套的18.5KW模块测试遥遥领先同行，第一个通过，将获得很大份额\n61、香江控股：公司是以商贸流通为主业的广州优质开发商\n62、北投科技：公司“科宝”交通大模型及智检机器人、无人机机巢等成果已落地\n63、圣泉集团：国内领先的 PCB 基板用电子树脂供应商\n64、意华股份：国内少数实现高速连接器量产的企业之一；公司聚焦于5G、6G和光通讯模块的研发制造，具有完整自主知识产权的5GSFP、SFP+系列产品已陆续研发成功并通过关键客户各项性能测试\n65、华远控股：公司实控人北京市西城区国资委正在筹划对下属部分企业集团重组，可能涉及控股股东华远集团\n66、顺景科技：公司并非单纯园林标的，通过顺景光通讯（51%控股）深度绑定苏驼通信（49%技术入股），切入5G前传+高速光模块+数据中心配套优质赛道。苏驼作为国家级高新技术企业，拥有170+专利、千万级光模块年产能，是运营商核心供应商，细分赛道实力远超市场认知", "preview": "20260602今日段子汇总\n...\n20260602今日段子汇总\n1、龙磁科技：永磁铁氧体龙头企业，金属软磁粉芯业务通过英飞凌等国际客户认证。公司在磁性材料配方与生产工艺上具备深厚积累，金属软磁粉芯产能逐步释放，受益于 AI 与新能源双轮驱动，实现从传统磁性材料向高端领域的战略升级\n2、裕太微：公司车载以太网物理层芯片已进入广汽、北汽、上汽、吉利、一汽红旗等汽车行业知名客户供应链\n3、世纪恒通：公司是腾讯微信公众号与视频号的信息及安全...", "sectors": ["AI应用", "AI配电", "PCB", "光伏", "光模块", "军工", "功率模拟", "化工", "半导体材料", "商业航天", "国产算力", "地产", "家电家居", "有色", "机器人", "汽车", "消费电子", "液冷服务器", "煤炭", "环保", "电力", "电力设备", "稀土", "轻工", "通信", "钢铁", "食品饮料"], "companies": ["XD博威合", "三利谱", "世纪恒通", "东山精密", "东杰智能", "东睦股份", "中京电子", "中化国际", "中大力德", "云汉芯城", "五方光电", "亨通光电", "凯迪股份", "北投科技", "华微电子", "华盛昌", "华远控股", "华锋股份", "华锡有色", "南山控股", "博杰股份", "友发集团", "圣泉集团", "大有能源", "大胜达", "天洋新材", "太极实业", "宇环数控", "安邦护卫", "实益达", "意华股份", "方大集团", "模塑科技", "永鼎股份", "汇源通信", "江西铜业", "深 content": "【中信机械】造船板块（#松发股...\n【中信机械】造船板块（#松发股份、中国船舶、中国动力）近期回调点评： 新船价格持续上涨，基本面无任何变化，纯资金面扰动，坚定看好造船板块投资机会\n上周Clarksons新船价格指数185点，较上周环比上涨0.1%。二手船价格指数达209.9点，环比上涨0.1%。目前Clarksons新船价格指数较21年初价格底部上涨48%，较年初基本持平。\n2026年5月全球新船订单约540万CGT/200亿美金，同比增长128%/131%。2026年1-4月全球造船订单约2710万CGT/811亿美金（油轮/集装箱船/散货船/LNG运输船分别占比32%/30%/12%/13%），分别同比增长49%/44%。目前全球造船厂在手订单约2.02亿CGT/5.26亿DWT，在手订单保障年数4.23年，继续创新高，造船行业景气持续。\n#今年以来VLCC持续爆单，订单开始向二三线船厂外溢： 今年以来VLCC订单已达102艘，仅次于2006年全年历史最高记录的108艘，目前VLCC价格较年初已上涨超6000万元，受制于一线船厂产能持续紧缺，近期VLCC订单开始向二三线船厂外溢，除中集、大金重工以外，本周芜湖造船厂和惠生能源也陆续拿下首批VLCC订单，分别为8艘和10艘。\n#长期来看，基于目前全球航运船队老龄化及新能源化的底层逻辑，叠加全球地缘政治冲突激烈化、全球贸易格局碎片化趋势，集装箱船、油轮、散货船行情轮动交替演绎，我们判断本轮造船景气周期可持续至2030年以后。\n#短期来看，我们看好2026年造船行业复苏行情，全球新造船订单自25年11月以来延续强劲复苏态势（美国关税/301调查谈判落地、叠加下游油运市场景气持续上行），新船价格指数自26年3月以来已经连续上涨，当下中船、恒力、扬子江等主要船厂业绩已呈现加速释放态势，随着行业贝塔复苏，无论从行业景气度、业绩的确定性和弹性还是估值性价比角度看（#松发股份、中国船舶2027年PE已不到10倍（Wind一致预期）），造船行业为2026值得重点关注和配置的板块，当前时点作重点推荐。\n中国船舶、恒力重工、中集集团、中国动力、船舶ETF、苏美达、中船防务H、中国船舶租赁、纽威股份、亚星锚链、扬子江。\n欢迎联系中信机械团队交流，获取相关公司和行业PPT、模型等资料以及造船行业数据库", "preview": "【中信机械】造船板块（#松发股...\n【中信机械】造船板块（#松发股份、中国船舶、中国动力）近期回调点评： 新船价格持续上涨，基本面无任何变化，纯资金面扰动，坚定看好造船板块投资机会\n上周Clarksons新船价格指数185点，较上周环比上涨0.1%。二手船价格指数达209.9点，环比上涨0.1%。目前Clarksons新船价格指数较21年初价格底部上涨48%，较年初基本持平。\n2026年5月全球新船订单约540万CGT/200亿美金，...", "sectors": ["AI配电", "交运", "商业航天"], "companies": ["中国动力", "中国船舶", "中国船舶租赁", "中船防务H", "中集集团", "亚星锚链", "恒力重工", "扬子江", "松发股份", "纽威股份", "苏美达"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 3, "companyRowCount": 11, "timestampCount": 14, "timestamps": ["2026-06-02 11:30"]}, {"id": "evidence-317", "content": "[礼物]【中信通信】英伟达与M...\n[礼物]【中信通信】英伟达与Marvell同时强调AI光互联重要性，关注光互联/CPO板块\n[太陽] 6月2日Computex大会上，Marvell CEO 发表主题演讲，Nvidia CEO黄仁勋亲自登台对谈：关于 AI 数据中心光互连与 CPO趋势\n演讲核心催化如下：\n[太陽]连接性成为AI基础设施新瓶颈：计算和内存瓶颈已逐步解决，下一阶段系统性能将由连接架构定义。AI工作负载需数万至数百万颗处理器协同，Agentic AI、混合专家模型等进一步推高数据移动需求，连接成为规模化扩展的关键。\n[太陽]铜墙右移，机架内转向光学：机架内部在400G单通道后将触及铜缆距离极限，当前200Gbps下极限约2.5米，已接近机架实际布线需求，机架内全互联将逐步转向光学。Marvell重点展示其CPO方案，光纤直连消除PCB走线，显著提升密度并降低功耗，成为突破物理限制的核心路径。\n[太陽]黄仁勋直言“尽可能用铜，能用光的地方全用光”，未来5-10年铜 n2）27年完成10k算力卫星在轨验证；\n3）28年实现30k高算力卫星协同推理、70B大模型在轨运行，开启首批商业化应用；\n4）29年突破多星异轨协同训练技术，扩大产业合作生态圈；\n5）30年建成150k规模化在轨算力服务体系，推出标准化Token化服务模式，形成完整商业闭环。\n[玫瑰]天算星座是由北邮发起，联合多所高校、科研院所以及中国移动、华为等单位共建的一个开放开源的空天计算在轨试验平台。据北邮官微，25年，北邮二号/三号卫星平台升空，高光谱载荷和超百Gbps星间激光通信载荷完成在轨验证任务，是业界首次实现了单载波200Gbps通信速率。\n[玫瑰]政策持续升温，产业落地加速。4月，工信部表示将谋划引导太空算力建设应用的政策措施，加快太空算力产业生态培育。5月中旬，上海太空算力产业生态伙伴计划成立，“星枢计划”同步启动，拟在十五五期间完成1000颗卫星组网建设。5月，北京太空智算研究院注册成立，将围绕星载算力芯片、星间激光通信、太空能源与散热、天地一体化网络及空间安全标准等方向开展技术攻关，并计划于2028年前完成首发试验星研制与发射。\n[玫瑰]两日连发，低轨星座进入密集发射期。5月31日，星网手机直连平板试验星发射入轨，本组卫星采用简洁高效的平板式设计、堆叠发射，采用点式堆叠分离机构，主要用于开展手机宽带直连、天地网络融合等技术试验验证。6月1日，长征十二号乙运载火箭搭载千帆星座第十批组网卫星发射成功，这也是长12B首飞，后续将择机开展一子级回收试验。\n[玫瑰]受益标的：迈为股份、紫光国微、普天科技、信维通信、信科移动、上海瀚讯、成都华微、智明达等。\n风险提示：下游风险不及预期等。\n华西军工首席陆洲13661893188（SACNO：S1120520110001）", "preview": "【华西军工】重点关注太空算力\n[玫瑰]核心观点：目前，国内正逐步开展太空算力组网建设和先导验证，加速星载智算芯片和星间激光通信等技术攻关，多项星座组网计划有序开展。我们认为，行业正在进入“在轨验证+政策升温+产业链攻关”的阶段。\n[玫瑰]今日，在北京市卫星物联网行业发展大会上，天算星座太空算力产业阶梯式发展规划发布：\n1）26年重点推进10k算力星集成、芯片架构启动及载荷样机设计；\n2）27年完成10k算力卫星在轨验证；\n3）28年实现...", "sectors": ["光伏", "军工", "商业航天"], "companies": ["上海瀚讯", "信科移动", "信维通信", "成都华微", "普天科技", "智明达", "紫光国微", "迈为股份"], "sources": ["wechat_group_4"], "sectorRowCount": 3, "companyRowCount": 8, "timestampCount": 11, "timestamps": ["2026-06-02 07:50"]}, {"id": "evidence-38", "content": "【申万建材】电子布持续：6月提...\n【申万建材】电子布持续：6月提价超预期，景气持续上行！#大算力# #周期涨价#\n6月1日起，7628布提价0.7元/米至7.2-7.5元/米，2116布提价0.8-0.9元/米至9.2-9.5元/米，1080布提价0.9-1元/米至9.6-9.9元/米，提价节奏加速。\n#T布最为紧缺。ABF载板面积、层数、数量等均释放乘数效应，T布需求持续倍增，消费电子端T布应用增加可期；T布价值量占ABF载板价值量仅0.5%，占消费电子则更低。最紧缺+价值量占比低蕴含巨大提价机会。\n#二代布同样稀缺。二代布企业订单已排至年底，AI服务器层数增加带动需求暴增，长认证周期、织布机约束、海外龙头扩产慢等特点导致二代布持续紧缺。\n#下游扩产节奏更快。我们统计2026年一季度CCL、PCB主要企业Q1资本开支增速均在100%以上，而玻纤板块资本开支增速仅30%左右，且玻纤行业格局更好，理应享受更高的估值水平。\n#国产织布机迎发展窗口期。关键纺机设备依赖进口、交付周期延长已成为玻纤板块重要的“卡脖子”问题，当前丰田织布机订单已排产至2030年，给国产织布机提供了关键宝贵的突破机会。\n重点：\n1）首推特种布：最紧缺T布龙头#宏和科技，二代布龙头#国际复材，大满贯选手#中材科技； 产业链一体化企业 建滔积层板&建滔集团；\n2）普通布龙头且特种布突破在即的 中国巨石；\n3）新进入者且确定性较高的#山东玻纤、#聚杰微纤；\n4）织布机国产替代核心标的#泰坦股份、#卓郎智能。\n☎欢迎交流：任杰19512256636/宋涛/郝子禹17321138296/傅浩玮", "preview": "【申 而是硬件互联能力。\n墨菲提出，从铜缆互连向光学互连的产业切换已经在当下落地推进，并非远期规划，本轮变革将催生半导体行业有史以来级别极高的新一轮需求扩张。\n墨菲依托实物产品佐证观点，他现场拿出自研相干光学模块，该产品属于Marvell工程复杂度顶尖的产品品类，整合先进制程 CMOS 数字信号处理器、第四代硅光子技术与硅锗工艺宽带模拟元器件。\n墨菲现场并排展示两款交换机产品，首款是全新发布的 Teralynx T100，为人工智能数据中心量身打造的102.4T 交换机，采用 3 纳米工艺，整机功耗低于 1000 瓦，功耗指标相较竞品降低 25%；另一款为共封装光学架构交换机。\n两款产品架构差异十分直观：T100 机型依靠 PCB 板内铜走线把信号传输至面板光模块，而共封装光学交换机直接将光纤引入芯片封装内部，彻底取消板内铜缆线路。\n墨菲原话：光线直接从芯片封装内部引出。\n铜墙的物理原理\n墨菲的核心逻辑依托基础物理规律：铜缆的信号传输距离和带宽呈反比关系。\n单通道速率 100G 时，铜缆有效传输距离约 5 米，可以满足单机架服务器互联需求。\n速率提升至 200G 后，传输距离压缩至 2.5 米，已经贴近机架物理层高与布线极限。\n行业全面迈向 400G 单通道时代后，铜缆已经无法实现机架内部全链路布线。\n墨菲：这道铜制的壁垒正在不断向内收缩，而且收缩进程就在眼前。\n共封装光学：为何势在必行\n墨菲表示，机架内部的互联改造无法沿用机架间同款光学方案。\n机架内部互联线路总量约为机架间连线数量的 10 倍，传统标准光模块受功耗、空间限制，无法在高密度场景完成布设。\n共封装光学方案把光引擎直接集成在交换机 / 算力芯片封装内，光纤直连芯片端、不再接驳前面板。\n该技术融合先进半导体工艺、硅光子、先进封装、光学互连多项技术，整套架构高度集成。\n墨菲称这是Marvell承接的工程难度最高的研发项目之一，公司已经持续十余年投入相关技术储备。\n英伟达 Vera Rubin 平台落地的 Spectrum-X 硅光子交换机，是业界首款量产共封装光学交换机，落地案例印证产业转型从概念落地至商用阶段。\n愿景：无距离的数据中心\n墨菲前瞻性观点：光互连不止解决带宽瓶颈，还会从底层重构数据中心硬件架构。\n当前人工智能服务器把处理器、显卡、定制加速芯片、内存固定组合封装，原因是各类器件需要近距离依靠铜缆实现高带宽互通。\n固定配比的硬件结构，会出现算力、内存资源错配，部分硬件资源在特定业务负载下长期闲置。\n当服务器内部连线全部换成光学方案后，物理距离不再成为硬件绑定约束。\n算力、内存、网络硬件可以拆分为独立资源池，按照业务负载需求灵活组合调度。\n硬件设计人员能够围绕业务需求定制人工智能算力集群，不再被硬件互联规格束缚。\n产业终极目标：搭建无物理距离约束的数据中心，海量算力、存储资源整合成统一资源池，硬件配置可以按需动态调整。\n台湾供应链的配套支撑\n墨菲明确，整套产业落地离不开台湾本地成熟的制造产业链。\nMarvell多年持续大批量出货 PAM4 相关产品，提前锁定产能、储备量产经验，同步和日月光等台湾封装厂商深度合作，前置布局产能。\n客户当下需要落地性强、稳定性达标、可规模化量产的整套方案，仅依靠单点技术或者小批量试制无法满足产业落地需求。\n企业投入与产业落地\nMarvell为落地整套技术路线累计投入约 36 亿美元。\n其中 25 亿美元用于多笔企业收购，包含 Inphi、Celestial AI 等光子产业链标的；\n剩余约 11 亿美元投入内部研发，同步剥离非核心业务聚焦主业。\n目前Marvell是全行业极少数能够完整落地全链路光互连产品的厂商，产品覆盖从芯片封装内部、机架、跨机房全距离场景，同时绑定量产制造供应链。", "preview": "Marvell CEO 表示铜...\nMarvell CEO 表示铜墙正移入机架内部，共封装光学是唯一出路\n在 2026 台北电脑展首日，Marvell科技首席执行官马特・墨菲面向行业参会嘉宾提出明确观点：人工智能基础设施下一阶段的核心发展瓶颈不在算力与内存，而是硬件互联能力。\n墨菲提出，从铜缆互连向光学互连的产业切换已经在当下落地推进，并非远期规划，本轮变革将催生半导体行业有史以来级别极高的新一轮需求扩张。\n墨菲依托实物产品佐证观点，...", "sectors": ["半导体", "通信"], "companies": ["Marvell科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 2, "companyRowCount": 1, "timestampCount": 3, "timestamps ，最终里程碑付款金额尚存在不确定性。\n同时，全资子公司美国海思科收到FDA上市批准通知，公司自主研发的1类静脉麻醉创新药环泊酚注射液（商品名：思舒宁®/CYPSEDO）获批上市，用于「成人全身麻醉诱导」。环泊酚系中国首个拥有全球自主知识产权的1类静脉麻醉创新药，亦是首个走向国际的中国静脉麻醉原研创新药。\n环泊酚海外Ⅲ期临床研究结果表明（WCA 2024）：针对接受择期手术并行气管插管的成人全身麻醉诱导患者，环泊酚组 vs. 丙泊酚组麻醉诱导成功率为97.0% vs. 97.6%，组间差异-0.57%（95%CI：-5.4%-4.2%）未跨越-8%的非劣效下界，达到主要终点。注射痛方面，在至少发生轻度疼痛（定义为NRS评分≥1）上，环泊酚组显著低于丙泊酚组（18.0% vs. 77.1%，p<0.0001）；在至少发生中度及严重注射部位疼痛（定义为NRS评分≥4）上，环泊酚组受试者比例也显著低于丙泊酚组：6.0% vs 61.4%（p<0.0001）。安全性方面，与丙泊酚相比，环泊酚组总体TEAEs发生率更低（22.0% vs. 53.0%）。\n在中国，环泊酚已获批多项适应症（全身麻醉诱导/维持、非气管插管的手术/操作中的镇静和麻醉、全身麻醉诱导和维持、重症监护期间的镇静、儿童/青少年全身麻醉诱导和维持等），于2022年纳入国家医保，截至2026年5月已在3,300余家医疗机构使用，覆盖4,000余万人次。后续公司将积极推动环泊酚在美国及其他地区的商业化落地。\n资料来源：公司公告\n注：仅为公开资料整理，不具备投资建议\n联系人：柳一林18322237137/杨希成/黄翰漾/孙媛媛", "preview": "【兴证医药】海思科与礼来达成小...\n【兴证医药】海思科与礼来达成小分子创新药研发合作，最高29.67亿美元里程碑金额；环泊酚注射液获FDA批准上市\n海思科全资子公司与礼来签署《授权与研发合作协议》：海思科将依托小分子创新技术平台，负责礼来选定的最多5个靶点创新药项目的发现及早期研发工作；礼来获得相关项目全球独家权利或大中华区以外独家权利，海思科保留部分项目大中华区独家权利。财务条款上，海思科有权获得首付款及近期付款最高8,700万美元...", "sectors": ["医药"], "companies": ["海思科"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-06-02 07:45"]}, {"id": "evidence-104", "content": "【凯伦股份】交流要点\n1. ...\n【凯伦股份】交流要点\n1. 佳智彩确认获得coherent设备订单；主要是OCS的液晶光阀环节的通路检测。去年Co海选供应商送样，今年小批量只给到公司一家；按照预研-定制设备的流程，公司后续份额较高；且相关设备研发经验可以向其他客户复制。\n2. 玻璃基板TGV领域有量测、检测两类设备，已有demo；公司历史上和京东方合作较深，也给国内其他头部玻璃基板企业送样。", "preview": "【凯伦股份】交流要点\n1. ...\n【凯伦股份】交流要点\n1. 佳智彩确认获得coherent设备订单；主要是OCS的液晶光阀环节的通路检测。去年Co海选供应商送样，今年小批量只给到公司一家；按照预研-定制设备的流程，公司后续份额较高；且相关设备研发经验可以向其他客户复制。\n2. 玻璃基板TGV领域有量测、检测两类设备，已有demo；公司历史上和京东方合作较深，也给国内其他头部玻璃基板企业送样。", "sectors": ["建筑建材"], "companies": ["凯伦股份"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-06-02 08:55"]}, {"id": "evidence-319", "content": "【利通科技】等静压产品进展迅速，MLCC+固态电池+食品饮料千亿级下游撑起高成长赛道\n[玫瑰]等静压技术基于帕斯卡原理，通过液体/气体介质实现全方位均匀施压，成型密度高、均匀性好，是传统单轴压制无法替代的高端成型工艺，下游应用场景正加速拓宽。\n#应用场景一：MLCC。MLCC占陶瓷电容市场超90%份额，广泛应用于手机、汽车电子、AI服务器等领域。等静压工艺是MLCC陶瓷粉体成型的关键环节，可实现高致密度、高均匀性压坯，直接影响产品 5", "content": "【美团】2026Q1收入略低于...\n【美团】2026Q1收入略低于预期，核心本地商业亏损环比改善超预期，利润拐点或已显现\n2026Q1美团收入910.4亿元，YOY+5.6%，略低于彭博一致预期（927亿），经调整净利润-49.7亿，大幅好于彭博一致预期（-70亿），核心商业及新业务亏损均好于预期。\n竞争态势趋缓，即时配送大幅减亏，收入640.6亿元，YOY+0.1%，主要因竞争激烈、扣除的补贴增加抵消了交易金额的增幅，经营利润-20.3亿元，环比2025Q4经营亏损100.5亿元实现大幅度收窄。（1）即时配送与闪购：审慎采取补贴策略，用户结构与核心用户频次持续提升。通过“品牌卫星店”、“拼好饭”及“美团闪电仓”升级供应链，商家订单转化率及留存明显改善。（2）到店、酒旅业务：一站式平台定位巩固，核心品类稳步增长。\n收入269.8亿元，同比增长21.3%，经营亏损21.2亿元，经营亏损率7.8%，同比收窄2.4pct。（1）小象超市持续扩大地域覆盖，自有品牌占比提升；（2）Keeta在成熟市场依托规模效应实现效率显著提升，新市场强劲增长。\n（1）消费者端：AI助手“小团”智能搜索迭代；推出“小团健康管家”，实现一站式问诊、购药和预订服务。（2）商家端：全套AI工具解决经营痛点。“智能掌柜”服务超70万家餐饮商户；“数字员工”支持超30万家服务零售商户；针对酒旅推出AI解决方案“既白”，在低星及高星酒店得到充分验证。\n随行业非理性竞争态势有所缓和，美团动态优化营销策略，26H2外卖UE有望回正，竞争格局趋稳及宏观环境复苏有望驱动利润增速上修。餐饮外卖核心壁垒为配送网络稳定性，美团精细化运营履约能力稳固，即时零售及海外积极投入供应链及基础设施建设，长期闪购及生鲜零售业务具弹性，海外有望贡献增量。我们预计2026-2028年调整后净利润-30/263/430亿，当前股价对应27/28年PE 16/10X。", "preview": "【美团】2026Q1收入略低于...\n【美团】2026Q1收入略低于预期，核心本地商业亏损环比改善超预期，利润拐点或已显现\n2026Q1美团收入910.4亿元，YOY+5.6%，略低于彭博一致预期（927亿），经调整净利润-49.7亿，大幅好于彭博一致预期（-70亿），核心商业及新业务亏损均好于预期。\n竞争态势趋缓，即时配送大幅减亏，收入640.6亿元，YOY+0.1%，主要因竞争激烈、扣除的补贴增加抵消了交易金额的增幅，经营利润-20...", "sectors": ["互联网服务"], "companies": ["美团"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-06-02 07:46"]}, {"id": "evidence-167", "content": "【联想集团】ISG拐点确立，利...\n【联想集团】ISG拐点确立，利润目标对标海外头部厂商，AI服务器量价齐升驱动估值重估【东财海外】\n🧧【6月1日台北GTC更新】英伟达发布NVIDIA RTX Spark超级芯片，面向个人AI智能体时代的Windows PC。联想集团为RTX Spark首批合作厂商之一。据英伟达介绍，今年秋季起，联想集团等厂商将陆续推出搭载该芯片的轻薄Windows笔记本和小型台式机。同时，英伟达宣布Vera Rubin平台进入全面量产，联想作为Vera Rubin NVL72全球首发合作伙伴，将交付全液冷，机架级AI系统。\n🧧预计26财年ISG收入增长目标进一步上修；运营利润率预计维持3%+水平，长期对标海外头部厂商，盈利拐点路径清晰。集团层面预计26财年Q1营收实现增长，利润增速快于收入。中期目标两年左右迈向千亿美元收入规模，净利润率目标向3%迈进，3-4年看5%。\n🧧AI服务器是ISG内部增长核心。AI服务器目前占ISG收入约30%，截至财年末AI服务器项目储备扩大至210亿美元，且预计转换率较高。产品端构建1+3+N矩阵（支持Intel/AMD/N款GPU），NVL72机柜已全面交付，联想是NVIDIARubin平台全球首发合作伙伴之一，Rubin架构平台预计26H2推出；液冷技术领先。客户结构上，国内通过\"问天\"自主品牌切入国内头部互联网厂商；海外主打GB300/NVL72/V3新平台，对接NeoClouds。26年4月完成对以色列高端企业级存储公司Infinidat100%股权收购，补齐高端存储短板，纳入ISG体系运营。\n🧧稀缺的合规拿货资质是结构性壁垒。联想是目  "sectors": ["商业航天"], "companies": ["乾照光电"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-06-02 09:01"]}, {"id": "evidence-187", "content": "🧧【国投硬科技】#联特科技：物...\n🧧【国投硬科技】#联特科技：物料、订单、技术三重共振，北美客户突破打开翻倍空间\n🧱物料保障：行业缺“芯”，联特不缺料\n高速光模块最怕的不是没订单，而是有订单却拿不到核心光芯片。当前行业供给依然偏紧，而#公司已获得住友、长光华芯等核心供应商较为充足的高速光芯片供应保障，后续新增产能也将逐步释放，有望凭借供应链优势优先承接北美客户需求。公司在核心光芯片资源上的卡位有望成为后续业绩兑现的重要支撑，在相关订单顺利兑现的情景下，#对应利润弹性或接近40亿元。配合产能上，公司马来西亚槟城工厂一期、二期已全面投产，三期扩产规划持续推进。#订单、物料、产能逐步形成闭环，为后续高速光模块放量奠定基础。\n📝订单兑现：Meta突破、谷歌放量，北美客户版图加速打开🛫\n#订单永远是一家实业公司技术实力和产品竞争力最好的验证。💪公司正完成从通过Arista间接供货Meta到#直供Meta 的关键跨越。近期马来西亚槟城工厂顺利通过Meta验厂，意味着后续大规模放量障碍基本扫清。目前800G产品已实现出货，1.6T产品同步推进送样验证。与此同时， AOC及2×400G FR4产品已实现稳定供货，1.6T可插拔模块完成验证并进入首批交付准备阶段，预计H2开启批量出货。此外，#公司参与微软Azure光模块认证、亚马逊等北美云厂商验证进展顺利，客户导入持续推进。\n💡技术领先：三大路线技术齐备，CPO纯正标的浮出水面\n相比短期业绩弹性，市场或更容易忽视公司在下一代光互联领域的技术卡位。公司同时布局#InP、硅光及TFLN三大技术路线，是国内少数具备多技术平台能力的光模块厂商之一。其中，#CPO光引擎已通过英伟达认证进入试产阶段，耦合效率达到95%以上，在功耗及成本优化方面展现出较强竞争力。\n🎯市场熟悉中际旭创的硅光路径，也认可新易盛的EML优势，而联特同时拥有TFLN布局、CPO储备以及光器件垂直整合能力，正逐步从百亿启动向千亿甚至万亿巨头看齐。当前订单、光芯片物料两大核心难题均已看到突破，高端高速光模块产能有望由2026年的400-500万只提升至2027年的1000万只。#我们认为公司近期基本面发生较大反转，建议重点关注。", "preview": "🧧【国投硬科技】#联特科技：物...\n🧧【国投硬科技】#联特科技：物料、订单、技术三重共振，北美客户突破打开翻倍空间\n🧱物料保障：行业缺“芯”，联特不缺料\n高速光模块最怕的不是没订单，而是有订单却拿不到核心光芯片。当前行业供给依然偏紧，而#公司已获得住友、长光华芯等核心供应商较为充足的高速光芯片供应保障，后续新增产能也将逐步释放，有望凭借供应链优势优先承接北美客户需求。公司在核心光芯片资源上的卡位有望成为后续业绩兑现的重要支撑，在相关订...", "sectors": ["光模块"], "companies": ["联特科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-06-02 09:50"]}, {"id": "evidence-414", "content": "盘前 / 盘后总结\n盘后科技...\n盘前 / 盘后总结\n盘后科技线仍由 AI 基础设施主导，但交易不再只看英伟达公司\n高盛、汇丰、摩根士丹利和多条行业资讯共同指向，ASIC、服务器网络、DRAM、CPO、电力与液冷正在接棒，资本开支强度仍高，瓶颈也更分散\n互联网和软件侧不再是单纯 AI 想象力\n美团公司的核心本地商业亏损收窄，Alphabet 公司被重新定义为用广告现金流建设 AI 算力的资本公司\nOracle 公司、ServiceNow 公司、Atlassian 公司、有道公司等材料则把 AI 变现拉回订单、收入、利润率和定价模型\n风险也在升温，MacroCharts 与野村同时提醒半导体拥挤交易和期权结构，能源与霍尔木兹风险继续扰动通胀预期\n长端利率缓解短期支撑权益，但高估值硬件链需要持续兑现订单和价格", "preview": "盘前 / 盘后总结\n盘后科技...\n盘前 / 盘后总结\n盘后科技线仍由 AI 基础设施主导，但交易不再只看英伟达公司\n高盛、汇丰、摩根士丹利和多条行业资讯共同指向，ASIC、服务器网络、DRAM、CPO、电力与液冷正在接棒，资本开支强度仍高，瓶颈也更分散\n互联网和软件侧不再是单纯 AI 想象力\n美团公司的核心本地商业亏损收窄，Alphabet 公司被重新定义为用广告现金流建设 AI 算力的资本公司\nOracle 公司、ServiceNo...", "sectors": [], "companies": ["Alphabet", "Atlassian", "Oracle", "ServiceNow", "有道", "美团", "英伟达"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 0, "companyRowCount": 7, "timestampCount": 7, "timestamps": ["2026-06-02 21:05"]}, {"id": "evidence-397", "content": "【财通灰灰团队】美股软件业绩总...\n【财通灰灰团队】美股软件业绩总结：如何理解IGV反弹 20260602\n美股软件年初以来经历了两轮比较清晰的反弹：第一轮是2月底至3月初，从极端悲观仓位和估值低位中初步修复；第二轮从4月中旬开始，IGV五月单月收盘涨幅约21.2%，从4月低点反弹近50%，核心在于软件开始用业绩回答“AI吞噬论”——DDOG、SNOW、FROG等基础软件公司普遍beat & raise，usage-based revenue重新进入加速轨道。\n板块内部分化明显，数据库、网安、开发工具等基础软件回暖明显，应用软件虽然跟随修复，但信心相对年初大多仍偏弱。其中头部公司AI收入开始有一定量级，而市场更关注这部分收入是否能拉动公司增速，对AI侵蚀seats/利润率的长期担忧并未消失。\n“AI吞噬软件”叙事从极端化回到理性定价，我们观点和此前路演交流一致，有私域数据、合规门槛、行业责任边界的软件安全垫充足，并且可能进一步受益于AI带来的软件能力边界扩大→TAM扩大。随美股软件情绪回暖，港股侧建议关注基本面边际向好的金蝶国际、聚水潭、浪潮数字企业、迈富时。", "preview": "【财通灰灰团队】美股软件业绩总...\n【财通灰灰团队】美股软件业绩总结：如何理解IGV反弹 20260602\n美股软件年初以来经历了两轮比较清晰的反弹：第一轮是2月底至3月初，从极端悲观仓位和估值低位中初步修复；第二轮从4月中旬开始，IGV五月单月收盘涨幅约21.2%，从4月低点反弹近50%，核心在于软件开始用业绩回答“AI吞噬论”——DDOG、SNOW、FROG等基础软件公司普遍beat & raise，usage-based rev...", "sectors": [], "companies": ["浪潮数字企业", "聚水潭", "迈富时", "金蝶国际"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 0, "companyRowCount": 4, "timestampCount": 4, "timestamps": ["2026-06-02 10:25"]}, {"id": "evidence-415", "content": "Sivers 与格芯携手推进人...\nSivers 与格芯携手推进人工智能数据中心光学解决方案\nSivers 的激光阵列产品将配套格芯的硅光子平台以及 SCALE 光学引擎方案，项目目标瞄准2030 年整体规模 250 亿美元的可插拔光学市场。\n2026 年 6 月 2 日，瑞典基斯塔，全球光子与无线技术龙头 Sivers 半导体正式官宣，和格芯达成战略合作，双方共同面向高景气人工智能基建市场研发新一代先进硅光子产品。\nSivers 自研激光阵列会被集成进格芯硅光子平台的参考设计方案内。\n本次合作可以落地多款光学互联架构，覆盖共封装光学、线性可插拔光学以及其余新一代数据中心互连产品。\nSivers 激光阵列同样适配格芯 SCALE 共封装光引擎平台，用于下一代光学子组件与光引擎架构研发。\n格芯 SCALE 共封装光学方案整合集成光子器件、粗波分复用、密集波分复用与先进封装工艺，以此提升带宽密度与系统拓展能力。\nSivers 首席营收官表示，人工智能算力负载与超大规模数据中心持续扩容，行业需要高带宽、高能效、可拓展的前沿光子技术，本次合作助力两家公司站稳硅光子技术研发第一梯队。\n格芯硅光子产品线资深研究员表态，伴随人工智能数据中心朝着高带宽、低功耗迭代，格芯硅光子业务需求持续走高；搭配 Sivers 激光阵列技术后 unt": 0, "companyRowCount": 1, "timestampCount": 1, "timestamps": ["2026-06-02 09:13"]}, {"id": "evidence-390", "content": "Anthropic 已秘密提交...\nAnthropic 已秘密提交上市申请草案，有望在今年秋季华尔街上市的竞赛中超越其长期竞争对手 OpenAI 。", "preview": "Anthropic 已秘密提交...\nAnthropic 已秘密提交上市申请草案，有望在今年秋季华尔街上市的竞赛中超越其长期竞争对手 OpenAI 。", "sectors": [], "companies": ["Anthropic"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 0, "companyRowCount": 1, "timestampCount": 1, "timestamps": ["2026-06-02 09:13"]}, {"id": "evidence-416", "content": "Arm Holdings（AR...\nArm Holdings（ARM）：AI时代CPU架构的绝对垄断者、授权费模式利润非线性爆发\nARM与x86是全球CPU最主流的两大指令集架构（即CPU设计的语言规则）。 采用复杂指令集，性能强、但功耗高&发热严重。由Intel创立、后AMD等也在使用。 采用精简指令集，核心优势是高能效、功耗极低。在手机、平板等移动设备端拥有统治地位。由ARM公司授权给其他厂商，如苹果、高通等。\nARM为AI时代的必选项。\n大模型满载运算会让芯片功耗飙升，同等算力下，ARM架构CPU的功耗比x86减少30%-40%，是解决AI数据中心电费爆炸和AI笔记本散热问题的唯一解。\n#②打破“内存墙”提高传输速度：本地运行AI大模型需要极高的数据传输速度。传统x86架构的CPU内存和显卡显存相互独立，延迟极高。ARM架构天然支持将CPU、GPU封装在同一块芯片内（SoC），并实现高达128GB的超大统一内存，让CPU和显卡共享极速通道。\n#科技巨头最新动作：全面抛弃Intel、消费端&数据中心两头包抄。\n① 消费端（AI笔记本电脑）：2026年6月1日Computex上，英伟达发布首款消费级电脑芯片RTX Spark（集成20核自研ARM CPU + Blackwell GPU）。微软、戴尔、联想等巨头同步推出首款旗舰AI笔记本电脑。英伟达正式全线倒向ARM架构制造PC主芯片。\n② 后端（AI数据中心）：为削减巨额电费，亚马逊（Graviton）、谷歌（Axion）、微软（Cobalt 100）等云计算巨头，100%放弃采购Intel，全面自研基于ARM架构的服务器CPU。同时，英伟达最核心的AI服务器GB200，其中央处理器（Grace CPU）同样完全基于ARM架构。\n#ARM：无敌的生态壁垒、躺着收租。由于全球所有操作系统（Windows、Android、iOS）和几百万软件的底层代码都已经对 ARM 进行了长达数十年的深度适配，软件生态壁垒无敌。\n#全面转向v9架构与CSS、ASP提升2-3倍。ARM正在推行最新的v9架构和CSS（计算子系统）方案，向客户交付“接近成品”的芯片设计，可以使客户自研芯片的周期缩短一半，公司的权利金（Royalty）费率直接翻倍。26Q1公司授权及权利金收入同比暴增45%+。\n#纯IP授权模式、轻资产运营、利润非线性爆发。ARM 纯IP授权模式没有任何制造成本，研发人员成本是固定的，毛利率高达97%以上。未来收入增加的部分都是纯利润，预计远期净利率达45%左右（FY26净利率18%）。\n投资建议：公司指引，#FY2031年收入翻5倍、EPS翻10倍（现在是0.85美金/股，2031年要做到9➕），即FY2031营业收入250亿美元、归母净利润95亿+美元。27/28年实现归母净利润12/16亿美元，建议重点关注！", "preview": "Arm Holdings（AR...\nArm Holdings（ARM）：AI时代CPU架构的绝对垄断者、授权费模式利润非线性爆发\nARM与x86是全球CPU最主流的两大指令集架构（即CPU设计的语言规则）。 采用复杂指令集，性能强、但功耗高&发热严重。由Intel创立、后AMD等也在使用。 采用精简指令集，核心优势是高能效、功耗极低。在手机、平板等移动设备端拥有统治地位。由ARM公司授权给其他厂商，如苹果、高通等。\nARM为AI时代的...", "sectors": [], "companies": ["Arm Holdings" dence-403", "content": "【中信证券前瞻】Alphabe...\n【中信证券前瞻】Alphabet 800亿美元股权融资速评\n【事件回顾】\n6月2日，谷歌母公司Alphabet宣布合计800亿美元股权融资，为美股史上最大单笔股权募资，分三部分：1）承销公开发行300亿美元（150亿强制可转换优先股+150亿A/C类普通股）；2）ATM（按市价发行）400亿美元，预计26Q3启动；3）伯克希尔·哈撒韦私募认购100亿美元，较周一收盘折价约6~8%。用途上，约500亿美元（承销发行、伯克希尔私募及部分ATM）投向AI基础设施与算力等公司用途，另约300亿美元（ATM部分）用于2026年员工股权归属相关税务安排。\n【影响分析】\n我们认为此次融资对财务股权影响有限，不改变投资方向判断：1）800亿中真正新增AI投入资金约500亿，另约300亿仅为员工股权税务的财务安排（公司现金先行垫付、再发股补足），本质是既有股权激励摊薄的渠道调整。2）800亿相对4.5万亿美元市值摊薄不足2%，扣除员工股权税务部分后实际增量更小。3）伯克希尔以6%~8%折价认购，折价并不高，且其作为此前对AI重资本投入偏审慎、现金充裕的代表性资金，参与本身对股东信心形成有力背书。4）公司选择将部分额度（400亿ATM）放在Q3择机增发，亦表明其对后续业务走向的信心。\n【投资观点】\n我们认为，此次融资是Alphabet在AI基建周期下的主动积极扩张，再次展现公司对于AI需求与回报潜力的判断；当前融资金额对于股权稀释影响较小，且按照公司资本开支规划与27年表述，继续外部融资并不意外。我们继续看好谷歌在AI产业链中的核心地位与长期价值创造能力，后续重点跟踪AI资本开支的增量ROIC。\n欢迎联系中信证券前瞻团队！", "preview": "【中信证券前瞻】Alphabe...\n【中信证券前瞻】Alphabet 800亿美元股权融资速评\n【事件回顾】\n6月2日，谷歌母公司Alphabet宣布合计800亿美元股权融资，为美股史上最大单笔股权募资，分三部分：1）承销公开发行300亿美元（150亿强制可转换优先股+150亿A/C类普通股）；2）ATM（按市价发行）400亿美元，预计26Q3启动；3）伯克希尔·哈撒韦私募认购100亿美元，较周一收盘折价约6~8%。用途上，约500亿...", "sectors": [], "companies": ["/"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 0, "companyRowCount": 1, "timestampCount": 1, "timestamps": ["2026-06-02 12:43"]}, {"id": "evidence-399", "content": "【中金互联网】腾讯AI视角讨论...\n【中金互联网】腾讯AI视角讨论：不败而后胜\n如果将长周期AI布局看成一场战役，确保不败者，更有概率获胜，我们认为腾讯恰是那个不败者。\n如将布局AI简化为AI组织优先级、资本开支和产品产出，相对于同行，腾讯AI动作看似较慢，我们认为原因可能来自腾讯独特的产品基因（社交），以及偏自下而上的组织架构和文化等因素：本轮AI需要千亿级资本开支、集中式组织调整，高度依赖自上而下的快速决策。\nAI是机遇，也可能是风险。腾讯社交和游戏等主业强韧性，正像打仗时始终握着充足的粮草一样，是腾讯长周期持续投资AI趋势的最大底气。基于此，腾讯已经从底层基础模型和提升AI创新冗余度两方面积极布局。模型层面，4月即将发布混元3.0，有望迎来进展。基于去中心化组织鼓励创新方面，元宝积极动作本质上是内部传递出鼓励AI创新的坚定态度，而近期Claw浪潮中腾讯也有行业相对更加积极应对。\n微信具备三重基础属性：熟人社交、服务和内容，其中熟人社交是核心壁垒，也难以被AI颠覆，而微信小程序等独特生态、微信独有用户数据等则是微信面对Agent等机遇独特的杠杆。然而微信面对AI的机遇，似乎显得“过于保守”。我们认为，微信的核心价值观不是克制（张小龙在微信公开课公开否认过），而坚持自身的核心价值观，做到恰到好处。新功能推出核心以给用户创造价值为前提，若ToC AI Agent用户场景定义更加清晰，隐私等风险能更好管控，微信Agent的价值也将自然显现。\n我们认为只要腾讯坚持弱者心态，微信坚持价值创造原则，中国科技巨头不陷入非理性扩张竞争的投资困境，腾讯过度的投资的概率不高。\n完整报告欢迎联系交流：白洋/肖俨衍/魏萌#", "preview": "【中金互联网】腾讯AI视角讨论...\n【中金互联网】腾讯AI视角讨论：不败而后胜\n如果将长周期AI布局看成一场战役 \n【AI PC：N1X芯片切入PC CPU市场】\n英伟达联合微软及联发科推出N1X平台，构建覆盖笔记本、台式机及工作站的AI PC产品线。黄仁勋表示PC正从“应用中心”转向“Agent中心”，未来个人电脑将成为个人AI助手运行平台。DGX工作站最高支持768GB内存及万亿参数模型运行，AI PC产业链有望迎来新一轮升级周期。\n【物理AI:Cosmos 3+Isaac GR00T发布】\n英伟达发布Cosmos 3物理世界基础模型、Alpamayo自动驾驶模型及Isaac GR00T机器人平台，加速机器人、自动驾驶及工业智能化应用落地。公司正逐步构建覆盖云端Agent、终端AI及Physical AI的完整生态体系。\n我们认为，本次演讲完整展示了Agent时代的产业路线图：企业级Agent创造需求，AI Factory生产Token，Vera Rubin运行Agent，N1X推动Agent向终端渗透，Cosmos加速Physical AI落地。算力需求的决定因素正从模型训练转向Agent数量与任务复杂度，Agent应用爆发将持续推动推理算力、AI服务器及数据中心基础设施进入新一轮成长周期。", "preview": "【国金计算机&科技】黄仁勋GTC台湾演讲要点\n【Agent时代到来，Token就是收入】\nAgent具备记忆、规划、工具调用及长期任务执行能力，将重构软件开发、企业办公、科研等场景。以软件开发为例，GitHub年度Commit量已从2023年的3亿次增长至2025年的5亿次，而2026年前几个月已接近再翻3倍。黄仁勋强调“Token就是收入”，未来AI工厂本质是Token生产工厂。\n【软件行业迎重构机会】\n软件不会被Agent取代，而是...", "sectors": [], "companies": ["/"], "sources": ["wechat_group_1"], "sectorRowCount": 0, "companyRowCount": 1, "timestampCount": 1, "timestamps": ["2026-06-02 07:45"]}, {"id": "evidence-411", "content": "【宇树单款人形机器人累计生产下...\n【宇树单款人形机器人累计生产下线约11000台】财联社6月2日电，宇树单款人形机器人累计生产下线约11000台。小财注：6月1日上交所上市审核委员会召开2026年第31次上市审核委员会审议会议，审议结果显示，宇树科技股份有限公司首发符合发行条件、上市条件和信息披露要求。", "preview": "【宇树单款人形机器人累计生产下...\n【宇树单款人形机器人累计生产下线约11000台】财联社6月2日电，宇树单款人形机器人累计生产下线约11000台。小财注：6月1日上交所上市审核委员会召开2026年第31次上市审核委员会审议会议，审议结果显示，宇树科技股份有限公司首发符合发行条件、上市条件和信息披露要求。", "sectors": [], "companies": ["宇树科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 0, "companyRowCount": 1, "timestampCount": 1, "timestamps": ["2026-06-02 17:37"]}, {"id": "evidence-400", "content": "【建投医药】Moderna公布...\n【建投医药】Moderna公布个体化mRNA肿瘤疫苗联合疗法随访最新数据\n6月1日，默沙东/Moderna在ASCO大会上公布了肿瘤新抗原mRNA疫苗Intismeranantuogene+K药用于手术切除黑色素瘤2b期临床KEYNOTE-942随访五年的最新数据。\n分析显示，Intismeranantuogene+K药治疗组相比于K药单药治疗，5年复发或死亡风险降低49%，远端转移或死亡风险降低59%。5年总生存率也显示出改善的鼓舞趋势（HR=0.471）。\n目前该联合疗法正在探索多个适应症，包括黑色素瘤、非小细胞肺癌等三项三期临床，以及多个瘤种的二期临床，覆盖围手术期早期癌症的治疗，以及晚期实体瘤的治疗。根据此前Moderna的公告，该联合疗法将于26年获得针对晚期黑色素瘤的临床3期数据。\n以上内容来自公司公告，欢迎联系建投医药袁清慧/王在存/刘若飞/汤然/贺菊颖沟通交流。", "preview": "【建投医药】Moderna公布...\n【建投医药】Moderna公布个体化mRNA肿瘤疫苗联合疗法随访最新数据\n6月1日，默沙东/Moderna在ASCO大会上公布了肿瘤 DrMos，海内外算力最大公约数。\n产业链建议关注，杰华特/芯朋微", "sectors": [], "companies": ["/"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 0, "companyRowCount": 1, "timestampCount": 1, "timestamps": ["2026-06-02 12:42"]}, {"id": "evidence-386", "content": "【长江社服】美团FY2026Q...\n【长江社服】美团FY2026Q1业绩点评：亏损环比大幅收窄，关注竞争缓和下UE修复节奏\n🌷事件描述：\n🔔 FY2026Q1，公司实现营收910亿元（vs彭博一致预期908亿元），同比+5.6%；经营亏损65亿元（vs彭博一致预期90亿元）；经调整净亏损50亿元（vs彭博一致预期68亿元）。\n🌷事件评论：\n⭐ 整体业绩：2026Q1，公司实现营收910亿元（vs 一致预期908亿元），经调整净亏损50亿元（vs 一致预期亏损68亿元），上年同期为经调整净利润109亿元。环比来看，亏损较2025Q4明显收窄，经营亏损由161亿元收窄至65亿元，经调整净亏损由151亿元收窄至50亿元。其中，核心本地商业收入641亿元，经营亏损20亿元，经营利润率-3.2%；新业务收入270亿元，经营亏损21亿元，经营利润率-7.8%。核心本地商业与新业务亏损收窄幅度均超市场预期。\n⭐ 餐饮外卖+闪购：1Q26外卖表现超预期，美团中高价订单份额稳固，平台ARPU和用户忠诚度增强。我们预计1Q26外卖UE亏损约1元，较4Q25显著收窄，主要受益于行业补贴趋于理性、单均补贴下降、订单结构改善及中高AOV订单优势延续。展望2Q26，美团4-5月UE已实现小幅盈利，2Q26外卖有望实现盈亏平衡。全年UE改善节奏仍需根据竞争环境动态调整，但美团与阿里在纯餐饮外卖UE上的差距目前已扩大至约3元，核心差异来自AOV与单均补贴。公司继续强化“品牌卫星店”“美团闪电仓”“歪马送酒”“品牌官旗闪电仓”等创新供给，并优化配送及商户运营支持体系。长期看，公司外卖UE有望恢复至1元或更高水平，日均单量有望达1亿单。\n⭐ 到店酒旅：短期仍受竞争投入扰动，但长期本地服务供给深度、用户心智与交易闭环优势仍是美团核心护城河。预计1Q26到店酒旅收入增速放缓至高单位数，OPM环比稳定在25%。公司依托“黑珍珠榜单”“必吃榜”“必玩榜”“必住榜”等高质量供给体系，为优质商家提供精准流量，并提升消费者决策效率；同时打通会员积分与连锁商家会员体系，帮助商家优化客户留存与管理。展望未来，公司计划继续强化到店服务数字化工具和AI赋能，通过榜单推荐、会员策略和标准化运营，持续提升商户经营效率和用户体验，预计利润率短期维持稳定，长期仍具回升空间。\n⭐ 新业务：1Q26新业务收入270亿元，同比增长21.3%，经营亏损21亿元，环比显著减亏。收入增长主要由食杂零售业务及海外业务扩张驱动，部分抵消美团优选关停影响。小象超市持续扩大地域覆盖，供应链能力进一步增强，产品品质、价格竞争力及自有品牌占比持续提升，并在北京、宁波开设实体店，强化品牌体验与全渠道能力，长期有望实现低个位数可持续利润率。Keeta方面，香港已实现盈亏平衡，沙特及其他中东市场、巴西效率提升显著，预计整体投入可控。\n⭐ AI及生态投入：Q1公司继续加速AI布局，提升消费者决策效率与商家经营效率。消费者端，“小团”深度集成至App导航栏，支持跨业务场景的智能搜索与服务，并推出“小团健康管家”，支持在线问诊、购药及医疗预约等一站式服务；商家端，“智能掌柜”已服务超70万家餐饮商户，“数字员工”服务超30万家服务零售商户，酒店AI解决方案“既白”已在低星及高星酒店场景验证。长期有望提升商户经营效率、平台转化效率及服务履约体验，进一步强化本地生活生态壁垒。\n⭐ 投资建议：展望后市，2026Q1业绩已验证公司在竞争缓和阶段的利润弹性，核心本地商业经营亏损由2025Q4的100亿元收窄至20亿元，新业务亏损由46亿元收窄至21亿元，亏损改善幅度好于市场预期。若外卖及即时零售竞争继续从补贴消耗转向效率比拼，美团凭借高价值用户结构、优质商户供给、即时配送履约网络及本地生活全场景交易闭环，仍有望维持领先份额，并推动UE持续修复。短期建议关注补贴及营销投入的边际变化、外卖+闪购UE改善节奏、到店酒旅利润率修复及Keeta海外投入效率；中长期看，公司“商户+用户+履约”三边网络飞轮仍具备较强护城河，盈利能力有望伴随竞争趋稳逐步回归。预计美团2026-2028年营收4101.17、4569.75和5024.47亿元，经调整净利润分别为-19.15         .concat(数据.sectors.map(项 => `<option value="${转义(项.name)}">${转义(项.name)}</option>`))
        .join('');
      元素.个股列表.innerHTML = 数据.companies
        .map(项 => `<option value="${转义(项.name)}"></option>`)
        .join('');
    }

    function 写入排行() {
      元素.板块排行.innerHTML = 数据.sectors.slice(0, 14).map(项 => `
        <button class="排行按钮 ${状态.板块 === 项.name ? '选中' : ''}" data-板块="${转义(项.name)}">
          <div class="排行主行"><span>${转义(项.name)}</span><span>${数字.format(项.outputCount)} 条</span></div>
          <div class="排行副行">支撑语料 ${数字.format(项.evidenceCount)} 条</div>
        </button>
      `).join('');
      元素.个股排行.innerHTML = 数据.companies.slice(0, 14).map(项 => `
        <button class="排行按钮 ${状态.个股 === 项.name ? '选中' : ''}" data-个股="${转义(项.name)}">
          <div class="排行主行"><span>${转义(项.name)}</span><span>${数字.format(项.outputCount)} 条</span></div>
          <div class="排行副行">支撑语料 ${数字.format(项.evidenceCount)} 条</div>
        </button>
      `).join('');
    }

    function 取结果() {
      return 数据.evidences.filter(语料 => {
        if (状态.板块 && !语料.sectors.includes(状态.板块)) return false;
        if (状态.个股 && !语料.companies.includes(状态.个股)) return false;
        return true;
      });
    }

    function 写入结果() {
      const 结果 = 取结果();
      元素.结果数.textContent = `当前结果 ${数字.format(结果.length)} 条`;
      if (!结果.length) {
        元素.语料列表.innerHTML = '<div class="空状态">没有找到支撑语料。</div>';
        return;
      }
      元素.语料列表.innerHTML = 结果.map((语料, 序号) => `
        <article class="语料卡" id="${语料.id}">
          <div class="语料头">
            <div class="语料编号">语料 ${序号 + 1}</div>
            <div class="语料统计">板块行数 ${数字.format(语料.sectorRowCount)}　个股行数 ${数字.format(语料.companyRowCount)}</div>
          </div>
          <div class="信息行"><span class="信息标题">板块：</span>${转义(语料.sectors.join('、') || '无')}</div>
          <div class="信息行"><span class="信息标题">个股：</span>${转义(语料.companies.join('、') || '无')}</div>
          <div class="正文">${转义(语料.content)}</div>
          <div class="操作行">
            <button class="小按钮" data-展开="${语料.id}">展开 / 收起</button>
            <button class="小按钮" data-复制="${语料.id}">复制语料</button>
          </div>
        </article>
      `).join('');
    }

    function 同步控件() {
      元素.板块筛选.value = 状态.板块;
      元素.个股搜索.value = 状态.个股;
    }

    function 写入地址() {
      const 参数 = new URLSearchParams();
      if (状态.板块) 参数.set('板块', 状态.板块);
      if (状态.个股) 参数.set('个股', 状态.个股);
      history.replaceState(null, '', `${location.pathname}#${参数.toString()}`);
    }

    function 读取地址() {
      const 片段 = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      const 参数 = new URLSearchParams(片段);
      状态.板块 = 参数.get('板块') || '';
      状态.个股 = 参数.get('个股') || '';
    }

    function 重绘() {
      同步控件();
      写入排行();
      写入结果();
      写入地址();
    }

    function 设板块(名称) {
      状态.板块 = 名称 || '';
      if (状态.个股) {
        const 个股 = 数据.companies.find(项 => 项.name === 状态.个股);
        if (个股 && 状态.板块 && !个股.sectors.includes(状态.板块)) {
          状态.个股 = '';
        }
      }
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function 设个股(名称) {
      状态.个股 = 名称 || '';
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', async (事件) => {
      const 板块按钮 = 事件.target.closest('[data-板块]');
      if (板块按钮) {
        设板块(板块按钮.dataset.板块);
        return;
      }
      const 个股按钮 = 事件.target.closest('[data-个股]');
      if (个股按钮) {
        设个股(个股按钮.dataset.个股);
        return;
      }
      const 展开按钮 = 事件.target.closest('[data-展开]');
      if (展开按钮) {
        const 卡片 = document.getElementById(展开按钮.dataset.展开);
        if (卡片) {
          卡片.classList.toggle('展开');
        }
        return;
      }
      const 复制按钮 = 事件.target.closest('[data-复制]');
      if (复制按钮) {
        const 卡片 = document.getElementById(复制按钮.dataset.复制);
        const 文本 = 卡片?.querySelector('.正文')?.textContent || '';
        await navigator.clipboard.writeText(文本);
        复制按钮.textContent = '已复制';
        setTimeout(() => {
          复制按钮.textContent = '复制语料';
        }, 1200);
      }
    });

    元素.板块筛选.addEventListener('change', 事件 => {
      状态.板块 = 事件.target.value;
      重绘();
    });

    元素.跳转个股.addEventListener('click', () => {
      const 词 = 元素.个股搜索.value.trim();
      if (!词) return;
      const 精确 = 数据.companies.find(项 => 项.name === 词);
      if (精确) {
        设个股(精确.name);
        return;
      }
      const 模糊 = 数据.companies.find(项 => 项.name.includes(词));
      if (模糊) {
        元素.个股搜索.value = 模糊.name;
        设个股(模糊.name);
      }
    });

    元素.个股搜索.addEventListener('keydown', 事件 => {
      if (事件.key === 'Enter') {
        元素.跳转个股.click();
      }
    });

    读取地址();
    写入统计();
    写入筛选器();
    重绘();
  </script>
</body>
</html>
