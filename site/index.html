<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语料查证器</title>
  <style>
    :root {
      --背景: #f5f5f7;
      --面板: #ffffff;
      --面板浅: #fbfbfd;
      --边框: #d2d2d7;
      --边框强: #c7c7cc;
      --文字: #1d1d1f;
      --次要: rgba(29,29,31,0.72);
      --强调: #0071e3;
      --强调浅: #e8f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--背景);
      color: var(--文字);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .页面 {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .侧栏 {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--边框);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .标题块, .侧块, .主块 {
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .标题块 {
      padding: 18px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }
    .侧块 {
      margin-top: 16px;
      padding: 14px;
    }
    .侧块标题 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }
    .排行列表 {
      display: grid;
      gap: 8px;
    }
    .排行按钮 {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
      color: var(--文字);
      text-align: left;
      cursor: pointer;
    }
    .排行按钮.选中 {
      border-color: var(--强调);
      background: var(--强调浅);
    }
    .排行主行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 620;
    }
    .排行副行 {
      margin-top: 6px;
      font-size: 12px;
      color: var(--次要);
    }
    .主体 {
      min-width: 0;
      padding: 22px;
    }
    .工具条 {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-bottom: 14px;
      background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.9) 75%, rgba(245,245,247,0) 100%);
    }
    .工具格 {
      display: grid;
      grid-template-columns: minmax(260px, .7fr) minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .字段 {
      display: grid;
      gap: 6px;
    }
    .字段标签 {
      font-size: 13px;
      color: var(--次要);
    }
    .输入框, .下拉框, .按钮 {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 14px;
      outline: none;
    }
    .输入框:focus, .下拉框:focus {
      border-color: var(--强调);
      box-shadow: 0 0 0 3px rgba(0,113,227,.16);
    }
    .按钮 {
      cursor: pointer;
      font-weight: 620;
    }
    .按钮.主按钮 {
      background: var(--强调);
      border-color: var(--强调);
      color: #ffffff;
    }
    .统计栏 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .统计卡 {
      padding: 14px;
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .统计名 {
      font-size: 12px;
      color: var(--次要);
      margin-bottom: 8px;
    }
    .统计值 {
      font-size: 28px;
      font-weight: 700;
    }
    .主块 {
      padding: 18px;
    }
    .主块标题行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .主块标题 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .结果数 {
      color: var(--次要);
      font-size: 15px;
    }
    .语料列表 {
      display: grid;
      gap: 14px;
    }
    .语料卡 {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
    }
    .语料头 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }
    .语料编号 {
      font-size: 16px;
      font-weight: 650;
    }
    .语料统计 {
      color: var(--次要);
      font-size: 13px;
    }
    .信息行 {
      margin: 8px 0 0;
      line-height: 1.7;
      font-size: 14px;
      color: var(--文字);
    }
    .信息标题 {
      color: var(--次要);
    }
    .正文 {
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.78;
      font-size: 15px;
      color: var(--文字);
      max-height: 9.2em;
      overflow: hidden;
      position: relative;
    }
    .语料卡.展开 .正文 {
      max-height: none;
    }
    .正文::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(251,251,253,0), rgba(251,251,253,1));
    }
    .语料卡.展开 .正文::after {
      display: none;
    }
    .操作行 {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .小按钮 {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 13px;
      cursor: pointer;
    }
    .空状态 {
      padding: 28px;
      text-align: center;
      border-radius: 8px;
      border: 1px dashed var(--边框强);
      color: var(--次要);
    }
    @media (max-width: 1200px) {
      .页面 {
        grid-template-columns: 1fr;
      }
      .侧栏 {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--边框);
      }
      .工具格 {
        grid-template-columns: 1fr;
      }
      .统计栏 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      .统计栏 {
        grid-template-columns: 1fr;
      }
      .主体, .侧栏 {
        padding: 16px;
      }
    }
  </style>
</head>

orRowCount": 3, "companyRowCount": 12, "timestampCount": 15, "timestamps": ["2026-04-22 11:08"]}, {"id": "evidence-100", "content": "## 光模块龙头：光芯片产能超...\n## 光模块龙头：光芯片产能超预期爬坡，Meta与AWS订单锁定增长空间\n> 以下内容为专家观点 · Q&A 形式整理\n---\n### 一、AWS 与谷歌订单进展\n**Q：亚马逊和谷歌的订单，目前的具体进展如何？**\n**A（亚马逊）：** 相关消息出现时间较早。市场约一个月前传出 **1.3亿颗锁单**信息，最初指明是 EML 芯片，但目前来看 **AWS 对 CW 芯片的需求量可能更大**。当前订单尚未最终签署，处于正式落地前期。预计 AWS 将在 **4月底至5月初**对芯片生产地进行实地考察，确认生产及产能状况，此后订单有望在短期内达成。可确认的是，AWS 确实有提前锁定 **CW Laser** 和部分 EML 芯片产能的意向。\n**A（谷歌）：** 谷歌需求预估远大于 AWS，早前市场对其硅光芯片的需求评估已超过 **70亿元人民币**（不仅针对索尔思）。目前除已通过验证的 800G 产品外，重点推进的是 **1.6T 产品的验证**，有两种技术方案：\n- 基于 **200G EML** 的方案\n- 基于 **CW 的硅光**方案\n验证结果原预计在 2026 年 Q3 初出炉，但从东山精密推进进度看，**有可能提前至 2026 年 Q2**。关于谷歌合作的具体消息，预计需等到 **5月下旬至6月**才会出现。\n---\n### 二、1.6T 技术方案认证差异\n**Q：CW 硅光与 200G EML 两种 1.6T 方案，认证难度和周期有何差异？**\n**A：** 两类芯片认证存在显著差异：\n- **CW 芯片**：认证门槛低、难度小、周期短。制程相对简单，市场对可靠性疑虑少，推进速度较快。\n- **200G EML 芯片**：认证周期长得多。制程复杂，性能与可靠性更容易出问题，流程严苛程度远超普通 DFB 芯片。加之 1.6T 光模块附加值高，多重因素共同导致认证周期漫长。\n---\n### 三、光芯片产能现状\n**Q：当前光芯片月产能达到多少？与3月份500万颗相比，爬产速度如何？**\n**A：** 目前仅**常州工厂** EML 芯片月产能已达约 **750万颗**；加上台湾工厂，合计可达 **1,100万颗**。整体产能爬升速度**超过原定计划**，实现了超计划完成。\n**Q：750万颗中100G与200G各占多少？Source Photonics 总产能是多少？**\n**A：** 750万颗均基于 **100G EML** 实际产出。若转换为生产 200G 芯片，因良率损失约10%，产能通常减少 **15%～20%**。台湾工厂月产能约 **400万～500万颗**，部分外延片或巴条送至常州进行后道工序。**Source Photonics 当前总月产能约1,000万颗。**\n---\n### 四、800G 光模块出货规划\n**Q：公司对2026年全年800G光模块的出货规划？**\n**A：** 2026年800G光模块实际出货量预计将**超过500万只**（此前指引为550万～600万只）。订单量预计进一步增加，规划产能已提升至 **2,500万只**。\n**Q：2026年Q1约40万只，Q2预计能达到多少？**\n**A：** 2026年 Q2 起，预计恢复到**每月50万只**的正常出货状态。Q1出货量少主要因暂停发货及假期因素，暂停并非生产停滞，而是应客户要求所做的调整。\n---\n### 五、1.6T 产品进展与 Meta 验证\n**Q：1.6T 产品在 Meta 的验证情况及2026年出货预期？**\n**A：** 1.6T 产品**已完成在 Meta 的验证**。2026年1月 Meta 审厂时已提出明确指导意见。预计 **2026年Q3 开始批量出货**，当前单次订单规模约 1万～2万只。\n**Q：针对1.6T，公司采用 CW 还是 EML 方案？**\n**A：** 公司**同时推进 CW 激光器和 EML 两种方案**。目前市场对 200G EML 前景普遍看好，因供应紧缺，客户主要动作是**提前锁定产能**而非直接下大额实体订单。1.6T 真正放量预计需等到 **2026年Q2 或 Q3**。\n---\n### 六、亚马逊合作模式\n**Q：亚马逊倾向于采购芯片还是模块？**\n**A：** 亚马逊当前**更关注 CW 芯片本身的供应**，首要任务是保障紧缺芯片的来源，模块制造相对容易解决。索尔思在提供芯片的同时也在争取模块份额。具体供应量及芯片与模块的比例划分，预计**5月完成工厂审查后**得出结果。\n---\n### 七、英伟达 CPO 市场布局\n**Q：索尔思向英伟达送样的产品形态及目标？**\n**A：** 送样产品为 **ELSFP 封装的光引擎**（非裸芯片），旨在探索进入英伟达 CPO 市场的机会。纯 CPO 方案实现难度大，而 **ELSFP 与 CPU 模块结合**的方案在可维护性、性能及散热方面表现优异，短期内需求前景可观。\n**Q：是否存在\"选边站\"问题？**\n**A：** 目前未观察到强烈的阵营对立。英伟达期望的 CPO 方案与现有可插拔光模块封装工艺兼容性低，产能严重受限，短期内难被其他 CSP 普遍接受。英伟达或需妥协，采用 NPO 或外置光源等更可靠方案。谷歌则对硅光和 EML 方案均持开放态度，鼓励送样认证。\n---\n### 八、高功率 CW 激光器竞争格局\n**Q：索尔思在高功率 CW 领域相较 Lumentum、Coherent 等的技术地位？**\n**A：** 索尔思凭借开发接入网 EML+SOA 方案时积累的经验，在高功率 CW（DFB+SOA 方案）开发上进度较快，**2026年初已送出样品，开发周期不足半年**。竞争对手方面，**Lumentum 无疑是领先者**，Coherent 也在加紧开发。源杰的低功率产品已通过旭创进入北美客户，但高功率产品尚处开发初期。\n**Q：CW 激光器当前月产能及扩产规划？**\n**A：** 目前月产能约 **100多～200片晶圆，对应100多万～200万颗芯片**，无法满足快速增长的需求，扩产规划正在推进中。\n---\n### 九、供应链瓶颈与衬底问题\n**Q：光模块生产物料中哪一项对产能影响最大？**\n**A：** 最可能影响产能的是**衬底供应**。DSP、TIA、Driver 等物料备料周期已延长至约9个月，供应相对稳定；衬底供应较为紧张，目前以半年为周期提前锁定产能。\n**Q：如何保障扩产至3亿颗芯片所需的衬底供应？**\n**A：** 策略包括：\n- 最大供应商为**云南锗业**旗下公司（约一半产能已被海思锁定）\n- 采购尺寸从2寸扩展至 **2寸、3寸及4寸**\n- 与外延厂商建立合作，可直接采购外延片或衬底\n- 通过台湾渠道向**日本住友、AXT** 等国外衬底厂商采购\n**Q：台湾和常州的扩产计划有何不同？**\n**A：** **整体扩产以常州为主**，常州将新建厂房，产能规划远大于台湾。主因是台湾在人工成本和设备产能方面已不如大陆。\n---\n### 十、Meta 暂停发货事件复盘\n**Q：2025年 Meta 暂停发货事件的根本原因？**\n**A：** 该事件被定义为**可靠性问题**而非单纯良率问题。根因是无源光器件 FAU 中的胶水等材料在温度变化下发生形变，导致**光路插损过大**。产品出厂测试合格但在客户端出现问题，引发了对长期稳定性的担忧。更换 FAU 后问题解决，Meta 于 **2026年1月正式给出结论**，此后合作恢复正常，**2027年大订单已基本确定**。\n---\n### 十一、北美 CSP 订单优先级排序\n**Q：北美 CSP 厂商下达光芯片订单时，最优先考虑哪些因素？**\n**A：** 在当前市场环境下，优先级排序为：**产能与交付能力 > 质量 > 价格 > 地缘政治**。只要能满足使用需求并确保按时交付，供应商就会获得青睐。当性能和产能相近时，会优先选择**非中国供应商**，即便价格更高。\n**Q：各 CSP 厂商在供应商选择上是否有差异？**\n**A：** 存在明显差异。**Meta** 对中国光模块和芯片供应商态度相对开放；**谷歌、Oracle** 等在有选择的情况下倾向于避免使用中国供应商，但旭创因历史合作关系是例外。\n---\n### 十二、产能设备与竞争优势\n**Q：8台 MOCVD 设备是否足以支持3亿颗的年产能目标？**\n**A：** 足够。保守估计一台 MOCVD 每月产能约 **500万颗**。相较于其他需等待设备交付的厂商，公司在**设备锁定方面具备优势**。\n---\n### 十三、技术路线展望\n**Q：400G EML 芯片研发进展？**\n**A：** 目前纯处于研发阶段，仅有 Beta 样品，距送样可靠性验证还有距离。400G EML **技术难度极高**，基本达到 EML 调制速率极限。\n**Q：3.2T 时代将以 EML 还是硅光为主？**\n**A：** **3.2T 时代将以硅光技术为主**。400G EML 制造难度极高，即便能生产，供应量也十分有限。3.2T 若采用200G速率需16路，采用400G速率需8路。\n---\n### 十四、行业景气周期判断\n**Q：光通信行业景气周期处于哪个阶段？**\n**A：** 当前行业爆发基于 AI 技术已转化为实际生产力，景气周期**至少处于中前期**，而非极早期。市场对 2027年乃至 2028年普遍持乐观态度，**短期内尚未看到增速放缓迹象，光模块繁荣预计还将持续数年**。\n---\n### 十五、投资价值判断与国内芯片竞争力\n**Q：哪些环节具有较高投资价值？**\n**A：** 投资应重点关注**服务于北美主要 CSP 厂商需求**的环节。国内 AI 需求量和市场利润与北美仍有差距；光通信和光芯片领域存在一定的历史路径依赖和地缘政治考量。\n**Q：国内芯片厂商争取 CSP 客户面临的主要挑战？**\n**A：** 核心挑战是**信任问题**。CSP 对物料稳定性要求极高，系统停机一小时损失巨大，价格反而是次要因素。评估国内芯片供应商的关键指标是**是否通过北美大厂认证**。源杰科技股价飙升正是因突破 AI 市场获得认证。部分具有外资背景的公司（如索尔思）因与微软、Meta、Oracle 等有传统合作，在客户关系上具备一定优势。\n---\n### 十六、磷化铟衬底的战略地位\n**Q：磷化铟衬底在产业链中的地位及供应格局？**\n**A：** 磷化铟衬底是光通信波长激光器**绕不过去的基础原材料**，EML 和 CW laser 均必须使用。供应格局方面：\n- **日本住友电工**曾占全球60%市场份额，但受地缘政治影响，中国管控铟元素供应，其扩产计划基本停止，市场份额可能被 **AXT（通美）**超越\n- 国内衬底行业正处**产能起飞前夕**，呈供不应求的卖方市场状态\n- **云南锗业**是国内较大供应商之一；广东先导等公司也在布局\n- 行业面临的主要问题是整体市场规模相对较小\n---\n### 十七、东山精密战略评估\n**Q：如何评估\"以光芯片推动光模块出货\"战略的成功概率？**\n**A：** 该战略最初受到怀疑，但结合当前物料普遍紧缺的市场环境来看，**具备相当的现实性**。当前市场特点是\"**有产能就能兑现**\"。东山精密的核心策略是：利用光芯片产能吸引 CSP 订单，同时将自产硅光芯片作为**战略资源换取光模块订单**，本质是希望在物料紧缺时期实现弯道超车。\n**Q：索尔思利用光芯片置换策略的实际进展？**\n**A：** 该策略**已取得实际成效**。目前 Coherent 已与索尔思签订互助协议——索尔思保证 EML 芯片后期供应，作为交换 Coherent 向索尔思提供旋光片。索尔思同时在积极开发国内供应链（如导入验证**福晶科技**产品）作为补充。在换取光模块订单方面，具体订单尚未完全落地，但可以确定**公司一定会获得模块订单，只是数量多少的问题**。\n---\n> ⚠️ **注：本文部分内容由AI生成，无法确保真实准确，仅供参考。**", "preview": "## 光模块龙头：光芯片产能超...\n## 光模块龙头：光芯片产能超预期爬坡，Meta与AWS订单锁定增长空间\n> 以下内容为专家观点 · Q&A 形式整理\n---\n### 一、AWS 与谷歌订单进展\n**Q：亚马逊和谷歌的订单，目前的具体进展如何？**\n**A（亚马逊）：** 相关消息出现时间较早。市场约一个月前传出 **1.3亿颗锁单**信息，最初指明是 EML 芯片，但目前来看 **AWS 对 CW 芯片的需求量可能更大**。当前...", "sectors": ["PCB", "光模块", "有色"], "companies": ["东山精密", "云南锗业", "福晶科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 3, "companyRowCount": 3, "timestampCount": 6, "timestamps": ["2026-04-22 08:37"]}, {"id": "evidence-249", "content": "上午盘面结构综述\n一，盘面最强...\n上午盘面结构综述\n一，盘面最强主线：算力\n二，连板结构梳理：\n海外链。金富科技4板，海星股份2板\n半导体。金螳螂4板\n机器人。立信达2板\n地域。苏州高新2板（AI硬件公司扎堆）\n电力。华电辽能2板\n三，题材板块梳理：\n1.海外链\n光上游。长光华芯，三安光电，天通股份，云南锗业，仕佳光子，优利德\n光纤。杭电股份，亨通光电，长盈通，长飞光纤，特发信息\n其他。青山纸业，东山精密，永鼎股份，博迁新材，智 扩展（如通过 CPO 实现的 Rubin Ultra NVL576 二层纵向扩展）推动潜在市场规模扩大 13 倍；在从 GB300 NVL72 到 Rubin Ultra NVL576 的单个计算单元横向扩展中，可插拔光模块的价值市场扩大 10 倍，即便 CPO 渗透率为 29%。\n单个计算单元的可插拔光模块（1.6T 或等量）数量将从 GB300 NVL72 的 216 个增加到 Rubin Ultra NVL576 的 2500 个。\n综合横向及纵向扩展的机会，看好光模块和光引擎（受益于 CPO/NPO 采用和光模块升级）、CW 激光器和 EML（受益于 CPO/NPO 采用和光模块升级）以及 PCB/CCL 制造商（受益于 PCB 中板采用）等主要受益存在显著的每股盈利上行潜力。\n覆盖的买入个股包括：中际旭创、新易盛、天孚通信、联亚、全新、住友电工、三菱电机、古河电工、胜宏科技（强力买入名单）、沪电股份、台光电和生益科技。\n关于中资企业 IPO 是否会给流动性带来压力，策略组的供需分析表明有充足的资金可吸纳新股发行。\n预计 2026 年全年香港市场股票供应总额为 1100 亿美元，其中包括 600 亿美元新股 IPO 和 500 亿美元上市后再融资。\n预计吸纳这部分供应的资金来自 1800 亿美元的公司资金分配（派息和回购）、2000-3000 亿美元的全球长线投资者资金再配置、2000 亿美元的南向资金流入，以及个人投资者的持续踊跃参与。\nIPO 市场回暖推动中国私募股权投资自 2025 年年中迎来再提速，同时也在改写私募股权投资格局。\n更多的 IPO 项目也将带来港交所以及离岸业务敞口较高的内地券商实现更佳增长。\n对于寻求积极溢出效应的投资者而言，关注 IPO 候选公司和买入同业可能是一种有望获益的投资策略，近两年也有越来越多基金采用。\n对于消费的反馈都还是偏谨慎，子板块中认可餐饮最具有量价改善带来的修复动力（百胜中国、海底捞）。\n做多 PPI/CPI 方向上，不少客户开始关注农业板块（未来几年通胀输入应该较明显）。\n最近的猪周期转折点报告中提到了猪肉产量可能在 2 季度开始下降并持续到明年（政策导向 + 企业主动），在经历了漫长的下行周期后板块估值具有吸引力，看好牧原股份。\n在 ETF 发行上来看，1 季度末也新增了不少农业主题的申报。", "preview": "过去几天在路上拜访了一些香港和...\n过去几天在路上拜访了一些香港和深广的客户，最直观的感受就是大家因为港股密集的 IPO 以及市场阶段性结束的窗口而非常忙碌。\n配置方向上 AI 仍然是绕不开的话题，存储、算力以外，光通信的信心也越来越有共识。\n我们全球科技团队近期发布了光通信网络的深度报告，测算光价值链的潜在市场规模将增长 9 倍至 1540 亿美元：从 GB300 NVL72（单个计算单元单机架 72 个 GPU 达到 NVL72）...", "sectors": ["PCB", "光模块"], "companies": ["中际旭创", "天孚通信", "新易盛", "沪电股份", "生益科技", "胜宏科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 2, "companyRowCount": 6, "timestampCount": 8, "timestamps": ["2026-04-22 11:04"]}, {"id": "evidence-141", "content": "【国投机械】机床展交流反馈01...\n【国投机械】机床展交流反馈01：\n今天我们组织了上海机床展公司交流，内容总结如下：\n1、#需求及景气。总体需求保持平稳向上，从我们交流几家主要机床主机厂来看，Q1各家公司的订单增速区间集中在10-30%，内需增速优于外需，部分公司增速更高，全年展望龙头增速或在20%-30%。从反馈的下游行业来看，高景气行业集中在3C、AI（液冷）、新能源（储能）等领域，其中#液冷应该是今年增量最大的领域，预计增速在在几倍量级，其中乔锋率先推出AI液冷解决系统方案。\n2、#竞争及盈利。经过前几年的行业下行和探底后，目前机床价格及利润率基本保持稳定，盈利底基本夯实。\n3、#核心零部件。今年以来受原料上涨影响，核心部件THK的机床用丝杠涨价约10%，外资数控系统也在酝酿涨价，华数系统价格稳定，下游还是3C、五轴较好。\n4、#新产品。除了原有产品常规立加、五轴等产品外，磨床成为增量，本次纽威及秦川均推出较为成熟的磨床设备，纽威的内螺纹及外螺纹磨床均在展出，稳定加工P1精度丝杠副产品，秦川反馈螺纹磨床已排产至年底。\n核心结论，当前机床行业底部持续复苏，AI敞口较 极推荐。\n#中孚实业2025年报&2026Q1简评：1季度盈利弹性显现\n公司2025全年归母净利为16.17亿元，同比+129%，现金分红7亿元，占母公司期末可供分配利润的86.34%；2026Q1归母净利为8.21亿元，同比+256%，环比+91%。\n加工费下调对冲电解铝改善，4季度盈利近持平\n（1）电解铝：2025Q4环比来看，铝价+806元、氧化铝价-359元、铝土矿价-3美元、煤价+95元、阳极+376元，对应河南电解铝吨净利环比+743元，按照单季度6.25万吨，对应环比+0.35亿至2.8亿净利润；四川含税电价环比-4分（3季度广元含税电价4.9毛，4季度4.4毛，河南4毛），吨净利环比+920元，按照单季度12.5万吨，对应环比+1.89亿至4.44亿净利润。叠加年底广元基地补贴收益，因此Q4电解铝板块净利润环比+2.5亿元至7.3亿元净利润；\n（2）铝加工：受制于4季度易拉罐加工费下调逾400元，或叠加加工板块汇兑和坏账损失，公司4季度加工板块亏损0.7亿元，3季度盈利0.6亿元，环比减少1.3亿元利润。公司采取进料加工等方式有效对于内外价差扰动。\n（3）或源于其余成本费用扰动，侵蚀利润环比回落1.6亿元。其中，采矿权减值损失导致资产减值1.23亿元，公司公允价值变动损益-0.91亿元，4季度投资收益-0.56亿元。\n铝价弹性显现，1季度盈利创新高：公司1季度归母净利8.2亿元，扣非归母8.78亿元，纷纷创历史单季度新高。测算公司1季度四川和河南电解铝吨税前利润6047元和7541元，对应Q1净利润6.4亿元和3.5亿元，易拉罐板块或因加工费疲软有所拖累。且汇兑损失导致财务费用同比+0.9亿元，投资净收益同比-1.7亿元（铝期货套保），公允价值变动净收益同比+0.9亿元。\n电解铝红利大时代之下，公司作为氧化铝下跌高弹性+高分红标的，四川电价存在进一步下调空间，且海内外高价差，大幅抬升铝加工出口利润中枢。大规模员工持股落地彰显积极信心，盈利和估值迎来共振。公司拟2025-2027年分红率60%+，红利价值显现。按照75万吨电解铝，铝价24000元，氧化铝2800元，年化归母净利润40亿元，对应PE为8.6X，保守按照分红率60%，股息率7.0%，继续重点推荐。\n#华锡有色2025年年报&2026年一季报点评\n公司2025年实现净利润12.9亿元，同比+21.39%；实现归母净利润8.01亿元，同比+21.75%；单四季度，公司实现净利润4.62亿元，同比+122.06%，环比+115.72%；实现归母净利润3.07亿元，同比+161.22%，环比+172.85%。2026年一季度，公司实现净利润2.69亿元，同比+4.92%，环比-41.72%；实现归母净利润1.82亿元，同比+18.54%，环比-40.66%。\n2025年和2026Q1产销量整体保持平稳。公司2025年生产锡精矿含锡0.65万吨，同比-6.2%，产量小幅下滑主要受环保监管趋严和铜坑矿开采矿石品位下滑的影响；生产铅锑精矿1.58万吨，同比+5.4%；生产锌精矿含锌5.4万吨，同比-0.1%。2026年一季度矿产端延续稳健的经营态势，虽受春节放假影响，铅锑精矿和锌精矿产量环比25Q4下滑9.8%和15.5%，同比与2025Q1水平相当。\n25Q4业绩同环比高增，涨价和年底消化库存或为主要驱动。25Q4公司实现利润总额5.4亿元，环比实现2.8亿元增长。具体来看，25Q4锡、铅锑、锌自产金属量环比分别+19%、+3%、+14%；同时锡价环比涨12%，锑价环比跌11%。若以产量规模测算，锡、铅锑、锌资源测算利润总额环比分别+0.8、-0.2、+0.1亿元，资源端利润环比合计增长0.7亿元。其他业务方面，25Q3基于高峰出让权益金1.03亿元，压制利润表现；25Q4除权益金影响消除外，或对25年前三季度累积的库存做了集中销售，环比增利1.1亿元。考虑少数股权权益（主要是高峰矿少数股东），最终Q4归母环增2亿元至3.1亿元。\n26Q1或受春节影响导致产销规模不匹配；此外，佛子矿权益金或影响部分利润。26年一季度，锡、锑、锌价环比涨28.5%、1.4%、7.0%；测算公司资源端锡、铅锑、锌利润环比+1.3、-0.1、+0.1亿元，合计环比增利1.3亿元。其他业务方面，26Q1环比25Q4减少3.4亿元，其中1.1亿元来自25Q4销售库存的利润，26Q1不再体现。其次，公司自产锡矿在来宾冶炼厂需1个月左右的冶炼周期，冶炼成锡锭对外出售，继而确认资源端的业绩。一季度由于春节放假，公司部分自产矿在来宾冶炼厂来不及周转；同时，公司26Q1锡锭销量同比下滑36.5%，也导致了部分自产矿没有兑现业绩。假设公司自产矿中有36.5%未确认收入，测算 : 7, "timestamps": ["2026-04-22 12:33"]}, {"id": "evidence-86", "content": "海外商业航天跟踪❗️【天风电新】SpaceX 25年AI资本开支127亿美元，星舰有望成为AI业务的核心驱动力-0421\n———————————\n🌼事件\n今日，路透社报道了其查阅的SpaceX招股书摘录信息：\n-财务情况：2025年，公司营收186.7亿美元，净利润-49.4亿美元，亏损来自XAI业务。若剔除XAI，SpaceX主体营业收入、净利润分别140.2亿美元、7.91亿美元。\n截至2025年底，公司拥有248亿美元现金、920亿美元资产和508亿美元负债。\n-其他信息：SpaceX将采用双重股权结构，B类股东每股对应10票，将决策权集中在马斯克初创团队，而普通A类股票每股对应1票。\n🌼分析\n公司25年资本开支共207亿美元，较24年翻倍，其中127亿美元用于人工智能领域。目前，星链已成为公司盈利的主要来源，25年贡献了44.2亿美元的营业利润，占资本开支比例不足1/4。\nSpaceX对AI部门的愿景是通过人工智能【理解宇宙的真实本质】，这意味着其对AI算力需求将持续爆发，26年将投入运营的星舰会是其核心解决方案：\n-传统业务：实现完全可回收后，发射星舰的成本与频率将较现役火箭有量级上的优势，进一步增厚商业发射、星链两块传统业务的盈利空间，为AI业务的扩张提供资金弹药。\n-太空数据中心：高频次复用的星舰有望将LEO运费降至10-100美元/kg，此时太空数据中心运营成本将仅为地面的1/10，马斯克预测这有望在36个月内实现，也为太空光伏打开空间。\n🌼投资建议\n【太空光伏】板块重点看6个票：迈为、奥特维、晶科、福斯特、聚和、科达利。\n1）先找设备的底迈为（700亿，近期半导体订单上修）、奥特维（200亿）\n2）再看新一轮弹性，主辅材可持续性更强，福斯特（主业上修，CPI薄膜弹性大）、聚和材料（Musk专门提光刻掩膜，关注潜在Blank Mask供应机会）、晶科能源（地面王炸）\n3）科达利:星链减速器，单机ASP 30-40W\n———————————\n欢迎交流：孙潇雅/林晋帆", "preview": "海外商业航天跟踪❗️【天风电新】SpaceX 25年AI资本开支127亿美元，星舰有望成为AI业务的核心驱动力-0421\n———————————\n🌼事件\n今日，路透社报道了其查阅的SpaceX招股书摘录信息：\n-财务情况：2025年，公司营收186.7亿美元，净利润-49.4亿美元，亏损来自XAI业务。若剔除XAI，SpaceX主体营业收入、净利润分别140.2亿美元、7.91亿美元。\n截至2025年底，公司拥有248亿美元现金、920...", "sectors": ["光伏"], "companies": ["奥特维", "晶科能源", "福斯特", "科达利", "聚和材料", "迈为股份"], "sources": ["wechat_group_1"], "sectorRowCount": 1, "companyRowCount": 6, "timestampCount": 7, "timestamps": ["2026-04-22 08:15"]}, {"id": "evidence-336", "content": "[烟花] 算力租赁行业重大更新...\n[烟花] 算力租赁行业重大更新：大模型厂商MaaS Token分成模式二季度正式启动，算力云提供商利润率有望翻倍\n重视商业模式的本质变化，从裸算力出租到Token工厂模式，估值体系正式从PE切换至PS\n事件：AI大模型商业化落地加速，国内主流大模型厂商共同敲定，MaaS Token分成模式将于2026年二季度全面落地执行，算力租赁行业迎来盈利逻辑与估值逻辑的双重变革。\n传统算力业务，长期停留在裸算力出租阶段：以P数、卡数为计价单位，收取固定租赁费用，行业内卷严重、盈利空间受限。\n这类模式属于典型重资产运营，市场仅能按照周期属性给予PE估值，估值天花板清晰，成长弹性不足。\n全新的Token分成模式，将算力中心彻底转变为Token工厂：算力服务商不再只赚取固定租金，而是按照大模型Token实际调用量进行利润分成。\n设备折旧、电力能耗均为刚性固定成本，下游AI调用需求越旺盛，Token消耗量越大，算力厂商新增部分几乎全部为纯利润，行业整体净利率有望实现翻倍增长。\n该模式具备极高的合作门槛，只有拥有万卡级高端算力集群的头部企业，才能接入头部大模型供应链，享受分成红利。\nA股符合万卡集群标准、充分受益本次行业变革的核心标的为以下5家：\n1. 利通电子（60 anyRowCount": 5, "timestampCount": 6, "timestamps": ["2026-04-22 14:23"]}, {"id": "evidence-94", "content": "# 光模块技术路线深度分析：薄...\n# 光模块技术路线深度分析：薄膜铌酸锂、硅光与 EML 方案\n> 以下内容为专家观点，注：本文部分内容由AI生成，无法确保真实准确，仅供参考\n---\n## 一、薄膜铌酸锂的定位与应用前景\n**Q：在单通道速率从224G向448G演进的背景下，薄膜铌酸锂技术是否是必要的？**\n从可插拔光模块市场来看，薄膜铌酸锂属于异质集成技术路线的一个分支，与磷化铟等材料并列。在单通道速率从200G向400G演进的过程中，目前存在三条主流技术方案：**EML、硅光**以及以**薄膜铌酸锂**为代表的异质集成。\n虽然可插拔光模块在向高速率发展，但同时也存在CPO、NPO、LPO等其他发展方向，这使得单纯的薄膜铌酸锂材料本身的发展空间可能相对有限。然而，如果从更广阔的**异质集成技术**视角来看，其发展空间则远大于单一的薄膜铌酸锂材料。\n---\n## 二、EML 与硅光方案的技术瓶颈对比\n**Q：向单通道400G及以上演进时，EML和硅光各自面临哪些挑战？**\n### EML 方案\nEML方案的技术路径相对明确，其带宽理论上可达**130GHz**左右，能够支持到6.4T光模块，在3.2T速率上不存在技术瓶颈。然而，EML面临三大挑战：\n- **迭代成本高**：每一代产品都需要全新的光源和EML芯片。例如，光源功率从70mW、100mW，到3.2T时可能需要300–400mW；配套EML芯片也需从100G、200G升级到400G，无法复用。\n- **供应链依赖**：EML方案高度依赖磷化铟衬底。与硅光方案中光源可采用一拖二或一拖四的设计不同，EML方案每一代产品基本都需要**8颗光源**，对磷化铟的依赖性更强。\n- **产能与验证周期**：EML产能主要集中在海外，扩产节奏较慢；验证周期（包括衬底和工艺）通常在一年以上，每代产品升级时都可能面临供需紧张。\n### 硅光方案\n硅光方案在800G和1.6T市场中渗透率提升，主要得益于其**供应链优势**。预计2026–2027年，1.6T硅光方案将大量涌现。然而，硅光的主要挑战在于**物理极限**——其带宽做到100GHz以上已非常勉强，这使部分观点对其在3.2T及6.4T时代的应用前景表示担忧。\n为突破此物理极限，业界正在探索多种方案：\n- **异质集成方案**：如OpenLight与Tower Semiconductor合作，先用3-5族工艺制造磷化铟激光器和调制器，再与硅光芯片进行异质集成，可将放大器、激光器、调制器、波导和探测器整合在一起。\n- **调制方式与组件升级**：如Coherent在OFC大会上提出的400G硅光方案，通过采用比PAM4更高级的调制方式，将处理压力转移至DSP，同时配合自研高速磷化铟激光器绕开材料本身的物理瓶颈。\n- **新型材料方案**：如Lightwave Logic与Tower Semiconductor合作，采用**电光聚合物**新材料，工艺温度低于200℃，旋涂工艺成本低于薄膜铌酸锂方案，已于2023–2024年间出现并经过小规模验证。\n---\n## 三、电光聚合物方案的挑战\n**Q：电光聚合物硅光方案面临哪些核心挑战？**\n- **高温下的长期可靠性**：数据中心内部实际工作温度通常高于70℃，可能达到85–90℃，并要求长时间不间断运行。虽然该方案已将聚合物温控节点提升至180℃，但在高温、长时间运行条件下的稳定性仍需严格验证。\n- **大规模量产的工艺一致性**：目前多处于小批量验证阶段，转向大规模生产时能否保持工艺一致性，以及是否出现工艺偏移，是业界关注的另一重要问题。\n---\n## 四、硅光替代EML的核心逻辑\n**Q：在800G以上，硅光方案相较于EML方案的核心替代逻辑是什么？**\n在1.6T光模块方案中，硅光方案预计将占据主导，可能达到与EML接近**6:4**的比例。核心替代逻辑主要基于三点：\n1. **性能相当**：硅光方案在1.6T速率下不逊于EML，甚至可能略有优势，但这并非决定性因素。\n2. **成本显著优势**：预计可降低**20–30%甚至更多**，不仅源于硅光芯片本身，更重要的是能大幅降低对光源部分的成本要求。\n3. **技术延展性更强**：EML方案每代产品升级都需大量重新设计，缺乏平滑延续性；硅光方案后续演进的工艺挑战相对较小，发展路径更为顺畅。\n---\n## 五、薄膜铌酸锂的技术优势与制约因素\n**Q：薄膜铌酸锂方案在单波400G路径中的具体优势、制约因素及产业化进展如何？**\n### 优势\n- 带宽高达**140GHz**，实验室数据最高已达**170GHz**，性能在几种备选方案中表现最优。\n- 该方案早在2023年左右已有业界接触，并已在200mm晶圆上实现。\n### 核心制约因素\n- **上游衬底晶圆供应稀缺**：全球仅有少数几家供应商，产能相对有限。\n- **工艺端挑战巨大**：对薄膜铌酸锂材料进行高精度蚀刻等制程相对困难，前期在制程和检测设备上的投入高达**6,000万至8,000万元**，是其产业化的主要障碍。\n- **供应链的限制**：全球能够大规模量产的工厂数量有限，主要集中在GlobalFoundries等少数几家。\n- **固有的可靠性问题**：铌酸锂材料本身存在**直流偏置漂移**问题，带来可靠性挑战，这也是催生TFLS等新材料方案的原因之一。\n- **光路耦合损耗较高**：薄膜铌酸锂调制器单个器件性能优异，但在与光源进行光路耦合时，进出光的损耗通常高于其他常规方案。\n---\n## 六、行业多元化布局现状\n**Q：为何业界至今未能形成单波400G的明确主流方案？**\n根本原因在于没有任何一种方案能够展现出**绝对优势**。即便是NVIDIA这样的公司，也在Blackwell平台中同时布局CPO和可插拔光模块。各大厂商普遍采取多元化布局策略以规避技术路线风险：\n- **中际旭创**：在探索薄膜铌酸锂的同时，也在大力发展可插拔硅光、CPO、NPO等多种技术。\n- **华工科技**：可能在NPO方向上投入更多，但也同时布局硅光和薄膜铌酸锂。\n---\n## 七、薄膜铌酸锂的两条产业化路径\n**Q：产业界针对薄膜铌酸锂方案存在哪些不同的实现路径？**\n- **路径一 — 异质集成**：仅将薄膜铌酸锂用于核心的调制部分，其他部分沿用成熟的硅光工艺，通过与现有硅光平台（如Tower的产线）整合来降低工艺复杂度和成本。中际旭创若采用此方案，大概率会基于其与Tower的合作。\n- **路径二 — 独立标准化调制器**：专注解决薄膜铌酸锂本身的全链条工艺难题，向下游客户提供独立的调制器模块。这种方式使模块供应商无需涉足复杂的上游衬底和下游集成问题，专注于提升自身产品的工艺稳定性和性能。\n---\n## 八、市场规模预测\n### 2026–2027年光模块出货量预测\n| 速率 | 2026年预测 | 2027年预测 |\n|------|-----------|-----------|\n| 400G | 数百万只 | 进一步萎缩，数百万只 |\n| 800G | 4,500–5,500万只 | 5,000–6,000万只 |\n| 1.6T | 3,000–4,000万只 | **8,000–9,000万只** |\n| 3.2T | — | 初期数百万只 |\n> 注：1.6T预测数据相对保守，市场需求增长非常迅速。上述预测**不包含NPO或CPO形态**。\n### 硅光 vs EML 方案占比预测（2027年）\n| 市场 | 硅光占比 | EML占比 |\n|------|---------|--------|\n| 800G | ~50% | ~50%（EML略多） |\n| 1.6T | **60%以上**（部分厂商达70%） | 40%以下 |\n---\n## 九、Tower硅光产能现状与扩产计划\n- **2025年Q4基准产能**：每月出货约**7,000–12,000片**（在海外三家8英寸工厂分布生产）。\n- **扩产计划**：将在三家8英寸工厂和一家新增的**12英寸工厂**中分阶段进行。\n- **1.6T硅光芯片**：单片晶圆可切割约**200–600颗die**；一个1.6T光模块主流方案通常包含**两颗**硅光芯片。\n- **2027年产能预估**：若2026年底5倍产能爬坡完成，理论上具备支持约**1亿至1.2亿只1.6T光模块**生产的硅光芯片供应能力。\n---\n## 十、CPO/NPO 发展现状\n### 国内NPO情况\n- 布局较早的公司主要有**华工科技**和**光迅科技**；**Infinera**计划2026年内确定NPO技术路线。\n- 目前展示的多数6.4T NPO方案是通过增加通路数量实现的（如32个单通道200G），而非依赖高稳健性的单通道400G技术。\n- **华为**在升腾产品线中主推NPO方案，国内出货量最大，达到**千片机的量级**。\n- 薄膜铌酸锂目前在低速率NPO应用中并无使用的必要。\n### CPO情况\n- NVIDIA路线追求极致性能，与台积电CoWoS平台深度绑定（PIC采用65nm 6Q1业绩：天润乳业/劲仔食品/口子窖/迎驾贡酒/老白干酒/ST绝味/莲花控股/古越龙山/西部牧业\n#披露25年年报：劲仔食品/山西汾酒/口子窖/迎驾贡酒/老白干酒/ST绝味/莲花控股/古越龙山/西部牧业\n公司交流提醒：\n①甘源食品4月22日15：00-线上-业绩交流\n1️⃣甘源食品：25年深度调整，26Q1业绩略超预期\n①25年公司营业收入/归母净利润/扣非归母净利润分别为20.96/2.08/1.90亿元（-7.2%/-44.6%/-44.3%），#业绩略低于预期，承压主要系原材料价格上涨及渠道调整影响；\n②26Q1公司营业收入/归母净利润/扣非归母净利润分别为6.18/0.66/0.59亿元（+22.5%/+25.7%/+29%），业绩略超预期，主要系同期低基数&春节错期&调整后提效增长。\n#分红：25年现金分红率70%同比持平，当前股价对应25年全年股息率（含中期分红）约3%。\n#综合25Q4&26Q1营收/利润分别同比+2%/-22%、基本符合预期。\n25年传统渠道下滑拖累业绩，传统产品青豌豆小幅增长。\n①分产品： 25年综合果仁及豆果/青豌豆/瓜子仁/蚕豆/其他系列-18.6%/+1%/-6.5%/+0.3%/-6.8%至5.74/5.3/2.8/2.8/4.1亿元。\n②分渠道：25年直营/电商增长明显（同比+35.8%/101.9%至3.2/1.6亿元），但经销渠道占比从24年的85.4%下滑至75.6%（同比下滑17.7%至15.8亿元），#经销渠道下滑主因公司将部分KA模式由经销商转为直营+优化经销商。\n③ 26Q1：春糖公司推出风味豆类坚果，同时发力招商，低基数+提效下公司实现困境反转。\n25年盈利端承压主因费用率增加叠加成本压力，26Q1净利率小幅提升。\n①25年：25年毛利率/净利率-0.7/-6.7pct至34.75%/10%，销售/管理费用率分别同比变动+5/-0.8至17.7%/4.6%，毛利率略下降主因费用率略抬升（推广新品+拓海外市场+做相应团队扩张等）叠加棕榈油等原料成本全年处高位。\n②26Q1：26Q1毛利率/净利率分别-0.4/+0.3pct至33.9%/11%，销售/管理费用率分别-0.07/-1.33至17.27%/3.54%，棕榈油仍成本承压，费用率小幅优化，净利率同比小幅增长，预计26年公司费用端将逐步优化。\n我们认为：公司新品储备充足，渠道经过25年调整重回增长轨道（预计传统商超有望转正、高势能渠道延续高增长）；同时公司低位锁价大豆、棕榈油，在26年规模效应及费用优化下，盈利能力于低基数下修复可期，当前股价对应26E PE 18X，建议关注。\n2️⃣洽洽食品\n26Q1经营情况： 销售额创历史单季度新高，受益于春节错期影响，瓜子收入双位数增长，坚果收入增长较快（主要系春节礼盒&全坚果放量带动），瓜子毛利率提升主要系25年9-10月新采购季价格降低。\n25Q4+26Q1总体： 坚果增长更快，瓜子稳中略增。\n渠道拆分： ①直营：零食量贩25年收入7亿，26年目标20-30%增长，盒马/小象超市/山姆目标高增速；②电商：26-27年争取扭亏为盈；③经销：加速调改工作，26年目标企稳。\n成本端： ①瓜子：葵花籽采购季价格下降10%+，公司加大储备；②坚果原料：核心原料为开心果、巴旦木、腰果、核桃，目前价格仍高位运行略有松动，后续或通过扩大直采比例、种植联盟合作、增加储备等方式应对；③油价上涨导致海运费上升，但货值占比低影响较小。\n业绩展望： ①营收：26年整体增速10-15%，其中瓜子增速略低，坚果更高，冰淇凌、鲜切薯条、魔芋等新品持续培育；②费用：26年保持充足营销费用投入；③净利率：2026年目标净利率为8-10%。\n可转债相关财务费用： 2026年10月可转债到期，需还本付息，相关财务费用为一次性支出，赎回后每年可节约五六千万财务费用。\n3️⃣巴比食品：门店调改闭店&团餐优化结构影响短期业绩，仍重点聚焦小笼包店型\n我们认为：公司预计全年期间费用率保持相对稳定，预计26年公司收入/利润增速10-15%，27年加速，当前股息率4%有支撑，Q2小笼包门店加速展店/调改陆续完成+团餐优化后提速等均为后续催化，仍积极看好市值重回80e（40%+空间）。\n26Q1业绩波动与门店调改&团餐结构调整有关。#剔除并购，老店Q1同店预计-0.6%，预计后续平稳。Q1业绩小幅波动主因——① 春节错期：春节错期滞后复工，加盟商外地人居多复工较晚推迟订货；② 调改闭店：3月除新开40-50家门店外，另有60-70家省级装修，影响有效营业天数；③ 团餐优化：Q1团餐下滑主因公司暂定负贡献客户，后续将小而散的小型客户归拢到核心经销商，扶持核心经销商扩展网络，进 同比+15%，环比-7.7%，累计出口金额24.22亿美元，同比+37%。\n评论\n从出口省份来看，江苏省出口金额同比+73%，环比+22%，此外，广东、浙江同比均提升30%。我们认为主要系户用及工商业逆变器需求抬升；安徽同比-45%,环比-25%，我们认为系中东集中式项目因伊以事件停滞和美国集中式项目需求放缓所致。\n从产品到达区域来看，我们认为3月需求情况变动受到伊以事件影响较大。根据BNEF数据，东南亚50%天然气供给源于中东片区，本次事件对泰国、马来西亚、越南等国影响较大。3月我国向这些国家出口逆变器金额环比+36.57%/+70.3%/+63.9%，我们认为，这些国家正在通过增加光伏装机补充能源供给。其中，泰国、马来西亚逆变器单台价值量上升较多，说明需求重心向大功率逆变器转移，越南单台价值量下滑较多，体现了户用逆变器需求上升；出口中东金额环比-59%，我们认为主要系集中式项目难以开工叠加运输不畅所致；出口美国金额环比-27%，我们认为近期开工有所放缓；澳大利亚同比+264%，环比+16%，主要系电池补贴退坡抢装所致，25年上半年无电池补贴。\n从价格端来看，单台价值量环比提升，我们认为是工商业逆变器需求占比增加。此外，根据sun.store3月欧洲逆变器采购价格来看，0-15KW的一体机及0-15KW及15KW以上并网逆变器环比均小幅向上浮动；储能系统除0-20KWh低压产品价格上调3.9%以外，其他高压户用储能系统及20-120KWh价格下调2.3%-4.12%。我们认为，主要系伊以事件对欧洲户用装机产生了一定驱动，基于当前经济现状，客户更加偏好性价比较高的产品。\n估值与建议\n维持相关公司盈利预测、评级、目标价不变。我们预期逆变器及P欧洲及新兴区域Q2环比增长较多，建议关注欧洲及新兴市场占比较高的户储逆变器公司，推荐锦浪科技、正泰电源。\n风险\n海外贸易政策波动，地缘政治风险，汇率波动风险，光储需求不及预期，竞争加剧风险。\n————————————————\n联系人：马妍13581707367/刘佳妮/石玉琦", "preview": "【中金光伏】3月海关数据显示东...\n【中金光伏】3月海关数据显示东南亚需求向好\n———————————————\n行业近况\n海关总署于4月20日公布逆变器2026年3月出口数据：3月逆变器出口325万台，同比-17%，环比-18.63%，1-3月累计出口1108万台，同比-2.7%；出口金额7.58亿美元，同比+15%，环比-7.7%，累计出口金额24.22亿美元，同比+37%。\n评论\n从出口省份来看，江苏省出口金额同比+73%，环比+...", "sectors": ["储能"], "companies": ["正泰电源", "锦浪科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 2, "timestampCount": 3, "timestamps": ["2026-04-21 22:38"]}, {"id": "evidence-3", "content": "【天风电子】AISOC一季度业...\n【天风电子】AISOC一季度业绩高增，掘金板块错杀机会\n瑞芯微：26Q1实现营收12.05e，同比+36.2%；实现归母净利3.29e，同比+57.15%。\n公司RK3588、RK3576、RVI1系列为代表的AIoT一系列算力平台增长强劲，毛利率随产品结构进一步优化，RK182X系列首批客户已进入产品发布、量产阶段，导入速度超出预期。AIoTSoC算力平台＋协处理器的双轨制发展，有望驱动公司业务持续增长。\n全志科技：26Q1预计实现营收9.12e，同比+47%；实现归母净利2.03e，同比+122%。\n公司持续积极拓展各产品线业务及推动新产品量产，叠加下游客户因涨价预期增加备货。公司对产品销售价格进行上调，主要应对存储等上游原材料及封装成本上涨影响。\n结论：AIOT下游应用广泛，随着终端AI渗透与新品推出升级，AIOTSOC量价齐升趋势不变。目前市场整体预期较低，业绩释放有望带动SOC板块修复，持续重点推荐。\n【AISOC】星宸、瑞芯微、晶晨、全志、乐鑫、恒玄、炬芯、中科蓝讯、富瀚微等。\n联系人：李双亮/程如莹", "preview": "【天风电子】AISOC一季度业...\n【天风电子】AISOC一季度业绩高增，掘金板块错杀机会\n瑞芯微：26Q1实现营收12.05e，同比+36.2%；实现归母净利3.29e，同比+57.15%。\n公司RK3588、RK3576、RVI1系列为代表的AIoT一系列算力平台增长强劲，毛利率随产品结构进一步优化，R 6，获益具统计及临床显著性。预计ASCO将读出HARMONi-6的OS 中期分析数据，最终OS HR仍是核心待读出数据。如果OS HR中期分析为强阳性将有利的支持HARMONi-6达到OS HR主要终点，并且将根本性奠定PD-1/VEGF双抗在一线肺鳞癌NSCLC的标准治疗地位，并且侧面验证双抗类药物（PD-(L)1/VEGF双抗、PD-1/IL-2双抗融合蛋白、PD-1/VEGF/CTLA-4三抗、PD-L1/4-1BB双抗）联合化疗等药物具备多种实体瘤一线疗法的治疗潜力。\n[玫瑰]驱动基因阴性NSCLC情况2 PD-1单抗+ADC：Nectin ADC+PD-1单抗已经迭代尿路上皮癌治疗标准，更多实体瘤一线标准正在迭代。2025年11月，TROP2 ADC SKB264联合K药一线治疗PD-L1阳性NSCLC的III期研究（OptiTROP-Lung05）达PFS主要终点，获益具统计及临床显著性，OS亦呈明确获益趋势。预计ASCO读出PD-1单抗K药+ TROP2 ADC(SKB264)的PFS数据，如果PFS HR及后线的OS HR呈现强阳性将有利的支持PD-1+TROP2 ADC成为PD-L1阳性NSCLC的标准疗法，并且进一步验证PD-1单抗+ADC（TROP2 ADC、EGFRxHER3 ADC、B7H3 ADC、PD-L1 ADC）具备多种实体瘤一线疗法的治疗潜力。\n[太阳]风险提示：双抗及ADC的OS获益不及预期风险，临床推进速度不及预期风险等。", "preview": "【山证医药|创新药动态更新】肿...\n【山证医药|创新药动态更新】肿瘤创新药格局迎来变革时刻：从肺癌一线看全局，双抗、ADC有望变革一线NSCLC疗法\n[太阳]事件：2026年4月21日，2026年ASCO会议摘要题目公布。康方生物的PD-1/VEGF双抗药物Ivonecimab（AK112）联合化疗，对比百济PD-1抗体联合化疗，在一线肺癌的三期临床HARMONi-6，作为LBA公布最终OS数据，并将于Plenary Session（...", "sectors": ["生物制品"], "companies": ["康方生物", "科伦博泰"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 2, "timestampCount": 3, "timestamps": ["2026-04-22 09:11"]}, {"id": "evidence-270", "content": "【广发通信】光模块上游物料跟踪...\n【广发通信】光模块上游物料跟踪（一）：InP磷化铟衬底\n🪶根据昨天推送，光芯片26-28年仍然紧张，多家国内供应商将获得扶持，产能扩张提速。InP磷化铟衬底作为光芯片的“基石材料”，具备较高的电子迁移率，适配光通信高速数据传输需求，是EML光芯片、CW激光器的重要原材料。2026年光芯片随光模块放量供不应求，上游InP衬底环节也存在供需缺口，是当前光通信产业链的紧缺+价格弹性环节。目前InP衬底供应商主要为#住友、AXT，同时建议关注相关A股标的：\n1️⃣广东先导集团：先导集团旗下子公司预计年产40吨InP晶体，3月18日清远环评已批复。公司可提供使用VGF法生长2-6 英寸InP衬底，是国内较早实现6英寸InP衬底量产的企业，具备完整的In材料、设备、衬底产业链能力。下游客户包括国内26年出货量领先的光芯片公司。建议关注 （先导科技集团旗下上市公司平台）\n2️⃣ 控股子公司云南鑫耀半导体材料有限公司已量产2-4英寸InP晶片产品，公司计划投资近1.9亿元扩产InP扩建一条年产30万片（折合4英寸，含6000片6英寸）InP单晶片生产线，最终总产能达45万片/年（折合4英寸）。下游客户包含国内26年出货量前三的光芯片公司。同时去年8月，九峰山实验室联合云南鑫耀等企业宣布，6英寸工艺重大突破，关键性能指标达国际领先水平\n风险提示：产业发展不及预期", "preview": "【广发通信】光模块上游物料跟踪...\n【广发通信】光模块上游物料跟踪（一）：InP磷化铟衬底\n🪶根据昨天推送，光芯片26-28年仍然紧张，多家国内供应商将获得扶持，产能扩张提速。InP磷化铟衬底作为光芯片的“基石材料”，具备较高的电子迁移率，适配光通信高速数据传输需求，是EML光芯片、CW激光器的重要原材料。2026年光芯片随光模块放量供不应求，上游InP衬底环节也存在供需缺口，是当前光通信产业链的紧缺+价格弹性环节。目前InP衬底供应...", "sectors": ["有色"], "companies": ["云南锗业", "先导科技集团 吨，对应环比+1.89亿至4.44亿净利润。叠加年底广元基地补贴收益，因此Q4电解铝板块净利润环比+2.5亿元至7.3亿元净利润；\n（2）铝加工：受制于4季度易拉罐加工费下调逾400元，或叠加加工板块汇兑和坏账损失，公司4季度加工板块亏损0.7亿元，3季度盈利0.6亿元，环比减少1.3亿元利润。公司采取进料加工等方式有效对于内外价差扰动。\n（3）或源于其余成本费用扰动，侵蚀利润环比回落1.6亿元。其中，采矿权减值损失导致资产减值1.23亿元，公司公允价值变动损益-0.91亿元，4季度投资收益-0.56亿元。\n铝价弹性显现，1季度盈利创新高：公司1季度归母净利8.2亿元，扣非归母8.78亿元，纷纷创历史单季度新高。测算公司1季度四川和河南电解铝吨税前利润6047元和7541元，对应Q1净利润6.4亿元和3.5亿元，易拉罐板块或因加工费疲软有所拖累。且汇兑损失导致财务费用同比+0.9亿元，投资净收益同比-1.7亿元（铝期货套保），公允价值变动净收益同比+0.9亿元。\n电解铝红利大时代之下，公司作为氧化铝下跌高弹性+高分红标的，四川电价存在进一步下调空间，且海内外高价差，大幅抬升铝加工出口利润中枢。大规模员工持股落地彰显积极信心，盈利和估值迎来共振。公司拟2025-2027年分红率60%+，红利价值显现。按照75万吨电解铝，铝价24000元，氧化铝2800元，年化归母净利润40亿元，对应PE为8.6X，保守按照分红率60%，股息率7.0%，继续重点推荐。", "preview": "#中孚实业2025年报&202...\n#中孚实业2025年报&2026Q1简评：1季度盈利弹性显现\n公司2025全年归母净利为16.17亿元，同比+129%，现金分红7亿元，占母公司期末可供分配利润的86.34%；2026Q1归母净利为8.21亿元，同比+256%，环比+91%。\n加工费下调对冲电解铝改善，4季度盈利近持平\n（1）电解铝：2025Q4环比来看，铝价+806元、氧化铝价-359元、铝土矿价-3美元、煤价+95元、阳极+37...", "sectors": ["煤炭"], "companies": ["中孚实业"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 09:44"]}, {"id": "evidence-190", "content": "#华锡有色2025年年报&20...\n#华锡有色2025年年报&2026年一季报点评\n公司2025年实现净利润12.9亿元，同比+21.39%；实现归母净利润8.01亿元，同比+21.75%；单四季度，公司实现净利润4.62亿元，同比+122.06%，环比+115.72%；实现归母净利润3.07亿元，同比+161.22%，环比+172.85%。2026年一季度，公司实现净利润2.69亿元，同比+4.92%，环比-41.72%；实现归母净利润1.82亿元，同比+18.54%，环比-40.66%。\n2025年和2026Q1产销量整体保持平稳。公司2025年生产锡精矿含锡0.65万吨，同比-6.2%，产量小幅下滑主要受环保监管趋严和铜坑矿开采矿石品位下滑的影响；生产铅锑精矿1.58万吨，同比+5.4%；生产锌精矿含锌5.4万吨，同比-0.1%。2026年一季度矿产端延续稳健的经营态势，虽受春节放假影响，铅锑精矿和锌精矿产量环比25Q4下滑9.8%和15.5%，同比与2025Q1水平相当。\n25Q4业绩同环比高增，涨价和年底消化库存或为主要驱动。25Q4公司实现利润总额5.4亿元，环比实现2.8亿元增长。具体来看，25Q4锡、铅锑、锌自产金属量环比分别+19%、+3%、+14%；同时锡价环比涨12%，锑价环比跌11%。若以产量规模测算，锡、铅锑、锌资源测算利润总额环比分别+0.8、-0.2、+0.1亿元，资源端利润环比合计增长0.7亿元。其他业务方面，25Q3基于高峰出让权益金1.03亿元，压制利润表现；25Q4除权益金影响消除外，或对25年前三季度累积的库存做了集中销售，环比增利1.1亿元。考虑少数股权权益（主要是高峰矿少数股东），最终Q4归母环增2亿元至3.1亿元。\n26Q1或受春节影响导致产销规模不匹配；此外，佛子矿权益金或影响部分利润。26年一季度，锡、锑、锌价环比涨28.5%、1.4%、7.0%；测算公司资源端锡、铅锑、锌利润环比+1.3、-0.1、+0.1亿元，合计环比增利1.3亿元。其他业务方面，26Q1环比25Q4减少3.4亿元，其中1.1亿元来自25Q4销售库存的利润，26Q ，且净近成型成本低等优势，MIM在灵巧手指驱动齿轮和仿生手手指连接结构件等应用场景的潜在需求前景广阔。#上海富驰分别与国际、国内的头部客户建立广泛的联系。其中，就未来的合作，#与北美某国际头部客户签订了Standard Non-Disclosure Agreement框架协议，公司意在推进MIM技术在机器人的市场拓展；国内，#已有客户与上海富驰就钛合金MIM减重底座方案、#指节外壳和传感器支架MIM不锈钢材质等方案进行评估。\n2）新科技-AI 算力方向：公司依托MIM金属注射成形和SMC软磁复合材料核心技术，精准切入AI算力领域，目前主要聚焦#AI高速连接器、芯片和光模块散热器、芯片电感和服务器电源电感等核心零部件，打造适配AI算力设备高功率、高效率、小型化需求的产品体系，助力AI算力基础设施建设等。\n（2.1）高速连接器：MIM技术零件在高速背板连接器有更多的使用机会，#在112G/224G高速连接器的外壳和内部结构，对高散热率的MIM结构件的需求将越来越大。#公司成功开发了GB300用高速连接器MIM零件，开发了超过40个型号的其它高速连接器，该类产品已经系列化，成为公司最具特色的MIM产品之一。\n（2.2）芯片和光模块散热器及液冷：上海富驰成功开发了#间接供应英伟达液冷服务器的液冷板腔体、连接阀和连接器，目前正处于开发阶段，报告期内暂未实现销售收入；除此之外，又成功导入另一客户的液冷流体连接器项目，应用于液冷服务器，并在报告期内开始实现销售。#公司成功开发了用于光模块散热的MIM结构件、主要用于满足国内某头部企业的复杂设计高散热需求，#顺利承接了800G\\1600G等相关项目，目前正处于开发阶段，且尚未实现销售收入。\n（2.3）芯片电感和服务器电源电感：芯片电感主要分为组合式和一体式，一体式芯片电感又分为传统一体成型和铜铁共烧型两类型。目前，东睦科达已经批量生产组合式芯片电感，报告期内，公司铜铁共烧一体式芯片电感实现了零的突破，已实现了少量销售收入。为顺应AI等算力建设的发展趋势，#公司组建了SMC芯片电感项目全新团队，建设了芯片电感专用生产基地，市场开拓取得积极进展。\n3）新科技-高端消费电子方向：MIM在生产精密零部件方面优势突出，已经在折叠屏手机铰链领域广泛应用，未来在AI眼镜、智能手表、穿戴设备等领域有非常大的潜力，报告期内，公司实现MIM技术平台销售收入25.40亿元，其中消费电子占其收入比约82.73%，其中折叠机等高端消费电子产品占MIM技术平台收入比达73.28%。#公司承接了国内某头部客户一款AI眼镜项目的部分塑胶件及MIM零件，目前处于量产前阶段。\n预测：预计2026-2028年公司实现营收75.7/84.6/99.8亿元，归母净利润8.3/11.4/13.9亿元，对应当前股价PE为24/18/14倍，考虑到公司在行业地位和成长性，给予公司“买入”评级。\n-JT", "preview": "【东睦股份】NV液冷、机器人关...\n【东睦股份】NV液冷、机器人关节模组、高端消费电子助力公司再创佳绩\n#2026年一季度剔除股票激励费用归母净利润+38.07%。2026年一季度股权激励支付费用3734.19万元，影响公司净利润3174.06万元，影响归属于上市公司股东的净利润2835.41万元，若剔除后一季度实现归母净利润1.54亿元，同比+38.07%。同时一季度发放年终奖2318万元，再扣除年终奖影响，一季度归母净利润约为1....", "sectors": ["机器人"], "companies": ["东睦股份"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 09:18"]}, {"id": "evidence-37", "content": "【东财煤炭有色*李淼/张恒浩】...\n【东财煤炭有色*李淼/张恒浩】山金国际：产量不及预期，港股发行在即0421\n#业绩落于指引中值。公司26Q1实现营业收入59.4亿元，同比+37%，环比+182%；归母净利润13.9亿，同比+101%，环比+172%。业绩环比变化原因：1）25Q4大幅囤货为港股发行蓄力，26Q1额外销售0.4吨金+9吨银；2）25Q4有年末费用的计提，26Q1已基本恢复至正常季度水平。\n#矿产金拆分。价格方面，Q4金均价1070元/克，环比+141元/克，售价低于市价约18元/克，或与上海盛鸿销售策略相关；产销方面，Q4金产销量分别为1.65/2.04吨，环比-0.36/+0.91吨，产量低于预期，主因青海大柴旦品位略有下降 大规模减产、停产，该地区石化供应链的脆弱性暴露。短期来看，油价的快速攀升使得炼厂成本承压，有望加速欧日韩产能的退出；长期来看，东南亚供应链脆弱性的暴露将延缓资本开支速度，工业化速度有望下滑。我国原油采购呈现多元化分布，供应链稳定性优势明显，大石化资产价值有望得到重估。\n☎欢迎交流：杨晖13717871708/吴宇13248068705", "preview": "【中信建投化工】恒力石化202...\n【中信建投化工】恒力石化2026Q1点评：非经贡献Q1业绩超预期，低价原料Q2价差有望扩大\n[礼物]事件：\n⭕恒力石化发布2026年一季度报告，实现营收492.1亿元，同比-13.7%，实现归母净利润39.1亿元，同比+90.7%，实现扣非归母净利润24.1亿元，同比+94.3%。\n[红包]点评\n⭕26Q1销量略有下滑，毛利率改善明显\n26Q1公司炼化产品/PTA/聚酯产品三大业务板块分别实现营收2...", "sectors": ["石油石化"], "companies": ["恒力石化"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 09:17"]}, {"id": "evidence-168", "content": "【中信建投大化工】史丹利202...\n【中信建投大化工】史丹利2025FY+26Q1点评：复合肥主业量利齐升，广西项目稳步推进\n🔔事件：\n1）公司2025年实现营收122.83亿元，同比+19.69%；归母净利润10.33亿元，同比+25.07%；扣非净利润9.34亿元，同比+30.70%。\n2）公司26Q1实现营收40.60亿元，同比+19.22%；归母净利润3.42亿元，同比+18.54%；扣非净利润3.15亿元，同比+18.78%。\n[玫瑰]从经营情况看：\n1）2025年公司磷复肥销量391.1万吨，同比+11.3%。分产品角度，硫基复合肥、氯基复合肥、新型肥料及其他分别实现营收22.98、60.26、37.12亿元，同比+3.45%、+2.17%、+93.24%；毛利率分别为16.18%、20.04%、17.01%，同比-0.60、+1.71、-4.07pct。其中，新型肥料及其他板块营收高增，系磷肥出口增加及松滋新材料磷化工产品放量；利润率则受到折旧增加+磷酸铁等磷化工产品盈利低迷拖累。常规肥利润率则相对稳定。从现金流角度，2025年公司经营活动净现金流录得12.41亿元，较2024年的4.81亿元大幅改善。\n2）2026Q1公司依托春耕旺季，在充分发挥渠道及产品优势实现营收高增长的同时，凭借高周转及产品的议价能力，有效传导了原材料成本的上涨。同时，得益于松滋公司减亏的正面影响，26Q1公司录得毛利率/销售净利率 17.32%/8.88%，较去年同期分别 -0.67/+0.90PCT，表现超市场预期。\n[太阳]磷化工配套持续完善，广西项目贡献中期增量\n公司近年来围绕磷化工产业链持续延伸，黎河肥业稳健运行，松滋新材料经营情况大幅改善：报告期内松滋肥业磷肥/精制磷酸等装置保持高位开工，亏损大幅收窄的同时与内部配套及外销市场形成高效协同。当下公司广西基地100万吨新型绿色肥料项目在建，截至报告期末工程进度已达85%，广西基地的投产有望进一步提升公司在华南、西南等区域的市场覆盖和产品供给能力。我们看好公司围绕“复合肥主业+磷化工配套”实现一体化布局，持续增强行业竞争力。\n☎欢迎交流：杨晖/郑轶", "preview": "【中信建投大化工】史丹利202...\n【中信建投大化工】史丹利2025FY+26Q1点评：复合肥主业量利齐升，广西项目稳步推进\n🔔事件：\n1）公司2025年实现营收122.83亿元，同比+19.69%；归母净利润10.33亿元，同比+25.07%；扣非净利润9.34亿元，同比+30.70%。\n2）公司26Q1实现营收40.60亿元，同比+19.22%；归母净利润3.42亿元，同比+18.54%；扣非净利润3.15亿元，同比+18.78%...", "sectors": ["农林牧渔"], "companies": ["史丹利"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 09:16"]}, {"id": "evidence-137", "content": "【中信建投大化工】梅花生物20...\n【中信建投大化工】梅花生物2025FY+26Q1点评：业绩短期承压，聚焦全品类氨基酸产品+全球化市场开拓\n🔔事件：\n1）公司发布2025年报，全年实现营收242.09亿元，同比-3.43%；归母净利润32.81亿元，同比+19.72%；扣非净利润22.05亿元，同比-18.22%。\n2）公司公告2025年度利润分配预案，拟每10股派现4.279元（含税），合计派现约12亿元，股利支付率36.6%。\n3）公司2026Q1实现营收59.86亿元，同比-4.51%，环比-0.13%；归母净利润1.18亿元，同比-88.42%，环比-53.90%。\n[玫瑰]分板块经营方面，2025年公司动物营养氨基酸/人类医用氨基酸/食品味觉性状优化板块分别实现营收142.02/7.40/74.70亿元，yoy-2.88%/+55.45%/-5.98%；销量296.04/1.19/113.54万吨，yoy+6.33%/+21.30%/+13.64%；毛利率20.83%/33.12%/12.73%，yoy+1.18/+7.44/-6.72PCT。其中，动物氨基酸收入下滑系赖氨酸、饲料级异亮氨酸等销量增长无法覆盖产品市价下跌，毛利率提升得益于原料成本下降与生产指标的改善；食品味觉优化产品受味精、黄原胶价格下行拖累，营收毛利均有所下滑；人类营养与医用氨基酸则在较低基数上实现高增，主要得益于针对海外工厂的收购扩大了产品规模及销量。公司全年录得毛利率/销售净利率19.00%/13.55%，同比-1.07/+2.62PCT。\n[礼物]25Q4-26Q1氨基酸价格承压运行，公司有望逐步走出盈利困境：\n受行业供需关系影响，去年11月以来赖氨酸、苏氨酸、味精等产品价格承压运行：据百川盈孚统计，今年1月国内苏氨酸/98%赖氨酸行业均价分别为7.2/6.3元/公斤，较Q3均价分别下跌20%/13%；同时由于今年春节较晚，直至2月行业内需仍较为平淡。进入3月，受美伊冲突催化、叠加需求旺季到来下游刚需补库，氨基酸价格触底反弹。截至当下国内苏氨酸/98%赖氨酸市场均价分别9.8/7.8元/公斤，较1月低点上涨36%/24%；且出口端由于海外受成本驱动，价格同样快速上涨。考虑到订单（特别是海外）的滞后性，公司Q2有望逐步走出盈利困境。\n[太阳]2025年公司稳步推进产能释放与资产优化，未来将聚焦于高价值发酵领域及全球差异化竞争：\n报告期内吉林子公司赖氨酸新产线投产、通辽味精扩产等项目顺利落地，同时公司完成针对日本协和收购的资产交割及业务交接，实现全流程闭环、并持续优化其管理和经营，其中核心主产品产能利用率较整合前提升超20%、单位生产成本同比下降15%。至此公司已建立起“饲料级+食品级+医药级”全品类、多层次的氨基酸产品体系，为后续拓展海外市场筑牢根基。我们看好公司未来围绕新整合成立的Plumino公司，聚焦高端医药氨基酸和精准发酵高价值产品，在高技术及市场壁垒的领域培育新的增长动能。公司年报披露Plumino公司目标于2026年实现利润端扭亏、于2030年实现收入翻番，并计划精准发酵领域申请专利15项以上。\n☎欢迎交流：杨晖/郑轶", "preview": "【中信建投大化工】梅花生物20...\n【中信建投大化工】梅花生物2025FY+26Q1点评：业绩短期承压，聚焦全品类氨基酸产品+全球化市场开拓\n🔔事件：\n1）公司发布2025年报，全年实现营收242.09亿元，同比-3.43%；归母净利润32.81亿元，同比+19.72%；扣非净利润22.05亿元，同比-18.22%。\n2）公司公告2025年度利润分配预案，拟每10股派现4.279元（含税），合计派现约12亿元，股利支付率36.6%。\n...", "sectors": ["农林牧渔"], "companies": ["梅花生物"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 08:59"]}, {"id": "evidence-200", "content": "【中信新材料】看好Q2半导体硅...\n【中信新材料】看好Q2半导体硅片涨价，相关公司修复空间较大\n1⃣综合考虑海外供需关系、海外龙头盈利情况、海外能源成本等情况，我们判断2026Q2有望成为海外12寸轻掺硅片涨价的关键节点【目前信越化学已经宣布涨价10%】，从而带动12寸重掺、国内12寸轻掺乃至8寸硅片等产品跟涨，开启半导体硅片新一轮的量价齐升周期，我们看好beta行情下具备特色的半导体硅片公司的 动、PC端公测，截至4月22日10：00排名iPhone端游戏免费榜第16名，我们建议关注游戏的获客表现及商业化节奏。\n☀盈利预测与估值\n考虑到收入结构调整，我们下调公司26/27E收入14%/8%至18/21亿元，上调26/27E归母净利18%/23%至4.8/5.4亿元。当前股价对应40x 26E P/E。维持中性评级，由于归母净利预测上调，上调目标价43%至30元（42/37x 26/27E P/E），上行空间6%。\n☀风险\n广告及游戏行业景气度不确定性，云业务、新游戏进展波动。\n❤张雪晴,余歆瑶,曹嘉扬", "preview": "【中金传媒】顺网科技2025R...\n【中金传媒】顺网科技2025Review：聚焦高毛利业务利润高增，关注云业务进展\n公司公布2025年业绩：收入17.4亿元（低于我们预期18.8亿元），同降5%；归母净利润4.18亿元（预告3.6-4.3亿元，好于我们预期3.7亿元），同增66%；扣非归母净利润3.07亿元（预告2.8-3.2亿元），同增41%。\n☀发展趋势\n1️⃣业务结构调整下毛利率提升，PC游戏高景气度或持续驱动毛利增量。公司2...", "sectors": ["AI应用"], "companies": ["顺网科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 14:56"]}, {"id": "evidence-173", "content": "【信达消费-点评】六福集团：1...\n【信达消费-点评】六福集团：1-3月零售值稳健增长，中国内地以外市场表现靓丽\n公司2026财年第四季度（26年1-3月）整体实现零售值（按自营店、品牌店及电商业务销售的最终零售值计算）同比+19%，其中中国内地同比+8%，中国内地以外市场同比+42%；整体实现零售收入（包括自营店及电商业务的销售金额）同比+36%，其中中国内地同比+20%，中国内地以外市场同比+41%。\n同店销售方面，2026财年第四季度公司整体同店销售（同一间自营店于可比较期内有完整日运营的销售比较）同比+33%，其中内地同比-1%，内地以外市场同比+39%。我们认为，1-3月随着中国内地新黄金增值税政策实施，中国港澳市场与中国内地市场的产品价差扩大，吸引更多消费者到中国港澳地区购买黄金产品，有利于该市场的零售表现。就中国内地市场而言，我们预计品牌店的同店增速有望明显快于自营店，呈现增长势头。\n产品结构持续优化，定价黄金占比提升。分品类看，FY2026第四季度集团整体同店销售口径下，黄金（按重量计）/定价首饰分别同比+42%/+10%，定价首饰中，18K金钻石同比-9%，定价黄金同比+20%，在面对高基数仍保持良好增长。产品方面，公司持续推出重磅新品，携手电影《哪吒之魔童闹海》推出“飞天猪足金储金壶”、“哪吒足金工艺品”、“乾坤圈足金手镯”等新品，唐宫文创系列推出“洛神水赋”等，并在北京王府井百货大楼推出“宋韵传家”主题展。\n中国内地渠道结构性调整，海外市场持续扩张。截至2026年3月31日，集团共有3005家门店，分地区看，中国内地/中国港澳/海外市场分别开有2880/74/51家，26年1-3月分别-71/+0/+3家；分品牌看，六福珠宝主品牌/金至尊/其他分别开有2524/260/221家，26年1-3月分别-63/+3/-8家。海外市场方面，FY2026集团在海外地区净开20家店铺，达成目标，接下来公司计划加快拓展海外市场，抓紧发展机遇。\n盈利预测：我们预计2026-2028财年公司归母净利润分别为15.0/17.2/19.5亿港元，PE分别为9.0X/7.9X/7.0X。\n风险因素：金价大幅波动、行业竞争加剧、新品推广不及预期、渠道扩张不及预期。", "preview": "【信达消费-点评】六福集团：1...\n【信达消费-点评】六福集团：1-3月零售值稳健增长，中国内地以外市场表现靓丽\n公司2026财年第四季度（26年1-3月）整体实现零售值（按自营店、品牌店及电商业务销售的最终零售值计算）同比+19%，其中中国内地同比+8%，中国内地以外市场同比+42%；整体实现零售收入（包括自营店及电商业务的销售金额）同比+36%，其中中国内地同比+20%，中国内地以外市场同比+41%。\n同店销售方面，2026财年第...", "sectors": ["珠宝首饰"], "companies": ["六福集团"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCoun ies": ["新东方"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 20:49"]}, {"id": "evidence-175", "content": "【国信食饮|张向伟团队】甘源食...\n【国信食饮|张向伟团队】甘源食品2025&26Q1业绩点评\n业绩数据：25FY实现营业总收入21.0亿元，同比-7.1%；实现归母净利润2.1亿元，同比-44.6%；实现扣非归母净利润1.9亿元，同比-44.3%。1Q26实现营业总收入6.2亿元，同比+22.5%；实现归母净利润0.7亿元，同比+25.7%；实现扣非归母净利润0.6亿元，同比+29.0%。#25年业绩低于预期、26Q1业绩超预期。\n1、#2025年收入受传统经销渠道下滑拖累，电商、直营渠道高速增长。分产品看，综合果仁及豆果/青豌豆/瓜子仁/蚕豆/其他系列收入分别-18.6%/+1.0%/-6.5%/+0.3%/-6.8%。分渠道看，经销模式收入同比-17.7%，收入占比从2024年的85.4%大幅降至75.6%，主因公司主动对部分KA渠道由经销商模式转为直营模式，并优化部分经销商。电商/直营及其他模式收入分别同比+35.8%/+101.9%，得益于公司在电商渠道扩充品类及加大投入。\n2、#2025年成本高位、费用投入增多，盈利能力受损。25年毛利率同比-0.7pp，主要系棕榈油成本维持高位。25年销售/管理/研发/财务费用率分别同比+5.0/+0.8/0.0/+0.1pp，#销售费用率增幅明显主要系公司为推广新品、线上线下渠道开拓、加强品牌营销而增大了投放，管理费用率提升主因为国内渠道结构调整以及海外市场拓展做了相应的团队扩张。25年归母净利率9.9%，同比-6.7pp。\n3、#2025年维持70%高比例现金分红。公司提出25年末期分红方案，拟每10股派发现金红利10.13元（含税），分红总额约0.93亿元，叠加中期分红，25年度累计分红1.46亿元，现金分红比例70%，同比持平。\n4、#Q4+Q1合并收入微增2.2%，Q1费率有所优化。4Q25收入同比-13.6%，主因春节错期导致部分备货后移，合并看Q4+Q1收入同比+2.2%。利润端，Q4单季净利率为9.3%，同比-5.9pp，降幅较Q3变化不大，盈利能力继续承压。Q1净利率10.7%，同比+0.3pp，毛利率同比-0.4pp，棕榈油原料成本仍承压，#但费用率开始优化，销售/管理费用率分别同比-0.1/-1.3pp，我们预计公司在25年大幅增投费用后开始进入费用稳定或适度优化阶段。\n观点：公司在2025年积极推进深刻的渠道变革，并辅以产品创新和海外拓展，为未来重回增长轨道奠定基础。#预计新品铺市、渠道改革红利释放、海外市场突破、费率优化将是2026年核心看点，建议密切关注。预计26年收入23.2亿，同比+11%，归母净利2.6亿，同比+26%，当前股价对应PE 19x。", "preview": "【国信食饮|张向伟团队】甘源食...\n【国信食饮|张向伟团队】甘源食品2025&26Q1业绩点评\n业绩数据：25FY实现营业总收入21.0亿元，同比-7.1%；实现归母净利润2.1亿元，同比-44.6%；实现扣非归母净利润1.9亿元，同比-44.3%。1Q26实现营业总收入6.2亿元，同比+22.5%；实现归母净利润0.7亿元，同比+25.7%；实现扣非归母净利润0.6亿元，同比+29.0%。#25年业绩低于预期、26Q1业绩超预期。\n...", "sectors": ["食品饮料"], "companies": ["甘源食品"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 09:17"]}, {"id": "evidence-47", "content": "【国泰海通基础化工团队】皇马科...\n【国泰海通基础化工团队】皇马科技：26Q1归母净利润同比增长10.47%，积极开拓战略性新兴产业\n[太阳]2026年第一季度报告，公司实现营收6.57亿元，同比增长8.89%;归母净利润1.12亿元，同比增长10.47%; 扣非净利润1.1亿元，同比增长10.98%。2025年，公司实现营收24.04亿元，同比增长3.06%;实现归母净利润4.37亿元，同比增长9.76%; 实现扣非净利润4.02亿元，同比增长6 evidence-337", "content": "【国金机械】GEV 一季报点评：在手订单可见度持续提升，燃机景气度继续上行\n#26Q1燃机订单可见度提升到4.9年，#燃机供需缺口持续拉大。26Q1，GEV燃机新签订单8.1GW，同比+14.1%。由于价格上涨，金额涨幅更高，26Q1电力业务订单100亿美元，同比+59%。26Q1交付燃机4.2GW，仍维持在较低水平。在手订单方面，功率口径，25Q1-26Q1公司在手订单（包含预留协议在手订单）分别为50/55/62/83/100GW，26年底指引超110GW。金额口径，26Q1末GEV电力板块（燃机约占82%）在手订单为996.94亿美元，按照过去4个季度电力业务合计收入203.16亿美元计算，当前电力业务在手订单覆盖年限从25Q4末的4.77年提升到4.91年，在手订单排期继续拉长，行业景气度持续提升。\n#受益燃机价格上涨，#公司上调2026年业绩指引。GEV将26年收入预期从440-450亿美元上调至445-455亿美元；调整后EBITDA margin从之前的11%-13%上调至12%-14%；自由现金流从之前的50-55亿美元上调至65-75亿美元。其中电力业务，受益燃气轮机持续涨价，2026年EBITDA margin从之前的16%-18%上调至17%-19%，看好国内产业链龙头应流股份业绩同趋势向上。\n#全球景气度提升，#看好应流股份订单持续高增。GEV作为全球燃机龙头，2025年末在手订单环比持续提升，表明交付紧张，产能严重紧缺。当前产业链瓶颈主要卡在叶片环节。涡轮叶片是燃机核心零部件，价值量大，壁垒高，集中度高，且全球产能严重不足，是当前燃机交付困难的主要原因。应流股份作为国内叶片龙头，经过长期重资产投入，现已进入收获期。在行业爆发前就已经完成了对头部主机厂的产品认证，是国内稀缺的叶片龙头，25年燃机收入仅9e，相比行业规模有大幅提升空间，看好公司后续出口订单持续爆发。\n☎国金机械：满在朋/房灵聪18361753245", "preview": "【国金机械】GEV 一季报点评：在手订单可见度持续提升，燃机景气度继续上行\n#26Q1燃机订单可见度提升到4.9年，#燃机供需缺口持续拉大。26Q1，GEV燃机新签订单8.1GW，同比+14.1%。由于价格上涨，金额涨幅更高，26Q1电力业务订单100亿美元，同比+59%。26Q1交付燃机4.2GW，仍维持在较低水平。在手订单方面，功率口径，25Q1-26Q1公司在手订单（包含预留协议在手订单）分别为50/55/62/83/100GW，...", "sectors": ["AI配电"], "companies": ["应流股份"], "sources": ["wechat_group_1"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 20:15"]}, {"id": "evidence-57", "content": "【国金电子】持续看好【仕佳光子...\n【国金电子】持续看好【仕佳光子】，低估的光芯片光器件平台公司\n#上周五公司披露12e+光芯片及器件扩产项目，同时落地股权激励\n1） CW已完成核心大客户验证，处于锁产能阶段。公司26年产能充足，27年扩产翻倍。100G eml处于送样阶段，300-400mw CW内部测试完成，即将送测海内外客户。\n2）主业26年持续上量，CPO fau通过部分客户验证，小批量出货中，awg大客户加大拉货，mpo受益涨价和出货量增加，主业利润高弹性！\n欢迎详聊", "preview": "【国金电子】持续看好【仕佳光子...\n【国金电子】持续看好【仕佳光子】，低估的光芯片光器件平台公司\n#上周五公司披露12e+光芯片及器件扩产项目，同时落地股权激励\n1） CW已完成核心大客户验证，处于锁产能阶段。公司26年产能充足，27年扩产翻倍。100G eml处于送样阶段，300-400mw CW内部测试完成，即将送测海内外客户。\n2）主业26年持续上量，CPO fau通过部分客户验证，小批量出货中，awg大客户加大拉货，mpo受益...", "sectors": ["光模块"], "companies": ["仕佳光子"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 00:06"]}, {"id": "evidence-17 [玫瑰]本次ASCO会议将有4个实体瘤分子展示，其中GPC-3/4-1BB双抗为口头报告\nBGB-B2033 (GPC3 x 4-1BB 双抗)：将披露单药用于筛选的实体瘤的1期临床结果。披露形式为口头报告，结果值得期待。\nBGB-43395（selective CDK4 inhibitor ）：将披露联合来曲唑用于1L治疗HR+/HER2-BC的1期临床结果。\nBG-C9074 (B7-H4-targeting ADC) ：将披露实体瘤剂量爬坡与安全性扩展队列结果。\nBGB-A3055 (anti-CCR8) 也会有壁报展示。\n[玫瑰]未来一年，中后期管线也将迎来多项重点里程碑进展\n多项药物将进入III期临床或申报上市进程。2026H1：1）泽布替尼关于TN MCL的MANGROVE研究III期-PFS期中分析数据读出；2）BGB-16673（BTK CDAC）关于R/R CLL的II期数据读出，这属于潜在关键性数据；3）CDK4抑制剂的1L HR+/HER2- BC的III期临床启动（已达成）；4）在TN CLL适应症上，索托克拉联合泽布替尼头对头阿可替尼和维奈克拉的III期临床启动。2026H2：泽布替尼的关于MM的III期临床将启动。\n更多联系：天风医药 杨松/曹文清", "preview": "【天风医药杨松团队】百济神州加...\n【天风医药杨松团队】百济神州加大推荐：实体瘤领域多款分子将在ASCO披露早期数据，GPC-3/4-1BB为口头报告\n[玫瑰]本次ASCO会议将有4个实体瘤分子展示，其中GPC-3/4-1BB双抗为口头报告\nBGB-B2033 (GPC3 x 4-1BB 双抗)：将披露单药用于筛选的实体瘤的1期临床结果。披露形式为口头报告，结果值得期待。\nBGB-43395（selective CDK4 inhibi...", "sectors": ["医药"], "companies": ["百济神州"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 08:58"]}, {"id": "evidence-129", "content": "【天风医药杨松团队】苑东生物：...\n【天风医药杨松团队】苑东生物：控股超阳药业布局分子胶赛道，创新管线多点突破\n[太阳]事件：公司发布2025年年报及2026年一季报。2025年全年，公司实现营业收入13.31亿元，同比下降1.36%；归母净利润2.84亿元，同比增长19.24%。2026Q1，公司实现营业收入3.26亿元，同比增长6.75%；归母净利润0.51亿元，同比下降16.11%。\n[玫瑰]HP-001胶囊：口服IKZF1/3分子胶降解剂，具备BIC潜力，已进入Ib/IIa期临床\nHP-001/CY001为控股子公司超阳药业（持股51.48%）自主研发的口服CRBN分子胶降解剂，适应症为联用地塞米松治疗R/R MM（II期）和单药治疗NHL（I期）。临床前研究显示其IKZF1/3降解效率、底物选择性及安全性均显著优于已上市IMiDs及下一代候选药物，具备BIC潜力。目前已完成Ia期单药剂量爬坡，进入Ib期剂量拓展和IIa期联合地塞米松用药阶段，在低、中、高剂量组均观察到有效性积极信号。该类分子胶药物为MM核心骨干用药，2024年来那度胺和泊马度胺等七大主要市场关于MM疾病的市场规模达161亿美元，2033年预期增长至约200亿美元。\n[玫瑰]HP-002片：可透脑BTK PROTAC降解剂，已提交IND申请\nHP-002为超阳药业自主研发的可透脑口服BTK PROTAC降解剂，适应症覆盖抗肿瘤和自免。临床前研究显示其对C481S/F、T474I等多种BTK耐药突变株具备广谱高效降解活性，降解效率与抗肿瘤活性显著优于NX-5948等同类产品，具备BIC潜力。HP-002已于2026年3月申报IND。此外，超阳药业还拥有HP-003（自免分子胶，临床前）及DAC平台首个分子（已获PCC立项，Pre-IND阶段）等管线。\n[玫瑰]母公司创新管线多点突破，研发梯队逐步成型\n苑东生物立足于自身优势，在抗肿瘤、自免、麻醉镇痛三大领域立项创新药管线十余条：YLSH003（TF ADC，适应症为晚期实体瘤）已启动I/II期临床并完成首例入组；EP-0210单抗（TL1A，适应症为IBD）已进入I期临床；EP-0226片（Cav2.2调节剂，适应症为神经病理性疼痛）正推进I期临床。\n[咖啡]更多请联系：天风医药 杨松/曹文清", "preview": 25年及1Q26年业绩点评：复合肥销量稳步增长，松滋新材料盈利显著改善，26Q1业绩略超预期\n[玫瑰]公司发布2025年年报，业绩符合预期，25年公司分红率约35%。25年公司实现营业收入122.83亿元（yoy+20%），归母净利润10.33亿元（yoy+25%），扣非后归母净利润9.34亿元（yoy+31%），毛利率18.15%（yoy-0.03 pct），净利率8.56%（yoy+0.61pct），业绩符合预期。其中25Q4公司实现营业收入为29.94亿元（yoy+26%，QoQ+3%），归母净利润为2.18亿元（yoy+35%，QoQ+5%），扣非后归母净利润为1.81亿元（yoy+29%，QoQ-1%），毛利率18.59%（yoy+0.48 pct，QoQ+3.02pct），净利率7.62%（yoy+0.33 pct，QoQ+0.06 pct）。预计25Q4归母净利润同比增长的原因为：复合肥销量同比提升，磷化工产品开工提升，松滋新材料盈利同比好转。公司公告2025年度利润分配预案，拟向全体股东每 10 股派发现金股利 2.70 元（含税），叠加25年半年度分红的0.52亿元，25年全年分红为3.63亿元，全年分红占归母净利润的35.12%。\n[玫瑰]公司发布26年一季报，业绩略超预期。26Q1公司实现收入40.60亿元（YoY+19%，QoQ+36%），实现归母净利润3.42亿元（YoY+19%，QoQ+57%），实现扣非归母净利润3.15亿元（YoY+19%，QoQ+74%），毛利率为17.32%（YoY-0.68 pct，QoQ-1.27pct），主要是部分原料上涨过快导致。26Q1归母净利润同比增长主要由于：1）复合肥销量同比增长；2）松滋基地同比扭亏为盈；3）部分库存收益。\n[玫瑰]25年及1Q26年磷复肥销量稳步增长，单吨盈利维持平稳，原料波动增大致使中小复合肥企业加速退出，头部企业市占率进一步提升。25年公司复合肥销量348万吨（yoy+4%），由于磷铵产能释放，25年公司实现磷复肥销量达391.09万吨（yoy+11%），实现营收120.35亿元（yoy+20%），实现毛利22.12亿元（yoy+19%），凭借产业链和渠道优势，市占率进一步提升。公司目前拥有磷铵产能100万吨/年，产品优先保障复合肥生产，产能利用率稳步提升中，广西公司年产100万吨新型绿色肥料项目正在建设中。1Q26年复合肥产量预计同比继续增长，原料硫磺等波动增大致使中小复合肥企业加速退出。\n[玫瑰]磷化工项目开工负荷继续提升，松滋新材料盈利显著改善，1Q26年预计已扭亏。公司的磷酸业务以湖北松滋基地为核心，目前拥有湿法磷酸30万吨/年、精制磷酸10万吨/年、磷酸铁5万吨/年产能（暂未开工）。25年松滋新材料公司经营大幅改善，磷肥、精制磷酸等装置保持高位开工，产量稳步增长，同时受益于内部原料配套与外销市场协同，该项目亏损大幅收窄，26Q1预计松滋新材料盈利同比实现扭亏为盈，奠定公司业绩增长基础。目前黎河肥业拥有10万吨工业一铵的产能，年产6万吨高端水溶肥项目正在建设中，磷化工产业链的贯通，增强了公司关键原料的成本控制力与供应安全性。", "preview": "史丹利25年及1Q26年业绩点...\n史丹利25年及1Q26年业绩点评：复合肥销量稳步增长，松滋新材料盈利显著改善，26Q1业绩略超预期\n[玫瑰]公司发布2025年年报，业绩符合预期，25年公司分红率约35%。25年公司实现营业收入122.83亿元（yoy+20%），归母净利润10.33亿元（yoy+25%），扣非后归母净利润9.34亿元（yoy+31%），毛利率18.15%（yoy-0.03 pct），净利率8.56%（yoy+0.6...", "sectors": ["农林牧渔"], "companies": ["史丹利"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 08:52"]}, {"id": "evidence-90", "content": "在这几天的调整中，我们再call【中国动力】，前面讲过太多次燃机，这次主要更新主业：\n1、竞争格局好，比下游造船更好；\n2、涨价，特别新船价格涨更多；\n3、最重要❗️船维修市场，千亿市场，2030年10%份额也就是100亿，今年营收预计也就是600亿，后市场盈利能力更好。", "preview": "在这几天的调整中，我们再call【中国动力】，前面讲过太多次燃机，这次主要更新主业：\n1、竞争格局好，比下游造船更好； 20:59"]}, {"id": "evidence-110", "content": "好太太：渠道改革成效显现，市占...\n好太太：渠道改革成效显现，市占率稳步攀升\n[太阳]事件：好太太发布2025年报及2026年一季报。25全年实现收入15.44亿元（同比-0.9%），归母净利润2.03亿元（同比-18.2%）；25Q4实现收入4.84亿元（同比-0.8%），归母净利润0.60亿元（同比+3.4%）；26Q1实现收入3.15亿元（同比+21.7%），归母净利润0.41亿元（同比+21.4%），扣非归母净利润0.38亿元（同比+20.8%）。\n[太阳]点评：25年承压主要系需求弱势&竞争加剧，智能晾晒行业整体呈现规模扩容、价格下沉（行业均价跌破1100元）。公司全年智能晾衣架销量同比+28%（行业增速为10%左右），仍在持续抢占份额。凭借深化渠道改革、强化品牌势能，我们判断公司市占率仍在向上，26Q1收入端表现靓丽。\n[太阳]电商维持增长，线下渠道加速改革。行业内线下流量持续萎缩，公司顺应趋势、深化线上精细化运营与精准化施策，25H2电商收入同比+13.8%，我们预计26Q1增长有望维持。此外，公司坚持产品差异化竞争策略、集中资源布局高端产品，25H2线上毛利率提至53.2%（24年为50.7%）。线下方面，25H2南区/北区收入同比分别-9.6%/-25.6%，凭借渠道坚定推进“平台+零售”转型战略、推进店效倍增计划，我们预计26Q1线下拐点显现、低基数下增速有望更优。\n[太阳]毛利率短期承压，规模优势显现。26Q1公司毛利率为43.63%（同比-4.3pct），净利率为12.90%（同比-0.03pct），我们预计毛利率承压主要系大宗原材料价格提升，同时我们判断公司凭借内部降本增效已有效弱化影响；后续伴随关键零部件自制比例提升，毛利率有望持续修复。费用表现来看，26Q1期间费用率为32.96%（同比-1.1pct），其中销售/研发/管理/财务费用率分别为24.18%/2.80%/6.57%/-0.58%（同比分别+0.87/-0.35/-1.88/+0.23pct），整体表现平稳。\n[太阳]现金流&营运能力表现优异。26Q1经营性现金流净额为0.37亿元（25Q1为-0.78亿元）；存货/应收/应付周转天数分别为60.98/25.10/89.97天（同比-36.6/-2.45/-19.64天）。\n[太阳]盈利预测：我们预计2026-2028年公司归母净利润分别为2.3/2.8/3.3亿元，对应PE为27.6X/22.6X/18.8X。\n[月亮]风险因素：新产品推广不及预期、市场竞争加剧、房地产市场低迷。", "preview": "好太太：渠道改革成效显现，市占...\n好太太：渠道改革成效显现，市占率稳步攀升\n[太阳]事件：好太太发布2025年报及2026年一季报。25全年实现收入15.44亿元（同比-0.9%），归母净利润2.03亿元（同比-18.2%）；25Q4实现收入4.84亿元（同比-0.8%），归母净利润0.60亿元（同比+3.4%）；26Q1实现收入3.15亿元（同比+21.7%），归母净利润0.41亿元（同比+21.4%），扣非归母净利润0.38亿元...", "sectors": ["家用轻工"], "companies": ["好太太"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 08:51"]}, {"id": "evidence-279", "content": "学大教育：重视超跌底部机会！\n...\n学大教育：重视超跌底部机会！\n📈当前对应3亿年内业绩预期仅14xPE，处于历史估值极低位，随业绩逐步兑现估值修复空间可期\n主业为高中阶段为主的1对1课外培训，A股唯一稀缺全国化布局教培龙头，23年行业恢复以来处于可观持续增长与盈利改善轨道。\n1）需求：课外培训刚需属性可持续，且23年以来普高扩招导致高考竞争加剧，支撑客群基数与需求持续增长；\n2）格局：龙头格局占优逻辑延续，预计市占率仍处于稳步提升趋势，且1对1与班课非直面竞争，1对1领域学大竞争优势尤其突出。\n前期深度调整主要受25Q3业绩波动与板块情绪波动影响，而业绩波动与彼时淡季阶段性因素相关，考虑收款与合同负债增长趋势良好，#26Q1～Q2旺季表现值得期待，市场信心有望随业绩兑现重新建立，估值修复空间可期。\n嵇文欣/孟鑫", "preview": "学大教育：重视超跌底部机会！\n...\n学大教育：重视超跌底部机会 前市值仅117亿，超3倍空间，重点推荐。", "preview": "行云科技更新：#首批订单B30...\n行云科技更新：\n事件：#首批B300服务器火速抵库，标志前期基于NCP渠道的低成本布局正式转化为算力，算力租赁龙头即刻上线。\n行云科技此次超预期到货，实质性解决了稀缺卡源的供给问题，也是对前期市场部分“行云拿不到卡”谣言的回击。目前公司共拟采购的2000台B300（行业成本最低NCP渠道，单机拿货成本310万元，融资利率4%），按大订单每月15万元租赁价格测算，单台服务器年经营性现金流可达143.6...", "sectors": ["算力租赁"], "companies": ["行云科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-22 13:57"]}, {"id": "evidence-378", "content": "谷歌 TPU v8 解读\n谷...\n谷歌 TPU v8 解读\n谷歌把 AI 芯片一刀切成两半，一块专门用于训练大模型，一块专门用于运行推理，因为这两项任务所需的硬件架构和核心需求已经完全不同。\n训练芯片（8t）：追求极致规模\n一口气可串联 13.4 万颗芯片进行大模型训练，最大规模还可进一步扩展至 100 万颗。\n首次支持 4-bit 计算（FP4），在同等算力规模下，运算速度实现翻倍提升。\n存储读取速度相比上一代产品快 10 倍，彻底解决芯片等待数据传输的核心痛点，实现数据与计算的高效匹配。\n推理芯片（8i）：追求极致低延迟\n芯片内部集成了 3 倍大的缓存，在 AI 对话等实时交互场景中，无需反复远距离调取数据，显著提升响应速度。\n新增同步加速器（CAE），让多颗芯片协同工作时，彼此间的等待时间缩短 80%，大幅提升集群协作效率。\n最关键的创新：互联拓扑重构\n将传统的\"邻居串门\"式互联拓扑，升级为全员直连模式。\n针对 MoE 模型，每个 token 可能需要调用任意专家模块，不再需要逐跳跳转，最多 7 跳即可到达任意芯片，传输效率比之前提升一倍。\n核心突破并非单纯算力提升，而是架构分叉 —— 训练芯片（8t）采用 Torus 架构追求极致规模，推理芯片（8i）则通过 Boardfly 架构 + 同步加速器 + 大容量 SRAM，专攻低延迟需求。\nMoE 模型改变了传统通信模式，推理集群全面采用 OCS 全互联技术。\n隐藏关键细节：推理芯片的光路交换机（OCS）\n推理芯片的\"全员直连\"互联，核心依赖光路交换机（OCS）。\n光路交换机直接通过光信号进行连接切换，无需电信号转换，实现极低延迟传输。\n此前光路交换机仅在训练集群使用，如今推理集群也全面部署，直接推动相关产业链市场空间翻倍。\n谷歌第八代 TPU 对比上一代 Ironwood 核心提升\n训练性价比提升 2.7 倍，推理性价比提升 1.8 倍，整体能效实现翻倍。\n存储访问速度快 10 倍，片上缓存容量大 3 倍，多芯片协作等待时间缩短 5 倍。\n芯片间互联带宽翻倍，数据中心骨干网带宽最高翻 4 倍。\n全互联通信跳数从 16 跳降至 7 跳，减少 56% 的通信损耗。\n推理芯片 HBM 容量从 216GB 提升至 288GB，带宽从 6528GB/s 提升至 8601GB/s。\n集群规模从数万颗芯片扩展至 13.4 万颗，最大可连接 100 万颗芯片。\n对英伟达的核心影响\n若谷歌对外售卖 TPU，将对英伟达形成显著冲击，但真正威胁并非来自 TPU 产品本身。\n核心威胁是 TPU 验证的\"训练 / 推理分叉\"路线，将被行业广泛采用。\n行业共识显示，推理算力需求是训练的 3-5 倍，若推理市场被自研 ASIC 芯片逐步蚕食，英伟达的可触达市场规模将大幅缩水。\n行业连锁反应\nCSP 厂商纷纷开启自研芯片布局，达子（高端芯片）的稀缺性逐渐稀释，不再是唯一核心选择。\n推理 ASIC 芯片迎来发展机遇，芯原和翱捷（刚成立子公司）将迎来业务发展的黄金时期。\n工艺层面核心受益：天孚通信\n推理芯片的 OCS 全互联技术，直接利好 OCS 产业链，其中天孚通信是核心受益标的。\nOCS 核心部件为 MEMS 微镜阵列，天孚通信负责微镜的封装与光纤耦合工艺。\nFAU 光纤阵列为天孚通信自产核心产品，OCS 的每个端口均需配备该部件。\n天孚通信最新公告\n公司配合客户开发 CPO 配套 FAU、ELS 产品，并持续增加产能，其核心客户即为谷歌、英伟达等全球顶尖科技企业。\n公司 1.6T 光引     function 读取地址() {
      const 片段 = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      const 参数 = new URLSearchParams(片段);
      状态.板块 = 参数.get('板块') || '';
      状态.个股 = 参数.get('个股') || '';
    }

    function 重绘() {
      同步控件();
      写入排行();
      写入结果();
      写入地址();
    }

    function 设板块(名称) {
      状态.板块 = 名称 || '';
      if (状态.个股) {
        const 个股 = 数据.companies.find(项 => 项.name === 状态.个股);
        if (个股 && 状态.板块 && !个股.sectors.includes(状态.板块)) {
          状态.个股 = '';
        }
      }
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function 设个股(名称) {
      状态.个股 = 名称 || '';
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', async (事件) => {
      const 板块按钮 = 事件.target.closest('[data-板块]');
      if (板块按钮) {
        设板块(板块按钮.dataset.板块);
        return;
      }
      const 个股按钮 = 事件.target.closest('[data-个股]');
      if (个股按钮) {
        设个股(个股按钮.dataset.个股);
        return;
      }
      const 展开按钮 = 事件.target.closest('[data-展开]');
      if (展开按钮) {
        const 卡片 = document.getElementById(展开按钮.dataset.展开);
        if (卡片) {
          卡片.classList.toggle('展开');
        }
        return;
      }
      const 复制按钮 = 事件.target.closest('[data-复制]');
      if (复制按钮) {
        const 卡片 = document.getElementById(复制按钮.dataset.复制);
        const 文本 = 卡片?.querySelector('.正文')?.textContent || '';
        await navigator.clipboard.writeText(文本);
        复制按钮.textContent = '已复制';
        setTimeout(() => {
          复制按钮.textContent = '复制语料';
        }, 1200);
      }
    });

    元素.板块筛选.addEventListener('change', 事件 => {
      状态.板块 = 事件.target.value;
      重绘();
    });

    元素.跳转个股.addEventListener('click', () => {
      const 词 = 元素.个股搜索.value.trim();
      if (!词) return;
      const 精确 = 数据.companies.find(项 => 项.name === 词);
      if (精确) {
        设个股(精确.name);
        return;
      }
      const 模糊 = 数据.companies.find(项 => 项.name.includes(词));
      if (模糊) {
        元素.个股搜索.value = 模糊.name;
        设个股(模糊.name);
      }
    });

    元素.个股搜索.addEventListener('keydown', 事件 => {
      if (事件.key === 'Enter') {
        元素.跳转个股.click();
      }
    });

    读取地址();
    写入统计();
    写入筛选器();
    重绘();
  </script>
</body>
</html>
