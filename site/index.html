<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语料查证器</title>
  <style>
    :root {
      --背景: #f5f5f7;
      --面板: #ffffff;
      --面板浅: #fbfbfd;
      --边框: #d2d2d7;
      --边框强: #c7c7cc;
      --文字: #1d1d1f;
      --次要: rgba(29,29,31,0.72);
      --强调: #0071e3;
      --强调浅: #e8f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--背景);
      color: var(--文字);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .页面 {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .侧栏 {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--边框);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .标题块, .侧块, .主块 {
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .标题块 {
      padding: 18px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }
    .侧块 {
      margin-top: 16px;
      padding: 14px;
    }
    .侧块标题 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }
    .排行列表 {
      display: grid;
      gap: 8px;
    }
    .排行按钮 {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
      color: var(--文字);
      text-align: left;
      cursor: pointer;
    }
    .排行按钮.选中 {
      border-color: var(--强调);
      background: var(--强调浅);
    }
    .排行主行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 620;
    }
    .排行副行 {
      margin-top: 6px;
      font-size: 12px;
      color: var(--次要);
    }
    .主体 {
      min-width: 0;
      padding: 22px;
    }
    .工具条 {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-bottom: 14px;
      background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.9) 75%, rgba(245,245,247,0) 100%);
    }
    .工具格 {
      display: grid;
      grid-template-columns: minmax(260px, .7fr) minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .字段 {
      display: grid;
      gap: 6px;
    }
    .字段标签 {
      font-size: 13px;
      color: var(--次要);
    }
    .输入框, .下拉框, .按钮 {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 14px;
      outline: none;
    }
    .输入框:focus, .下拉框:focus {
      border-color: var(--强调);
      box-shadow: 0 0 0 3px rgba(0,113,227,.16);
    }
    .按钮 {
      cursor: pointer;
      font-weight: 620;
    }
    .按钮.主按钮 {
      background: var(--强调);
      border-color: var(--强调);
      color: #ffffff;
    }
    .统计栏 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .统计卡 {
      padding: 14px;
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .统计名 {
      font-size: 12px;
      color: var(--次要);
      margin-bottom: 8px;
    }
    .统计值 {
      font-size: 28px;
      font-weight: 700;
    }
    .主块 {
      padding: 18px;
    }
    .主块标题行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .主块标题 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .结果数 {
      color: var(--次要);
      font-size: 15px;
    }
    .语料列表 {
      display: grid;
      gap: 14px;
    }
    .语料卡 {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
    }
    .语料头 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }
    .语料编号 {
      font-size: 16px;
      font-weight: 650;
    }
    .语料统计 {
      color: var(--次要);
      font-size: 13px;
    }
    .信息行 {
      margin: 8px 0 0;
      line-height: 1.7;
      font-size: 14px;
      color: var(--文字);
    }
    .信息标题 {
      color: var(--次要);
    }
    .正文 {
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.78;
      font-size: 15px;
      color: var(--文字);
      max-height: 9.2em;
      overflow: hidden;
      position: relative;
    }
    .语料卡.展开 .正文 {
      max-height: none;
    }
    .正文::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(251,251,253,0), rgba(251,251,253,1));
    }
    .语料卡.展开 .正文::after {
      display: none;
    }
    .操作行 {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .小按钮 {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 13px;
      cursor: pointer;
    }
    .空状态 {
      padding: 28px;
      text-align: center;
      border-radius: 8px;
      border: 1px dashed var(--边框强);
      color: var(--次要);
    }
    @media (max-width: 1200px) {
      .页面 {
        grid-template-columns: 1fr;
      }
      .侧栏 {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--边框);
      }
      .工具格 {
        grid-template-columns: 1fr;
      }
      .统计栏 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      .统计栏 {
        grid-template-columns: 1fr;
      }
      .主体, .侧栏 {
        padding: 16px;
      }
    }
  </style>
</head>

OO Sabih Khan 留任运营，Tom Marieb 负责日常。Cook 以执行主席身份继续处理关税、政策、大客户等对外事务。\n1）选人信号：董事会放弃了\"库克 2.0\"候选，这是关键\n苹果内部最像库克的接班人选原本是前 COO Jeff Williams（供应链出身、62 岁、履历是库克翻版）。最终董事会选择的是 Ternus——硬件工程师、50 岁、从未管过供应链或财务。参照 2011 年乔布斯选库克（放弃\"像乔布斯\"的 Ive 和 Forstall）是为把产品机器规模化，这次用人逻辑同构但方向相反：库克留下的机器不缺运营、不缺规模，缺的是定义下一个终端的能力。董事会用行动表达了这一判断。\n2）AI 大模型非苹果发力点，硬件创新仍然是重点——这是供应链逻辑的起点\n过往两年，Apple Intelligence 未达预期、Siri 大版本升级交给 Google Gemini 托底、AI 高管去年换成 Google 旧将、Ive 2019 年出走后 2025 年将其创业公司以 64 亿美金卖给 OpenAI——苹果软件生态的独特性正在被稀释。在这种背景下，苹果下一个增长叙事大概率不是\"更强的模型\"，而是\"更新的终端形态\"（AR 眼镜、可穿戴新品类、折叠屏等）。Ternus 履历里最特别的一点恰是 1997-2001 年在 VR 头显初创公司的四年——这是苹果高管中极少见的早期 XR 背景。选他加 Srouji 升任首席硬件官的组合，指向的是硬件形态创新与自研硅深度整合这条路线。\n3）新终端意味着新料号、新工艺、新供应商卡位机会\n相比 iPhone 链条已经成熟、单机价值量提升空间有限，新终端从 0 到 1 阶段是供应链单机价值量抬升最快，盈利能力强，——Vision Pro 一代产业链、AirPods 一代产业链、Apple Watch 一代产业链皆曾演绎过相同逻辑。Ternus 任期初期（2026H2-2028）是苹果若干新品类从试产到放量的关键窗口，看好相关的新品供应链受益。\n建议关注消费电子产业链：立讯精密、工业富联、大族激光、鹏鼎控股、领益智造、蓝思科技、歌尔股份、水晶光电、珠海冠宇、信维通信、比亚迪电子、博硕科技、达瑞电子、宜安科技、华曙高科、铂力特、蓝特光学、恒铭达、宇晶股份、龙旗科技、紫建电子、杰普特、智立方、豪鹏科技、宇瞳光学、康冠科技等", "preview": "【天风电子团队】苹果 CEO 交棒硬件工程师，9 月 1 日 Ternus 接任，董事会用人信号指向\"新终端\"方向，看好硬件创新周期下核心供应链深度受益\n事件\n4 月 20 日苹果公告：Tim Cook 9 月 1 日卸任 CEO 转任执行主席，John Ternus（50 岁，宾大机械工程出身，1997 年毕业后先在 VR 头显小公司任职四年，2001 年加入苹果产品设计团队，服役 25 年，2021 年起任硬件工程 SVP）接任。同...", "sectors": ["PCB", "光模块", "商业航天", "太空光伏", "服务器", "消费电子", "锂电"], "companies": ["信维通信", "华曙高科", "博硕科技", "大族激光", "宇晶股份", "宇瞳光学", "宜安科技", "工业富联", "康冠科技", "恒铭达", "智立方", "杰普特", "歌尔股份", "比亚迪电子", "水晶光电", "珠海冠宇", "立讯精密", "紫建电子", "蓝思科技", "蓝特光学", "豪鹏科技", "达瑞电子", "铂力特", "领益智造", "鹏鼎控股", "龙旗科技"], "sources": ["wechat_group_1"], "sectorRowCount": 7, "companyRowCount": 26, "timestampCount": 33, "timestamps": ["2026-04-21 09:45"]}, {"id": "evidence-4", "content": "【国金电新】催化临近，风偏回暖，关注锂电新技术机会260417\n#近期催化： 弗迪电池ceo何龙表态储能要发展，必须考虑钠电池，曾毓群表态钠电有望替代30-40%现有市场；4月8日，国内半固态电池龙头清陶能源向港交所递交IPO申请。\n#未来潜在催化： 4.21宁德科技日、4.25北京车展、5.13深圳CIBF展，技术催化或密集发生。\n1、钠电池：钠在地壳中的储量是锂的400-1200倍，原料成本仅为锂的1/50，且我国资源自给充足，有效规避锂价波动风险，具有长期战略意义；根据中科海钠，26Q1钠电池电芯成本已降至0.35-0.40元/Wh，与磷酸铁锂电池的价差缩小至0.1 s，我们认为该公司将在 2026 年下半年推出支持 Scorpio-X 交换机的产品，以支持亚马逊 Trainium 3 XPU 的上量，同时提供 PCIe 重定时器（retimer）和 AEC 解决方案。\n我们认为，Marvell 正积极参与下一代 AWS 2nm XPU ASIC（Trainium 4）的研发。\n我们相信，Marvell 将扩大其网络内容，并原生支持 Ulink 交换芯片，其中一部分将集成 Celestial CPO，另一部分将支持 NVLink Fusion。\n亚马逊还使用了 MRVL 的 Teraynx 横向扩展（scale-out）交换芯片。\n关于 Astra Labs（ALAB）\n作为亚马逊横向扩展（scale-up） 横向扩展（scale-out）网络供应商，Astra Labs 在 Trainium 3 中获得了不断扩大的价值份额。\n对于 Trainium 2，我们认为 Astra Labs 正在部署 Scorpio-P 系列交换机（PCIe 头部节点连接解决方案）以及其 PCIe 重定时器（retimer）解决方案组合。\n针对 Trainium 3，我们预计该公司将为亚马逊 Trainium 3 XPU 带来有意义的容量增长，2026 年实现规模量产。\n对于 Trainium 4，我们认为 Astra Labs 可能有机会支持 Ulink 和 NVLink 交换技术，同时推出支持亚马逊 Trainium 4 AEC 网络的 800Gbps 组件。\n需注意，由于反向收入确认（股权认证）的影响，对亚马逊出货量的增加可能会对报告毛利率造成不利影响。\n整体结论\n总体而言，亚马逊 - 安思睿（Anthropic）的合作关系改善了 Trainium 芯片供应链及相关集群基础设施的近期和中期前景 这对亚马逊主要半导体供应商（增持评级的 MRVL 和增持评级的 ALAB）构成利好。", "preview": "亚马逊与安思睿（Anthrop...\n亚马逊与安思睿（Anthropic）深化合作伙伴关系，锁定多代 Trainium 芯片产能；对增持评级的 MRVL 和 ALAB 构成利好\n昨日收盘后，亚马逊与安思睿（Anthropic）宣布扩大战略合作。\n根据协议，亚马逊将保障安思睿在 Trainium 2、Trainium 3 以及未来几代亚马逊 Trainium 芯片（Trainium 4 及更高版本）芯片高达 5 吉瓦（GW）的产能供应，用...", "sectors": ["半导体"], "companies": ["美满电子", "阿斯达实验室"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 2, "timestampCount": 3, "timestamps": ["2026-04-21 20:35"]}, {"id": "evidence-117", "content": "今日（周一）已披露业绩公司-洽...\n今日（周一）已披露业绩公司-洽洽（超预期，分红率100%+）/巴比食品（符合预期）\n明日4月21日（周二）\n披露26Q1业绩：惠泉啤酒/甘源食品\n披露25年年报：良品铺子/甘源食品/五芳斋\n明日公司交流提醒：\n① 金徽酒-线下-甘肃-9：00\n② 洽洽食品-线上-业绩交流-10：00（欢迎索取链接）\n③ 巴比食品-线下-董事长交流-15：00\n④ 八马茶叶-线下-福建南平-14：00\n1⃣洽洽食品25年年报&26Q1业绩点评：经营拐点显现，26Q1业绩超预期\n25年公司营业收入/归母净利润/扣非归母净利润分别为65.74/3.18/2.50亿元（-7.82%/-62.51%/-67.68%），\n26Q1公司营业收入/归母净利润/扣非归母净利润分别为22.22/1.68/1.49亿元（+41.46%/+117.82%/+156.47%）。综合看25Q4+26Q1营收/归母净利润同比分别+9%/+6%，#业绩超预期、主要系春节产品备货积极&春节错期基数低&新品导入盒马山姆，分红率超100%+。\n分产品： 25年葵花子/坚果类/其他产品分别营收40.2/17.6/0.7亿元（-8.2%/-8.4%/-10%）。#26Q1产品销售状态良好、瓜子&零食双位数增长、坚果翻倍。\n25年成本处高位盈利能力承压，新采购季原料价格进入下行区间（下降10-15%），26Q1毛净利率改善。\n1）毛利率：2025年实现23.41%（同比-5.37pct），25Q4实现26.60%（同比+0.77pct），26Q1实现25.10%（同比+5.63pct）；\n2）费用率： 高等级G3等级的电子级磷酸、SEMI通用标准最高等级G5等级的电子级硫酸和电子级双氧水以及蚀刻液、清洗剂、显影液、剥膜液、再生剂5大类功能湿电子化学品产品。公司相关产品可应用于28 nm及以下先进制程，并已经通过中芯国际、长江存储、长鑫存储、华虹集团、台积电、SK海力士等境内外知名集成电路厂商认证。\n🌟由于AI产业进入规模扩张阶段，以及相应基础设施的扩容，全球半导体销售额进一步增长。与此同时，伴随着全球晶圆产能的持续扩张以及先进制程产能占比的提升，半导体材料的消耗量及品质要求也同步提高。根据CEMIA测算，2025年中国大陆集成电路领域湿电子化学品需求量将达154.3万吨，同比增长23.1%。\n🌟兴福电子是国内最早从事电子级磷酸研发并拥有自主知识产权的企业，产品技术水平已达国际先进。根据公司招股说明书，结合CEMIA相关数据测算，2021-2023年中国大陆内资晶圆厂前道工艺用电子级磷酸（单酸口径）公司市场占有率由39.3%提升至69.7%。然而，这并不意味着公司电子级磷酸放量已触及天花板。先进制程推进与晶圆结构复杂化带动单位晶圆对高纯磷酸的需求上升；同时电子级磷酸作为部分功能湿电子化学品的重要原料，需求空间同样可观。此外，在国内主流晶圆厂份额已处高位的基础上，公司亦有望通过提高外资及境外晶圆厂渗透率，打开新增量。\n🌟基于在湿电子化学品领域建立的深厚客户信任与认证壁垒，公司正积极向光刻胶、电子特气、前驱体等多个半导体材料品类实施扩张。通过构建多品类的协同供应体系，公司不仅能够显著提升单体客户的销售额，更能深化客户粘性，推动自身角色从单纯的材料“供应商”向深度绑定的“战略合作伙伴”转型。\n[红包]预计公司2025-2027年归母净利润分别为2.08、3.23、4.89亿元，首次覆盖，给予公司“买入”评级。\n[礼物]风险提示：原材料价格波动风险，下游需求不及预期，行业竞争加剧，产能建设进度不及预期，新产品客户认证进度不及预期。\n🎉欢迎交流\n周家诺13162921087/赵乃迪18618495784/蔡嘉豪/王礼沫", "preview": "[拳头]【兴福电子】国内电子级磷酸龙头，平台化布局拓宽成长空间【光大石化化工交运团队】\n🌟兴福电子成立于2008年11月，并于2025年1月于上交所科创板上市。经过十余年的持续投入、技术积累和市场开拓，公司成功开发和量产了SEMI C36-1121最高等级G3等级的电子级磷酸、SEMI通用标准最高等级G5等级的电子级硫酸和电子级双氧水以及蚀刻液、清洗剂、显影液、剥膜液、再生剂5大类功能湿电子化学品产品。公司相关产品可应用于28 nm及以...", "sectors": ["半导体材料"], "companies": ["兴福电子"], "sources": ["wechat_group_1"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-21 10:15"]}, {"id": "evidence-183", "content": "[拳头]【奥来德】26年高世代蒸发源订单进入确认期 【光大石化化工交运团队】\n🌟2026年Q1，公司预计实现归母净利润7000-8500万元，同比增加175%-234%。根据证券日报报道，京东方第8.6代AMOLED生产线已于2025年12月30日成功提前5个月点亮。考虑到京东方第8.6代AMOLED生产线的建设进度，我们预计2026年Q1公司开始确认部分8.6代AMOLED线性蒸镀源订单收入。\n🌟根据CINNO公众号消息，2月25日Sunic Systems宣布已收到来自京东方的订单，将为其提供量产OLED的蒸镀设备，该合同为京东方3.2万片/月8.6代AMOLED生产线的二期项目。考虑到Sunic Systems本身即为京东方上述生产线一期项目的蒸镀设备供应商，公司高世代线性蒸镀源与Sunic Systems蒸镀设备具有较高适配性，因此我们预计公司有望继续获得京东方高世代AMOLED生产线二期项目的线性蒸镀源订单。\n🌟2026年1月，公司发布2025年度以简易程序向特定对象发行股票预案，公司拟募集资金2.76亿元用于建设OLED显示核心材料PSPI材料生产基地项目（项目投资总额2.40亿元，拟使用募集资金2.40亿元）和补充流动资金。\n🌟2025年9月15日，公司公众号发布消息表示公司近日与京东方科技集团股份有限公司在北京正式签署战略合作框架协议，双方就此建立战略合作伙伴关系。根据协议，双方此次合作主要聚焦四大核心方向，基本囊括了奥来德目前OLED有机材料和OLED蒸发源设备等核心业务条线。\n[红包]预计 ence-42", "content": "【天风医药杨松团队】通策医疗2...\n【天风医药杨松团队】通策医疗2025年报&026Q1业绩点评：种植&正畸保持稳健，蒲公英分院业绩快速增长\n📚事件：公司公布2025年报，实现收入收入29.13亿元（yoy+1.37%）；归母净利润5.02亿元（yoy+0.19%），扣非净利润4.96亿元（yoy-0.04%）。分结构看，种植业务收入 5.19亿元（yoy-2.08%）；正畸业务收入 5.1亿元（yoy+7.63%）；儿科业务收入 4.87亿元（yoy-2.69%）；修复业务收入 4.66亿元（yoy+0.72%）；大综合业务收入 7.83亿元（yoy+2.27%）。\n2026Q1，公司口腔医疗门诊量89.76万人次（yoy+3.71%），营业收入7.55亿元（yoy+1.43%），归母净利润1.87亿元（yoy+1.66%）；归母扣非净利润1.85亿元（yoy+1.37%），业绩保持稳定。分结构看，种植收入1.19亿元（yo+2.2%），正畸收入1.39亿元（yoy+0.5%），儿科收入1.2亿元，同比持平；修复收入1.12亿元（yoy+3.5%）；大综合收入2.04亿元（yoy+1.3%）。\n🔥种植业务量价保持稳定，正畸病例数量增加\n2025年公司累计完成种植牙6.5万颗（yoy-1.4%），其中参与集采的种植牙数量为5.03万颗，占比77%（与上年持平），单颗均价8000元，同比持平。2026Q1种植牙数量为1.56万颗（yoy+2.8%）；其中集采种植牙1.14万颗，占比73%（较上年同期下降），单颗均价7680元（同比略有下降）；2025年公司正畸病例数量同比增长10.8%，客单价约2.1万元，同比下降0.1万元。早畸单价1.3万元，同比持平。\n🔥蒲公英分院快速增长，业绩有望实现快速增长\n公司持续布局蒲公英分院，实现省内主要区域覆盖，分院运营效能稳步提升。2025年公司蒲公英医院49家，收入8.56亿元（yoy+20%），毛利率28%，净利润超9kw元（yoy+95%），门诊量119万人次（yoy+22%），单椅产值70万元；2026Q1蒲公英营收2.23亿元（yoy+17%），毛利率持平，净利润4.4kw元（yoy+24%），门诊量同比增23%；全年目标单椅产值105万元（对应总营收同比增48%，单院年均产值2600万元）。\n在传统模式整体承压的背景下，公司希望通过消费医疗市场进行突破，看好2026年实现其快速增长的目标。\n更多：天风医药 杨松/刘一伯", "preview": "【天风医药杨松团队】通策医疗2...\n【天风医药杨松团队】通策医疗2025年报&026Q1业绩点评：种植&正畸保持稳健，蒲公英分院业绩快速增长\n📚事件：公司公布2025年报，实现收入收入29.13亿元（yoy+1.37%）；归母净利润5.02亿元（yoy+0.19%），扣非净利润4.96亿元（yoy-0.04%）。分结构看，种植业务收入 5.19亿元（yoy-2.08%）；正畸业务收入 5.1亿元（yoy+7.63%）；儿科业务收入 4...", "sectors": ["医疗服务"], "companies": ["通策医疗"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-21 00:49"]}, {"id": "evidence-274", "content": "【天风汽车】芯联集成25年报及...\n【天风汽车】芯联集成25年报及26Q1季报点评-0420\n———————————\n1、财务数据\n2025年： 营收81.80亿元，同比+25.67%；归母净利润-5.95亿元，同比减亏；毛利率5.51%，同比+4.48pct；\n26Q1： 营收19.62亿元，同比+13.19%；归母净利润-0.88亿元，同比减亏；毛利率5.69%，同比+2.02pct。\n2、分业务\n从产品结构看，集成电路晶圆制造代工/模组封装/研发服务25年分别实现收入59.83/15.08/3.98亿，同比+6.93%/150.62%/404.05%。\n从应用领域看，车载/高端消费/工控/AI领域25年收入占比分别为45.43%/28.09%/18.46%/8.02%。具体看，\n1）汽车电子：25年新增国内主流车企合作项目25个，产品线从从主驱功率模组拓展至OBC、底盘、热管理等关键系统，单车价值量持续提升，增厚业绩。\n2）AI：布局MicroLED光通信及具身智能MEMS传感器。其中具身智能产品已经导入多家客户，累计订单规模千万元。\n3）高端消费：终端产品的升级换代或将带动消费电子领域MEMS床干起芯片、功率器件等整体增长，同时AI手机及AIPC将带来新场景的增量需求；\n4）工控：光伏最新一代地面组串项目，2KV 465KW 获得全球头部客户的首发量产。搭配 G3 芯片的全塑封定制工业变频模组在头部客户量产，1700V及2300V 高压 IGBT 产品全面导入风电头部客户；220KW 储能碳化硅产品全面导入储能客户并实现量产。\n3、后续看点：\n1）AI：公司已构建覆盖AI 服务器电源从一次电源、二次电源到三次电源的一站式系统代工解决方案，同时提前布局Micro LED光通信，加速相关技术产业化落地，成为公司新的增长点。\n2）高端消费：光器件方面，应用于传感和通信的大功率边缘发射激光器也已通过客户验证并进入规模量产阶段，后续有望持续贡献业绩。\n3）工控：公司深度服务新型电力系统变革，与南瑞半导体深度合作，超高压功率器件产品已覆盖3300V至 6500V 的电压，同时研发下一代碳化硅功率模块，有望提升市占率。\n盈利预测：根据wind一致预期，26/27年预计实现归母净利润0.65/3.91亿，同比+110.93%/+502.05%。", "preview": "【天风汽车】芯联集成25年报及...\n【天风汽车】芯联集成25年报及26Q1季报点评-0420\n———————————\n1、财务数据\n2025年： 营收81.80亿元，同比+25.67%；归母净利润-5.95亿元，同比减亏；毛利率5.51%，同比+4.48pct；\n26Q1： 营收19.62亿元，同比+13.19%；归母净利润-0.88亿元，同比减亏；毛利率5.69%，同比+2.02pct。\n2、分业务\n从产品结构看，集成电路晶圆制造代...", "sectors": ["半导体"], "companies": ["芯联集成"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-21 14:16"]}, {"id": "evidence-179", "content": "【天风电子】RCC高端材料：光模块高端PCB/载板/CoWoP上游材料和工艺的重要变化\n当前算力产业持续升级，1.6T/3.2T高端光模块、先进封装载板及CoWoP相关领域对PCB制程要求大幅提升，需依托mSAP工艺实现≤10μm超细线路、超薄均匀绝缘层及高板面平整度。\nRCC采用树脂直接涂布铜箔的工艺，无玻纤布、无需传统PP半固化片层，从材料根源上解决传统方案的制程短板，成为行业迭代的关键优化材料。\n🥇#对比传统PCB（PP叠压+mSAP）：更易实现高端精密制程-适配光模块升级刚需\n相比传统PP+MSAP方案，RCC在实际生产中更容易稳定做出超细线路、更均匀的绝缘层、更平整的板面，能更好匹配高端光模块的精密PCB制造要求：\n1. 绝缘层精度更易控制：PP含玻璃纤维布，易出现树脂分布不均，绝缘层厚度偏差偏大，较难满足高端光模块的高精度要求；RCC无玻纤结构，树脂涂布均匀，绝缘层厚度偏差可控性更优，更容易达标高端制程标准。\n2. 线路精度更易保障：PP在高温压合时易出现流胶，可能挤压线路造成偏移、形变，较难稳定实现≤10μm超细线路；RCC无流胶问题，搭配mSAP工艺，可更稳定做出5-8μm精细线路，线路形态与尺寸一致性更好。\n3. 制程适配性更优：PP中的玻纤会对激光微孔加工形成一定阻碍，且树脂与铜箔结合强度相对有限；RCC无玻纤干扰，加工更顺畅，与铜箔结合更紧密，更适配高频高速产品的长期可靠性要求。\n🥈#对比ABF载板：综合性价比突出-助力载板场景国产化推进\n相较ABF载板方案，RCC在先进封装载板领域具备差异化优势：\n1. 供应链安全性更优：可在一定程度上降低对海外核心材料的依赖，缓解全球核心基材产能偏紧带来的供应链压力；\n2. 量产成本更具优势：整体材料与制造成本相对可控，有助于降低高端载板的生产成本，性价比表现更突出；\n3. 大尺寸量产更友好：ABF载板在大尺寸生产中存在制程难度高、良率承压的问题，RCC在大尺寸载板生产中的可行性与良率表现更具竞争力。\n🥉#应用场景逐层落地：成长空间有序打开\nRCC核心应用优先聚焦高端光模块PCB，直接匹配1.6T/3.2T光模块高速迭代的核心制程需求；在此基础上，凭借工艺优势延伸至先进封装载板领域，并进一步适配CoWoP封装场景，从光模块核心PCB到封装载板、再到CoWoP，由核心主赛道向高价值延伸赛道逐 4%、+56.4%，我们认为改性塑料和绿色石化业务销量受到了美伊局势影响，整个产业链为预防断链风险有一定惜售，导致销量增长受限。与此同时，公司盈利得到了改善，毛利率同比+1.2pct至13.3%。\n高投入重研发，新兴需求助力长期增长\n金发科技作为国内改性塑料的龙头企业持续投入研发提升产品性能，2023年以来每年研发费用率都超过4%，2025年公司首席技术官黄险波博士当选中国工程院院士，彰显了公司整体科研实力与行业影响力。目前，AI算力、具身智能机器人、低空经济等新兴领域的爆发对改性塑料的需求和性能要求不断提升，公司在技术投入和人才队伍上远超国内同行，布局改性塑料的同时，在高性能的PEEK、LCP等多种特种工程塑料上都有布局，未来新兴需求也将助力公司持续增长。", "preview": "【建投大化工】金发科技2025...\n【建投大化工】金发科技2025&26Q1点评：经营稳健增长，新兴需求助力成长\n事件：\n金发科技发布2025年年度报告，全年实现营收654.0亿元，同比+8.1%，实现归母净利润11.5亿元，同比+39.4%。其中Q4实现营收157.8亿元，同/环比-21.3%/-12.2%，实现归母净利润0.9亿元，同/环比-39.8%/-82.2%。\n金发科技发布2026年一季度报告，实现营收155.9亿元，同比...", "sectors": ["化工"], "companies": ["金发科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-21 13:00"]}, {"id": "evidence-261", "content": "【开店连锁系列】周黑鸭：同店企...\n【开店连锁系列】周黑鸭：同店企稳改善，新渠道高速增长\n1、门店业务：（1）门店数量：公司计划2026年净增加100家至3100家左右，我们认为难度不大，2025H2已经净开155家；（2）同店收入：计划老店同店收入同比增长5%，同时新开高势能门店、拉动平均单店收入同比增长10%+。关于老店同比增长，我们认为大环境持续复苏情况可完成5%目标；大环境贡献度不大情况下，公司依靠运营能力提升、高性价比和引流产品拉动，有望实现同店收入小个位数增长。2026Q1同店收入同比小个位数增长。\n2、新渠道业务：2025年新渠道收入1.4亿元，2026年目标增速100%+，确定性较强：（1）山姆持续上新，2025年山姆两款复调产品收入贡献2000万+（没卖满全年），2026年3月份继续上新，预计2026年山姆收入至少破亿；（2）其他真空流通渠道持续开拓渠道，布局开市客、零食量贩、盒马、连锁KA便利店等，推动收入增长。\n3、净利率：预计2026年净利率同比提升。（1）真空流通渠道净利率10%左右，该渠道快速增长拉动整体净利率提升；（2）线上渠道净利率大个位数；（3）门店净利率5%+，伴随产能利用率提升，净利率有望提升。\n4、盈利预测：公司经营较灵活，2025年率先连锁开店业态实现同店同比转正增长，同时新渠道发力。2026年经营趋势持续向上，预计2026年收入增速20%+，净利率同比提升。我们预计2026-2028年收入30.65/37.59/45.87亿元，同比增长20.86%/22.63%/22.03%；净利润1.93/2.54/3.31亿元，同比增长22.96%/31.82%/30.38%；对应PE估值14.7/11.1/8.5倍。", "preview": "【开店连锁系列】周黑鸭：同店企...\n【开店连锁系列】周黑鸭：同店企稳改善，新渠道高速增长\n1、门店业务：（1）门店数量：公司计划2026年净增加100家至3100家左右，我们认为难度不大，2025H2已经净开155家；（2）同店收入：计划老店同店收入同比增长5%，同时新开高势能门店、拉动平均单店收入同比增长10%+。关于老店同比增长，我们认为大环境持续复苏情况可完成5%目标；大环境贡献度不大情况下，公司依靠运营能力提升、高性价比和引流...", "sectors": ["食品饮料"], "companies": ["周黑鸭"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-21 13:56"]}, {"id": "evidence-67", "content": "【开源电新】威迈斯一季报点评：...\n【开源电新】 社】消费之光行动教育，上调全年业绩到4.2亿，主业中期200亿目标还有2倍空间\n🔥我们去年入职财通之后持续推荐的行动教育上周大涨，很多投资者反馈行动是消费股典范：高分红，老板无减持，景气持续。\n今天从中期和长期讲公司空间：\n#市场空间：广义赛道万亿精准赛道容量清晰，头部份额仅不到1%，极低提升空间大\n■全口径企业培训：2025 年约 1.3 万亿元，2026-2030 年维持双位数增速。企业家 / 董事长实效培训（行动教育核心赛道）；市占率不到1%，扩张空间极大。\n#行动客户池与付费能力：享受景气和产业升级+刚需付费+结构升级\n■核心客群：年营收3-10 亿中型民企，不开发 3 亿以下企业，客户现金流健康、付费意愿强。累计服务7 万 + 企业、16 万 + 校友、600 + 上市校友，复购率+转介绍达85%。\n■景气享受流动性和产业升级：经济下行期企业更重降本增效、管理优化，培训需求韧性强；目前企业家信心已于24年见底，25年开始公司收款逐步改善，且受益于产业升级和宏观流动性，#工业制造行业（21%）已成为公司第一大客户行业。\n■刚需驱动：民企老板圈层社交、管理体系搭建、数字化落地为刚性需求，行动教育是低门槛、高性价比的 “企业家圈层入场券”。长江、中欧商学院入学门槛和学费相对较高，整体上行动教育对中小企业主的圈层建设起到了重要的作用，具备非常强的中介价值。\n#主业中长期空间：短期120亿，中期200亿\n■海外大市值企业以综合服务 / 系统赋能型为主：埃森哲（市值约1700亿美元，主营咨询+IT外包，含企业培训赋能），卡内基训练（30-50亿美元，聚焦中小企业实效管理、领导力培训），SAP全球服务（母公司市值1638.58亿美元，提供企业咨询+数字化全链条服务）、瑞来斯学习（100-120亿美元，聚焦企业大学建设与定制化培训）。\n■打开市值与业务的正反馈通道：公司当前具备百亿市值的客户群体，随着公司市值持续提升，有望持续拿下更大规模体量的客户，充分赋能公司的业务发展。\n■除主业加速以外，公司今年和钉钉合作相关AI产品，有望在下半年开始贡献弹性增量；我们预计一季报将继续验证加速趋势，上调公司全年的业绩至4.2亿元/yoy+30%，给予30x估值，对应120e市值目标，现价买入。\n■中期空间：3-5 年营收 30-40 亿，利润 10 亿，主业市值看200 亿\n1. 渠道端：百校计划完成后，全国100 家分校，规模体量将是现在的4倍，对应收入有望达到30-40亿元。\n2. 产品端：AI 型组织 + AI 销售大师 + 咨询，高毛利大单占比提升，拉动净利率至30%+。\n3. 主业利润与市值：30% 净利率对应9-12 亿净利润，给予20 倍200 亿市值。", "preview": "【财通商社】消费之光行动教育，...\n【财通商社】消费之光行动教育，上调全年业绩到4.2亿，主业中期200亿目标还有2倍空间\n🔥我们去年入职财通之后持续推荐的行动教育上周大涨，很多投资者反馈行动是消费股典范：高分红，老板无减持，景气持续。\n今天从中期和长期讲公司空间：\n#市场空间：广义赛道万亿精准赛道容量清晰，头部份额仅不到1%，极低提升空间大\n■全口径企业培训：2025 年约 1.3 万亿元，2026-2030 年维持双位数增速。企业...", "sectors": ["教育"], "companies": ["行动教育"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-21 17:12"]}, {"id": "evidence-346", "content": "【远东股份】年报点评：All ...\n【远东股份】年报点评：All in AI，千亿可期【东北计算机】0421\n年报符合预期，一季报大超预期，光纤实打实开始贡献利润+主业改善，2季度开始光纤只会更猛，中报预计会放大量。\n主业稳定，电池大幅度减亏，储能项目订单需求火爆，我们认为主业上的改善是非常优质的安全垫，给市场良好的信号。\n1800吨光棒的扩产定增向市场展现公司在光纤上的决心以及实际投入，我们认为今年从一季度开始贡献利润，后续二三四季度会更上一层楼。\nrubin微通道液冷板或即将迎来积极推进，作为大陆最早送样和持续送样的厂商，期待后续积极进展。", "preview": "【远东股份】年报点评：All ...\n【远东股份】年报点评：All in AI，千亿可期【东北计算机】0421\n年报符合预期，一季报大超预期，光纤实打实开始贡献利润+主业改善，2季度 owCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-21 08:33"]}, {"id": "evidence-40", "content": "洽洽食品2025年报&2026...\n洽洽食品2025年报&2026Q1业绩简评：盈利企稳，分红及26Q1业绩超预期！\n🔺2026Q1公司实现收入22.2亿元、同比+41.5%（vs 市场预期15~20%增长），归母净利润1.68亿元、同比+116.8%（vs 市场预期1.4~1.5e），扣非归母净利润1.49亿元、同比+156.5%。2025年公司收入65.7亿元、同比-7.8%，归母净利润3.18亿元、同比-62.5%，扣非归母净利润2.50亿元、同比-7.0%，其中2025Q4收入20.7亿元、同比-12.7%，归母净利1.50亿元（此前预告25Q4归母净利1.33~1.53亿）、同比-32.6%、扣非净利1.35亿元（此前预告25Q4扣非净利1.16~1.36亿元）、同比-37.2%。26Q1业绩大超预期，且25Q4业绩靠近业绩预告区间上沿。\n🔺2026Q1收入大超预期，主要是春节错峰，当然新渠道拥抱和新品也有贡献。2026Q1公司收入同比增长41.5%，大超预期，我们预计瓜子10~20%增长、坚果同比翻倍以上，主要受益春节错峰备货利好，同时量贩零食、盒马、山姆等新渠道增长强劲。即使合并计算Q4+Q1，公司收入也有8.9%稳健增长，扭转了过去两年收入增长停滞的趋势，同时25Q4+26Q1收入增速也创造了2022年以来Q4+Q1最高收入增速。\n🔺瓜子成本改善推动毛利率企稳改善。2025Q4公司毛利率26.6%、同比+0.8Pct，环比+2.1Pcts，主要来自瓜子成本回落带来毛利率回升；Q4管理费率4.5%、同比-0.2Pct，销售费率11.0%、同比+1.2Pcts，财务费率3.6%、同比+4.7Pcts，财务费率大幅攀升主要系可转债利息摊销增加；最终归母净利率7.3%、同比-2.1Pcts，扣非净利率6.5%、同比-2.5Pcts。\n2026Q1毛利率25.1%、同比+5.6Pcts、环比-1.5Pcts，主要是低毛利率礼盒占比提升所致；Q1管理费率4.4%、同比-1.3Pcts，销售费用率11.7%、同比+1.1Pcts，财务费用-0.4%、同比+0.6Pct。最终归母净利率7.6%、同比+2.7Pcts，扣非净利率6.7%、同比+3.0Pcts。\n🔺公司分红率超100%，有助于稳定市场现金回报。公司2025年拟现金分红5.0亿，测算分红率达157%、股息率4.2%。虽然公司2025年利润承压明显，但是公司依然保持分红绝对数值的稳健，体现了公司对于股东现金回报的重视。未来随着公司业绩持续增长，我们认为公司分红率有望长期维持60~80%较高水平，同时分红绝对数额有望逐年增长。\n🔺我们认为随着老板回归业务管理，公司积极拥抱新渠道、上市新产品，叠加成本回落，看好公司2026年开始业绩底部向上修复，预计公司2026/27年收入同增15%/8%至75.6亿/81.7亿元，归母净利同增114%/15%至6.8亿/7.8亿元，对应PE为17.6x/15.4x。", "preview": "洽洽食品2025年报&2026...\n洽洽食品2025年报&2026Q1业绩简评：盈利企稳，分红及26Q1业绩超预期！\n🔺2026Q1公司实现收入22.2亿元、同比+41.5%（vs 市场预期15~20%增长），归母净利润1.68亿元、同比+116.8%（vs 市场预期1.4~1.5e），扣非归母净利润1.49亿元、同比+156.5%。2025年公司收入65.7亿元、同比-7.8%，归母净利润3.18亿元、同比-62.5%，扣非归母净利...", "sectors": ["食品饮料"], "companies": ["洽洽食品"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-21 00:49"]}, {"id": "evidence-236", "content": "溶解浆：棉花/涤纶短纤价格上涨...\n溶解浆：棉花/涤纶短纤价格上涨，溶解浆替代空间显现，利好太阳纸业\n⭕现货价格跟踪\n# 溶解浆： 6550元/吨（月环比+3.1%，年同比-13.8%）\n# 粘胶短纤：13440元/吨（月环比+4.5%，年同比-1.3%）\n# 棉花：16932元/吨（月环比+0.3%，年同比+18.4%）\n# 涤纶短纤：8050元/吨（月环比+3.9%，年同比+15.5%）\n[玫瑰]溶解浆是粘胶短纤的核心原材料，由于棉花/涤纶价格持续走强，替代效应下粘胶短纤需求有望增长，进而带动溶解浆价格。\n[玫瑰]棉花价格持续走强。供给端，ICAC预估2026/2027年度全球棉花产量同比-4%，供给端的收缩主要是由于国内政策限制新疆棉花种植面积，以及美国棉花产区干旱。需求端，短期来看纺织行业旺季有效支撑棉花需求。目前棉花-粘胶短纤价差上涨至3329元/吨，处在历史高位。较高的棉粘价差有望驱动纺织企业以粘代棉，带动溶解浆需求。\n[玫瑰]石化原材料成本高企，涤纶短纤价格高增，涤纶短纤价格自2025年12月触底反弹以来累计涨幅达28.4%。本轮涤纶价格的上涨主要是由于地缘冲突推动原油价格上涨，导致石化原材料成本高企，进而传导至涤纶短纤价格。粘胶短纤对涤纶的替代效应明显。目前粘胶短纤-涤纶短纤价差已经跌至5390元/吨，有望驱动纱线厂向粘胶短纤进行切换，进而带动溶解浆需求。\n[玫瑰]纺织需求回暖叠加替代效应，拉动粘胶短纤需求，溶解浆价格触底回升。2025年受国产供给和进口量增加导致供需失衡，溶解浆价格呈阶梯式下行。2026年终端需求回暖，1-3月纺织服装社零同比+9.3%，叠加粘胶短纤对棉花和涤纶短纤的替代效应，溶解浆作为对粘胶短纤的核心原材料，需求有望企稳回升。\n[玫瑰]溶解浆价格为6550元/吨，价格在过去五年的16%分位。溶解浆价格较2026年初低点累计涨幅达6.9%，价格涨幅低于棉花/涤纶短纤价格涨幅，且溶解浆价格对棉花涨价的反应通常有3-5个月的滞后性，因此溶解浆价格仍存在上涨空间。\n[玫瑰]成本端，南方地区阴雨天气制约木片上货进程叠加节后个别浆厂有较强补库意愿，导致木片价格阶段性提升，未来随着南方天气扰动因素减弱，木片价格有望趋稳。\n[玫瑰]太阳纸业是国内溶解浆行业的龙头企业，共有80万吨溶解浆年产能，老挝、广西基地产能满产，山东基地灵活调整。棉花价格持续上涨，或推动溶解浆量价齐升。", "preview": "溶解浆：棉花/涤纶短纤价格上涨...\n溶解浆：棉花/涤纶短纤价格上涨，溶解浆替代空间显现，利好太阳纸业\n⭕现货价格跟踪\n# 溶解浆： 6550元/吨（月环比+3.1%，年同比-13.8%）\n# 粘胶短纤：13440元/吨（月环比+4.5%，年同比-1.3%）\n# 棉花：16932元/吨（月环比+0.3%，年同比+18.4%）\n# 涤纶短纤：8050元/吨（月环比+3.9%，年同比+15.5%）\n[玫瑰]溶解浆是粘胶短纤的核心原材料，由于...", "sectors": ["轻工"], "companies": ["太阳纸业"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-21 12:51"]}, {"id": "evidence-241", "content": "溶解浆：棉花/涤纶短纤价格上涨...\n溶解浆：棉花/涤纶短纤价格上涨，溶解浆替代空间显现，利好太阳纸业\n⭕现货价格跟踪\n6550元/吨（月环比+3.1%，年同比-13.8%）\n#粘胶短纤：13440元/吨（月环比+4.5%，年同比-1.3%）\n#棉花：16932元/吨（月环比+0.3%，年同比+18.4%）\n#涤纶短纤：8050元/吨（月环比+3.9%，年同比+15.5%）\n[玫瑰]溶解浆是粘胶短纤的核心原材料，由于棉花/涤纶价格持续走强，替代效应下粘胶短纤需求有望增长，进而带动溶解浆价格。\n[玫瑰]棉花价格持续走强。供给端，ICAC预估2026/2027年度全球棉花产量同比-4%，供给端的收缩主要是由于国内政策限制新疆棉花种植面积，以及美国棉花产区干旱。需求端，短期来看纺织行业旺季有效支撑棉花需求。目前棉花-粘胶短纤价差上涨至3329元/吨，处在历史高位。较高的棉粘价差有望驱动纺织企业以粘代棉，带动溶解浆需求。\n[玫瑰]石化原材料成本高企，涤纶短纤价格高增，涤纶短纤价格自2025年12月触底反弹以来累计涨幅达28.4%。本轮涤纶价格的上涨主要是由于地缘冲突推动原油价格上涨，导致石化原材料成本高企，进而传导至涤纶短纤价格。粘胶短纤对涤纶的替代效应明显。目前粘胶短纤-涤纶短纤价差已经跌至5390元/吨，有望驱动纱线厂向粘胶短纤进行切换，进而带动溶解浆需求。\n[玫瑰]纺织需求回暖叠加替代效应，拉动粘胶短纤需求，溶解浆价格触底回升。2025年受国产供给和进口量增加导致供需失衡，溶解浆价格呈阶梯式下行。2026年终端需求回暖，1-         </button>
      `).join('');
      元素.个股排行.innerHTML = 数据.companies.slice(0, 14).map(项 => `
        <button class="排行按钮 ${状态.个股 === 项.name ? '选中' : ''}" data-个股="${转义(项.name)}">
          <div class="排行主行"><span>${转义(项.name)}</span><span>${数字.format(项.outputCount)} 条</span></div>
          <div class="排行副行">支撑语料 ${数字.format(项.evidenceCount)} 条</div>
        </button>
      `).join('');
    }

    function 取结果() {
      return 数据.evidences.filter(语料 => {
        if (状态.板块 && !语料.sectors.includes(状态.板块)) return false;
        if (状态.个股 && !语料.companies.includes(状态.个股)) return false;
        return true;
      });
    }

    function 写入结果() {
      const 结果 = 取结果();
      元素.结果数.textContent = `当前结果 ${数字.format(结果.length)} 条`;
      if (!结果.length) {
        元素.语料列表.innerHTML = '<div class="空状态">没有找到支撑语料。</div>';
        return;
      }
      元素.语料列表.innerHTML = 结果.map((语料, 序号) => `
        <article class="语料卡" id="${语料.id}">
          <div class="语料头">
            <div class="语料编号">语料 ${序号 + 1}</div>
            <div class="语料统计">板块行数 ${数字.format(语料.sectorRowCount)}　个股行数 ${数字.format(语料.companyRowCount)}</div>
          </div>
          <div class="信息行"><span class="信息标题">板块：</span>${转义(语料.sectors.join('、') || '无')}</div>
          <div class="信息行"><span class="信息标题">个股：</span>${转义(语料.companies.join('、') || '无')}</div>
          <div class="正文">${转义(语料.content)}</div>
          <div class="操作行">
            <button class="小按钮" data-展开="${语料.id}">展开 / 收起</button>
            <button class="小按钮" data-复制="${语料.id}">复制语料</button>
          </div>
        </article>
      `).join('');
    }

    function 同步控件() {
      元素.板块筛选.value = 状态.板块;
      元素.个股搜索.value = 状态.个股;
    }

    function 写入地址() {
      const 参数 = new URLSearchParams();
      if (状态.板块) 参数.set('板块', 状态.板块);
      if (状态.个股) 参数.set('个股', 状态.个股);
      history.replaceState(null, '', `${location.pathname}#${参数.toString()}`);
    }

    function 读取地址() {
      const 片段 = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      const 参数 = new URLSearchParams(片段);
      状态.板块 = 参数.get('板块') || '';
      状态.个股 = 参数.get('个股') || '';
    }

    function 重绘() {
      同步控件();
      写入排行();
      写入结果();
      写入地址();
    }

    function 设板块(名称) {
      状态.板块 = 名称 || '';
      if (状态.个股) {
        const 个股 = 数据.companies.find(项 => 项.name === 状态.个股);
        if (个股 && 状态.板块 && !个股.sectors.includes(状态.板块)) {
          状态.个股 = '';
        }
      }
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function 设个股(名称) {
      状态.个股 = 名称 || '';
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', async (事件) => {
      const 板块按钮 = 事件.target.closest('[data-板块]');
      if (板块按钮) {
        设板块(板块按钮.dataset.板块);
        return;
      }
      const 个股按钮 = 事件.target.closest('[data-个股]');
      if (个股按钮) {
        设个股(个股按钮.dataset.个股);
        return;
      }
      const 展开按钮 = 事件.target.closest('[data-展开]');
      if (展开按钮) {
        const 卡片 = document.getElementById(展开按钮.dataset.展开);
        if (卡片) {
          卡片.classList.toggle('展开');
        }
        return;
      }
      const 复制按钮 = 事件.target.closest('[data-复制]');
      if (复制按钮) {
        const 卡片 = document.getElementById(复制按钮.dataset.复制);
        const 文本 = 卡片?.querySelector('.正文')?.textContent || '';
        await navigator.clipboard.writeText(文本);
        复制按钮.textContent = '已复制';
        setTimeout(() => {
          复制按钮.textContent = '复制语料';
        }, 1200);
      }
    });

    元素.板块筛选.addEventListener('change', 事件 => {
      状态.板块 = 事件.target.value;
      重绘();
    });

    元素.跳转个股.addEventListener('click', () => {
      const 词 = 元素.个股搜索.value.trim();
      if (!词) return;
      const 精确 = 数据.companies.find(项 => 项.name === 词);
      if (精确) {
        设个股(精确.name);
        return;
      }
      const 模糊 = 数据.companies.find(项 => 项.name.includes(词));
      if (模糊) {
        元素.个股搜索.value = 模糊.name;
        设个股(模糊.name);
      }
    });

    元素.个股搜索.addEventListener('keydown', 事件 => {
      if (事件.key === 'Enter') {
        元素.跳转个股.click();
      }
    });

    读取地址();
    写入统计();
    写入筛选器();
    重绘();
  </script>
</body>
</html>
