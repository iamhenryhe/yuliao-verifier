<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语料查证器</title>
  <style>
    :root {
      --背景: #f5f5f7;
      --面板: #ffffff;
      --面板浅: #fbfbfd;
      --边框: #d2d2d7;
      --边框强: #c7c7cc;
      --文字: #1d1d1f;
      --次要: rgba(29,29,31,0.72);
      --强调: #0071e3;
      --强调浅: #e8f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--背景);
      color: var(--文字);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .页面 {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .侧栏 {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--边框);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .标题块, .侧块, .主块 {
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .标题块 {
      padding: 18px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }
    .侧块 {
      margin-top: 16px;
      padding: 14px;
    }
    .侧块标题 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }
    .排行列表 {
      display: grid;
      gap: 8px;
    }
    .排行按钮 {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
      color: var(--文字);
      text-align: left;
      cursor: pointer;
    }
    .排行按钮.选中 {
      border-color: var(--强调);
      background: var(--强调浅);
    }
    .排行主行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 620;
    }
    .排行副行 {
      margin-top: 6px;
      font-size: 12px;
      color: var(--次要);
    }
    .主体 {
      min-width: 0;
      padding: 22px;
    }
    .工具条 {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-bottom: 14px;
      background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.9) 75%, rgba(245,245,247,0) 100%);
    }
    .工具格 {
      display: grid;
      grid-template-columns: minmax(260px, .7fr) minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .字段 {
      display: grid;
      gap: 6px;
    }
    .字段标签 {
      font-size: 13px;
      color: var(--次要);
    }
    .输入框, .下拉框, .按钮 {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 14px;
      outline: none;
    }
    .输入框:focus, .下拉框:focus {
      border-color: var(--强调);
      box-shadow: 0 0 0 3px rgba(0,113,227,.16);
    }
    .按钮 {
      cursor: pointer;
      font-weight: 620;
    }
    .按钮.主按钮 {
      background: var(--强调);
      border-color: var(--强调);
      color: #ffffff;
    }
    .统计栏 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .统计卡 {
      padding: 14px;
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .统计名 {
      font-size: 12px;
      color: var(--次要);
      margin-bottom: 8px;
    }
    .统计值 {
      font-size: 28px;
      font-weight: 700;
    }
    .主块 {
      padding: 18px;
    }
    .主块标题行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .主块标题 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .结果数 {
      color: var(--次要);
      font-size: 15px;
    }
    .语料列表 {
      display: grid;
      gap: 14px;
    }
    .语料卡 {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
    }
    .语料头 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }
    .语料编号 {
      font-size: 16px;
      font-weight: 650;
    }
    .语料统计 {
      color: var(--次要);
      font-size: 13px;
    }
    .信息行 {
      margin: 8px 0 0;
      line-height: 1.7;
      font-size: 14px;
      color: var(--文字);
    }
    .信息标题 {
      color: var(--次要);
    }
    .正文 {
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.78;
      font-size: 15px;
      color: var(--文字);
      max-height: 9.2em;
      overflow: hidden;
      position: relative;
    }
    .语料卡.展开 .正文 {
      max-height: none;
    }
    .正文::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(251,251,253,0), rgba(251,251,253,1));
    }
    .语料卡.展开 .正文::after {
      display: none;
    }
    .操作行 {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .小按钮 {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 13px;
      cursor: pointer;
    }
    .空状态 {
      padding: 28px;
      text-align: center;
      border-radius: 8px;
      border: 1px dashed var(--边框强);
      color: var(--次要);
    }
    @media (max-width: 1200px) {
      .页面 {
        grid-template-columns: 1fr;
      }
      .侧栏 {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--边框);
      }
      .工具格 {
        grid-template-columns: 1fr;
      }
      .统计栏 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      .统计栏 {
        grid-template-columns: 1fr;
      }
      .主体, .侧栏 {
        padding: 16px;
      }
    }
  </style>
</head>

俗增长。其中公允价值变动损益科目无疑有望实现同比高增，由于25年银行有较强的平滑业绩波动以及银行账簿利率风险管理诉求，导致投资收益同比持续高增，一定程度上削弱了26Q1银行其他非息收入增长的弹性。预测26Q1上市银行其他非息收入同比增长8.5%，较25年上行3.5pct。\n[太阳]银行或利用26Q1核心营收改善的时间窗口，加速风险处置并适度增提拨备。银行业结构性的资产质量压力仍未现拐点，25年国股行对公房地产贷款不良率系统性上行，个人贷款不良率继续爬坡。25年国有大行信用成本开始向下击穿不良净生成率（2018年以来首次）。预期26年银行不良生成率仍有一定的上行风险，银行或充分利用这个时间窗口加速风险处置、适度增提拨备。预测26Q1上市银行计提信用减值损失同比增速5.9%，较25年上升5.3pct。\n[太阳]基于上述核心假设，预测上市银行26Q1营收同比增速为6.1%，较25年显著提升4.8pct，其中国有行/股份行/城商行/农商行分别为6.7%/3.7%/9.3%/3.4%，较25年分别+4.4pct/5.4pct/5.7pct/3.9pct。预测PPOP同比增速为3.2%，较25年+2.2pct，其中国有行/股份行/城商行/农商行分别+0.8pct/+4.2pct/+4.2pct/+4.8pct，预测归母净利润同比增速为3.3%，较25年+1.6pct，其中国有行/股份行/城商行/农商行分别+1.1pct/2.1pct/+3.2pct/+0.1pct，相比营收，改善幅度略小，主要是信用成本支出有所增加。\n[太阳]2026年银行板块有望回归基本面叙事：十五五开局之年，政策性金融工具加持下资产扩张仍有韧性；仍处于存款集中重定价周期，支撑净息差有望企稳回升；结构性风险暴露仍期待有政策托底。2026年，保险行业将系统性执行I9，公募考核新规的中长期引导效应也有望显现，我们看好2026年银行板块绝对收益。\n[太阳]建议关注两条主线：1、基本面稳健、具备较好防御价值的国有大行，相关标的：工商银行、建设银行、农业银行；2、基本面确定的优质中小行，相关标的： 渝农商行、杭州银行、宁波银行、齐鲁银行、苏州银行、南京银行。\n详细内容请参考我们发布的同名研究报告。", "preview": "【东方银行】A股银行26Q1业...\n【东方银行】A股银行26Q1业绩前瞻：营收有望超预期，其中利息净收入增速弹性或较为可观\n核心观点：\n[太阳]净息差韧性有望超预期，带动利息净收入重回增长区间，且弹性可观。一方面是存款重定价的有效支撑，测算26年存款重定价对净息差有约16BP正向拉动作用，结合23年新增存款的节奏，26Q1有望体现50%以上。另一方面，我们判断26年银行贷款利率有望筑底，且资产投放风险偏好较低、资产定价水平本身较低的银...", "sectors": ["银行"], "companies": ["农业银行", "南京银行", "宁波银行", "工商银行", "建设银行", "杭州银行", "渝农商行", "苏州银行", "齐鲁银行"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 9, "timestampCount": 10, "timestamps": ["2026-04-16 09:13"]}, {"id": "evidence-259", "content": "🔥【中泰汽车|何俊艺团队】轮胎...\n🔥【中泰汽车|何俊艺团队】轮胎月度跟踪：欧洲供不应求&原材料高位回落，4月业绩期+反倾销(5.4)在即(带PPT)\n#\n基于量增确定性，3.25底部提示(交易底)+4.1继续重点推荐(胎企次轮涨价)，悲观情景测算头部胎企年化业绩弹性均值+25%(当前9xPE/中期看50%-翻倍空间)\n1⃣β：3月起轮胎板块因油价暴涨跌至9xPE，原材料( # 海运费( # 汇率( 释放，2026年出海加速逻辑不变，板块戴维斯双击催化临近。关键节点：4月业绩期→5.4反倾销结果→高端配套与赛道胎定点突破。\n2⃣个股：持续看好中策、赛轮、森麒麟半钢+全钢胎出海放量（26Q1满产）及高端定点拔估值；海安、赛轮巨胎国内外产能放量贡献弹性；关注浦林成山、风神、三角、玲珑等自主胎企。\n💡月度核心数据：\n考②出口订单趋势\n1⃣产能进度：26Q1主要新增产能预计满产，头部26年业绩弹性均值+25%。\n2⃣输美订单数：26/03淡季，赛轮/森麒麟/玲珑美国进口订单票数月度累计同比 +9%/+17%/+59%。\n3⃣产能利用率：海外常年100%+。\n考②国内开工率和库存水平\n1⃣出口趋势：中国产量/出口量月度同比持平，系中小胎企受欧洲双反  "鹏鼎控股"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 7, "timestampCount": 8, "timestamps": ["2026-04-16 15:44"]}, {"id": "evidence-146", "content": "【华泰电新】欧盟欲重振“欧洲制...\n【华泰电新】欧盟欲重振“欧洲制造”，短中期影响有限\n➡欧盟欲重振“欧洲制造”，短中期影响有限\n◆ 根据SCMP（南华早报）4月14日报道，在3月举行的26位部门主管高层会议上，欧盟委员会主席批准计划，禁止欧盟资金流向包含中国逆变器的清洁技术项目。\n◆ 我们认为此次计划并非新增，此前在26年3月，欧盟委员会曾发布《工业加速法案》（IAA）草案，规定自IAA法案生效3年后，获得公共支持的光伏项目必须使用欧盟制造的光伏电池和逆变器。\n◆ 26-30年正值欧洲能源转型的关键阶段，同时欧洲本土光储制造业产能与技术水平与中国企业存在显著差距，我们认为切断中国供应成本高企，难度较大。\n◆ 此外，法案正式落地仍需时日，且生效后仍将预留3年过渡期，为中国企业欧洲建厂规划留有足够缓冲。\n➡能源价格上涨影响逐步体现，电池包毛利率有望于Q2修复\n◆ 根据海关总署，26年1-2月逆变器整体出口金额达到16.65亿美元，同比增长56.92%。\n◆ 考虑到Q1春节影响，叠加Q2、Q3将步入传统旺季，预计户储板块企业Q2业绩环比将保持增长态势。\n◆ 短期能源价格上涨的影响正在逐步体现，当前已看到中东及欧洲当地库存及在途货物加速消耗，据德业股份业绩会反馈，Q2排产表现为持续提升。\n◆ 关于市场对于原材料涨价导致电池包盈利下滑的担忧，企业Q1进行了提价，户储板块终端价格敏感度较低，传导较为顺畅，我们预计Q2毛利率将明显修复。\n➡继续看好板块高景气度延续，产业链相关公司包括德业股份、阳光电源、固德威、锦浪科技、艾罗能源、正泰电源。", "preview": "【华泰电新】欧盟欲重振“欧洲制...\n【华泰电新】欧盟欲重振“欧洲制造”，短中期影响有限\n➡欧盟欲重振“欧洲制造”，短中期影响有限\n◆ 根据SCMP（南华早报）4月14日报道，在3月举行的26位部门主管高层会议上，欧盟委员会主席批准计划，禁止欧盟资金流向包含中国逆变器的清洁技术项目。\n◆ 我们认为此次计划并非新增，此前在26年3月，欧盟委员会曾发布《工业加速法案》（IAA）草案，规定自IAA法案生效3年后，获得公共支持的光伏项目必须使用...", "sectors": ["储能"], "companies": ["固德威", "德业股份", "正泰电源", "艾罗能源", "锦浪科技", "阳光电源"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 6, "timestampCount": 7, "timestamps": ["2026-04-16 10:28"]}, {"id": "evidence-40", "content": "【东吴电子陈海进】AI基建进入...\n【东吴电子陈海进】AI基建进入密集催化期，重点推荐PCB/IC载板\n🥇事件：四月下旬，美股Q1财报季逐步拉开序幕，AI板块本周台积电开响第一枪，微软/谷歌/亚马逊/Meta也将在4月下旬陆续发布业绩并举办电话会。谷歌两大重点旗舰活动CloudNext及I/O大会分别将在4月22日/5月19召开，此后还有重磅的Computex黄仁勋演讲将在6月初举行，AI基建进入密集催化期。\n🥇观点重申；\n⭕AI芯片军备提速，PCB产业迎量价齐升拐点\n➡️ASIC方面，谷歌Cloud Next 26有望披露TPU v8架构及内存池化部署节奏，Anthropics上周获3.5GW配额并计划采购百万颗Ironwood TPU。与此同时，亚马逊CEO股东信表示Trainium年化收入规模有望达500亿美元，订阅率接近满额，ASIC芯片带动PCB放量。英伟达方面，Rubin Ultra架构有望于2027年下半年落地，搭载的正交背板，及CoWoP将带动PCB价值量提升。AI算力军备竞赛加速，PCB产业迎来量价齐升黄金期。\n⭕AI芯片封装与存储共振，IC载板景气加速上行\n➡️下游AI芯片封装需求爆发，上游材料涨价传导，载板厂商产能满载，产业景气高昂。 ABF龙头欣兴载板产能紧张，BT新订单已无力承接，法说会表示2026年第二季度ABF价格涨势将更加剧烈。景硕发言人表示目前AI相关高阶ABF载板供给不足，T-Glass玻璃布、铜箔等多类品项缺料，预计ABF载板下半年 大模型兴起，应用实现加速突破。\n国内医疗器械企业积极拥抱这一趋势，本届展会上多家企业将 AI 大模型作为产品核心功能。\n迈瑞医疗是典型代表，与往届按品类展示不同，今年 AI 成为其展台核心。\n迈瑞医疗推出启元系列大模型，覆盖 ICU、超声等多条产品线。\n现场潜在采购商对迈瑞的 AI 方案表现出浓厚兴趣，团队认为迈瑞凭借多年数据积累具备天然优势。\n采购商同时关注成本、准确率、兼容性等实际问题。\n联影医疗与威高骨科切入超声领域\n联影医疗本届展会拥有最大展区面积，往年同样是最大参展商之一。\n联影展示了 CT、MRI 及全新推出的超声等多款高端医疗设备。\n联影已实现光子计数 CT（uCT Ultima）商业化。\n联影超声定位高端市场，目前仍处于产能爬坡阶段。\n威高骨科作为超声领域新进入者，展出多款覆盖中端至高端市场的机型。\n多家企业展出手术机器人，现场体验流畅\n手术机器人是增长较快的领域，尤其在海外市场表现突出。\n这反映出中国产品在全球手术机器人领域的认可度持续提升，当前该领域主要由直觉外科主导。\n团队现场操作了微创机器人、思哲医疗、术锐的演示设备，整体操作友好、体验良好。\n从非专业角度看，各演示设备在精度与易用性上无显著差异。\n企业需要向医生证明产品竞争力比肩竞品，否则将转向价格竞争。\n微创机器人本届展会展区面积较往年缩减成本的模式明显扩大。\n参观纽睿西展台，了解脑机接口产品\n纽睿西的脑机接口产品 NEO 于 2026 年 3 月获得国家药监局批准。\n企业通过视频展示这款全球首款获批的脑机接口产品，可帮助部分截瘫患者一定程度恢复手臂肌肉力量。\n该设备核心优势为可长期植入患者脑部，企业正围绕技术研发更多适应症。\n据销售人员介绍，NEO 产品价格尚未最终确定。", "preview": "中国医疗保健：2026 年 C...\n中国医疗保健：2026 年 CMEF 快速印象\n本次 CMEF 中国国际医疗器械博览会现场依旧人流密集，AI 成为今年医疗设备最核心的新增亮点。\n野村团队于 4 月 9-10 日参观了在上海举办的第 93 届中国国际医疗器械博览会。\n展会期间有约 5000 家企业参展，团队重点参观了手术机器人、脑机接口产品及多家核心覆盖公司的展品。\nAI 成为迈瑞医疗核心展示重点\nAI 在医疗领域的应用并非新鲜事物...", "sectors": ["医疗器械"], "companies": ["威高骨科", "微创机器人", "联影医疗", "迈瑞医疗"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 4, "timestampCount": 5, "timestamps": ["2026-04-16 10:36"]}, {"id": "evidence-167", "content": "市场焦点全神贯注于今天下午台积...\n市场焦点全神贯注于今天下午台积电（TSMC）的业绩发布，重点关注资本支出（CAPEX）和毛利率（GM）趋势。投资者普遍持非常乐观的态度，预计 2026 年上半年毛利率将达到 60% 以上的中高区间，2026 财年的增长率可能上调至 30% 以上的高位，随后 2027 财年将继续保持强劲增长。\n在资本支出方面，高盛（GS）认为可能维持在之前 2026 财年指引 520-560 亿美元范围的高端，但 2027 财年及以后的上行空间巨大（高盛对 2027 财年的预测值为 700 亿美元）。\n公司关于 CoWoS、SoIC 以及 CPO/COUPE 进展的评论对相关供应链也至关重要。在业绩公布前，我们看到台积电和其他大盘科技股出现积极的买入流，同时市场也有兴趣重新审视设备和测试以外的一些台积电相关供应链，包括化学品、耗材、厂务工程等。日月光（ASE）也可能是一个不错的台积电溢出效应标的，虽然受益程度不如纯半导体设备股，但在先进封装和 CPO 领域也占据有利地位。其他大盘科技股方面：联发科（MTK）股价因 CoWoS 份额分配上行的积极预期而上涨，而智能手机业务的下行风险已得到充分预警。台达电（Delta）因其 800V 高压直流输电（HDVC）的贡献和进展也受到更多关注。（感谢台湾销售 Jill Huang）", "preview": "市场焦点全神贯注于今天下午台积...\n市场焦点全神贯注于今天下午台积电（TSMC）的业绩发布，重点关注资本支出（CAPEX）和毛利率（GM）趋势。投资者普遍持非常乐观的态度，预计 2026 年上半年毛利率将达到 60% 以上的中高区间，2026 财年的增长率可能上调至 30% 以上的高位，随后 2027 财年将继续保持强劲增长。 将继续出台相关支持措施，韩国已官宣将可再生能源容量提升至 100 吉瓦，本次事件将对全球各地区能源领域产生显著冲击。\n3、海外储能投资逻辑与标的推荐\n✅储能赛道景气度验证：海外储能赛道高景气度已通过重点逆变器企业一季度业绩得到验证。\n德业股份 2026 年一季度预计实现归母净利润 10-12 亿元，同比增长55.91%-70.08%，固德威、艾罗一季度预计实现大几十的同比增速。\n⏳一季度高增并非由伊朗冲突驱动，该事件 3 月中旬才爆发，渠道反应尚不充分源头信息加微，增长核心源于海外储能赛道自身需求旺盛。\n展望二季度，伊朗冲突影响开始向全球辐射，但德业已给出二季度业绩环比继续增长的指引。\n行业高增速下，海外公储、户储赛道对碳酸锂、电芯涨价的传导较为顺畅，高景气度对量的增速和盈利能力均有较高保障。\n️欧洲供应链风险分析：欧洲针对中国逆变器的限制传闻本质是保护当地传统逆变器厂商。\n欧洲本土逆变器厂商 2022 年经历库存拥挤后普遍元气大伤，多数处于破产或经营困难状态，产品开发能力与成本控制能力均难与中国厂商抗衡。\n欧洲能源转型仍高度依赖中国光伏、储能供应链。\n⏳即便相关法案生效，也有 3 年以上的过渡期，足够企业制定应对方案，无需过度担忧供应链本土化风险。\n投资建议与标的推荐：海外储能赛道长期需求确定性较强，全球能源转型发展路径较为相似。\n前期依靠光伏、户储解决用电问题，后续新能源与户储饱和后，依靠工商储、大储解决电网问题。\n即便个别国家需求出现阶段性调整，也会有其他新兴市场承接需求，整体需求大盘稳定。\n⌛当前部分优质储能标的已回调至 2026 年年初位置，二三季度为海外出货旺季，当下是较好的布局窗口。\n核心推荐欧洲工商储、澳洲及亚洲等新兴市场户储赛道，首推全球渠道布局领先的德业股份，以及公储、户储业务弹性较大的艾隆、固德威。", "preview": "储能观点再更新：海外市场高景气...\n储能观点再更新：海外市场高景气度全面确认\n1、储能板块近期行情复盘\n开年储能走势与核心主线：2026 年开年以来储能板块核心投资主线为海外工商储爆发，海外尤其是欧洲多国工商储商业模型已跑通，需求放量顺畅。\n⚡大储虽有量的增速，但受限于竞争格局问题，业绩端仍存承压风险。\n多家逆变器企业在 2025 年底至 2026 年 1 月已给出 2026 年乐观增长指引，其中户储预期增速为30%-40%，工商储预...", "sectors": ["储能"], "companies": ["固德威", "德业股份", "艾罗能源"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 3, "timestampCount": 4, "timestamps": ["2026-04-16 18:22"]}, {"id": "evidence-36", "content": "整车调整，后面怎么看？\n———...\n整车调整，后面怎么看？\n———————\n这两天市场流动性预期改善，整车大涨一个多月之后开始调整，4月科技成长重回主擂，以下是我们对整车后续观点。\n一、基本面：首先要认知到出海是接下来两年整车股价的主线，出口数据有望节节攀升，更多车企加入x扩渠道x增库销比x单店需求上升，这个增长并不是线性的，其中比亚迪、吉利、零跑乃至奇瑞都是一样的，而在这里面增长动能是电车出海。\n二、资金面：汽车资金买得早、卖得也早，但如果电车出海是三年以上成长周期（行业出口增速20%+、电车50%+、利润翻倍式），那么势必会有全市场的增量资金——现在属于大家知道了逻辑但未必有信心，随数据持续走强、市场研究颗粒度增加，投资者信心会增强——毕竟最终，出海带来的EPS大增完全能消化掉估值。\n瞄准此前出口逻辑里的两轮车、工程机械，当年估值20-30倍是常态，比亚迪的20倍，尤其吉利的10倍，并未高估。往往重仓来自于第二波机会！\n三、标的：电车出海三杰，龙头标配比亚迪，低估值龙二吉利，弹性配置零跑。后续催化剂包括：出口数据超预期、4/24北京车展、零跑D19周四上市、吉利极氪8X周五上市等。此外，我们对比亚迪、吉利、零跑内销盈利比市场乐观，可能2-4Q的财报会比市场预期得要好。\n之前很多投资者在问吉利什么时候会有调整好上仓位，maybe就是接下来一段时间，毕竟这个调整来自于风偏而不是基本面～建议把握回调时段的机会！", "preview": "整车调整，后面怎么看？\n———...\n整车调整，后面怎么看？\n———————\n这两天市场流动性预期改善，整车大涨一个多月之后开始调整，4月科技成长重回主擂，以下是我们对整车后续观点。\n一、基本面：首先 长江电子】大族激光年报：PCB景气度再超预期\n1、大族激光公布2025年年报，全年收入188亿（+27%），归母11.9亿（预期10-11亿），扣非8.1亿（+82%）；\n2、结构上超预期主要来自PCB（大族数控）Q4表现，营收18.7亿（环+23%），归母3.3亿（环+46%），单季度毛利率42.2%（环+8.2pct），净利率17.7%（环+2.8pct）；\n3、PCB业务除高盈利超快激光占比提升外，主力出货产品机械钻孔机、CO2钻孔机等毛利率在高景气下走出了类似存储和电子布的紧缺提价逻辑，有望带动2026年业绩继续上修；\n4、AI设备与3D打印共振，2026-2027年利润预期30E、50E，继续重点看好！", "preview": "【长江电子】大族激光年报：PC...\n【长江电子】大族激光年报：PCB景气度再超预期\n1、大族激光公布2025年年报，全年收入188亿（+27%），归母11.9亿（预期10-11亿），扣非8.1亿（+82%）；\n2、结构上超预期主要来自PCB（大族数控）Q4表现，营收18.7亿（环+23%），归母3.3亿（环+46%），单季度毛利率42.2%（环+8.2pct），净利率17.7%（环+2.8pct）；\n3、PCB业务除高盈利超快激光占比...", "sectors": ["PCB"], "companies": ["大族数控", "大族激光"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 2, "timestampCount": 3, "timestamps": ["2026-04-16 21:41"]}, {"id": "evidence-147", "content": "亚太科技 — 半导体 — 存储...\n亚太科技 — 半导体 — 存储：南亚科技 2026 年一季度业绩映射：DRAM 均价强劲增长与利润率改善\n4 月 13 日，中国台湾 DRAM 厂商南亚科技发布 2026 年一季度（3 月季度）财报，高盛据此对覆盖的韩国存储厂商海力士、三星电子进行映射分析。\n核心要点如下：1）DRAM 均价强劲增长 + 营业利润率改善；2）长期协议谈判仍在推进，但不会全部替换为长期协议；3）维持 DRAM 市场积极展望；4）氦气供应局势对生产影响有限。\nDRAM 均价强劲增长与营业利润率改善\n南亚科技 2026 年一季度 DRAM 均价环比上涨超 70%，2025 年四季度环比涨幅为 40% 以上。\n在均价大幅上涨推动下，营业利润率环比提升 22 个百分点至 61%。\n公司未给出 2026 年二季度价格指引，但表示预计价格将上涨、整体需求保持旺盛。\n南亚科技的均价与利润率趋势与韩国厂商一致，且韩国厂商表现更强。\n高盛预计，三星电子 2026 年一季度 DRAM 均价环比增长 92%，营业利润率达 80%。\n高盛预计，海力士 2026 年一季度 DRAM 均价环比增长 59%，营业利润率达 76%。\n长期协议谈判推进中，但不会全面替换\n长期协议是财报会议核心议题，南亚科技表示长期协议谈判仍在进行，但不会将所有合约替换为长期协议。\n公司称将与客户构建多元化合约体系，包括不同期限的长期协议及月度 / 季度短期合约。\n高盛预计，长期协议将成为韩国厂商即将召开的财报会议中投资者的核心关注点。\n投资者希望了解供应商与客户签署长期定价的机制，以及长期合约的约束力。\n维持 DRAM 市场积极展望\n南亚科技对 DRAM 市场供需两端均维持积极展望。\n需求端：DRAM 与 HBM 需求保持强劲，高端 PC、手机需求持续具备韧性。\n供给端：预计今年行业产能仅小幅增加，整体供给紧张格局将持续。\n氦气局势对生产影响有限\n南亚科技表示，氦气可从中东以外地区采购，能够缓解中东冲突带来的潜在供应中断风险。\n对应韩国厂商：鉴于库存充足、供应来源多元化，叠加韩国方面已从美国等地区锁定 4 个月半导体用氦气，氦气问题带来的供应中断风险有限。\n三星电子：目标价风险与估值方法\n估值方法：基于 2026 年预期企业价值 / 息税折旧摊销前利润的分部加总估值，给予普通股 12 个月目标价 285000 韩元。\n优先股基于较普通股 23% 的折价，给予 12 个月目标价 220000 韩元。\n高盛对三星电子普通股与优先股均给予买入评级。\n核心下行风险：1）存储供需严重恶化；2）智能手机利润率大幅收缩；3）手机 OLED 市场份额丢失。\n海力士：目标价风险与估值方法\n估值方法：基于 2026/2027 年平均市净率，给予 12 个月目标价 1350000 韩元，对应目标市净率 2.9 5全年实现收入78.61亿元（同比-1.02%），归母净利润6.56亿元（同比+59.96%），扣非归母净利润6.12亿元（同比+178.99%）；2025Q4公司实现收入21.36亿元（+14.41%），归母净利润1.06亿元（去年同期亏损0.25亿元），扣非归母净利润1.04亿元（去年同期亏-0.35亿元）。\n[太阳]业绩拆解：越南盈利能力提升，国内业务仍承压。 分地区来看，25年越南/国内收入分别为62.11/16.50亿元、同比增长3.57%/-13.25%。从净利来看，越南净利为6.42亿元、同比增长27.38%，净利率为10.3%、同比增长1.9PCT。我们测算，国内业务方面，仍出现较明显亏损，我们测算亏损幅度不足1亿元（不考虑减值），Q4已出现小幅改善（产能利用率提升叠加小幅涨价）。\n[太阳]色纺纱毛利率改善明显。 2025年纱线销量为26.07万吨、同比增长7.59%，ASP为2.85万元/吨、同比下降5.75%，均价下跌主要由于公司下半年主动调整定价策略，以价换量刺激订单增长。分拆来看，色纺纱/坯纱收入分别为39.56/34.73亿元、同比增长-2.47%/6.19%，色纺纱占比下降2PCT至53%。色纺纱/坯纱毛利率分别为17.84%/8.12%、同比提升6.62/1.52PCT。\n[太阳]毛利率恢复，净利润率受到非经因素扰动。25年公司毛利率/净利率为13.67%/8.35%、同比提升3.47/3.19PCT，净利率提升幅度略低于毛利率主要由于资产处置收益减少。从费用来看，25年销售/管理/研发/财务费用率分别为0.39%/3.52%/0.96%/0.78%、同比下降0.08/0.18/0.45/0.69PCT，财务费用率有所下降。25年投资收益1.57亿元，其中中宁波通商银行1.42亿元；公允价值变动净收益0.19亿元；资产减值损失为7300万元，较往年4000万平均水平有所增加，主要系存货减值计提政策更为谨慎计提比例增加所致。\n[太阳]2026年一季度展望： 销量方面，Q1销量同比增长约28%。价格方面，据行业数据，2026年一季度棉均较去年同期上涨接近10%，但公司Q1出货订单多为Q4所接，而Q4正值价格低谷期，因此单价同比预计持平或略微下降。利润端，因2025Q1基数较高（投资收益7700万），预计经营利润表现突出，表观利润增速预计低于或者持平收入增速，但预计Q2利润增速仍有望保持靓丽。2025年以来公司产能利用率较此前明显改善，利润的季度波动将大幅降低，叠加棉价上行周期，2026年上半年的业绩确定性较强。\n[太阳]盈利预测：我们预计2026-2027年公司归母净利润分别为8.4、9.8亿元，对应PE为13.8X、11.8X。继续推荐~\n[红包]联系人：姜文镪18817619332，刘田田15101097934", "preview": "【信达消费】百隆东方2025年...\n【信达消费】百隆东方2025年报点评：越南盈利高增，国内经营改善，2026H1业绩确定性增强\n[太阳]事件：公司发布2025年报。2025全年实现收入78.61亿元（同比-1.02%），归母净利润6.56亿元（同比+59.96%），扣非归母净利润6.12亿元（同比+178.99%）；2025Q4公司实现收入21.36亿元（+14.41%），归母净利润1.06亿元（去年同期亏损0.25亿元），扣非归母...", "sectors": ["纺服"], "companies": ["百隆东方"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-16 09:19"]}, {"id": "evidence-313", "content": "【兴证医药】特宝生物与Alig...\n【兴证医药】特宝生物与Aligos就衣壳调节剂ALG-000184达成授权协议。\n特宝生物与Aligos就ALG-000184达成授权协议，该药物为一款新型口服小分子衣壳组装调调节剂，特宝生物获得该分子国内独家开发与商业化权益，Aligos获得首付款 2500 万美元，里程碑付款8500万美元、销售里程碑3.35亿美元，以及按净销售额的个位数比例计算的特许权使用费。\n1期临床在HBeAg阳性受试者中，每日口服300mg ALG-000184单药治疗96周后，9例受试者100%实现了HBV DNA持续抑制（<10 IU/mL）；在HBeAg阴性受试者中，第24周时11例受试者100%实现HBV DNA抑制，并维持长达96周，在第96周时，9例受试者中有8 ctorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-16 20:51"]}, {"id": "evidence-9", "content": "【国泰海通医药】益方生物年报及...\n【国泰海通医药】益方生物年报及电话会点评：26年收入达到1亿目标有信心，各管线进展顺利\n公司2025年实现收入0.37亿元，主要来自授权产品贝福替尼和格索雷塞的销售分成以及相关里程碑。2026年公司预计考虑到上述产品的放量带来更多分成的前提下，叠加研发里程碑，对于全年收入达到1亿人民币具有信心。\n研发持续投入，更多管线进入临床开发。2025年公司实现归母净利润-3.2亿，主要系研发投入达3.3亿元。2026年公司预计保持可比水平的研发投入，推进wrn抑制剂、KIF18A抑制剂等资产进入临床，并积极推进临床前包括下一代ADC、STAT6 PROTAC的开发；\nD2570进展顺利，中美临床同步进行中。公司TYK2抑制剂D2570正在中国推进银屑病III期临床，顶线数据预计1q27读出；中国的IBD、SLE、PSA和白癜风II期都在进行中，临床前动物模型上看到了单药很好的疗效，并在I期看到了包括IL17、TNFα biomarker在内的积极生物学信号，其中IBD II期临床有望在3q26看到初步临床数据，值得期待。美国临床方面，I期临床已基本完成，在海外人群中看到了和中国临床可比的PK和安全性数据，公司正在筹备美国银屑病II期临床推进，预计在上半年能够启动，并于27年中获得初步数据。\nkras g12c抑制剂、口服SERD前线临床顺利推进，有望做出差异化优势。kras g12c抑制剂目前正在由正大天晴进行销售，2026年将迎来二线肺癌适应症的首个完整医保放量年度。此外，kras g12c+fak抑制剂针对一线肺癌的III期临床有望27年完成；口服serd首个III期临床二线乳腺癌适应症正在顺利推进，公司近期启动了口服serd联合康宁杰瑞TROP2*HER3 ADC的联用临床，预计27年会有初步数据读出，该ADC安全性优势明显，疗效优异；\n2026年是TYK2抑制剂全球催化丰富的一年，值得关注公司进展。AAD大会上，强生、武田和alumis已经披露了旗下银屑病口服药物的全球III期PSO的详细结果，其12-16w PASI100疗效在30-40%水平，52w疗效在50%水平，而D2570有望在12-16w就达到50%疗效，并在52w突破到更高疗效水平，具有BIC潜力。此外，武田的TAK279预计在今年会披露IBD的全球II期结果；BMS的sotyktu、alumis的ESK001将会披露SLE的全球III期和II期结果，验证tyk2抑制剂在多个适应症的poc潜力。益方生物D2570同适应症数据有望在2H26-2027读出，值得期待。\n联系人：余文心/余克清/廖博闻/汪晋", "preview": "【国泰海通医药】益方生物年报及...\n【国泰海通医药】益方生物年报及电话会点评：26年收入达到1亿目标有信心，各管线进展顺利\n公司2025年实现收入0.37亿元，主要来自授权产品贝福替尼和格索雷塞的销售分成以及相关里程碑。2026年公司预计考虑到上述产品的放量带来更多分成的前提下，叠加研发里程碑，对于全年收入达到1亿人民币具有信心。\n研发持续投入，更多管线进入临床开发。2025年公司实现归母净利润-3.2亿，主要系研发投入达3.3亿元。...", "sectors": ["生物医药"], "companies": ["益方生物"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-15 22:18"]}, {"id": "evidence-83", "content": "【国盛计算机】朗新科技：AI助...\n【国盛计算机】朗新科技：AI助力电力交易量3倍增长，布局算电协同打开全新空间\n[太阳]#2025年迎来业绩拐点、归母净利同比+142%。公司实现营业收入45.17亿元，同比增长0.84 %；实现归属于上市公司股东的净利润1.05亿元，同比增长141.94%，业绩符合预期。\n[太阳]#能源数智化：与上海临港算力中心共建虚拟电厂、探索算电协同新蓝海。1）公司与上海临港算力中心共建虚拟电厂平台，完成智算百卡集群多任务算力跨省快速转移实测，率先探索出算电协同落地路径。2）据信通院数据，到2030年我国数据中心用电量将达4000到7000亿千瓦时 电类高15-20pct）。 新签订单高增：25年公司新...", "sectors": ["固态电池"], "companies": ["联赢激光"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-16 10:28"]}, {"id": "evidence-241", "content": "【天风电新】晶科科技：耐心等待...\n【天风电新】晶科科技：耐心等待中卫算电协同，政策强催化下价值重估正当时-260416\n————————————\n🌼前期震荡系情绪错杀，政策+项目双重催化已至。\n公司前期股价波动，核心系市场对短期资金面扰动过度反应，公司基本面及经营情况持续向好。随着【算电协同】首次写入政府工作报告、国家数据局明确算力枢纽绿电占比≥80%硬性约束，叠加中卫GW级项目落地进入倒计时，短期情绪扰动已过，价值重估窗口正式开启。\n🌼核心逻辑：双赛道稀缺龙头，算电协同构建护城河。\n晶科科技为晶科集团新业务核心平台，是稀缺同时卡位宁夏中卫双中心+绑定腾讯等头部CSP的算电协同标的，GW级项目落地将直接切入token出海与AI算力核心需求，叠加政策强催化，长期成长确定性与估值弹性双高。\n一、算电协同：中卫GW级项目落地在即，头部客户锁定腾讯等CSP。\n1、项目落地确定性高：公司与头部IDC企业共建的GW级算电协同项目已进入最后筹备阶段，终端客户大概率锁定TX等头部CSP厂商，将承接AI训练、离线分析等token出海核心算力需求，项目落地后有望贡献可观分成收益。\n2、中卫双中心优势无可替代：\n1）成本极致：中卫数据中心到户电价0.36元/度（国网宁夏电力），仅为东部1/2、欧美1/3-1/5，算力运营成本大幅领先行业。\n2）合规与区位双优：全国唯一兼具国家算力枢纽、新型互联网交换中心的双核心节点城市，至核心城市时延8-13ms，适配非实时算力、存储备份等需求。\n3）政策强支持：宁夏明确2027年新建数据中心绿电占比100%，强制算力集群绿电占比≥80%，项目落地后将享受政策红利。\n二、主业稳健：轻资产转型+储能高增长，业绩提供坚实支撑。\n1、储能业务爆发：公司储能电站在手储备达20GWh，绝大部分卡位容量补偿政策较好地区，以\"建成+转让\"高周转轻资产模式为主，2026年转让预期6-7GW，保守按0.1元/w测算对应6.5亿元增量利润。\n2、资产优化提速：加速剥离海外亏损电站资产（如沙特0.8GW项目），聚焦国内高收益项目，利润表现持续优化。\n3、现金流充裕：公司持有国内5GW光伏电站，其中3GW布局于八大算力枢纽省份，储能核心节点储备20GWh，6-8GWh直接绑定算力节点，为算电协同业务提供充足现金流支撑。\n🌼结论：政策强催化+项目落地双轮驱动，弹性空间充足。\n估值测算：传统光伏电站业务100亿市值+储能电站转让130亿元（26年6.5亿元×20x）+算电协同新业务120亿（考虑政策强催化），合计有望350+亿目标市值。", "preview": "【天风电新】晶科科技：耐心等待...\n【天风电新】晶科科技：耐心等待中卫算电协同，政策强催化下价值重估正当时-260416\n————————————\n🌼前期震荡系情绪错杀，政策+项目双重催化已至。\n公司前期股价波动，核心系市场对短期资金面扰动过度反应，公司基本面及经营情况持续向好。随着【算电协同】首次写入政府工作报告、国家数据局明确算力枢纽绿电占比≥80%硬性约束，叠加中卫GW级项目落地进入倒计时，短期情绪扰动已过，价值重估窗口正式开启...", "sectors": ["光伏"], "companies": ["晶科科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-16 13:59"]}, {"id": "evidence-254", "content": "【广发机械】中联重科跟踪：透过...\n【广发机械】中联重科跟踪：透过汇兑看真实的增速，低估值高价值\n今日，公司调整幅度较大，谈谈我们的理解。\n1.#重点关注基数影响。（1）中联重科25Q1有【一次性的土地处置收益5.6e】+【汇兑收益1.3e】=6.9e；（2）26Q1完全没有土地处置的收益+【汇兑损失4.5e（港股融资相关）】=-4.5e；（3）非经常性因素，#26Q1相较于25Q1少了11.4e。\n2..# 比+2.2pct；一季度国内装机市占率同比+3.4pct至47.7%，龙头份额继续提升。此外公司车端出口市占率预计比国内更高。\n4、扩张仍在继续，现金流和资金实力充足。\n2026Q1末公司货币资金+交易性金融资产合计超4100亿元，存货1089亿元，较年初继续提升；在建工程349亿元，较年初增长约50亿元。\n5、公司龙头优势继续强化。\n动力端受益于乘用车渗透率提升、单车带电量提升及商用车电动化加快，储能端受益于国内商业模式理顺及海外数据中心配储需求增长，行业景气度明显，公司作为行业龙头将持续受益。\n6、强化上游掌控\n公司公告注册资本300亿成立子公司专门管理运营新能源矿产领域，保证供应链安全稳定。\n此外4.21公司将举行超级科技日，主题为 “极域之约”，将公布系列新技术。\n预计公司26年归母利润可达1000亿，当前估值20x，行业龙头地位稳固，值得重点关注", "preview": "【招商电新】宁德时代2026Q...\n【招商电新】宁德时代2026Q1业绩点评-20260415\n1、公司公告：2026Q1实现营收、归母、扣非净利润分别1291.31、207.38、180.93亿元，同比分别+52.45%、+48.52%、+52.95%；经营活动现金流净额336.81亿元，同比+2.47%。整体看，收入利润基本没有受到上游原材料涨价影响，供应链话语权依然强劲。\n2、Q1业绩高增，盈利维持高位。\n2026Q1公司归母净...", "sectors": ["锂电"], "companies": ["宁德时代"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-15 22:50"]}, {"id": "evidence-23", "content": "【招商电新】特变电工25年报点...\n【招商电新】特变电工25年报点评260415\n#公司发布25年报、Q4业绩略低于预期、预计主要是年底计提减值及新能源公司亏损影响。\n公司25年收入973.2亿元，同比基本持平，毛利率18.8%，同比+0.68pct，归母/扣非净利59.5/45.5亿元，同比+43.7%/15.6%。其中Q4收入243.3亿元，同/环比-4.73%/-1.05%，毛利率20.4%，同/环比+4.6/2.64pct，归母/扣非净利4.7/7.0亿元。///Q4资产减值6.1亿元（主要是电站相关减值）、信用减值1.86亿。\n➡️1、输变电产业高景气，在手订单充足\n#电气设备收入保持高增、毛利率提升。25年电气设备收入268亿元，同比+19.7%。毛利率19.8%，同比+2.2pct，主要系市场结构调整、加强成本管控。设备出口收入预计70-80亿元，约占电气设备收入28%。\n公司输变电产品齐全，产能领先，将持续受益全球电力基建。公司变压器、电抗器产量超5亿kVA，居行业前三。在变压器、电抗器、电容器、换流阀、套管、开关、二次设备、电线电缆等领域均有布局，一批核心技术攻关取得阶段性突破/达到国际领先水平。\n#电线电缆完成2笔收购，有望发挥协同效应。25年电线电缆收入155.7亿元，同比-0.78%，毛利率8.34%，同比+0.72%。公司12月完成赛杰爱迪（江苏）高压电气、扬州曙光电缆的并购，补全GIL、核电、轨道交通用等高端电缆等产品链，预计26年收入、利润贡献将加大。\n#输变电成套工程。25年输变电成套工程收入49.2亿元，同比基本持平，毛利率15.9%，同比+0.58pct。\n海外收入方面，25年海外收入126.6亿元，约占整体收入13%。海外毛利率15.6%，同比-2.5pct。\n订单方面，25年输变电国内签约562亿元，同比+14.5%；国际市场产品签约20亿美元，同比+68%；国际成套正在执行未确认收入及待履行合同金额超50亿美元。\n➡️2、煤炭由于疆煤过剩、收入和毛利率下滑。25年煤炭产品收入169.7亿元，同比-11.9%，毛利率22.4%，同比-10pct，主要系煤炭销售均价下降，销量同比持平左右。\n➡️3、新能源产品及工程收入下滑。25年新能源产品及工程收入135.6亿元，同比-26.9%，毛利率0.59%，同比-0.83pct。主要系Q4电站转让、发电收入、逆变器产品收入等都有所下滑。\n➡️4、发电业务。25年发电业务收入71.8亿元，同比+28.2%，主要系电站装机规模增加，发电量增加。毛利率54.75%，保持稳定。\n➡️5、黄金业务。25年黄金收入24.7亿元，同比+107%，毛利率57.2%，同比+3.5pct，主 estampCount": 2, "timestamps": ["2026-04-16 14:45"]}, {"id": "evidence-271", "content": "台积电：1Q26毛利率超预期，...\n台积电：1Q26毛利率超预期，上修全年收入增速至30%以上\n台积电公司1Q26收入和毛利率双双超指引，2Q26继续给出稳健向上的收入与盈利展望，并将2026年美元收入增长指引由此前“接近30%”上修至“30%以上”；资本开支维持520-560亿美元，但明确指向区间高端，重申未来三年资本支出将显著高于过去三年。\n业绩：1Q26收入359亿美元，环比+6.4%，毛利率66.2%，高于63%-65%指引上限；2Q26收入指引39.0-40.2亿美元，毛利率指引65.5%-67.5%，中位数66.5%，环比再升。毛利率超预期主要归因于成本改善、整体产能利用率提升及汇率改善；此外，3nm产能仍偏紧、客户抢占先进产能意愿较强，我们认为部分紧急订单也可能对毛利率形成额外支撑。\nAI需求：HPC平台收入占比进一步升至61%，环比增长20%，继续成为最主要增长引擎；管理层表示AI相关需求“extremely robust”，并指出行业正从生成式AI走向agentic AI ，token消耗提升将继续推升算力需求，客户及客户的客户（主要为CSP）均持续释放强劲需求信号。因此，2026年全年美元收入增速指引上修至30%以上。当前供给仍然很紧，公司正与设备供应商、工程建设方一起尽力拉快扩产节奏，但由于新厂建设和爬坡都需要时间，紧张状态大概率仍将持续。\nCapex与扩产：2026年资本开支维持520-560亿美元，但公司明确将落在区间高端。产能布局上，台湾新增Fab 25 P1预计1H27投产，亚利桑那二厂预计2H27导入3nm量产，日本二厂计划于2028年导入3nm。\n气体：已建立多区域、多供应商的材料与气体供应体系，并备有安全库存。能源方面，公司称台湾方面已确保至少到5月的LNG供应，并在推进后续气源与备援方案，因此预计短期不会对生产运营造成实质影响。\n竞争对手：对于Intel、Samsung以及客户自建芯片/产能等竞争，公司表示不会低估Intel这样的强劲对手，但foundry行业没有捷径，当前客户分流更多还是在极度紧张供给下的现实选择，而非台积电竞争力发生变化；随着产能持续扩充，公司会努力争取“能拿回来的每一块业务”。\nCoPoS：当前主力方案仍是大尺寸CoWoS，公司也在推进CoPoS pipeline，目标是在未来几年投产。", "preview": "台积电：1Q26毛利率超预期，...\n台积电：1Q26毛利率超预期，上修全年收入增速至30%以上\n台积电公司1Q26收入和毛利率双双超指引，2Q26继续给出稳健向上的收入与盈利展望，并将2026年美元收入增长指引由此前“接近30%”上修至“30%以上”；资本开支维持520-560亿美元，但明确指向区间高端，重申未来三年资本支出将显著高于过去三年。\n业绩：1Q26收入359亿美元，环比+6.4%，毛利率66.2%，高于63%-65%指引上...", "sectors": ["半导体"], "companies": ["台积电"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-16 17:44"]}, {"id": "evidence-248", "content": "国产算力的小作文太多了。\n尤...\n国产算力的小作文太多了。\n尤其是一季报临近，博弈季度业绩的很多。真的没有必要，看产业趋势就好！\n熟悉我们团队都知道，我们从芯原股份上市以来，一路跟踪到现在。也是在去年年初最底部的时候，就开始强推的团队。\n跟踪芯原，关注产业趋势就好。昨天我们还特地强调了沐曦的大订单，芯原自然也会同步受益。", "preview": "国产算力的小作文太多了。\n尤...\n国产算力的小作文太多了。\n尤其是一季报临近，博弈季度业绩的很多。真的没有必要，看产业趋势就好！\n熟悉我们团队都知道，我们从芯原股份上市以来，一路跟踪到现在。也是在去年年初最底部的时候，就开始强推的团队。\n跟踪芯原，关注产业趋势就好。昨天我们还特地强调了沐曦的大订单，芯原自然也会同步受益。", "sectors": ["国产算力"], "companies": ["芯原股份"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, 闭口合同，租金完全锁定；\n可选：+2 年弹性续约，价格按第四、五年市场价重议；\n回收周期：行业统一按3–3.5 年覆盖服务器成本、资金成本、电费、运维、带宽。\n小卡 / 推理卡\n统一12 个月闭口，部分优质客户可谈 2–3 年；\n2025 年低谷曾有 6 个月短约，2026 年已全面消失。\n违约现实：\n2023–2024 年出现过客户因租金下跌毁约；2026 年供给紧张，违约率大幅下降，头部大厂一旦毁约，违约金以亿元计（曾有大厂支付 1 亿元违约金）。\n财务视角很残酷：前 3 年是回本生死线，活过 3 年，后面每一年都是利润爆发期。\n04｜海外 CoreWeave 878 亿、Nebulas 270 亿长单，国内为什么很少见这么大订单？\n核心结论：不是国内不想，是客户结构、信用周期、卡源约束、融资能力四重门槛挡着。\n海外订单真实数据（2026 年 4 月最新）：\nCoreWeave：与 Meta 累计超 350 亿美元（2025 年 142 亿至 2031 年 + 2026 年 210 亿至 2032 年）；+Anthropic 云服务；+Jane Street60 亿美元大单；总积压订单878 亿美元。\nNebulas：与 Meta 最高270 亿美元长单，获英伟达20 亿美元战略投资。\n国内差距原因：\n客户预算节奏：国内大厂资本开支更谨慎，分年度落地，不一次性签 8 年长单。\n供给确定性不足：高端卡一货难求，服务商不敢承诺超大规模长期交付。\n融资与信任壁垒：只有头部上市公司、国央企能拿到低成本长期资金；腰部厂商不敢扛 5 年重资产。\n合规风险：海外卡政策波动大，长单存在政策敞口。\n但国内正在追赶：头部服务商与大厂已开始3–5 年保量保价框架，只是金额不会一次性曝光。\n05｜超威事件后，国内 B200/B300 到底有多缺？2026 年还能拿到新卡吗？\n核心结论：现货被瞬间扫空，新增量卡几乎断供，行业正式进入 “有卡为王” 的强卖方市场。\n一线现状（专家亲历）：\n一线现状（专家亲历）：\n全国库存清零：超威事件后，可用大卡现货在极短时间内被抢空，未出租的算力集群也被高价锁定。\n新增渠道冰封：海外供给大幅转向地下，正规渠道几乎拿不到增量 B 卡。\n定价权彻底反转：2026 年重新回到谁有卡谁定价，租金月度上调，头部客户愿意为稳定货源支付溢价。\n专家判断：短期看不到放松迹象，高端卡短缺将贯穿 2026 全年，甚至延续到 2027 年。\n这也是国内算力租赁 2026 年业绩爆发的最核心供给逻辑。\n06｜国内外利润率为何差距巨大？海外亏损、国内净利率 10%–15%，真相是什么？\n核心结论：不是国内更赚钱，是折旧口径、运营成本、扩张节奏、客户结构完全不同。\n海外成本与利润真相：\n硬件成本极低：CoreWeave 等直接向英伟达拿货，链路最短，单价远低于国内。\n但费用高到吓人：\n电价、地价、人工成本显著高于国内；\n高速扩张期，研发、销售、数据中心建设费用拉满；\n折旧按5–6 年摊，但资本开支爆炸，报表短期显亏。\n亏损是 “扩张性亏损”：不是不赚钱，是把利润全部砸进扩产，为抢占未来份额。\n国内盈利真相：\n折旧更激进：普遍按3 年加速折旧，前 3 年成本提足，后面利润弹性极大。\n成本优势显著：电价、运维、土建成本更低，综合毛利率30%–50%，净利率10%–15%是头部常态。\n需求极旺：2026 年租金持续上行，存量老卡成本低，利润被双重放大。\n需求极旺：2026 年租金持续上行，存量老卡成本低，利润被双重放大。\n一句话：海外是赚未来的钱，国内是赚当下的钱；不是国内更暴利，是结构更友好。\n07｜2026 年租金涨疯了？H100/B200 真实月租、涨幅、上架率到底多少？\n核心结论：高端卡全线涨价，上架率超 90%，H100 月租破 5 万，B200 一卡难求。\n全球价格数据（2026 年 4 月一线口径）：\n海外：H100 租赁价5 个月涨 40%，从 1.7 美元 / 小时→2.35 美元 / 小时；Blackwell 系列2 个月涨 48%，达 4.08 美元 / 小时。\n国内：\nH100、A100 月租普遍 5 万 +，部分稀缺资源达6 万–6.6 万；\n国内：\nH100、A100 月租普遍 5 万 +，部分稀缺资源达6 万–6.6 万；\nH200 涨幅20%–30%；\nB200 几乎无现货，租金随行就市，大厂愿意溢价锁量。\n利用率：头部厂商上架率 > 90%，高端卡全量租罄，无闲置。\n涨价逻辑：Token 消耗指数级爆发 + 高端卡供给冻结，双重挤压下，租金易涨难跌。\n08｜签了 3 年闭口合同，中途芯片 / 光纤 / 电     function 取结果() {
      return 数据.evidences.filter(语料 => {
        if (状态.板块 && !语料.sectors.includes(状态.板块)) return false;
        if (状态.个股 && !语料.companies.includes(状态.个股)) return false;
        return true;
      });
    }

    function 写入结果() {
      const 结果 = 取结果();
      元素.结果数.textContent = `当前结果 ${数字.format(结果.length)} 条`;
      if (!结果.length) {
        元素.语料列表.innerHTML = '<div class="空状态">没有找到支撑语料。</div>';
        return;
      }
      元素.语料列表.innerHTML = 结果.map((语料, 序号) => `
        <article class="语料卡" id="${语料.id}">
          <div class="语料头">
            <div class="语料编号">语料 ${序号 + 1}</div>
            <div class="语料统计">板块行数 ${数字.format(语料.sectorRowCount)}　个股行数 ${数字.format(语料.companyRowCount)}</div>
          </div>
          <div class="信息行"><span class="信息标题">板块：</span>${转义(语料.sectors.join('、') || '无')}</div>
          <div class="信息行"><span class="信息标题">个股：</span>${转义(语料.companies.join('、') || '无')}</div>
          <div class="正文">${转义(语料.content)}</div>
          <div class="操作行">
            <button class="小按钮" data-展开="${语料.id}">展开 / 收起</button>
            <button class="小按钮" data-复制="${语料.id}">复制语料</button>
          </div>
        </article>
      `).join('');
    }

    function 同步控件() {
      元素.板块筛选.value = 状态.板块;
      元素.个股搜索.value = 状态.个股;
    }

    function 写入地址() {
      const 参数 = new URLSearchParams();
      if (状态.板块) 参数.set('板块', 状态.板块);
      if (状态.个股) 参数.set('个股', 状态.个股);
      history.replaceState(null, '', `${location.pathname}#${参数.toString()}`);
    }

    function 读取地址() {
      const 片段 = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      const 参数 = new URLSearchParams(片段);
      状态.板块 = 参数.get('板块') || '';
      状态.个股 = 参数.get('个股') || '';
    }

    function 重绘() {
      同步控件();
      写入排行();
      写入结果();
      写入地址();
    }

    function 设板块(名称) {
      状态.板块 = 名称 || '';
      if (状态.个股) {
        const 个股 = 数据.companies.find(项 => 项.name === 状态.个股);
        if (个股 && 状态.板块 && !个股.sectors.includes(状态.板块)) {
          状态.个股 = '';
        }
      }
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function 设个股(名称) {
      状态.个股 = 名称 || '';
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', async (事件) => {
      const 板块按钮 = 事件.target.closest('[data-板块]');
      if (板块按钮) {
        设板块(板块按钮.dataset.板块);
        return;
      }
      const 个股按钮 = 事件.target.closest('[data-个股]');
      if (个股按钮) {
        设个股(个股按钮.dataset.个股);
        return;
      }
      const 展开按钮 = 事件.target.closest('[data-展开]');
      if (展开按钮) {
        const 卡片 = document.getElementById(展开按钮.dataset.展开);
        if (卡片) {
          卡片.classList.toggle('展开');
        }
        return;
      }
      const 复制按钮 = 事件.target.closest('[data-复制]');
      if (复制按钮) {
        const 卡片 = document.getElementById(复制按钮.dataset.复制);
        const 文本 = 卡片?.querySelector('.正文')?.textContent || '';
        await navigator.clipboard.writeText(文本);
        复制按钮.textContent = '已复制';
        setTimeout(() => {
          复制按钮.textContent = '复制语料';
        }, 1200);
      }
    });

    元素.板块筛选.addEventListener('change', 事件 => {
      状态.板块 = 事件.target.value;
      重绘();
    });

    元素.跳转个股.addEventListener('click', () => {
      const 词 = 元素.个股搜索.value.trim();
      if (!词) return;
      const 精确 = 数据.companies.find(项 => 项.name === 词);
      if (精确) {
        设个股(精确.name);
        return;
      }
      const 模糊 = 数据.companies.find(项 => 项.name.includes(词));
      if (模糊) {
        元素.个股搜索.value = 模糊.name;
        设个股(模糊.name);
      }
    });

    元素.个股搜索.addEventListener('keydown', 事件 => {
      if (事件.key === 'Enter') {
        元素.跳转个股.click();
      }
    });

    读取地址();
    写入统计();
    写入筛选器();
    重绘();
  </script>
</body>
</html>
