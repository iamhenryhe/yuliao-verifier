<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语料查证器</title>
  <style>
    :root {
      --背景: #f5f5f7;
      --面板: #ffffff;
      --面板浅: #fbfbfd;
      --边框: #d2d2d7;
      --边框强: #c7c7cc;
      --文字: #1d1d1f;
      --次要: rgba(29,29,31,0.72);
      --强调: #0071e3;
      --强调浅: #e8f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--背景);
      color: var(--文字);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .页面 {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .侧栏 {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--边框);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .标题块, .侧块, .主块 {
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .标题块 {
      padding: 18px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }
    .侧块 {
      margin-top: 16px;
      padding: 14px;
    }
    .侧块标题 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }
    .排行列表 {
      display: grid;
      gap: 8px;
    }
    .排行按钮 {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
      color: var(--文字);
      text-align: left;
      cursor: pointer;
    }
    .排行按钮.选中 {
      border-color: var(--强调);
      background: var(--强调浅);
    }
    .排行主行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 620;
    }
    .排行副行 {
      margin-top: 6px;
      font-size: 12px;
      color: var(--次要);
    }
    .主体 {
      min-width: 0;
      padding: 22px;
    }
    .工具条 {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-bottom: 14px;
      background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.9) 75%, rgba(245,245,247,0) 100%);
    }
    .工具格 {
      display: grid;
      grid-template-columns: minmax(260px, .7fr) minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .字段 {
      display: grid;
      gap: 6px;
    }
    .字段标签 {
      font-size: 13px;
      color: var(--次要);
    }
    .输入框, .下拉框, .按钮 {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 14px;
      outline: none;
    }
    .输入框:focus, .下拉框:focus {
      border-color: var(--强调);
      box-shadow: 0 0 0 3px rgba(0,113,227,.16);
    }
    .按钮 {
      cursor: pointer;
      font-weight: 620;
    }
    .按钮.主按钮 {
      background: var(--强调);
      border-color: var(--强调);
      color: #ffffff;
    }
    .统计栏 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .统计卡 {
      padding: 14px;
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .统计名 {
      font-size: 12px;
      color: var(--次要);
      margin-bottom: 8px;
    }
    .统计值 {
      font-size: 28px;
      font-weight: 700;
    }
    .主块 {
      padding: 18px;
    }
    .主块标题行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .主块标题 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .结果数 {
      color: var(--次要);
      font-size: 15px;
    }
    .语料列表 {
      display: grid;
      gap: 14px;
    }
    .语料卡 {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
    }
    .语料头 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }
    .语料编号 {
      font-size: 16px;
      font-weight: 650;
    }
    .语料统计 {
      color: var(--次要);
      font-size: 13px;
    }
    .信息行 {
      margin: 8px 0 0;
      line-height: 1.7;
      font-size: 14px;
      color: var(--文字);
    }
    .信息标题 {
      color: var(--次要);
    }
    .正文 {
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.78;
      font-size: 15px;
      color: var(--文字);
      max-height: 9.2em;
      overflow: hidden;
      position: relative;
    }
    .语料卡.展开 .正文 {
      max-height: none;
    }
    .正文::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(251,251,253,0), rgba(251,251,253,1));
    }
    .语料卡.展开 .正文::after {
      display: none;
    }
    .操作行 {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .小按钮 {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 13px;
      cursor: pointer;
    }
    .空状态 {
      padding: 28px;
      text-align: center;
      border-radius: 8px;
      border: 1px dashed var(--边框强);
      color: var(--次要);
    }
    @media (max-width: 1200px) {
      .页面 {
        grid-template-columns: 1fr;
      }
      .侧栏 {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--边框);
      }
      .工具格 {
        grid-template-columns: 1fr;
      }
      .统计栏 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      .统计栏 {
        grid-template-columns: 1fr;
      }
      .主体, .侧栏 {
        padding: 16px;
      }
    }
  </style>
</head>

力扩张核心保障。\n单机柜功率迈向兆瓦级背景下，传统低压交流供电架构已完全无法适配需求。800V HVDC/SST通过中压电网- 800V DC直供架构，大幅减少中间转换环节，实现电力损耗降低40%、设备体积减少60%以上，成为单机柜功率突破兆瓦级的新路径。\n此次黄仁勋随特朗普访华，或进一步推动中美AI电力供应链的技术协同与标准统一，加速800V HVDC&SST方案在全球数据中心的落地节奏。\n2、HVDC海外商业化进入批量落地期，国产厂商出海迎来黄金窗口。\n台达电HVDC业务获百万套级三年订单指引，验证海外市场需求逐步从试点测试转向规模化放量。当前海外数据中心HVDC渗透率较低，高功率密度供电架构升级迫在眉睫。国产厂商凭借技术优势与性价比，有望在全球替代中抢占先机。\n3、SST需求随高功率机架同步爆发，产业链上下游全面受益。\n整机端：国内头部企业技术已实现突破，金盘科技SST样机已落地，具备北美认证优势；四方股份高压电力设备技术积累深厚，可衔接数据中心中高压接入与SST场景需求。\n上游器件端：高频变压器、电感、电容等核心部件需求同步增长，京泉华、可立克、伊戈尔等均针对SST开发配套中频隔离变压器等核心部件；江海股份高功率电容产品适配高功率密度场景。\n🌼 投资建议\n黄仁勋访华进一步强化AI电力主线地位，台达订单验证行业商业化进度超预期，800V HVDC&SST进入确定性放量期，重点推荐两大主线：\n1、800V HVDC核心标的：重点推荐麦格米特（NV体系）、中恒电气（绑定施耐德）、欧陆通、科士达（绑定海外大客户）、通合科技（台达链）、优优绿能、英威腾（绑定海外大客户）、科林电气（绑定ZJ）等。\n2、SST产业链核心标的：\n1）整机端：金盘科技（SST技术领先+北美认证完备）、四方股份（高压电力设备技术积累深厚）等；\n2）上游器件端：京泉华（绑定伊顿）、可立克（台达潜在供应商）、伊戈尔（台达潜在供应商）、江海股份（台达链）等。\n———————————\n欢迎交流：孙潇雅/高鑫", "preview": "❗️【天风电新】：黄仁勋访华锚定AI电力主线，800V HVDC&SST商业化加速验证-0513\n—————————\n🌼 事件\n2026年5月13日，英伟达CEO黄仁勋临时加入特朗普访华行程，随总统出访中国。 叠加此前NV闭门峰会明确将算力+能源全栈解决方案定为核心战略，800V HVDC 与固态变压器（SST）为破解AI电力瓶颈的关键路径。\n此外，近期产业反馈台达电HVDC&SST业务获海外头部客户明确订单指引，商业化进度持续超预期。...", "sectors": ["AI配电", "储能", "功率模拟", "工控设备", "电力设备", "锂电"], "companies": ["中恒电气", "京泉华", "伊戈尔", "优优绿能", "可立克", "四方股份", "欧陆通", "江海股份", "科士达", "科林电气", "英威腾", "通合科技", "金盘科技", "麦格米特"], "sources": ["wechat_group_1"], "sectorRowCount": 6, "companyRowCount": 14, "timestampCount": 20, "timestamps": ["2026-05-13 15:24"]}, {"id": "evidence-255", "content": "【国金电新】电力设备：固态变压...\n【国金电新】电力设备：固态变压器百花齐放，产业化进展超预期[庆祝]260513\n[太阳]产业链调研反馈，北美G客户近期要给台达下一个三年的Forecast，规模大概对应到1个多GW左右，SST产业化进展超预期。\nSST相关进展更新 四方 4月发布SST1.0，规划26Q3发布35KV样机；26Q4发布13.8KV样机，26年SST订单有望过亿。\n# 伊戈尔 4月发布SST整机产品，先后完成北美、欧洲市场首秀，规划26Q3开发34.5KV样机；26Q4通过UL、CE等认证；27年进行小批量试点与交付；28年上半年实现OEM/ODM规模量产。\n金盘 26Q1 SST发往北美测试，预计下半年形成正式订单，内众多客户正在沟通。\n# 可立克 已开发10kV电网用SST中高频变压器，正研发35kV电网用SST中高频变压器样机。\n京泉华 高频变压器绑定伊顿，台达新一代液冷方案已经送样，目前20多家sst厂在合作。\n安靠 5月哈工大、帝国理工、国防科技大学等科研团队正式签署固态变压器合作协议，投入3000万元研发资金，目标18个月攻关4.8MW工程样机（效率≥98.5%、功率密度≥300W/L、BOM成本≤1.5元/W）。\n西电 4月全国CPI同比上涨1.2%，较3月的1.0%继续回升；同期PPI同比上涨2.8%，较3月的0.5%显著抬升。CPI已连续处于正区间，PPI在3月转正后4月加速上升，整体价格中枢抬升。CPI-PPI剪刀差环比转负为-1.6%，价格压力向上游集中，企业利润分配偏向资源、原材料和部分中上游。4月核心CPI同比+1.2%，较3月小幅改善，终端需求修复斜率仍慢、成本传导仍处于早期。\n结构上看，4月价格回升重心在非食品和消费品，工业消费品价格上涨，服务消费维持改善。4月消费品价格同比上涨1.4%，服务价格同比上涨0.9%，服务价格维持低位修复，消费品价格偏结构性回升。油价、出行服务拉动CPI回升，食品受猪肉价格影响同比下降1.6%。当前大众品企业仍未进入被动提价，未来涨价预期下，顺价能力主要依赖品牌力、渠道力和结构升级。\nCPI回升带来需求修复与议价环境改善，重视结构性顺价周期下的大众品板块配置机遇。1）成本与价权共振的调味品与餐饮供应链：受益于餐饮需求回暖以及在成本上行阶段具备较强提价传统与顺价能力，速冻、调味品在下游需求驱动及格局改善的作用下，26Q1收入同比+7%、+5%，利润同比+41%、+18%，已验证景气修复。2）成本红利尾声，价权逐步修复的乳制品产业链：原奶周期回升预期下，中游乳企受益于价格回升、价格战放缓与产品结构升级，有望通过后续提价、减折将压力传导至终端，改善企业盈利能力。3）成本相对平稳，集中度高，具备价权弹性的啤酒。餐饮场景逐步修复，进口大麦成本处于低位，包材成本部分反转，关注啤酒企业塑造高端大单品与新兴渠道渗透带来吨价与结构升级空间。4）结构性成本红利的零食与软饮料。软饮料成本趋势分化，PET成本上涨扰动，白糖成本红利持续，重视具备供应链优势、品类势能与渠道优势的龙头。零食板块格局相对分散，成本传导及提价能力分化。", "preview": "【国泰海通食饮】通胀回升，结构...\n【国泰海通食饮】通胀回升，结构分化——CPI、PPI跟踪专题\n投资建议：结合CPI与成本、毛利与定价权传导链条，重视结构性顺价周期下的大众品板块配置主线：1）餐供、调味品具备量价回升弹性，推荐海天味业、安井食品、千禾味业、安琪酵母、宝立食品、巴比食品；2）乳制品推荐伊利股份、蒙牛乳业（港股）、新乳业、三元股份、优然牧业（港股）、现代牧业（港股） ；3）饮料成长标的推荐东鹏饮料、农夫山泉（港股），同时...", "sectors": ["可选消费", "食品饮料"], "companies": ["三元股份", "东鹏饮料", "中国食品", "伊利股份", "优然牧业", "农夫山泉", "劲仔食品", "千禾味业", "华润啤酒", "卫龙美味", "安井食品", "安琪酵母", "宝立食品", "巴比食品", "康师傅控股", "新乳业", "洽洽食品", "海天味业", "现代牧业", "珠江啤酒", "百润股份", "百龙创园", "盐津铺子", "统一企业中国", "蒙牛乳业", "西麦食品", "青岛啤酒"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 2, "companyRowCount": 27, "timestampCount": 29, "timestamps": ["2026-05-13 09:02"]}, {"id": "evidence-194", "content": "【HYDZ】AI驱动扩产高景气+科技板块回暖，两存上市节奏有望继续推进，看好自主可控板块接下来的表现\n[庆祝]基本面的三重beta：强beta+国产化+广阔需求，不是脉冲式的高增长，而是整体中枢的显著上移\n[玫瑰]受益于AI对于先进制程及先进存储芯片的旺盛需求，全球进入高资本开支的扩张周期，带动全球设备/耗材/洁净室等环节持续上行，这是板块的第一重beta；\n[玫瑰]出于供应链安全的考量，国内加大了对设备/零部件/耗材等环节的头部公司持持力度，相关公司产品验证与业务放量持续推进中，这是板块的第二重beta；\n[玫瑰]考虑到在先进制程及先进存储芯片的本土化供应份额，以两存/中芯/华虹为代表的晶圆厂持续高增长，带来了广阔的需求市场，这是板块的第三重beta。\n[庆祝]资本市场的节奏：近期的科技板块的强势反弹，为相关工作的推进提供了较好的条件\n去年四季度开始，市场对于两存上市的预期持续强化，从时间周期来看，相关工作正在稳步推进中，近期科技板块的强势反弹，为相关的资本市场动作提供了较好的契机，有望看到相关进程的继续推进。\n[太阳]看好自主可控板块接下来的表现，从选股策略上，依然是我们之前强调的三种思路：\n[玫瑰]买龙头：设备（华创、中微、拓荆、长川等）、零部件（富创、江丰等） 太阳]前言：伟大的行业，一定欢迎伟大的公司！LX的加入，非但不必担心竞争加剧，反而应当更坚信光通信的长期吸引力和高速增长！事实上，23年以来，光通信参与方，已从最初的“易中天”，扩散到全球所有AI巨头，范围横跨CSP、AI芯片公司、半导体公司、网络设备公司等等。狂热的行业需求、密集的技术迭代，不仅对旭创等绝对龙头进行了超额奖赏，更激励并哺育着全新的玩家。大家一起充分享受时代的光的红利！\n回答LX光通信的三个问题——客户、物料、生产制造\n[太阳]①客户：先做G，后续M+N。G的含金量极高，G的光模块当前时点有且仅有四个供应商：旭创+LX（中国），lumentum+coherent（北美）。G的真实性，可自行找北美验证。G是全球核心，不仅有巨额订单，更引领光互联技术。# 预计G在27年采购量将是今年的3-5倍，还将伴随大量新平台和新产品需求，既要重视旭创在其中的巨额收获，也不要低估LX的实力，# LX通过G客户敲开了天量市场。M+G后续更新。今年有订单，但重点看明后年。\n[太阳]②物料：别低估LX和marvell的深度合作，25年双方就签署协议。铜连接的时代，marvell和LX技术共赢，LX的高速线缆、连接器及相关能力，为marvell提供重要支撑，因此在光的时代，# marvell优先保供DSP。光芯片领域，日本、台湾地区都有供应。硅光芯片，G客户协调。今年LX量不大，物料够用即可，不必用当前时点问的一些数来定论明年总量，后续可跟踪连续的物料下单。LX的物料肯定比不过XC，但肯定不算差。物料的验证各凭本事，先验先买，后验后买，汇绿、剑桥两个公司就是很好的案例。\n[太阳]③生产制造：# LX在自动化、高精密加工领域具有断档领先优势。未来光通信的演进是“光电融合的半导体化”：光器件将像晶体管一样被集成到芯片级封装中，制造精度要求从传统光通信的“微米级”跃升至“纳米级”，而自动化、良率管控和热设计等能力将取代单纯速率指标，成为产业竞争的核心之一。LX凭借自动化制造与系统集成能力，在整个光通信领域构建高效率、高可靠性壁垒。后续光互联环节制造越复杂，LX 越有优势。产能方面，LX管够。\n未来展望：光模块+光无源器件+液冷+电源+CPC，“铜光电热”一体化方案降低客户集成成本，重视AI平台型公司。", "preview": "#段子\n怎么看LX切入光通...\n怎么看LX切入光通信的重大预期差\n[太阳]前言：伟大的行业，一定欢迎伟大的公司！LX的加入，非但不必担心竞争加剧，反而应当更坚信光通信的长期吸引力和高速增长！事实上，23年以来，光通信参与方，已从最初的“易中天”，扩散到全球所有AI巨头，范围横跨CSP、AI芯片公司、半导体公司、网络设备公司等等。狂热的行业需求、密集的技术迭代，不仅对旭创等绝对龙头进行了超额奖赏，更激励并哺育着全新的玩家。大家一起充分享...", "sectors": ["消费电子"], "companies": ["立讯精密"], "sources": ["知识星球_蛛网投研Agent"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-13 08:53"]}, {"id": "evidence-120", "content": "#盛视科技：积极推进到货、底部...\n🔥#我们继续看好：盛视科技是最具弹性的算力租赁标的之一！\n🔥#算力租赁核心#供应链+资金，盛视在这两方面均具备优势\n✔供应链：公司4月14日公告拟采购11亿元IT设备，#5月11日股东会表决同意拟购买不超过60亿元IT设备，公司已具备非常稀缺的算力供应链能力。在当前市场需求高增趋势下，我们看好Q2公司IT设备规模到货，且持续快速推进60亿采购规划。\n✔＃资金：公司账上13亿元+现金，并拟新增授信230亿元规划，公司具备满足超高规模算力规划的资金能力。公司主业基本盘稳固，\n🔥\n✔#GPU租金持续上涨，公司是为数不多在4月最新披露IT采购规划的厂商，新的IT设备签单将显著受益于市场价格上涨。此外，当前算租市场需求正从CSP扩散至模型及互联网客户，面对不断增长的客户数量，新的设备或具备更好的溢价和商业条款，这也意味着更高的净利率。\n✔＃公司主业全球智慧口岸领军，在全球化运营能力方面具备深厚基础，供应链潜力或被低估！\n🔥估值：\n#①公司主业智慧口岸领军受益AI+机器人+政策驱动，潜在20亿营收/4亿净利润贡献100亿市值基本盘，仍具备上涨潜力。②当前中国算租市场需求持续旺盛，假设全年300亿元算力采购贡献18亿元净利润对应360亿市值。③#合计460亿市值、潜在4倍股，当前最具弹性的算力租赁标的之 , {"id": "evidence-124", "content": "【信达消费】泡泡玛特交流核心要...\n【信达消费】泡泡玛特交流核心要点\n1、中国市场：拥有超7000万注册会员，会员规模快速增长，老会员保持高活跃、高粘性，会员跨品类、跨渠道消费意愿延续2025年增长趋势。新品售罄率维持较高水平，老品通过运营手段延长生命周期。线下优化门店消费体验，电商和直播平台重点发力拉新及老会员复购。\n2、海外市场：流量已进入更稳定健康的状态，本地消费者占比持续提升，品牌渗透速度加快。消费者对IP的认知逐步深化，不再仅关注LABUBU，出现明显区域偏好：例如Crybaby在泰国形成较强本地影响力；消费者开始关注IP生态，包括服装、周边、展览、设计师签售会等内容。旅游零售布局持续推进，核心地段开设旗舰店，加速完善海外零售体系、会员体系，沉淀潮玩文化与IP认知，推动团队成熟，实现长期发展。\n3、提升方向-全球化组织调整：对全球艺术家挖掘、IP运营与合作、商品规划、买货管理、门店运营、陈列设计、全球物流供应链等模块进行整合，强化总部对区域的支持赋能，提升全球化运营能力。开展全层级人才盘点与HC梳理，一方面加强高层人才培养与激励，另一方面调整臃肿团队、削减冗余HC，提升组织能量与灵活性。\n4、Labubu：流量有涨有跌，今年也做很新动作，一季度与三丽鸥、FIFA的联名产品表现优异，巴黎十周年展览收获大量好评，下一站将在东京举办；首个以LABUBU为核心的电影项目正在推进，目前处于剧本阶段；下半年将推出2款重点产品；计划与世界杯开展深度合作。\n5、乐园：新区域于2026年4月30日正式开业，首次引入大型游乐设备，开园后表现远超预期，流量较2025年同期实现大幅增长，消费者反馈偏正面。本次改造重点提升景观氛围，升级演出场地，新增LABUBU森林、Dimoo云之王国两个主题区域，配套与IP人设匹配的游乐设备；2026年7月底将有另一新区域开放，后续将持续优化演出等细节。\n6、盈利能力：26年PVC、布料、包装等原材料价格上涨，原材料成本较2025年同期预计上升3-5个百分点，预计影响整体毛利率下降0.5个百分点左右。国际油价上涨带动头程海运费、燃油附加费、仓储成本提升，叠加海外高毛利率区域收入占比下降、进口关税增长，预计合计影响毛利率下降1-2个百分点。净利率受毛利率变动影响，会有阶段性波动；人力、租金等固定支出费用预计小幅提升，26年将严格管控各项费用。\n7、抽盒机引入海外官网，打造沉浸式的全球线上用户体验；针对星星人开发具有本土化特色的产品；家电业务处于早期发展阶段，占整体收入比例极低，以稳定节奏打磨产品和供应链，不会加速扩张。", "preview": "【信达消费】泡泡玛特交流核心要...\n【信达消费】泡泡玛特交流核心要点\n1、中国市场：拥有超7000万注册会员，会员规模快速增长，老会员保持高活跃、高粘性，会员跨品类、跨渠道消费意愿延续2025年增长趋势。新品售罄率维持较高水平，老品通过运营手段延长生命周期。线下优化门店消费体验，电商和直播平台重点发力拉新及老会员复购。\n2、海外市场：流量已进入更稳定健康的状态，本地消费者占比持续提升，品牌渗透速度加快。消费者对IP的认知逐步深化，不再...", "sectors": ["潮玩"], "companies": ["泡泡玛特"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-13 11:26"]}, {"id": "evidence-50", "content": "【兴证医药】泽璟制药与默沙东研...\n【兴证医药】泽璟制药与默沙东研发（中国）达成肿瘤领域三特异性抗体药物临床战略合作意向\n2026年5月12日，泽璟制药宣布，与默沙东研发（中国）有限公司达成临床战略合作意向。双方将发挥各自领域核心优势，针对泽璟制药自主研发的肿瘤领域三特异性抗体药物，共同推进临床合作开发，加速推进该创新疗法的临床转化与应用，惠及更多肿瘤患者。\n根据双方达成的框架协议，双方将整合各自优势资源，围绕该三特异性抗体药物的临床开发深度协同，进一步提升临床研发效率与质量，加快项目在实体瘤领域的临床推进步伐，力争早日满足肿瘤患者尚未被满足的临床治疗需求。\n目前泽璟制药共刺激TCE ZGGS34: (CD3/CD28/MUC17）已在中国进入I期临床试验，并获得FDA IND批准。\n资料来源：泽璟制药公司公告\n注：仅为公开资料整理，不具备投资建议\n联系人：高尹伟业13761718734/郭沛骅/杨希成/黄翰漾/ 深化\n【IP审美】① 消费者关注点从LABUBU扩散至其他IP（Dimoo在新加坡、SkullPanda在菲律宾、Crybaby在泰国）；② 开始关注IP生态（展览、设计师签售等）\n【全球化】总部接管全球IP挖掘、整合全球物流（头程/尾程/仓库）、统一门店设计陈列与运营标准、拉齐开店标准——从\"放权扩张\"转向\"中央集权\"\n⭕ # IP矩阵：LABUBU长线化+多IP梯队形成，降低单一依赖\n【labubu】① 全球流量波动属正常现象，公司更关注长期商业价值（类比米老鼠、皮卡丘）；② 电影项目推进中（剧本阶段）；③ 2026年世界杯合作可能；④ 乐园新区域沉浸式体验；⑤ 下半年两款重磅新品\n【星星人/sp】①2026年Q1实现高速增长，在中国和亚洲多国成为现象级IP；②欧美sp*小马宝莉联名亮眼，25H2高增海外欢迎度高；\n⭕ # 利润率：原材料+物流+关税三重压力，管理层指引可控\n【成本】① PVC、布料、包装等价格上升，成本较2025年同期上升3-5个百分点，预计影响整体毛利率0.5个百分点左右；② 国际油价及航运市场波动，头程海运费、燃油附加费、仓储费提升；③ 部分高毛利率区域收入占比下降及进口关税增长，合计预计影响毛利率下降1-2个百分点\n【措施】通过供应链优化、采购议价、运营效率提升对冲压力\n【净利率】受毛利率变动及人力、租金等固定费用率小幅提升影响，阶段性承压，但公司会严格管控各项费用\n⭕# 我们的研究\n1️⃣ 自行测算店效\n（1）中国：收入同比+100-105%（线下+75-80%、线上+150-155%），环比Q4回落。单店店效同比+96.2%（总收入口径）、+72.0%（线下口径），环比-12.4%（总收入口径）。国内基本盘强，存量门店和线上效率双提升，不是开店堆量，环比仅为旺季后正常回调。\n（2）亚太：收入同比+25-30%，环比Q4大幅回落。单店店效同比-17.9%，环比-40.0%。较去年+345%高基数正常化，低于此前市场预期30-40%（市场预期与国内趋势相似），开店快于收入增长，店效被稀释。\n（3）美洲：收入同比+55-60%，环比Q4回落。单店店效同比-39.3%，环比-49.2%。略超此前市场预期50-55%、大幅超空头预期30-40%，渠道铺设见效，但类单店店效压力最大，需观察新店爬坡进度。\n（4）欧洲：收入同比+60-65%，环比Q4回落。单店店效同比-29.2%，环比-56.4%。表现稳健，但小基数高波动，不宜单季线性外推。\n2️⃣观点： Q1业绩会三大预期差收敛\n第一，海外放缓趋势：Q1验证北美拐点向下但没那么差，非断崖式恶化。亚太低于此前高双位数增速预期。\n第二，中国区软着陆：Q1验证好于预期。店效同比+96%（全口径）/+72%（仅线下），验证平台化运营能力有支撑，非单爆款依赖。\n第三，利润率下台阶：是否守住高位分歧最大。2025年经调整净利率35.2%历史高位，2026年乐观下滑1-2pp守住30%+，悲观四重压力叠加回到25-28%（经营杠杆反向、海外费用前置、产品组合变化、折扣&线上投流等渠道费用侵蚀）", "preview": "【华福商社】泡泡玛特：Q1业绩...\n【华福商社】泡泡玛特：Q1业绩会三大预期差收敛，但利润率分歧较大\n⭕ # 核心结论：Q1中国超预期，品牌力足够支撑加密大店，流量退坡好于预期；中国区同店转正、海外总部集权化调整、毛利率下行1-2个百分点指引、乐园远超预期、家电明确不急于放量，建议后续重点跟踪Q2海外各区域环比数据及毛利率实际走势。\n⭕ # 海外：从\"流量爆发\"到\"精细化运营\"，追求单店质量\n【增速】① 管理层承认2025年海外因LA...", "sectors": ["潮玩"], "companies": ["泡泡玛特"], "sources": ["知识星球_蛛网投研Agent"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-13 12:49"]}, {"id": "evidence-29", "content": "【华福计算机】# 平治信息 ：...\n【华福计算机】# 平治信息 ：Token工厂即将上线，算力业务模式有望多元化打开天花板！\n平治智算云平台推出Token工厂模块，用于集中管理多家AI模型供应商的接口调用。# 公司算力业务正在从锁价租赁向token调用的多元化方向发展。\ntoken工厂最大价值在于放大高端B卡的生产收益。目前主流的算力租赁模式为签订一定年限的闭口锁价合同，租赁收益确定性高，B卡单个集群年化收入约17亿元，收益往往可达 : "evidence-51", "content": "【苏博特近期股价大涨，持续推荐...\n【苏博特近期股价大涨，持续推荐：积极布局PEKK、AI4S，主业复苏】\n苏博特积极布局PEKK，准备中试，可比公司凯盛新材今年估值60倍。\n苏博特PEKK专利已处于公示阶段，即将获批，实验室端已做出成品。最初瞄准医疗领域（消化高价产品能力强），但目前医疗行业受冲击，正在讨论无人机（低空经济）、机器人等方向，终端客户大概率为零部件厂商，公司定位为原材料提供商，间接供应终端产品。选择PEKK的核心原因是其核心原材料聚醚与公司自产的聚醚化学结构接近，从工业化工制造角度，技术上无明显障碍，主要需解决规模化生产和商业化问题。\n苏博特全国重点实验室联合东南大学大数据中心、阿里云共同打造“砼真砼知”大模型\n2月1日，东南大学发布了一则看似”学术圈”的新闻：国内首个混凝土材料科学大模型“砼真砼知”正式上线。这个由重大基础设施工程材料全国重点实验室联合东南大学大数据中心、阿里云计算有限公司共同打造的大模型，不仅能实现专家级智能问答，更集成了智能数据提取、性能预测、配比设计、开裂风险评估等核心功能。而主导这个项目的，正是中国工程院院士、东南大学首席教授刘加平（苏博特的实际控制人之一）。重大基础设施工程材料全国重点实验室，是由江苏苏博特新材料股份有限公司、东南大学和江苏省建筑科学研究院有限公司联合共建，于2025年正式获批重组。\nAI4S和大语言模型、具身智能并列为AI三大关键方向。AI4S标的志特新材12月末至今大涨230%。\n苏博特AI技术作为科研辅助手段，聚焦严酷环境模拟，处于探索阶段。公司国家重点实验室将AI用于深地、深海、深空等严酷环境的模拟，补充物理实验的不足，扩展模拟参数范围（如复杂海洋环境），辅助混凝土外加剂配方研发。目前处于技术验证阶段，实验室有三到五年规划，AI作为手段而非目标，具体模型及项目因涉密未披露；国家首批配套资金预计2026年到位，公司同步配套资金。\n公司参与合肥四代核聚变项目、月球基地课题\n1）合肥四代核聚变项目：公司参与合肥四代核聚变项目，提供混凝土材料及外加剂，相关混凝土设施部分已完成，项目体量大几百万。该领域壁垒极高，因内陆核电对混凝土安全性、开裂系数要求严苛，业内国内无第二家企业能做到，公司在核电市场占70%份额，剩余30%为外资，中核、中广核等不允许第二家企业参与。2）地外建造课题：公司重点实验室有地外建造课题，最易落地的是月球项目。公司院士团队分到了月球土壤样本（仅院士级别团队可获得），用于地外建造科研项目研究，方向是利用月球本土土壤或材料进行建设（因不可能从地球运混凝土到月球）。这是前沿研究，属于国家战略层面与美国竞争的前沿领域（海洋、太空）。\n公司Q1收入、归母净利润分别同比增长2%、24%，主业开始恢复。\n盈利预测与估值：预计公司26年归母净利润分别达到1.5亿元，同比增长25%，对应估值41倍。中性假设下，26年预计实现10%左右的营收增长；若房地产表现更好则锦上添花。可比公司凯盛新材估值60倍。", "preview": "【苏博特近期股价大涨，持续推荐...\n【苏博特近期股价大涨，持续推荐：积极布局PEKK、AI4S，主业复苏】\n苏博特积极布局PEKK，准备中试，可比公司凯盛新材今年估值60倍。\n苏博特PEKK专利已处于公示阶段，即将获批，实验室端已做出成品。最初瞄准医疗领域（消化高价产品能力强），但目前医疗行业受冲击，正在讨论无人机（低空经济）、机器人等方向，终端客户大概率为零部件厂商，公司定位为原材料提供商，间接供应终端产品。选择PEKK的核心原因是...", "sectors": ["化工"], "companies": ["苏博特"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-13 08:04"]}, {"id": "evidence-145", "content": "【裕太微】坚定看好AI浪潮中具...\n【裕太微】坚定看好AI浪潮中具备稀缺性的国内细分龙头\n各位领导好，我们刚组织反路演的公司 ，四月底以来股价涨幅超过50%，欢迎各位领导交流~\n4月底公司拟 、retimer等芯片最核心 ，具备较强产业卡位优势\n整体而言， 分龙头，\n具体情况及行业观点，欢迎各位领导联系~", "preview": "【裕太微】坚定看好AI浪潮中具...\n【裕太微】坚定看好AI浪潮中具备稀缺性的国内细分龙头\n各位领导好，我们刚组织反路演的公司 ，四月底以来股价涨幅超过50%，欢迎各 -40", "content": "百龙创园阿洛酮糖获得国内生产许...\n百龙创园阿洛酮糖获得国内生产许可 20260512\n根据公司公众号，公司近日成功取得D-阿洛酮糖生产许可证，这一许可标志着公司在国内市场的阿洛酮糖销售即将全面打开。\n阿洛酮糖是新一代天然甜味剂，兼具功能与营养。阿洛酮糖是自然界中天然存在但含量极少的一种稀有单糖，口感接近于蔗糖，甜度约为蔗糖70%，热量仅为蔗糖的10%。阿洛酮糖不仅在肠道吸收后不发生代谢，耐受性高，同时可降低小肠对葡萄糖、果糖等糖类的吸收速率，在食品、保健品和医疗领域具有重要的应用价值。\n潜在市场空间巨大，多家企业参与其中。全球去年消耗蔗糖约1.8亿吨，市场规模达近万亿人民币。当前，消费者已逐步意识到蔗糖的各种危害，代糖使用量和比例逐步提升。阿洛酮糖作为新一代天然甜味剂，此前已在多个国家及地区获批，当前海外市场体量约在5万吨左右。假设未来阿洛酮糖消费量提升至100万吨，按目前18000元/吨的价格，市场则可达180亿元。考虑到蔗糖的巨大空间，我们认为阿洛酮糖市场未来可期。另一方面，这款明星产品很早也获得了国内外企业关注。在海外，包括泰莱、宜瑞安、松谷化学在内的多家食品配料巨头参与其中；在国内，多家上市及非上市公司也正规划投建相关产能或已初步具备一定生产条件，包括中粮科技、微元生物、三元生物、保龄宝、福洋生物、金禾实业等。\n行业先发优势，龙头开启国内市场。百龙创园作为国内最早研发阿洛酮糖并实现销售的公司，第一家获得海关出口编码，同时目前拥有国内同行业最大的阿洛酮糖产能，可同时生产液体与晶体产品，产品远销美国、韩国等国家，销售收入及体量领先国内同行。此次获批国内市场，公司有望乘国内市场开发的东风，进一步巩固市场领先地位，同时获得阿洛酮糖新一个增长极。\n自阿洛酮糖去年7月国内首次获批以来，我们已在市面上陆续见到少量添加阿洛酮糖产品的茶饮、乳制品等终端产品。本次获批，为行业实质性地提升了有效和优质的产能供给，因此更多添加阿洛酮糖的终端食品有望在近期面世。\n我们持续推荐百龙创园，预计26-28年收入为17.38/22.60/29.03亿元，同比+26.1%/30.0%/28.5%；归母净利润为4.80/6.29/8.30亿元，同比+30.3%/31.0%/32.0%，分别对应26-28年25X/19X/14X PE，欢迎更多交流。", "preview": "百龙创园阿洛酮糖获得国内生产许...\n百龙创园阿洛酮糖获得国内生产许可 20260512\n根据公司公众号，公司近日成功取得D-阿洛酮糖生产许可证，这一许可标志着公司在国内市场的阿洛酮糖销售即将全面打开。\n阿洛酮糖是新一代天然甜味剂，兼具功能与营养。阿洛酮糖是自然界中天然存在但含量极少的一种稀有单糖，口感接近于蔗糖，甜度约为蔗糖70%，热量仅为蔗糖的10%。阿洛酮糖不仅在肠道吸收后不发生代谢，耐受性高，同时可降低小肠对葡萄糖、果糖等糖类的...", "sectors": ["可选消费"], "companies": ["百龙创园"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-13 08:01"]}, {"id": "evidence-156", "content": "盛视科技：积极推进到货、底部要...\n盛视科技：积极推进到货、底部要重视！\n🔥#我们继续看好：盛视科技是最具弹性的算力租赁标的之一！\n🔥#算力租赁核心#供应链+资金，盛视在这两方面均具备优势\n✔供应链：公司4月14日公告拟采购11亿元IT设备，#5月11日股东会表决同意拟购买不超过60亿元IT设备，公司已具备非常稀缺的算力供应链能力。在当前市场需求高增趋势下，我们看好Q2公司IT设备规模到货，且持续快速推进60亿采购规划。\n✔＃资金：公司账上13亿元+现金，并拟新增授信230亿元规划，公司具备满足超高规模算力规划的资金能力。公司主业基本盘稳固，\n🔥\n✔#GPU租金持续上涨，公司是为数不多在4月最新披露IT采购规划的厂商，新的IT设备签单将显著受益于市场价格上涨。此外，当前算租市场需求正从CSP扩散至模型及互联网客户，面对不断增长的客户数量，新的设备或具备更好的溢价和商业条款，这也意味着更高的净利率。\n✔＃公司主业全球智慧口岸领军，在全球化运营能力方面具备深厚基础，供应链潜力或被低估！\n🔥估值：\n#①公司主业智慧口岸领军受益AI+机器人+政策驱动，潜在20亿营收/4亿净利润贡献100亿市值基本盘，仍具备上涨潜力。②当前中国算租市场需求持续旺盛，假设全年300亿 有希望贡献增量市值。", "preview": "骄成超声——两大存储客户均已获...\n骄成超声——两大存储客户均已获得突破，兼具弹性与确定性\n边际变化：关键存储客户处取得关键进展\n观点：很多次表述了，3D化的制造和封装的趋势，无损检测很重要且越来越重要，公司能力已经得到了大客户认可，扩产核心受益，且高份额可期！兼具确定性与弹性，设备板块主升背景下看好此票的超额\n空间怎么拍？\n1）业绩：今年主业业绩有望在2.5亿以上，锂电敞口在50%，公司耗材逻辑好，能给到100e；\n2）半导体先进封...", "sectors": ["半导体设备"], "companies": ["骄成超声"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-12 22:31"]}, {"id": "evidence-146", "content": "高盛 - 澜起科技(68800...\n高盛 - 澜起科技(688008.SH) - CPU推理 workload 支撑内存接口芯片增长，将目标价上调至363元人民币/510港元；买入评级 - 2026-05-13\n我们对澜起科技持积极态度，预计 2026-2028 年净利润复合年增长率为 38%，这主要得益于服务器内存模块对内存接口芯片的强劲需求，以及高速互连芯片（如 PCIe/CXL/以太网/光互连芯片）的需求，这些对于实现 AI 服务器更快的数据传输至关重要。鉴于公司第一季度业绩稳健超预期，我们对其增长可持续性的看法更为乐观，并给予了更高的估值倍数，因此将目标价上调约 40%/67% 至 363 元人民币/510 港元。维持“买入”评级。\n代理式 AI 推理增加了内存接口芯片的需求。随着代理式 AI 采用率的提高，CPU 面临着更重的推理工作负载，如任务管理、编排和内存管理。这将增加对澜起科技内存接口芯片的需求，因为这类芯片连接着内存模块和 CPU。我们预计，在通用服务器和推理服务器持续需求增长的支撑下，澜起科技的 RCD 收入在 2025-2032 年间将保持 8% 的复合年增长率；同时，受益于 MRDIMM 技术渗透率的提升，我们预计用于更高带宽服务器内存模块的 MRCD/MDB 产品在 2025-2032 年间将以 98% 的复合年增长率增长。\n持续的新产品开发。2026 年第一季度，四款新产品（MRCD/MDB、PCIe 重定时器、CKD 和 CXL MXC）的收入达到 2.69 亿元人民币，占接口芯片板块收入的 19%。据管理层透露，澜起科技的 PHY 重定时器将于 2026 年流片，PCIe 交换机也将于 2026 年流片；光互连芯片正处于研发阶段。我们预计，一旦这些储备产品推向市场，将获得强劲的需求，因为它们属于供应商稀少且需求不断增长的高端/高速互连芯片。\n盈利预测修正：我们将 2026-2032 年的净利润预期上调了 4%-10%，主要原因是收入增加和毛利率提高。2026-2032 年收入预期的上调反映了以下积极前景：(1) 现有的内存接口芯片业务，受 CPU 和 RDIMM/MRDIMM 使用量增长的驱动；(2) 储备中的新产品。毛利率的提高反映了新产品占比的提升。澜起科技通常在新产品刚推出时产生较高的毛利率，随后随着年度价格下降，毛利率会随时间推移而降低。运营费用预估保持不变。\n估值：随着我们对 2026-2032 年盈利预测的调整以及目标市盈率的更新，我们将 A 股/H 股的目标价上调约 40%/67% 至 363 元人民币/510 港元。\n对于 A 股，我们 363 元人民币的 12 个月目标价基于 45.2 倍（此前为 35 倍）的 2030 年预期折让市盈率，对应 2030-2031 年平均每股收益增长率为 33%。我们 45.2 倍的目标市盈率倍数源自同行市盈率与净利润增长的相关性，并将其滚动调整为基于 2027 年市盈率和 2027-2028 年每股收益增长（此前为 2026 年市盈率和 2026-2027 年每股收益），并根据最新市场情况进行刷新。\n对于 H 股，我们 510 港元的 12 个月目标价基于 58.3 倍的 2030 年预期市盈率（较 A 股有 29% 的估值溢价，并使用 1.09 的人民币/港元汇率）。H-A 股溢价基于该公司过去 20 个交易日的平均 H-A 股溢价。此前 8% 的 H-A 股溢价源自兆易创新、潍柴动力和比亚迪的历史平均交易溢价。鉴于现在有了更多澜起科技 H 股的交易数据，我们认为有必要使用该股票自身的历史交易数据来得出       元素.板块筛选.innerHTML = ['<option value="">全部板块</option>']
        .concat(数据.sectors.map(项 => `<option value="${转义(项.name)}">${转义(项.name)}</option>`))
        .join('');
      元素.个股列表.innerHTML = 数据.companies
        .map(项 => `<option value="${转义(项.name)}"></option>`)
        .join('');
    }

    function 写入排行() {
      元素.板块排行.innerHTML = 数据.sectors.slice(0, 14).map(项 => `
        <button class="排行按钮 ${状态.板块 === 项.name ? '选中' : ''}" data-板块="${转义(项.name)}">
          <div class="排行主行"><span>${转义(项.name)}</span><span>${数字.format(项.outputCount)} 条</span></div>
          <div class="排行副行">支撑语料 ${数字.format(项.evidenceCount)} 条</div>
        </button>
      `).join('');
      元素.个股排行.innerHTML = 数据.companies.slice(0, 14).map(项 => `
        <button class="排行按钮 ${状态.个股 === 项.name ? '选中' : ''}" data-个股="${转义(项.name)}">
          <div class="排行主行"><span>${转义(项.name)}</span><span>${数字.format(项.outputCount)} 条</span></div>
          <div class="排行副行">支撑语料 ${数字.format(项.evidenceCount)} 条</div>
        </button>
      `).join('');
    }

    function 取结果() {
      return 数据.evidences.filter(语料 => {
        if (状态.板块 && !语料.sectors.includes(状态.板块)) return false;
        if (状态.个股 && !语料.companies.includes(状态.个股)) return false;
        return true;
      });
    }

    function 写入结果() {
      const 结果 = 取结果();
      元素.结果数.textContent = `当前结果 ${数字.format(结果.length)} 条`;
      if (!结果.length) {
        元素.语料列表.innerHTML = '<div class="空状态">没有找到支撑语料。</div>';
        return;
      }
      元素.语料列表.innerHTML = 结果.map((语料, 序号) => `
        <article class="语料卡" id="${语料.id}">
          <div class="语料头">
            <div class="语料编号">语料 ${序号 + 1}</div>
            <div class="语料统计">板块行数 ${数字.format(语料.sectorRowCount)}　个股行数 ${数字.format(语料.companyRowCount)}</div>
          </div>
          <div class="信息行"><span class="信息标题">板块：</span>${转义(语料.sectors.join('、') || '无')}</div>
          <div class="信息行"><span class="信息标题">个股：</span>${转义(语料.companies.join('、') || '无')}</div>
          <div class="正文">${转义(语料.content)}</div>
          <div class="操作行">
            <button class="小按钮" data-展开="${语料.id}">展开 / 收起</button>
            <button class="小按钮" data-复制="${语料.id}">复制语料</button>
          </div>
        </article>
      `).join('');
    }

    function 同步控件() {
      元素.板块筛选.value = 状态.板块;
      元素.个股搜索.value = 状态.个股;
    }

    function 写入地址() {
      const 参数 = new URLSearchParams();
      if (状态.板块) 参数.set('板块', 状态.板块);
      if (状态.个股) 参数.set('个股', 状态.个股);
      history.replaceState(null, '', `${location.pathname}#${参数.toString()}`);
    }

    function 读取地址() {
      const 片段 = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      const 参数 = new URLSearchParams(片段);
      状态.板块 = 参数.get('板块') || '';
      状态.个股 = 参数.get('个股') || '';
    }

    function 重绘() {
      同步控件();
      写入排行();
      写入结果();
      写入地址();
    }

    function 设板块(名称) {
      状态.板块 = 名称 || '';
      if (状态.个股) {
        const 个股 = 数据.companies.find(项 => 项.name === 状态.个股);
        if (个股 && 状态.板块 && !个股.sectors.includes(状态.板块)) {
          状态.个股 = '';
        }
      }
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function 设个股(名称) {
      状态.个股 = 名称 || '';
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', async (事件) => {
      const 板块按钮 = 事件.target.closest('[data-板块]');
      if (板块按钮) {
        设板块(板块按钮.dataset.板块);
        return;
      }
      const 个股按钮 = 事件.target.closest('[data-个股]');
      if (个股按钮) {
        设个股(个股按钮.dataset.个股);
        return;
      }
      const 展开按钮 = 事件.target.closest('[data-展开]');
      if (展开按钮) {
        const 卡片 = document.getElementById(展开按钮.dataset.展开);
        if (卡片) {
          卡片.classList.toggle('展开');
        }
        return;
      }
      const 复制按钮 = 事件.target.closest('[data-复制]');
      if (复制按钮) {
        const 卡片 = document.getElementById(复制按钮.dataset.复制);
        const 文本 = 卡片?.querySelector('.正文')?.textContent || '';
        await navigator.clipboard.writeText(文本);
        复制按钮.textContent = '已复制';
        setTimeout(() => {
          复制按钮.textContent = '复制语料';
        }, 1200);
      }
    });

    元素.板块筛选.addEventListener('change', 事件 => {
      状态.板块 = 事件.target.value;
      重绘();
    });

    元素.跳转个股.addEventListener('click', () => {
      const 词 = 元素.个股搜索.value.trim();
      if (!词) return;
      const 精确 = 数据.companies.find(项 => 项.name === 词);
      if (精确) {
        设个股(精确.name);
        return;
      }
      const 模糊 = 数据.companies.find(项 => 项.name.includes(词));
      if (模糊) {
        元素.个股搜索.value = 模糊.name;
        设个股(模糊.name);
      }
    });

    元素.个股搜索.addEventListener('keydown', 事件 => {
      if (事件.key === 'Enter') {
        元素.跳转个股.click();
      }
    });

    读取地址();
    写入统计();
    写入筛选器();
    重绘();
  </script>
</body>
</html>
