<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语料查证器</title>
  <style>
    :root {
      --背景: #f5f5f7;
      --面板: #ffffff;
      --面板浅: #fbfbfd;
      --边框: #d2d2d7;
      --边框强: #c7c7cc;
      --文字: #1d1d1f;
      --次要: rgba(29,29,31,0.72);
      --强调: #0071e3;
      --强调浅: #e8f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--背景);
      color: var(--文字);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .页面 {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .侧栏 {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--边框);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .标题块, .侧块, .主块 {
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .标题块 {
      padding: 18px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }
    .侧块 {
      margin-top: 16px;
      padding: 14px;
    }
    .侧块标题 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }
    .排行列表 {
      display: grid;
      gap: 8px;
    }
    .排行按钮 {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
      color: var(--文字);
      text-align: left;
      cursor: pointer;
    }
    .排行按钮.选中 {
      border-color: var(--强调);
      background: var(--强调浅);
    }
    .排行主行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 620;
    }
    .排行副行 {
      margin-top: 6px;
      font-size: 12px;
      color: var(--次要);
    }
    .主体 {
      min-width: 0;
      padding: 22px;
    }
    .工具条 {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-bottom: 14px;
      background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.9) 75%, rgba(245,245,247,0) 100%);
    }
    .工具格 {
      display: grid;
      grid-template-columns: minmax(260px, .7fr) minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .字段 {
      display: grid;
      gap: 6px;
    }
    .字段标签 {
      font-size: 13px;
      color: var(--次要);
    }
    .输入框, .下拉框, .按钮 {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 14px;
      outline: none;
    }
    .输入框:focus, .下拉框:focus {
      border-color: var(--强调);
      box-shadow: 0 0 0 3px rgba(0,113,227,.16);
    }
    .按钮 {
      cursor: pointer;
      font-weight: 620;
    }
    .按钮.主按钮 {
      background: var(--强调);
      border-color: var(--强调);
      color: #ffffff;
    }
    .统计栏 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .统计卡 {
      padding: 14px;
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .统计名 {
      font-size: 12px;
      color: var(--次要);
      margin-bottom: 8px;
    }
    .统计值 {
      font-size: 28px;
      font-weight: 700;
    }
    .主块 {
      padding: 18px;
    }
    .主块标题行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .主块标题 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .结果数 {
      color: var(--次要);
      font-size: 15px;
    }
    .语料列表 {
      display: grid;
      gap: 14px;
    }
    .语料卡 {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
    }
    .语料头 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }
    .语料编号 {
      font-size: 16px;
      font-weight: 650;
    }
    .语料统计 {
      color: var(--次要);
      font-size: 13px;
    }
    .信息行 {
      margin: 8px 0 0;
      line-height: 1.7;
      font-size: 14px;
      color: var(--文字);
    }
    .信息标题 {
      color: var(--次要);
    }
    .正文 {
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.78;
      font-size: 15px;
      color: var(--文字);
      max-height: 9.2em;
      overflow: hidden;
      position: relative;
    }
    .语料卡.展开 .正文 {
      max-height: none;
    }
    .正文::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(251,251,253,0), rgba(251,251,253,1));
    }
    .语料卡.展开 .正文::after {
      display: none;
    }
    .操作行 {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .小按钮 {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 13px;
      cursor: pointer;
    }
    .空状态 {
      padding: 28px;
      text-align: center;
      border-radius: 8px;
      border: 1px dashed var(--边框强);
      color: var(--次要);
    }
    @media (max-width: 1200px) {
      .页面 {
        grid-template-columns: 1fr;
      }
      .侧栏 {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--边框);
      }
      .工具格 {
        grid-template-columns: 1fr;
      }
      .统计栏 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      .统计栏 {
        grid-template-columns: 1fr;
      }
      .主体, .侧栏 {
        padding: 16px;
      }
    }
  </style>
</head>

化 今天建滔再发覆铜板涨价函，按照最新订单（7 月交付）FR4的人民币价格将超过 240 元，正式超过 2021 年的高点 220 元左右。涨价时间节奏超预期，没等 6 月电子布涨价板就涨了，这说明覆铜板的逻辑有小变化，从电子布更紧带动涨价，变成了板的产能一样紧。如果后来生益接台企外溢单的传闻成真，再把fr4...", "sectors": ["PCB"], "companies": ["中国巨石", "建滔积层板"], "sources": ["知识星球_蛛网投研Agent"], "sectorRowCount": 1, "companyRowCount": 2, "timestampCount": 3, "timestamps": ["2026-05-28 09:28"]}, {"id": "evidence-346", "content": "MLCC 超大信息量调研\n1...\nMLCC 超大信息量调研\n1. 当前MLCC本轮涨价核心由高容、服务器规格带动，电源类部分规格同步涨价，原因是与服务器共用物料，原厂优先交付服务器订单，导致常规产品交期延后。年初至今高容MLCC涨价约30%，通用常规规格涨幅仅约5%，行业预计6月常规规格将迎来新一轮调价。\n2. 当前MLCC行业整体订单出货比维持在1.2左右，仅为2017年历史高点的三分之一。2017-2019年缺货周期中部分主流规格涨幅达数倍，当前整体价格涨幅、景气强度远不及历史高位。\n3. 72卡配置下GB200 AI服务器主板端MLCC用量接近18万颗，整机柜叠加电源、网卡、交换、NVLink、液冷模块后，总用量约45万颗。GB300相较GB200用量增幅约10%，整机用量接近48万颗。\n4. 下一代Rubin平台AI服务器MLCC整体用量预计提升20%，72卡配置下整机用量落在57万至58万颗区间，AI平台迭代持续拉动单机MLCC装载量上行。\n5. AI服务器MLCC用量增量主要来自算力芯片配套需求增长，以及电源侧滤波、储能功能带来的增量需求。当前AI服务器整机高容MLCC占比约35%，后续算力、电流稳定性要求提升将持续推高高容用量与占比。\n6. 2026年全球MLCC总需求预计在20000亿至25000亿颗，其中高容产品占比约三成。当前AI服务器需求占整体MLCC市场约8%，年内缺货延续下，年末AI服务器需求占比有望升至15%。\n7. GB200至GB300平台高容MLCC占比稳定在35%，Rubin平台高容占比预计至少提升至40%。目前Rubin平台部分高容物料已有提前拉货、前置下单动作，适配下半年批量生产，具体用量暂无法精准核算。\n8. 非AI领域中汽车MLCC需求稳步增长，光伏需求明显走弱。光伏降温主要源于海外地区新能源推广政策力度下滑，行业整体需求显著收缩，无法贡献增量。\n9. 新能源汽车替代燃油车、车载新功能迭代持续增加电子物料需求，当前普通新能源车MLCC单车用量约15000颗。下半年新车型迭代落地后，单车用量预计新增3000至5000颗，整体升至约20000颗。\n10. 新能源车MLCC增量核心来自车载新增电子功能，以及电池管理系统电路板。电池容量、充电电压升级带动电源电路滤波储能需求提升，驱动MLCC用量持续增长。\n11. 消费类行业MLCC增长乏力，下半年AR眼镜新品带来的MLCC需求体量有限，且以日系厂商擅长的小尺寸规格为主，无法对行业形成普惠性利好。\n12. MLCC高低容产线可相互切换，切换难度取决于介质类型。同介质切换速度较快，低容转高容调试周期需2至3个月才可实现稳定量产。\n13. 低容转高容生产的核心难点是同尺寸下堆叠更多介质层，对印刷、堆叠设备精度和良率管控要求大幅提升，工艺容错率更低、生产难度更高。\n14. 干法与湿法工艺底层制造逻辑无本质差异，高容生产核心难点集中在介质超薄化、叠层加密。低容转高容生产后，设备产出效率下降20%-30%，整体良率同步下滑。\n15. 国内外MLCC核心技术差距集中在高端瓷粉材料，高端瓷粉高度依赖日系供应，直接限制国产高容产品介质超薄化能力。印刷、叠片工艺代差已收窄至两年左右。\n16. 国内厂商在10V以下常规规格技术成熟、可对标海外，在10V 10μF以上高容、特高容核心规格领域，与村田等龙头仍存在明显技术差距。\n17. 行业多数原厂已启动低容产能转高容产能，核心驱动力是高容产品利润率远高于中低容产品。转产之前中低端MLCC产能充足、完全不缺货，2025年10月前高容市场供应也相对宽松。\n18. 产能结构性转移后，行业出现结构性紧缺，高容持续缺货的同时，原本过剩的中低容MLCC产能开始紧张，行业供需格局彻底重塑。\n19. 当前中低容MLCC价格未大幅上涨，但交期显著拉长，常规8-10周交期现已普遍延长至12周以上，原厂暂未启动中低端规格全面涨价。\n20. AI需求占MLCC整体比例不足10%却引发全产业链紧张，核心一是原厂产能向高容AI规格倾斜、压缩低容产能；二是日韩厂商主动出清代利薄、竞争激烈的中低端规格产能。\n21. 日韩厂商退出的中低端订单大量外溢，国产厂商产能无法即时承接，订单转移、供应链重构过程拉长交期，造成全品类结构性紧缺。\n22. 本轮扩产以国内厂商为主，集中布局中低端MLCC产能；日韩海外厂商无大规模新增产能，仅维持每年10%左右的常规自然增长。\n23. MLCC新增产能释放存在明显瓶颈，核心是上游设备采购周期长，新产能无法快速落地，短期难以缓解中低端缺货格局。\n24. MLCC新建产线从设备订购到量产，最短周期半年，常规落地周期为六至九个月，扩产节奏完全受制于上游设备交付进度。\n25. 中低端MLCC紧缺格局至少延续至2026年底，2027年能否缓解取决于AI订单体量与日韩产能回流情况，同时依赖国产扩产落地进度。\n26. 扩产周期偶有设备延期情况，会让整体周期额外增加三个月，多数项目可在一年内完成投产。中低容设备已有国产替代资源，但大规模深度合作尚未落地。\n27. 全球MLCC格局高度集中，村田份额近40%、三星近20%、太阳诱电15%-18%、TDK约15%，剩余份额由台系、国产厂商瓜分，头部垄断格局稳固。\n28. 村田核心市场为手机消费电子、其次是汽车、第三是AI工业服务器；太阳诱电主打服务器与工业电源；TDK重点布局汽车与电源场景，各家赛道差异明显。\n29. 所有国产MLCC厂商合计全球市占约10%，产品结构以通用通用品为主。国内高容产能、规格布局领先的厂商为风华高科、三环集团。\n30. 三环集团高容产品业务占比25%-30%，风华高科高容产品占比约20%，两家为国产高容MLCC第一梯队。\n31. 国产高容MLCC性能可适配AI服务器，但尚未进入英伟达、英特尔等海外主流供应链，仅批量应用于国内服务器厂商的风扇、交换机等辅助模块，主板核心端渗透率极低。\n32. 海外高端服务器准入门槛极高，侧重长期稳定性而非价格，国产产品稳定性仍有差距，低价优势无法突破高端供应链壁垒。\n33. 百万级单价AI服务器中，MLCC整体价值量仅一两万元，硬件成本占比偏低，属于刚需但低价值核心元器件。\n34. 高容MLCC高端市场份额比整体市场更集中，日韩垄断属性更强；消费、普通工业、汽车领域高容份额格局与整体行业格局基本一致。\n35. 三环集团曾供货华为基站，服务器业务以中低端小批量合作为主；风华高科与华为合作更深、品类更广，服务器高容合作资源更优，三环高端规格覆盖更全。\n36. 行业调价跟随龙头节奏，全部厂商参照村田策略调价。2026年6月三星、国产厂商将率先调价，6月底至7月村田跟进调价，重点优化低端产品价格、转移产能至高容。\n37. 2026年5月涨价由台系、三星主导，仅覆盖高容规格；村田本轮未参与5月调价，其最近调价在3月底，下一轮调价窗口为6月底。\n38. 本轮涨价最早启动于2026年3月渠道端，并非原厂主动发起，贸易商率先抬升现货价格，带动行业涨价预期。\n39. 中小贸易商存在针对性囤货、控规格抬价行为，主要囤积高容紧缺规格；直连原厂的代理商需求饱满、到货即交付，基本无囤货。\n40. 渠道端库存水位中等偏高，当前库存周期3-4个月，显著高于往年2个月的正常水位，渠道备货积极性明显提升。\n41. 日系厂商直销比例约四成、经销六成；国产厂商直销仅两至三成，七至八成出货依赖分销渠道，渠道话语权远高于日系品牌。\n42. 全球厂商稼动率分层明显，日系90%-95%、三星85%-90%、台系80%以上、国产约80%，均低于历史缺货周期90%以上的超高稼动水平。\n43. MLCC涨价趋势至少延续至2026年底，2027年行情取决于海外云厂商新增订单体量。行业阈值明确，全行业稼动率突破90%将触发大幅涨价。\n44. 主流高容0805 10μF 50V当前单价80-90元/千颗，远低于历史峰值150-180元，本轮高容涨价仍处于初期阶段。中低容规格单价普遍低于20元/千颗，刚脱离亏损、进入微利区间。\n45. 短期不会出现大规模扩产砸盘降价，原厂普遍控产能、稳价格、优先提升高容利润，行业存在价格协同节奏，不会无序放量冲击市场。\n46. MLCC、铝电解、钽电容存在容值互补替代关系，超大容值场景选用电解、钽电容，常规100V以下小型化场景MLCC为最优选择。\n47. AI服务器小型化、高集成化趋势利好MLCC持续增量，电解、钽电容因体积劣势应用受限，未来AI硬件增量将集中释放至MLCC品类。", "preview": "MLCC 超大信息量调 tamps": ["2026-05-28 12:57"]}, {"id": "evidence-136", "content": "【HYDZ】中芯国际&华虹半导体：国产算力提振本土先进制程估值，供需矛盾催生成熟制程利润，看到本土代工资产的价值重估机会！\n[庆祝]据Wind资讯，5月27日，联电CFO表示，今年下半年展开选择性涨价，27年将更全面与客户就价格调整进行商议。\n[太阳]成熟制程供需矛盾，催生涨价潮涌现，盈利弹性逐渐展现\n[玫瑰]需求端：AI需求的爆发持续填补并挤占其他领域产能，台积电无法承接的成熟制程订单大量外溢到其他晶圆厂，同时由于AI算力芯片的旺盛需求，台积电将部分次先进节点产能转换成CoWoS产线，加剧了转单效应的显现；\n[玫瑰]供给端：先进制程/先进存储的爆炸式需求导致了全球性的晶圆厂建设浪潮，显著占据了洁净室建设的产能，造成了短期成熟制程扩产放缓。旺盛的需求与相对刚性的供给，叠加客户对于库存的担忧，催生了供需矛盾的显现，行业涨价趋势频现：\n参考最新法说会--【UMC预计二季度ASP环比提升低个位数、SMIC二季度毛利率环比提升约1%、华虹半导体二季度毛利率环比提升1～3%、GFS宣布下半年选择性涨价、Vanguard二季度价格环比提升2～4%】。\n[太阳]先进制程需求持续高景气，中芯&华虹产业战略意义凸显\n[玫瑰]参考台积电资讯，目前GPU/CPU/通讯芯片需求已占台积电N3产能的60%，预计2027年将进一步提升至86%，客户罕见地高溢价50-100%锁定产能，凸显了先进制程高度紧张的供需关系，而SMIC和华虹相关资产作为中国大陆本土的先进制程核心资产，也展现出了同样的需求趋势，先进制程成为了配额制的核心资源；\n[玫瑰]华为“韬定律”阐述的系统级优化方法论，通过芯片架构设计、先进封装、系统集成等纬度的优化，为次先进制程玩家深度参与AI芯片市场提供了一种思路，进一步主力中国大陆本土AI产业的发展，战略意义凸显，有了价值重估的机会。\n[太阳]晶圆制造行业价值重估，中芯&华虹相对滞涨\n一个很有趣的统计：\n26年初至今各家晶圆厂涨幅，GFS+125%、UMC+179%、Vanguard+75%、TSMC+51%、华虹半导体（H股）+96%、SMIC（H股）+17%\n从PB角度来看，GFS 3.8xPB、UMC 4.1xPB、Vanguard 4.5xPB、TSMC 11.9xPB、华虹半导体 5xPB、SMIC（H） 4xPB，SMIC（A） 7.8xPB。\n[红包]复盘SMIC与华虹半导体历史上的股价阶段，可以总结为一句话-【任何跟先进制程有关的逻辑，都利好这两家晶圆厂】，当前的阶段是--【国产算力需求爆发提振先进制程战略地位+成熟制程供需矛盾提振晶圆厂盈利能力+SMIC&华虹相对全球资产滞胀】，看到中芯&华虹价值重估机会！", "preview": "【HYDZ】中芯国际&华虹半导体：国产算力提振本土先进制程估值，供需矛盾催生成熟制程利润，看到本土代工资产的价值重估机会！\n[庆祝]据Wind资讯，5月27日，联电CFO表示，今年下半年展开选择性涨价，27年将更全面与客户就价格调整进行商议。\n[太阳]成熟制程供需矛盾，催生涨价潮涌现，盈利弹性逐渐展现\n[玫瑰]需求端：AI需求的爆发持续填补并挤占其他领域产能，台积电无法承接的成熟制程订单大量外溢到其他晶圆厂，同时由于AI算力芯片的旺盛需...", "sectors": ["国产算力"], "companies": ["中芯国际", "华虹半导体"], "sources": ["wechat_group_1"], "sectorRowCount": 1, "companyRowCount": 2, "timestampCount": 3, "timestamps": ["2026-05-28 09:30"]}, {"id": "evidence-252", "content": "【兴证电子】成熟制程涨价上修E...\n【兴证电子】成熟制程涨价上修EPS，存储龙头上市打开估值空间！\n从海外来看，全球主要存储厂商（三星、海力士、美光等）合计市值大约为3.6万亿美元市值，全球海外代工厂商（台积电，三星，英特尔，联电，格芯）合计市值为2.5万亿美元市值，存储/代工市值比大约为1.46；假设国内存储龙头上市后市值5/6/7万亿元（按照今年利润合计2500e），按照同比例，国内Fab市值3.4/4.1/4.8万亿元，目前1.3万亿市值，相比目前有很大的空间。\n成熟制程涨价潮来袭，各家稼动率保持满载，代工厂景气度上行。因TSMC、Samsung两大厂加速减产八英寸晶圆，且AI带动相关电源管理芯片需求迅猛增长，各成熟制程晶圆厂已向客户释出2 部企业高管参会。\n董事长明确公司战略方向：产品系列化、制造产线化、服务系统化、欧洲本土化。\n【产品系列化】\n公司从单一塔筒、管桩供应商向系列化产品供应商转型，产品涵盖超大单桩、导管架及漂浮式风电基础，目前符合欧洲标准、满足业主要求的首个导管架已开工，目标覆盖浅海到深远海全场景风电基础产品，满足超大型机组配套需求。\n【制造产业化】\n传统塔筒、管桩已实现流水线作业，而导管架、漂浮式基础当前多为试验型产品，生产效率偏低。公司过去两年持续研发浮体的产线化、自动化、流水线作业技术，目标通过制造产业化提升生产效率、降低产品成本。\n【服务系统化】\n转型方向：从单一产品供应商向系统化服务商转型，解决业主开发项目对接多主体、签约量大带来的管理难度大、成本高的痛点，通过承担更多管理界面提效降本。\n母港服务：已在欧洲租赁3个码头，仍在拓展码头合作，首个港口服务合同已落地，2026年内实施。\n航运体系建设：规划布局11条重型甲板工程船，构建自有大型航运体系，保障交付安全准时。\n船队交付节奏：第一条船已返程即将抵达蓬莱港；第二条已下水改装；第三条预计6月下水；第四条9-10月下水。2026年底将有4条船入列，2027年将达8条，针对性解决行业高运输成本、高油耗、低运力痛点，具备差异化优势。\n安装服务布局：2025年起应客户邀请，启动欧洲海域适用的风电安装船研发，目前项目进度过半，将打通产业链最后环节，完善深远海整体解决方案。\n【欧洲本土化】\n欧洲产业布局已推进数年，多个项目正在落地，有望2026年内实现欧洲首个产业化基地落地。\n【行业挑战】深远海风电发展推动产品大型化，单桩、导管架大型化以及漂浮式风电产业化是行业核心发展方向，同时也带来配套能力不足的挑战。\n（1）运输缺大型有效运输船，安装缺大级别深远海安装船，欧洲重型安装船日租金已从二十几万欧元涨至50万欧元，抬高产业成本。\n（2）大兆瓦风机产业化遇配套瓶颈：当前已有20兆瓦风机产品，但缺适配安装船，也暂无成熟14-15米直径、3000吨级别超大型管桩生产能力。", "preview": "⭕大金重工董事长金鑫谈行业发展...\n⭕大金重工董事长金鑫谈行业发展趋势及公司战略260527\n今日大金重工在曹妃甸召开深蓝战略及唐山超级工厂战略发布会，欧洲海风主流业主悉数到场，RWE莱茵集团、苏伊士集团、沃旭能源、DEME德米集团、道达尔能源、Ocean winds、西门子能源、维斯塔斯等多家头部企业高管参会。\n董事长明确公司战略方向：产品系列化、制造产线化、服务系统化、欧洲本土化。\n【产品系列化】\n公司从单一塔筒、管桩供应商向系列...", "sectors": ["风电"], "companies": ["大金重工"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 06:51"]}, {"id": "evidence-260", "content": "【DW电子】和顺石油（奎芯）：...\n【DW电子】和顺石油（奎芯）：中标中科院计算所流片项目，流片业务取得重大突破\n📮事件：\n5月27日，奎芯中标中科院计算所高性能RISC-V处理器芯片流片项目，项目金额8千万。\n本次流片项目涉及高性能处理器，IP产品+流片渠道能力取得ICT认可。该项目预计为先进制程，且对比公司26年4亿在手订单，项目占今年订单规模\n📮意义何在：\n1、若后续流片进展顺利，将标志着公司业务从IP加速转向 #流片与量产，前期的IP铺垫逐渐落地为营收的快速增长，公司经营规模再加速。\n2、中科院计算技术研究所（ICT）与寒武纪、海光、龙芯中科等厂商技术/股权/人才交流关系紧密，ICT项目中标加速公司拥抱ICT系客户，丰富潜在客户群，极大提升后续业务天花板。\n📮UCIe深度藕合华为韬定律底层逻辑。\n韬定律强调芯片设计从\"单点工艺追赶\"转向\"系统工程创新\"。其核心路径之一是小芯片化与异构集成——#正是UCIe标准所着力解决的互连难题。UCIe将来自不同工艺节点的CPU、I/O、内存控制器等多样功能单元通过标准化接口高效集成，实现韬定律中多层级协同优化的物理基础。和顺石油（奎芯）作为国内UCIe稀缺标的核心受益❗️", "preview": "【DW电子】和顺石油（奎芯）：...\n【DW电子】和顺石油（奎芯）：中标中科院计算所流片项目，流片业务取得重大突破\n📮事件：\n5月27日，奎芯中标中科院计算所高性能RISC-V处理器芯片流片项目，项目金额8千万。\n本次流片项目涉及高性能处理器，IP产品+ 整趋势，从零散节目合作转向深层次合作框架，且除了快消外，新能源、网服广告主亦贡献增量。我们认为，公司综艺能力居行业前列，良好的节目口碑和声量有望为播出期广告追加与后续系列综艺的招商奠定基础，带来广告收入弹性。\n3️⃣剧集：重视头部和垂类剧集投入，会员业务具备边际改善空间。会上，公司发布超89部剧集，覆盖古装、都市、悬疑和青春题材，其中2026年重点储备剧集包括《 》《 》《 》《 》等。我们认为，芒果TV核心受众是年轻女性，2026年公司或针对其受众有更精准的剧集投入，如头部大剧和垂类精品，会员业务有望边际改善，建议关注剧集播出表现、成本投入趋势。\n☀盈利预测与估值\n维持26/27年净利润预测13.7/19亿元不变。现价对应23.8/17.0倍26/27年P/E。维持跑赢行业评级和24元目标价，对应32.9/23.5倍26/27年P/E，较现价有38%的上行空间。\n风险\n会员/广告/新业务增长不及预期，内容成本过高，监管收紧。", "preview": "【中金传媒】芒果超媒｜公司动态...\n【中金传媒】芒果超媒｜公司动态：创新为基输出优质内容，广告和会员有发展空间\n2026年5月28日，以“乘风向上，声耀巅峰”为主题的2026芒果春夏生长大会在长沙举办。会上，公司发布了湖南卫视、芒果TV 2026年重点剧集和综艺项目资源。\n☀评论\n1️⃣核心能力是以创新为基的优质内容持续输出。公司在招商会上主要强调，其具备头部综艺节目的持续输出能力、重视用户互动的综艺创新能力以及内容与品牌深度合作范式...", "sectors": ["传媒"], "companies": ["芒果超媒"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 21:57"]}, {"id": "evidence-76", "content": "【信达消费】滔搏FY26业绩点...\n【信达消费】滔搏FY26业绩点评：经营保持韧性，延续高分红\n公司FY26财年实现收入257.40亿元，同比-4.71%；实现归母净利润12.67亿元，同比-1.49%，降幅较FY25大幅收窄。其中FY26H2收入同比-3.70%，归母净利润同比+15.89%。FY26全年派息率137.1%，延续高分红回报股东。\n分渠道与品牌：零售线上对冲线下压力，主力品牌降幅收窄。分渠道看，FY26零售、批发渠道收入分别同比-2.70%和-16.60%，零售线上增长部分抵消了线下客流压力。分品牌看，主力品牌（耐克、阿迪达斯）和其他品牌收入分别同比-4.20%和-7.40%。截至FY26末，公司直营门店4,360家，全年净关店660家，关店幅度较FY25收窄；总销售面积同比-9.70%，单店销售面积同比+3.90%，\"一品一策\"聚焦店效的思路延续。\n盈利能力：毛利率降幅收窄，费用管控对冲经营杠杆压力。FY26毛利率同比-0.43pct至38.01%，降幅较FY25大幅收窄，主要因线上促销氛围仍浓、线上占比提升拉高整体折扣，但精细化全域货品管理部分对冲了负面影响。费用管控成效显著，销售+管理费用率同比-0.7pct至32.40%。归母净利率同比改善0.16pct至4.92%，经营负杠杆压力有效舒缓。\n经营质量：库存优化现金流稳健，财务韧性充足。期末存货54.86亿元，同比-8.6%，存货周转天数130天，同比优化3天。经营活动现金流净额27.28亿元，期末净现金11.7亿元，财务保持稳健。\n新品牌与战略：深耕跑步户外赛道，新品牌矩阵稳步推进。公司持续加码跑步、户外等高景气赛道，作为Norrøna、norda、Soar、Ciele等品牌中国独家运营伙伴推进全链路落地，并于上海开设首家跑步生活方式集合店ektos，逐步渗透专业跑者圈层。\n盈利预测：我们预计公司FY2027-2028财年归母净利润为13.97/15.28亿港元，对应PE分别为10.17X、9.36X。。", "preview": "【信达消费】滔搏FY26业绩点...\n【信达消费】滔搏FY26业绩点评：经营保持韧性，延续高分红\n公司FY26财年实现收入257.40亿元，同比-4.71%；实现归母净利润12.67亿元，同比-1.49%，降幅较FY25大幅收窄。其中FY26H2收入同比-3.70%，归母净利润同比+15.89%。FY26全年派息率137.1%，延续高分红回报股东。\n分渠道与品牌：零售线上对冲线下压力，主力品牌降幅收窄。分渠道看，FY26零售、批发渠道收...", "sectors": ["纺织服饰"], "companies": ["滔搏"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 08:47"]}, {"id": "evidence-362", "content": "【儒竞科技】观点更新：业绩向上...\n【儒竞科技】观点更新：业绩向上趋势明确，新业务尤其机器人进展超预期，盈利空间大兑现度高\n公司新业务经过过去两年持续研发投入，26年迎来开花结果兑现，机器人驱动器及数据中心业务均具备高成长性，且公司已卡位头部主机厂客户，有望迎来业绩爆发下戴维斯双击机会。\n1、业绩:公司26年Q1业绩筑底清晰，Q2开始迎来逐月经营改善，热泵需求高增，数据中心热管理（变频驱动器）延续高增，数据中心柜外直流电源新品5月开始大客户出货，机器人关节电机驱动器海外客户进度及国内客户放量超预期。公司25年营收不足13亿，考虑下游客户项目需求，26年底产值规划已达40亿元，其中国内30亿，海外（一期）10亿，27-28年增长曲线陡峭。\n2、机器人业务:关节电机驱动器海外大客户进展显著低估，且竞争格局好。公司泰国工厂一期产能已紧锣密鼓准备，大客户要求10月左右进行规模量产配套，单机价值量或近万元人民币；考虑竞争对手仅为德国某Tier1（暂无国内供应商），公司经过近三年的研发送样迭代，获取海外客户订单确定性较高。此外，公司驱动器还独家或主力供应国内多家头部机器人主机厂（ZY等），客户需求量超预期，26年配套销售金额有望达3~5亿人民币。\n3、数据中心柜外电源（AIDC）:公司已拿到国内头部CSP大厂首批订单（小几千万元级），5月开始交货，配套价值量约10亿元/GW，考虑到大客户数GW扩产规划，27-28年有望成为除机器人外新增长曲线。\n4、暖通业务:1）数据中心冷水机组变频控制驱动器等热管理产品25年已实现大几千万（接近1亿）营收，26年有望超过1.5亿元 2）热泵业务作为高毛利基盘，25年营收约1.5-1.6亿元（行业触底），26年开始首年复苏，Q1营收增速近50%，27-28年持续改善趋势明确，并有望突破22年5亿元营收高点。\n5、海外市场:公司泰国工厂一期规划产值5-10亿元，配套汽零、数据中心及机器人等海外业务，目前产能建设进度加速（产能瓶颈大），机器人驱动器海外大客户量产节点清晰，数据中心业务与暖通主业客户（开立、特灵等）重叠度高，具备业务放量高兑现度，27年有望新一轮规模扩产。\n投资建议:公司变频驱控主业具备轻资产、高技术附加值属性，Q1末净现金约21亿元，25年报高送转。暖通主业受益热泵及数据中心热管理放量具备增长空间，汽零海外有增量；机器人关节电机驱动器目前预期差较大，单机价值量接近万元，海外大客户100万台量产目标下，公司若占据5成份额、净利率12-15%，对应利润空间可达6亿元；数据中心热管理及电源业务考虑数GW出货目标贡献数亿利润。综合来看，公司当前市值74亿，传统暖通及汽零主业70亿市值底部清晰，机器人及数据中心新业务具备翻倍以上空间。\n欢迎交流最新调研及模型~", "preview": "【儒竞科技】观点更新：业绩向上...\n【儒竞科技】观点更新：业绩向上趋势明确，新业务尤其机器人进展超预期，盈利空间大兑现度高\n公司新业务经过过去两年持续研发投入，26年迎来开花结果兑现，机器人驱动器及数据中心业务均具备高成长性，且公司已卡位头部主机厂客户，有望迎来业绩爆发下戴维斯双击机会。\n1、业绩:公司26年Q1业绩筑底清晰，Q2开始迎来逐月经营改善，热泵需求高增，数据中心热管理（变频驱动器）延续高增，数据中心柜外直流电源新品5月开始...", "sectors": ["工控设备"], "companies": ["儒竞科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 21:57"]}, {"id": "evidence-63", "content": "【兴业计算机】中控技术：深度调...\n【兴业计算机】中控技术：深度调整就是最好的窗口！[拳头]继续坚定强烈推荐20260527\n经与公司沟通基本面向好，跟随市场情绪波动，不惧调整，深度调整即是最好的布局窗口！\n[玫瑰]欢迎沟通～", "preview": "【兴业计算机】中控技术：深度调...\n【兴业计算机】中控技术：深度调整就是最好的窗口！[拳头]继续坚定强烈推荐20260527\n经与公司沟通基本面向好，跟随市场情绪波动，不惧调整，深度调整即是最好的布局窗口！\n[玫瑰]欢迎沟通～", "sectors": ["AI应用"], "companies": ["中控技术"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 06:56"]}, {"id": "evidence-117", "content": "【兴证医药】海思科HSK316...\n【兴证医药】海思科HSK31679「MASH伴F2/F3纤维化」亚洲IIb期数据亮相EASL 2026：双主要终点均优效达成\n公司口服THR-β激动剂HSK31679在EASL Congress 2026以壁报形式披露针对亚洲「MASH伴F2/F3纤维化」患者的IIb期研究数据。研究为多中心、随机双盲、安慰剂对照设计，在中国46个临床中心开展，共纳入186例经肝活检确认的MASH患者（NAS≥4分，F2≤CRN纤维化<F4），以1:1:1随机分配至HSK31679 80mg组、160mg组及安慰剂组，治疗52周。\n疗效方面，主要终点一（MASH改善同时纤维化无恶化）：80mg组 vs. 安慰剂组：37.3% vs. 10.0%（OR 4.87，p=0.0023）；160mg组 vs. 安慰剂组：30.0% vs. 10.0%（OR 5.24，p=0.0032），两剂量组均优效达成。主要终点二（MASH改善同时纤维化改善≥1分）：80mg组 vs. 安慰剂组：22.0% vs. 5.0%（OR 4.82，p=0.0206），160mg组 vs. 安慰剂组：18.3% vs. 5.0%（OR 4.94，p=0.0235），两剂量组同样优效达成。\n作为参照，同靶点药物Resmetirom在II期研究（Lancet 2019，N=125，F1-3，36周）中，可比终点（NASH消退且NAS降低≥2分，且纤维化无恶化）达成率为80mg组24.7% vs. 安慰剂组6.5%（p=0.024）（注意：可比终点上，Resmetirom要求NASH\"完全消退\"且NAS降低≥2分且纤维化无恶化；HSK31679为MASH\"改善\"且纤维化无恶化）。\n安全性方面，药物相关G3+ TEAE发生率：安慰剂组0%、80mg组0%、160mg组2%（1例）；无因不良事件导致的停药；无药物相关严重不良事件或死亡；胃肠道不良事件发生率略高于安慰剂组，均为轻至中度。\nHSK31679已于26Q1被CDE纳入突破性疗法，公司计划根据策略启动III期。\n资料来源：公司公众号\n注：仅为公开资料整理，不具备投资建议\n联系人：柳一林18322237137/杨希成/黄翰漾/孙媛媛", "preview": "【兴证医药】海思科HSK316...\n【兴证医药】海思科HSK31679「MASH伴F2/F3纤维化」亚洲IIb期数据亮相EASL 2026：双主要终点均优效达成\n公司口服THR-β激动剂HSK31679在EASL Congress 2026以壁报形式披露针对亚洲「MASH伴F2/F3纤维化」患者的IIb期研究数据。研究为多中心、随机双盲、安慰剂对照设计，在中国46个临床中心开展，共纳入186例经肝活检确认的MASH患者（NAS≥4分，...", "sectors": ["医药"], "companies": ["海思科"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 09:22"]}, {"id": "evidence-120", "content": "【兴证医药】爱尔眼科港股交表及...\n【兴证医药】爱尔眼科港股交表及招股书资料整理\n公司已于2026年5月27日向香港联交所递交了发行H股并上市的申请。募集资金拟用于：1）国内医疗机构建设和升级，包括未来5年设立170-230家新爱尔眼科门诊部，对现有医院升级扩建，采购先进设备；2）收购国内外眼科医疗机构，包括欧洲北美地区的平台连锁，东南亚及南美地区的具备基础规模的中小型机构，收购国内授权品牌医院；3）眼科人工智能及技术生态系统开发；4）营运资金及其他一般企业用途。\n公司拟于往绩记录期间结束后收购一家于巴西提供眼科医疗服务的公司的控股权益，截止目前公司仅就该事项签署了不具备法律约束力的谅解备忘录。\n公司本次发行并上市尚需取得中国证监会、香港 格下降，但咖啡因的收入已经恢复稳定增长。我们看好个别品种后续价格或逐步修复。\n[玫瑰]已BD品种海外推进有序，看好公司授权费用成为可持续收入。1Q26公司确认授权费收入1.46亿元，我们认为公司年内仍有可观授权费用待确认：1）AZ 超长效GLP-1平台交易首付款后续到账（12亿美金），及潜在里程碑解锁；2）25年及往前落地BD预付款收入仍待确认（截至25年底，公司预付款应收约15亿元）。此外，公司此前已落地BD品种的海外进展顺利，涵盖Lpa小分子（海外一期已完成）、GLP-1小分子（海外一期进行中），以及年内超长效双偏向GLP-1/GIP及Amylin或有望进入海外临床（进入海外临床即可解锁部分研发里程碑）。综上，我们看好公司授权费用成为26-28年可持续的收入支持。\n[玫瑰]研发管线：年内数据读出计划丰富，多重磅管线具出海潜力。公司2H26或有更多数据读出，涵盖PD-1/IL-15国内I期及EGFR ADC国内2L mtNSCLC III期等。此外，公司潜在多个品种具备出海潜力：1）小核酸平台-肝靶向品种PCKS9已在III期，Lp(a)、AGT、C5、ANGTPL3均在I期，非肝靶向ALK7有望较快进入临床；2）Ex vivo BCMA CAR-T及In vivo CD19 CAR-T均处临床I期；3）PD-L1/IL15中美均I期中，其中肺鳞癌、肝癌及消化道瘤种望重点布局；4）EGFR ADC 国内+奥希 1L EGFR mtNSCLC已进入III期，+PD-1 1L EGFR wtNSCLC II期中；海外突变3L及野生型2L NSCLC注册型临床筹备中。\n联系人：代雯/沈卢庆/孙茗馨", "preview": "【华泰医药代雯团队】石药集团1...\n【华泰医药代雯团队】石药集团1Q26业绩点评：内生利润环比改善，看好创新管线有序推进+已落地BD授权款确认\n[太阳]石药今日公告1Q26实现收入64.65亿元（-7.8%yoy），收入同比下滑主因抗生素等价格下行影响+授权费确认较少（若剔除授权费确认影响则收入+0.4% yoy）；1Q26实现归母净利润8.6亿元（-41.8%yoy；内生利润为7.4亿元，-7.3% yoy，环比改善明显），内生利润...", "sectors": ["医药生物"], "companies": ["石药集团"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 06:54"]}, {"id": "evidence-64", "content": "【四方股份】四方和维谛的联合开...\n【四方股份】四方和维谛的联合开发协议已编制完成，正在走盖章签字流程。合作条款是“双向排他”，独家合作，非常牛逼，四方是维谛sst独供。", "preview": "【四方股份】四方和维谛的联合开...\n【四方股份】四方和维谛的联合开发协议已编制完成，正在走盖章签字流程。合作条款是“双向排他”，独家合作，非常牛逼，四方是维谛sst独供。", "sectors": ["AI配电"], "companies": ["四方股份"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 06:56"]}, {"id": "evidence-207", "content": "【国投机械】康平科技：绑定罗博...\n【国投机械】康平科技：绑定罗博特科，光模块+半导体开辟第二增长曲线\n#绑定罗博特科、切入光模块设备产业链。公司控股子公司凌臣科技主营运控系统，二季度切入光模块产业链，给罗博特科、剑桥等供应光耦合设备运控模块，已获得几千万规模订单，全年光模块设备目标1亿+。此外，公司涉及半导体、锂电等景气赛道#半导体设备预期1-2亿规模。\n#主业电动工具、拓展整机市场业绩稳健。公司主业是电动工具电机，主要客户是TTI、百得，越南基地产能释放+拓展整机代工，业绩保持稳健增长，今年有望恢复10e+营收。\n#市值目标80e+、翻倍空间。凌臣科技Q1营收3亿规模，运控领域地位高，对标固高科技，涉足光模块+半导体设备市场，公司有完全控股预期，凌臣科技看100e+市值，可以支撑50e+市值；公司主业26年预期1个亿左右利润，支撑市值30e。\n欢迎交易 朱宇航/孙然_", "preview": "【国投机械】康平科技：绑定罗博...\n【国投机械】康平科技： dence-121", "content": "【怡亚通】与区属国资平台、算力...\n【怡亚通】与区属国资平台、算力设施服务商签署合作协议，存储产业+AI算力战略加速落地\n事件：5月27日，公司分别与深圳市龙岗区数据有限公司、润建股份签署合作协议，拟协力建设AI算力中心。两项合作均聚焦算力基础设施建设、智算运营及AI产业生态布局，标志着公司在存储芯片+AI算力战略方向上继续深化落子。\n#详情：与区属国资、算力基础设施服务商分别展开合作，构建算力中心。\n1）与龙岗数据公司合作：依托怡亚通现有龙岗供应链园区推进算力中心基础设施升级。怡亚通负责对园区实施高标准算力机房改造及配套保障，并结合自身存储芯片+AI算力产业布局持续导入产业侧需求；龙岗数据公司作为区属国资平台，发挥数字基础设施建设、资源统筹及区域协同优势，推动项目向绿色化、低碳化、高密度智算方向升级。\n2）与润建股份合作：将围绕算力运营及AI产业生态展开深度协同，共同推动在怡亚通龙岗整合供应链基地建设算力中心，部署高性能服务器，立足大湾区，面向全国及海外，推动AI智能体、算力与产业链一体化产业平台落地，实现算力资源高效调度与产业化应用，加快构建面向未来的智算产业生态。\n#影响：本次签约是怡亚通从传统供应链服务向存储产业+AI算力延伸的重要节点。公司具有龙岗供应链基地提供现成空间与产业承载基础，叠加龙岗区属国资平台的资源统筹能力，以及润建股份在通信网络、算力运维和数字化服务方面的产业经验，有望降低公司切入智算中心建设及运营门槛。若项目后续顺利推进，公司有望在大湾区AI算力供给、产业客户导入及智能体应用落地中获得新的业务增长抓手。", "preview": "【怡亚通】与区属国资平台、算力...\n【怡亚通】与区属国资平台、算力设施服务商签署合作协议，存储产业+AI算力战略加速落地\n事件：5月27日，公司分别与深圳市龙岗区数据有限公司、润建股份签署合作协议，拟协力建设AI算力中心。两项合作均聚焦算力基础设施建设、智算运营及AI产业生态布局，标志着公司在存储芯片+AI算力战略方向上继续深化落子。\n#详情：与区属国资、算力基础设施服务商分别展开合作，构建算力中心。\n1）与龙岗数据公司合作：依托怡亚...", "sectors": ["信创"], "companies": ["怡亚通"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 09:23"]}, {"id": "evidence-308", "content": "【恒铭达】参股远山新材，布局GaN产业链，打开AI服务器领域1500亿市场空间🚀\n🔥事件：26日晚，公司公告称基于公司战略规划，拟向#远山新材料 投资4900万元，取得其8.93%股权。远山具备#氮化镓（GaN）外延材料与芯片自主生产能力，主营蓝宝石基中高压氮化镓（GaN）外延材料、功率器件及功率模块的研发、生产与销售，其核心技术源自日本，重点布局1200V-3000V高压氮化镓（GaN）极化超级结（PSJ）功率器件，产品可以应用于#AI算力服务器电源、新能源车、光伏储能、机器人等工业级场景。本次对外投资符合公司整体战略发展规划，#有助于进一步拓展产业布局、深化全面合作。\n🔥2030年全球AIDC催生超1500亿元GaN器件市场空间❗\nGPU机柜功率密度急剧攀升，27年Rubin Ultra机柜将突破1MW，未来800VDC将成为AIDC主要架构。800VDC架构中，电压沿“800VDC→54VDC→12VDC→0.8VDC”三级阶梯剧烈下降，GaN、SiC功率器件用量将显著提升，一级降压环节GaN器件较Si器件导通电阻降低50%，较SiC关断损耗降低30%、驱动损耗降低90%、辅助电源面积降低50%，优势显著。#以NVL576机柜为例，单板GaN器件用量1244颗、整柜约10万颗（18万美元价值量），1 GW（千台兆瓦级机柜集群，例如NLV576）AIDC中GaN器件采购额将高达1.8亿美元（超12亿元）。目前全球在建AIDC约30-40GW，麦肯锡预测2030年全球AIDC的IT负载将超过150GW，其中新增125GW。照此估算，#至2030年全球AIDC中GaN器件新增市场空间约1500亿元。\n💥恒铭达及其子公司华阳通深耕精密制造领域多年，已拓展消费电子（北美A客户）、通信及算力（国内H客户）、新能源等多领域，提供消费电子模切件、算力服务器精密结构件、液冷散热零组件等产品。我们认为，#此次公司参股GaN芯片标志着AI服务器电源业务拓展的开始，未来依托 , "content": "万通发展小白答疑贴（二）行业技术层面\nQ1：PCIe Switch随CPU通胀逻辑？\n#AI服务器内部互联分两层：1）CPUxGPU；2）GPUxGPU，之前市场关注点集中在GPU与GPU互联，可选方案包括NV Switch、PCIe、UA link、以太网等Switch；忽视CPU与GPU互联主打PCIe协议\n#2026年CPU与GPU配比有望从1：4逐步向1：1转变，带动PCIe Switch通胀，且CPU需要挂载存储、网卡、声卡等大量外设，#这类外设均采用标准PCIe接口，逻辑强化。\nQ2：PCIe Switch的配比及量价空间？\n#主流8卡AI服务器配置标准为2个CPU：4个PCIe Switch：8个GPU，即CPU与PCIe Switch为1：2配套，博通给大客户直销价格为1000美金，分销商市场涨价到1500-2000美元，数渡价格6-700美金。\n产业链调研2026年国内需求高达300-400万颗，对应市场规模150亿元（光浪潮采购7-80万颗，50亿采购额），2-3年后市场规模有望扩充到500亿市场（数渡未来有希望拿3-50%份额即可展望3千亿市值）。\nQ3：万通发展（数渡科技）同澜起科技/盛科通信的产品异同？\n#结论：完全不重叠。\n盛科通信-机柜外，scale-out环节；澜起科技、数渡科技-机柜内，scale-up环节。\n1）盛科通信：Scale-out环节的交换机芯片，对应服务器之间、节点之间的外部连接；\n2）澜起科技：Scale-up环节的产品，目前PCIe Retimer已经出货；研发下一代PCIe Switch 6.0，国内PCIe 6.0预计2028年上量，无法享受26-27年pcie5.0放量市场；\n3）数渡科技：Scale-up环节的产品，PCIe 5.0 Switch产品已经出货并产生收入，与博通技术相当不存在代际之差；\nQ4：数渡科技PCIe Switch产品力如何？\n#现有量产产品为104通道PCIe 5.0 Switch，可直接适配NVIDIA 5090推理卡，且已与国内绝大部分GPU厂商完成适配认证，包括华为、天数智芯、沐曦等厂商产品；下一颗26年预计量产的144通道可适配GB200/GB300。\n由于产品稀缺性，国内主流客户几乎全部导入，公司PCIe 5.0 Switch跟博通不仅pin-to-pin兼容，还可实现bom-to-bom替代，无需修改电路板结构，直接替换博通芯片即可使用。", "preview": "万通发展小白答疑贴（二）行业技术层面\nQ1：PCIe Switch随CPU通胀逻辑？\n#AI服务器内部互联分两层：1）CPUxGPU；2）GPUxGPU，之前市场关注点集中在GPU与GPU互联，可选方案包括NV Switch、PCIe、UA link、以太网等Switch；忽视CPU与GPU互联主打PCIe协议\n#2026年CPU与GPU配比有望从1：4逐步向1：1转变，带动PCIe Switch通胀，且CPU需要挂载存储、网卡、声卡等...", "sectors": ["国产算力"], "companies": ["万通发展"], "sources": ["wechat_group_1"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 09:45"]}, {"id": "evidence-229", "content": "中仑新材 BOPA 膜：电容...\n中仑新材 BOPA 膜：电容领域的 “隐形脊梁”，下一个海星股份\n薄膜电容器作为电能稳压器，承担着滤波、储能、稳压的核心作用，BOPA 膜是其核心绝缘基膜，性能直接决定电容的寿命、稳定性与耐压极限。BOPA 膜具备优异的介电强度与绝缘阻抗，能承受电容工作时的瞬时高压冲击，杜绝漏电、击穿风险。\n中仑新材 BOPA 膜可实现微米级超薄制备，厚度均匀性控制在 ±0.1μm，配合低介质损耗特性，能减少电能传输损耗，提升电容能量转换效率。BOPA 膜耐高温、热收缩率低，在 120℃极端环境下仍能保持性能稳定，确保电容在高频场景下长期可靠运行，寿命远超普通膜材。\nBOPA膜研发与产业化难度极高，全球仅少数企业具备量产能力，中仑新材凭借深厚积淀，稳居全球第一梯队。高端 BOPA 膜的核心是专用尼龙树脂配方，需在分子链结构、添加剂配比上实现精准调控，兼顾绝缘、耐温、低损耗、高韧性等多重矛盾性能。树脂杂质需控制在 ppm 级，避免影响介电性能，普通企业难以达到提纯标准。需历经数百次实验调试，平衡结晶度、取向度与热稳定性，中仑新材深耕行业二十余年，积累超 200 项核心专利，配方体系全球领先。高端 BOPA 膜生产线单条投资超 5 亿元，核心设备依赖德国布鲁克纳等国际巨头，设备采购、安装、调试周期超 18 个月，资金门槛极高。\n产能稀缺 + 认证壁垒：高端电容用 BOPA 膜产能全球稀缺，且需通过下游电容巨头（如法拉电子、江海股份）严苛认证，认证周期超 2 年，新进入者难以快速切入供应链。作为全球 BOPA 膜绝对龙头，中仑新材全球市占率超 20%，连续八年位居全球第一，是高端电容膜国产化的核心推动者。高端电容膜需求持续爆发，公司产能稳步扩张，有望充分受益于国产化替代与行业增长双重红利。", "preview": "中仑新材 BOPA 膜：电容...\n中仑新材 BOPA 膜：电容领域的 “隐形脊梁”，下一个海星股份\n薄膜电容器作为电能稳压器，承担着滤波、储能、稳压的核心作用，BOPA 膜是其核心绝缘基膜，性能直接决定电容的寿命、稳定性与耐压极限。BOPA 膜具备优异的介电强度与绝缘阻抗，能承受电容工作时的瞬时高压冲击，杜绝漏电、击穿风险。\n中仑新材 BOPA 膜可实现微米级超薄制备，厚度均匀性控制在 ±0.1μm，配合低介质损耗特性，能减少电能传输...", "sectors": ["化工"], "companies": ["中仑新材"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 12:02"]}, {"id": "evidence-329", "content": "中仑新材交流反馈：关注SST带...\n中仑新材交流反馈：关注SST带来的电容膜增量\n公司BOPP新能源膜材作为薄膜电容器的关键基膜材料，其成本占比约40%-50%。通过耐高温、耐高压、低介电损耗与强自愈性的性能优势，该材料能赋予电容元器件低损耗、长寿命、高稳定性及优异的高频特性，为电力系统的高效运行提供保障。人工智能数据中心的投资建设，将直接拉动上游电力设备的需求。\n产能方面，中仑BOPP规划九条线，一期两条线。第一条线25年11月投产，第二条线预计今年下半年投产，另有4条线最近准备签约设备，单线年产能约2400吨(具体视产品厚度而定)。第一条线用于家电薄膜电容器的已批量出货（4.8-5.8um，少量3.8um），法拉方面春节前送验证（主要是3um以下BOPP薄膜）。5um左右售价3万，毛利率30%；3um以下薄膜售价在8-12万，毛利率50%。\n国内具备3um以下BOPP基膜生产能力的厂商较小，嘉德利属于国内第一梯队，但良品率不是很理想。中仑反馈当前已实现2.7um厚度BOPP膜的稳定生产并于春节前给法拉送货（公司工厂就在法拉旁边，调试对接供货都很方便），预计会有相当比例份额。目前法拉超高端BOPP基膜主要还是采购自日本东丽。\n法拉配套需求足够，SST预计降带来更多增量。当前法拉年需求量2万吨+BOPP基膜，SST方案预计大幅拉动薄膜电容需求。2030年预计SST薄膜电容市场空间达100e，BOPP占比40-50%，假设对应40亿市场，参考嘉德利净利率至少30%以上，12亿利润空间。", "preview": "中仑新材交流反馈：关注SST带...\n中仑新材交流反馈：关注SST带来的电容膜增量\n公司BOPP新能源膜材作为薄膜电容器的关键基膜材料，其成本占比约40%-50%。通过耐高温、耐高压、低介电损耗与强自愈性的性能优势，该材料能赋予电容元器件低损耗、长寿命、高稳定性及优异的高频特性，为电力系统的高效运行提供保障。人工智能数据中心的投资建设，将直接拉动上游电力设备的需求。\n产能方面，中仑BOPP规划九条线，一期两条线。第一条线25年11月投产...", "sectors": ["化工"], "companies": ["中仑新材"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 16:51"]}, {"id": "evidence-210", "content": "中国芯片巨头长鑫存储 IPO ...\n中国芯片巨头长鑫存储 IPO 引发对市场过往顶部的回忆", "preview": "中国芯片巨头长鑫存储 IPO ...\n中国芯片巨头长鑫存储 IPO 引发对市场过往顶部的回忆", "sectors": ["存储"], "companies": ["长鑫存储"], " "], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 13:30"]}, {"id": "evidence-281", "content": "🔥【天风通信】永鼎股份：客户验证进展顺利，积极看好公司后续发展，持续推荐！\n[太阳]事件：公司近日股价出现回调，主要是受整体板块影响，公司基本面持续向好，目前光芯片在客户侧验证顺利，后续有望获得规模订单。展望后续，我们认为公司股价仍有较大上行空间，持续推荐。\n[烟花]子公司鼎芯光电全面布局EML、CW光源等光芯片产品，目前CW光源放量出货且产能持续爬坡，后续有望获得其他大客户订单（预计订单量高于之前客户），明年出货量有望大幅提升，鼎芯光电亦同步持续大幅扩产。此外，公司同步加快200mW、400mW CW及200G EML等高端芯片研发突破。\n[红包]光纤持续涨价并维持较高价格位置，公司积极扩产，预计2026底光棒产能扩产到950吨，光纤产能扩产到3600万芯公里，公司聚焦高价值产品，有望贡献弹性利润。此外，公司亦布局MPO光纤跳线产品，并在安徽六安自建产线，目前已有批量订单。\n[庆祝]此外，子公司东部超导前瞻布局高温超导带材，是国内为数不多可以量产的超导带材公司，产品性能优异，可用于可控核聚变战略方向，近期计划扩产5万公里，满足下游需求的快速增长，预计今年可实现盈利，后续有望快速增长并贡献弹性利润，我们认为市场对公司高温超导带材业务并未充分定价，存在较大的预期差。\n☎天风通信🥇王奕红/康志毅*/张建宇*/唐海清", "preview": "🔥【天风通信】永鼎股份：客户验证进展顺利，积极看好公司后续发展，持续推荐！\n[太阳]事件：公司近日股价出现回调，主要是受整体板块影响，公司基本面持续向好，目前光芯片在客户侧验证顺利，后续有望获得规模订单。展望后续，我们认为公司股价仍有较大上行空间，持续推荐。\n[烟花]子公司鼎芯光电全面布局EML、CW光源等光芯片产品，目前CW光源放量出货且产能持续爬坡，后续有望获得其他大客户订单（预计订单量高于之前客户），明年出货量有望大幅提升，鼎芯光...", "sectors": ["光模块"], "companies": ["永鼎股份"], "sources": ["wechat_group_1"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 13:30"]}, {"id": "evidence-91", "content": "🔥【招商电子】PCB 行业深度...\n🔥【招商电子】PCB 行业深度跟踪：AI高速升级需求催生mSAP新趋势，积极把握算力主升浪行情，看好各细分环节头部公司\n[礼物]算力PCB：光模块从800G到1.6T升级，单通道速率翻倍提升，推动PCB从减成法-HDI向mSAP-SLP升级。而 mSAP 产能扩张周期预计在 15-18 个月，需求的爆发将加剧 mSAP产能的供给缺口。远期来看，CoWoP 封装将采用更大尺寸、更高层数的SLP产品设计方案，单颗 GPU 对应的 PCB ASP 将大幅提升。此外，光模块、AI 芯片功耗跃升加大对高散热的需求，陶瓷基板有望凭借高导热系数、低CTE等优势在多个AI数据中心场景中得到应用。\n[礼物]载板：AI算力芯片和存储需求向上，国内载板厂商盈利能力持续回升，高端ABF载板供给紧张将给陆厂切入国内外核心客户供应链绝佳的机会窗口期。在载板上游原材料供应体系中，国内在 BT 类基板、 ABF 膜材料均有相应厂商进行了前瞻布局，如 生益科技、华正新材、南亚新材等， 可实现国产替代。\n[礼物]CCL：AI高速CCL升级节奏加速，市场规模快速增长。国内厂商凭借对上游物料供应链的掌控以及优秀的交付能力今明年将有望在全球高速 CCL 市场竞争中实现放量赶超。根据我们的跟踪，国内CCL龙头【生益科技】S8/S9材料已经在N客户算力供应链取得大批量订单，且在S10 、PTFE等材料具备前瞻卡位，有望实现对 Rubin 全部料号的突破，今明年供应份额有望进一步提升。周期方面，“涨价”依旧是 CCL行业26-27年的主旋律。\n[礼物]上游主材：AI需求推动高端产品加速升级、供需缺口环节持续紧张，PTFE等材料有望成为新潜力方向。1）玻纤布：一代、二代布为当下主流高端材料，Q布放量在即，高阶玻布缺口严重，价格持续向上；2）电子铜箔：AI需求推动HVLP铜箔及载体铜箔加速升级，需求快速增长；3）树脂：M8+、M9等级CCL升级有望推动 益，左手UCIE右手设计服务\n🚀AI需求旺盛先进制程紧缺，FAB大涨，公司开发独立IO方案将HBM等从GPU die中拆解出来，节省先进制程需求。已经有客户流片，单GPU价值量3000元级别。同时公司流片服务业务有望超预期！", "preview": "🧧和顺石油：先进制程紧缺受益，左手UCIE右手设计服务\n🚀AI需求旺盛先进制程紧缺，FAB大涨，公司开发独立IO方案将HBM等从GPU die中拆解出来，节省先进制程需求。已经有客户流片，单GPU价值量3000元级别。同时公司流片服务业务有望超预期！", "sectors": ["石油石化"], "companies": ["和顺石油"], "sources": ["wechat_group_1"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-28 14:00"]}, {"id": "evidence-335", "content": "6月再看CCL涨价会议概要20...\n6月再看CCL涨价会议概要20260528\n涨价进程：2026年一共四轮涨价，6月提价落实后价格已经突破上轮周期高点\n自2026年3月起，CCL行业已实施四轮集中调价（3月、4月初、4月28日、5月27日），累计涨幅达40%以上。25年8-9月价格从110-120元/张开始启动，3月的时候达到150元/张（FR-4标准品，含税），经前三轮快速传导后，目前价格升至220元/张；5月27日最新提价函若全面落地，成交均价将突破240元/张，高于2021年历史高点（230元）。2026年前三轮基本实现100%传导（基本是提价函后一周内就实现全部客户落实），传导效率远超2025年下半年的提价；而5月本轮提价最终落地节奏与幅度高度依赖下游接受度，后面半个月再看看落实效果。\n产业链库存情况：电子布0库存，CCL约10%库存，PCB保留部分战略性CCL备货\n1）上游电子布：电子布零库存，头部CCL厂春节后库存于4月清零；中小厂普遍维持不足10%的BC级降级品库存，实际可售A级品近乎为零。上游电子布厂商缺口巨大——中型厂月缺500万米，头部厂月缺超1000万米；按五家头部CCL厂推算，全行业月缺口保守估计达4000万米以上，年化缺口逾4–5亿米。\n电子布2026年上半年无新增有效产能释放。所谓“下半年扩产”目前仅泰山、株玻等个别厂商有微量释放，但影响力微弱；小厂扩产能力与规模均不足，未形成实质供给增量。AR/AI类高端PCB对1080、106等超薄布需求激增，迫使原用于7628厚布的织布机产能转向薄布生产，导致传统主力型号7628亦出现减产与缺口。\n2）中游CCL：库存处于历史低位。头部企业春节后库存于4月耗尽；当前库存虽名义存10%，但多为BC级降级品，A级正品库存趋近于零。库存策略已从“安全储备”转向“即产即销”，在手订单覆盖期稳定在1个月左右，排产饱满度达100%。\n3）下游PCB：库存结构发生根本性变化。成品库存维持在10–20天合理水平；但原材料（CCL）库存显著提升至1–1.5个月，部分准备充分的厂商达2个月。此非主动投机，而是应对交期延长（CCL交付周期持续拉长）与价格不确定性（防范后续涨价）的防御性储备。PCB厂当前CCL库存水平（1–1.5个月）低于2025年下半年高峰（2–3个月），也是已经消耗了部分CCL库存的结果\n目前看淡季下游需求强于同期，消费电子拖累下整体景气仍好于超预期\n尽管6–7月为传统消费电子淡季，但2026年需求表现显著强于历史同期（同比+20%–30%）：\n强势领域：汽车电子（含新能源车）、储能、无人机、机器人等高附加值应用需求持续强劲，订单饱满，价格传导顺畅（可达70–80%），终端客户接受度高。\n弱势领域：消费电子（含手机、电脑）及关联家电、地产链需求仍处修复初期，同比小幅下滑。该板块虽占整体需求约50%，但当前贡献度已降至30–40%，成为产业链中价格传导最慢（仅50–60%）、利润承压最重的环节。\n在消费电子这一最大需求板块尚未复苏的情况下，全行业仍维持高景气，恰恰反证了非消费类新兴应用（尤其是AI硬件）的爆发力已足以驱动整体产业链过热。三季度如果能看到消费电子的旺季效应，缺货可能会更加明显。\n产业链价格传导弹性看，CCL超额提价，PCB仅部分顺价\nCCL环节：处于绝对强势地位。不仅实现对电子布涨价的100%覆盖，更通过“超额传导”获取额外利润（即涨价幅度显著高于电子布成本涨幅，假设一张板用8平米布，实际上布的成本涨了4块，但覆铜板提了10%接近20块）。其定价权源于卖方市场格局与下游刚性需求，利润空间持续扩大。\nPCB环节：承受最大传导压力。历史经验显示，其向终端客户的价格传导率通常仅60–80%，剩余20–40%成本需自行消化。若CCL价格进一步涨至260元/张，双面板成本将迫近420元/张，PCB厂将面临保本甚至亏损压力。此时，其应对策略将转向：① 严控接单（尤其低毛利订单）；② 强化成本管控（加工费、良率）；③ 向AI等高毛利产品倾斜产能。专家警示：若管理不善且价格无法传导，部分PCB厂或将面临经营危机。\n传导可持续性关键变量：① 电子布真实产能释放时点（2027年H2或为重要拐点）；② 高端应用（汽车、AI）能否持续支撑价格上限；③ 消费电子旺季（Q3）是否如期启动并改善整体传导环境。\n延续全年电子布-CCL上游紧缺的判断，但价格迈过高点后要观测PCB接受度\n短期（2026年内）：电子布缺口确定性存在，CCL价格中枢将持续上移。240元/张已成新基准，250–260元区间具备现实可能性。涨价频率已固化为“月度协商”，决策依据为当月电子布价格变动、订单饱和度及下游反馈，难以给出精确幅度预测。\n中期（2027年起）：两大关键变量将决定行情拐点：① 供给端：头部电子布厂扩产项目若于2026年H2开始批量释放，叠加2027年更多产能投产，有望在2027年H2显著缓解缺口；② 需求端：若AI硬件渗透率持续超预期，或消费电子迎来实质性复苏，则景气周期可能延长至3–5年。当前市场共识为：2026年确定性向好，2027年取决于产能兑现进度，但大幅回落风险极低。\n风险观测指标：聚焦高端板块传导韧性与AI产能转化率\n高端应用价格接受度：汽车、储能、AI类PCB订单能否持续维持70%以上传导率，其毛利率是否稳定；\nAI专用电子布产能占比：当前AI相关电子布用量约占总需求10–20%，若该比例加速提升（如突破30%），将加剧传统布种短缺，进一步强化涨价逻辑；\nPCB厂接单策略变化：若头部PCB厂开始系统性收缩传统订单、集中资源承接AI订单，表明其已将价格压力转化为结构性升级动力，预示产业链进入新平衡阶段。", "preview": "6月再看CCL涨价会议概要20...\n6月再看CCL涨价会议概要20260528\n涨价进程：2026年一共四轮涨价，6月提价落实后价格已经突破上轮周期高点\n自2026年3月起，CCL行业已实施四轮集中调价（3月、4月初、4月28日、5月27日），累计涨幅达40%以上。25年8-9月价格从110-120元/张开始启动，3月的时候达到150元/张（FR-4标准品，含税），经前三轮快速传导后，目前价格升至220元/张；5月27日最新提价函若全...", "sectors": ["电子"], "companies": [], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 0, "timestampCount": 1, "timestamps": ["2026-05-28 17:56"]}, {"id": "evidence-296", "content": "PCB今明年斜率真的很夸张，一定要重视全链条和龙头公司", "preview": "PCB今明年斜率真的很夸张，一定要重视全链条和龙头公司", "sectors": ["电子"], "companies": [], "sources": ["wechat_group_9"], "sectorRowCount": 1, "companyRowCount": 0, "timestampCount": 1, "timestamps": ["2026-05-28 13:33"]}, {"id": "evidence-27", "content": "⭐⭐【国金金属 | 钼】：韬定律核心受益品种_而且还能涨价！0527\n⭐⭐【国金金属 | 钼】：韬定律核心受益品种_而且还能涨价！0527\n#钼-完美适配韬定律下连接材料。韬定律下及3D封装等场景下，芯片内部电路逐步微缩化、多层化；因而传统半导体金属互连主力材料钨，已经在微缩制程中暴露出明显的物理瓶颈（电阻提升过大、热 ...", "preview": "⭐⭐【国金金属 | 钼】：韬定律核心受益品种_而且还能涨价！0527\n⭐⭐【国金金属 | 钼】：韬定律核心受益品种_而且还能涨价！0527\n#钼-完美适配韬定律下连接材料。韬定律下及3D封装等场景下，芯片内部电路逐步微缩化、多层化；因而传统半导体金属互连主力材料钨，已经在微缩制程中暴露出明显的物理瓶颈（电阻提升过大、热 ...", "sectors": ["钼"], "companies": [], "sources": ["知识星球_调研纪要"], "sectorRo           <div class="正文">${转义(语料.content)}</div>
          <div class="操作行">
            <button class="小按钮" data-展开="${语料.id}">展开 / 收起</button>
            <button class="小按钮" data-复制="${语料.id}">复制语料</button>
          </div>
        </article>
      `).join('');
    }

    function 同步控件() {
      元素.板块筛选.value = 状态.板块;
      元素.个股搜索.value = 状态.个股;
    }

    function 写入地址() {
      const 参数 = new URLSearchParams();
      if (状态.板块) 参数.set('板块', 状态.板块);
      if (状态.个股) 参数.set('个股', 状态.个股);
      history.replaceState(null, '', `${location.pathname}#${参数.toString()}`);
    }

    function 读取地址() {
      const 片段 = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      const 参数 = new URLSearchParams(片段);
      状态.板块 = 参数.get('板块') || '';
      状态.个股 = 参数.get('个股') || '';
    }

    function 重绘() {
      同步控件();
      写入排行();
      写入结果();
      写入地址();
    }

    function 设板块(名称) {
      状态.板块 = 名称 || '';
      if (状态.个股) {
        const 个股 = 数据.companies.find(项 => 项.name === 状态.个股);
        if (个股 && 状态.板块 && !个股.sectors.includes(状态.板块)) {
          状态.个股 = '';
        }
      }
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function 设个股(名称) {
      状态.个股 = 名称 || '';
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', async (事件) => {
      const 板块按钮 = 事件.target.closest('[data-板块]');
      if (板块按钮) {
        设板块(板块按钮.dataset.板块);
        return;
      }
      const 个股按钮 = 事件.target.closest('[data-个股]');
      if (个股按钮) {
        设个股(个股按钮.dataset.个股);
        return;
      }
      const 展开按钮 = 事件.target.closest('[data-展开]');
      if (展开按钮) {
        const 卡片 = document.getElementById(展开按钮.dataset.展开);
        if (卡片) {
          卡片.classList.toggle('展开');
        }
        return;
      }
      const 复制按钮 = 事件.target.closest('[data-复制]');
      if (复制按钮) {
        const 卡片 = document.getElementById(复制按钮.dataset.复制);
        const 文本 = 卡片?.querySelector('.正文')?.textContent || '';
        await navigator.clipboard.writeText(文本);
        复制按钮.textContent = '已复制';
        setTimeout(() => {
          复制按钮.textContent = '复制语料';
        }, 1200);
      }
    });

    元素.板块筛选.addEventListener('change', 事件 => {
      状态.板块 = 事件.target.value;
      重绘();
    });

    元素.跳转个股.addEventListener('click', () => {
      const 词 = 元素.个股搜索.value.trim();
      if (!词) return;
      const 精确 = 数据.companies.find(项 => 项.name === 词);
      if (精确) {
        设个股(精确.name);
        return;
      }
      const 模糊 = 数据.companies.find(项 => 项.name.includes(词));
      if (模糊) {
        元素.个股搜索.value = 模糊.name;
        设个股(模糊.name);
      }
    });

    元素.个股搜索.addEventListener('keydown', 事件 => {
      if (事件.key === 'Enter') {
        元素.跳转个股.click();
      }
    });

    读取地址();
    写入统计();
    写入筛选器();
    重绘();
  </script>
</body>
</html>
