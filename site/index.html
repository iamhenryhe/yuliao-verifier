<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语料查证器</title>
  <style>

      --背景: #f5f5f7;
      --面板: #ffffff;
      --面板浅: #fbfbfd;
      --边框: #d2d2d7;
      --边框强: #c7c7cc;
      --文字: #1d1d1f;
      --次要: rgba(29,29,31,0.72);
      --强调: #0071e3;
      --强调浅: #e8f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--背景);
      color: var(--文字);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .页面 {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .侧栏 {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--边框);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .标题块, .侧块, .主块 {
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .标题块 {
      padding: 18px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }
    .侧块 {
      margin-top: 16px;
      padding: 14px;
    }
    .侧块标题 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }
    .排行列表 {
      display: grid;
      gap: 8px;
    }
    .排行按钮 {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
      color: var(--文字);
      text-align: left;
      cursor: pointer;
    }
    .排行按钮.选中 {
      border-color: var(--强调);
      background: var(--强调浅);
    }
    .排行主行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 620;
    }
    .排行副行 {
      margin-top: 6px;
      font-size: 12px;
      color: var(--次要);
    }
    .主体 {
      min-width: 0;
      padding: 22px;
    }
    .工具条 {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-bottom: 14px;
      background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.9) 75%, rgba(245,245,247,0) 100%);
    }
    .工具格 {
      display: grid;
      grid-template-columns: minmax(260px, .7fr) minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .字段 {
      display: grid;
      gap: 6px;
    }
    .字段标签 {
      font-size: 13px;
      color: var(--次要);
    }
    .输入框, .下拉框, .按钮 {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 14px;
      outline: none;
    }
    .输入框:focus, .下拉框:focus {
      border-color: var(--强调);
      box-shadow: 0 0 0 3px rgba(0,113,227,.16);
    }
    .按钮 {
      cursor: pointer;
      font-weight: 620;
    }
    .按钮.主按钮 {
      background: var(--强调);
      border-color: var(--强调);
      color: #ffffff;
    }
    .统计栏 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .统计卡 {
      padding: 14px;
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .统计名 {
      font-size: 12px;
      color: var(--次要);
      margin-bottom: 8px;
    }
    .统计值 {
      font-size: 28px;
      font-weight: 700;
    }
    .主块 {
      padding: 18px;
    }
    .主块标题行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .主块标题 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .结果数 {
      color: var(--次要);
      font-size: 15px;
    }
    .语料列表 {
      display: grid;
      gap: 14px;
    }
    .语料卡 {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
    }
    .语料头 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }
    .语料编号 {
      font-size: 16px;
      font-weight: 650;
    }
    .语料统计 {
      color: var(--次要);
      font-size: 13px;
    }
    .信息行 {
      margin: 8px 0 0;
      line-height: 1.7;
      font-size: 14px;
      color: var(--文字);
    }
    .信息标题 {
      color: var(--次要);
    }
    .正文 {
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.78;
      font-size: 15px;
      color: var(--文字);
      max-height: 9.2em;
      overflow: hidden;
      position: relative;
    }
    .语料卡.展开 .正文 {
      max-height: none;
    }
    .正文::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(251,251,253,0), rgba(251,251,253,1));
    }
    .语料卡.展开 .正文::after {
      display: none;
    }
    .操作行 {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .小按钮 {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 13px;
      cursor: pointer;
    }
    .空状态 {
      padding: 28px;
      text-align: center;
      border-radius: 8px;
      border: 1px dashed var(--边框强);
      color: var(--次要);
    }
    @media (max-width: 1200px) {
      .页面 {
        grid-template-columns: 1fr;
      }
      .侧栏 {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--边框);
      }
      .工具格 {
        grid-template-columns: 1fr;
      }
      .统计栏 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      .统计栏 {
        grid-template-columns: 1fr;
      }
      .主体, .侧栏 {
        padding: 16px;
      }
    }
  </style>

\n✅天润工业：曲轴为下游扩产核心卡点，看好逐季度量价利环比提升\n1️⃣曲轴就是内燃机发电机（柴发、燃发）扩产的核心卡点，公司大机曲轴作为潍柴、卡特、康明斯、玉柴等主流厂商的核心供应商，将持续受益下游景气度上修，且近期订单、产能仍有提升预期。且对业绩的贡献是逐季度环比提升的，潍柴M55、卡特大机产品等高单价曲轴（4-7w为主，部分高达8-10w）Q2逐步投产，曲轴毛坯自供线Q3落地，量价利三个维度都有提升。\n2️⃣同时，公司主业依旧稳健，规模效应下盈利能力实质性提升，26Q1剔除阿尔泰并表影响，公司实际经营净利率约11%，接近历史高位。此外，公司对天然气喷射系统、电驱桥等新兴业务进行了前瞻布局，在中期维度弹性客观。\n投资建议：仍然维持对天润工业的推荐，预计26-27年净利润5.3/6.7亿元；假设按照现有产能完全释放，大机曲轴产能3万支*6.5万ASP*18%净利率=3.7亿利润，连杆70万支*0.1万ASP *18%净利率=1.3亿利润；合计4.9亿*30XPE=147亿市值，叠加主业60亿，合计看200亿市值，50%+空间。\n✅键邦股份：需求端旺盛、调价空间依然充分，原材料价格回落增厚隐性利润\n1️⃣近期原油价格回调带动赛克生产核心原材料-环氧乙烷价格同步下降，根据百川浮盈数据，5月7日全国环氧乙烷均价为8530元/吨，较上周下降5.5%，公司采购成本亦有减少。若无中东地缘政治扰动，近3年环氧乙烷价格维持6-7k/t区间波动，26年初价格低至5500元，因此价格回落预计为大趋势。\n2️⃣利润弹性：中性预期下，假设27年赛克指导价1.8w（含税），出货量3.5w吨满产，则环氧乙烷9k/7k价格下单吨净利润分别为6.3k/7.2k，合计净利润2.2亿/2.5亿，环氧乙烷跌价额外贡献3000万利润。此外，公司下游需求旺盛态势延续，Q2排产已锁定，并逐步安排Q3订单，我们认为当前供需格局下调价空间仍然充足。\n投资建议：若考虑小幅涨价及原材料跌价，2027年公司整体净利润有望达4亿元，基于公司在此环节的优质格局和业绩高成长性，给予30XPE估值，对应120亿市值，当前60%空间。\n———————————\n欢迎交流：孙潇雅/李俊漾", "preview": "❗️【天风汽车】缺电零部件调整点评（天润工业、键邦股份）：系缺电链调整影响，实际基本面持续向好，依旧维持推荐- 0508\n———————————\n🌟核心观点：今日缺电链普遍回调，但从零部件/上游供应商的微观维度，下游景气度仍在持续上修，依旧看好核心供应商天润工业（曲轴）、键邦股份（上游助剂）。\n✅天润工业：曲轴为下游扩产核心卡点，看好逐季度量价利环比提升\n1️⃣曲轴就是内燃机发电机（柴发、燃发）扩产的核心卡点，公司大机曲轴作为潍柴、卡特...", "sectors": ["化工", "汽车"], "companies": ["天润工业", "键邦股份"], "sources": ["wechat_group_1"], "sectorRowCount": 2, "companyRowCount": 2, "timestampCount": 4, "timestamps": ["2026-05-08 20:00"]}, {"id": "evidence-251", "content": "【国海计算机·周观点·0510...\n【国海计算机·周观点·0510】 TAM至1200亿美元、康宁和英伟达合作拟十倍扩产光连接产能、豆包将开始探索收费模式\n🔥计算\n承诺5年内购买2000亿美元谷歌云服务和芯片、SpaceX向Anthropic开放超22万颗英伟达GPU使用权\n▪5月6日讯，Anthropic承诺五年内购买2000亿美元谷歌云服务和芯片。同时，Anthropic获得SpaceX Colossus 1数据中心超22万颗英伟达GPU算力使用权。（IT之家）\n#字节跳动2026年的AI基础设施支出将超过2000亿元\n▪5月7日讯，字节TikTok在泰国的约1778.05亿元项目获批，该项目将在曼谷等地部署更多服务器并扩展数据存储与处理基础设施。字节跳动2026年的AI基础设施支出将超过2000亿元。（智东西）\nTAM上调一倍至1200亿美元\n▪5月7日讯，AMD将2030年服务器CPU TAM从此前600亿美元上调至1200亿美元，年复合增长率从18%上调至超35%，CPU成为AI基建的核心增量。（财联社）\n🔥连接/存储\n▪5月6日讯，康宁获英伟达5亿美元投资，其在美光连接产能将提高10倍、光纤产能扩大50%以上。（科创板日报）\n#ALAB推出PCIE协议AI交换机Scorpio X\n▪5月6日讯，Scorpio X交换机搭载320条PCI 的 CIS 协议。除非客户破产，否则 18 亿美元的交易收入将得到保障，预计将于第四季度开始逐步实现，收入金额为 2000 万至 2500 万美元。一旦客户达到满负荷运转，收入将按合同比例确认。”\n为支持该客户，管理层将在未来 12 个月内追加约 8.12 亿美元的资本支出。其中约 7 亿美元将于 2026 年下半年投入，剩余部分将于 2027 年上半年投入。我们预计该交易将在 2027 年下半年全面启动。部分交易金额预计将在下个季度计入 RPO（收入和利润目标），全部金额预计将在 2027 年全部计入 RPO，因为交易结构限制了前 12 个月内全部计入。管理层将 2026 年 CIS（客户独立系统）预期至少上调至 50%。\n就第一季度而言，由于部分支出提前至第二季度以及零部件成本下降带来的部分利好，第一季度资本支出略低于预期。随着公司开始接收英伟达 GPU 并消化第一季度延期支出，预计第二季度资本支出将显著增长。此外，受持续推进的市场推广活动的影响，第二季度营业利润率也将略有下降。\n总而言之：看涨的理由在于核心 CDN 业务企稳、安全势头强劲以及计算 AI 基础设施投资带来的增长潜力。本季度我们看到了这三点。对于着眼于长期投资的投资者而言，目前的估值仍然颇具吸引力，因为持续的安全势头、AI 推理能力的扩展以及交付能力的稳定都可能推动股价进一步上涨，而强劲的现金流和审慎的资本配置则提供了下行支撑。重申“跑赢大盘”评级，并将目标价从 130 美元上调至 165 美元。\n分析师：彼得·莱文", "preview": "Evercore ISI 将 ...\nEvercore ISI 将 $AKAM 的目标价从 130 美元上调至 165 美元 - 跑赢大盘\n分析师评论：“AKAM 公布的第一季度业绩稳健，符合预期。但受公司宣布与一家领先的前沿科技公司达成一项里程碑式的七年期 18 亿美元 CIS（客户信息系统）合作协议以及管理层承诺 2027 财年实现两位数增长的提振，股价上涨。这一消息巩固了看涨观点。管理层表示，CIS 项目正在加速推进，我们预计这笔...", "sectors": ["CDN"], "companies": ["AKAM"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-09 10:39"]}, {"id": "evidence-121", "content": "IrisEnergy获英伟达投...\nIrisEnergy获英伟达投资与云订单，矿场电力资源优势彰显\n事件：5月8日，英伟达与IrisEnergy（股票代码：IREN）宣布建立战略合作伙伴关系，主要内容包括：1）IREN向英伟达授予一项为期五年的权利，允许后者以每股70美元的行权价格购买最多3000万股普通股，即最多21亿美元的投资权；2）双方计划在IREN的AIDC中部署高达5GW的英伟达DSX对应的AI基础设施，前期部署将集中于IREN位于得州Sweetwater的2GWAIDC，这将是英伟达DSX架构的旗舰部署基地；3）双方另有一份价值34亿美元的五年期协议，根据协议，英伟达将向IREN采购GPU云服务来运行内部AI研究工作负载，包括编排和集群管理软件，该协议将由Blackwell风冷系统提供服务，这些系统将部署在IREN位于得州Childress的数据中心内，其电力容量约为60MW。\n此前，5月5日，IREN宣布将以约6.25亿美元收购云服务商Mirantis。\n点评：我们认为，英伟达与IREN的合作，一方面彰显了美国电力的紧缺程度，另一方面标志着基于比特币矿场时期积累的并网电力资源和刚刚收购的Mirantis的云服务能力，IREN已经有能力斩获云服务订单，已经完成从比特币矿场转型AI服务商“AIDC托管-裸金属算力租赁-云服务”的三步走跃迁，跻身同样拥有英伟达资金支持的Coreweave、Nebius等组成的一流新云（Neocloud）梯队。在AI编程工具ClaudeCode引发的Agent浪潮下，AI算力需求飙升，同样基于此前积累的并网电力资源优势，比特币矿场转型而来的AIDC有望享受来自芯片厂商或云厂商资金或订单支持。\n建议关注：建议关注在北美待租出电量较多的矿场AIDC：IrisEnergy（待租出电量4050MW，数据截至2026年3月17日，下同）、Terawulf（待租出电量2218MW）、Hut8（待租出电量1683MW）、RiotPlatforms（待租出电量1675MW）、CleanSpark（待租出电量835MW）、Ga 发射业务均将实现同比增长。\n3️⃣Q1调整后EBITDA亏损为1180万美元，远优于指引。\n🌌订单转化：在手订单激增至创纪录的22亿美元以上（同比+108%，环比+20.2%）。预计Q1末积压订单中约36%将在未来12个月内转化为实际营收，业绩能见度极高。\n🌌流动性：流动性总额达20亿美元，其中包含14.8亿美元的现金及现金等价物，为后续Neutron研发及并购提供充足财务弹性。\n🌌盈利能力：Q1 GAAP毛利率为38.2%，Non-GAAP毛利率达43%，均优于预期。受SDA TrancheII/III大单及卫星平台业务占比提升带来的产品组合变化影响，预计Q2 Non-GAAP毛利率将结构性回落至38%-40%。\n【发射业务：HASTE获国防部大单，中子号商业化提前兑现】\n🚀Electron与HASTE：创下单季历史最高预订量。Q1共斩获31次发射订单，积压待发任务超70次。HASTE拿下美国国防部1.9亿美元、20次发射的历史性批量订单，并与Anduril签署3次商业合作，深度融入美国高超音速测试网络。\n🚀中子号（Neutron）订单：斩获公司史上最大规模发射合同。签订5次批量专用发射订单（直至2029年），发射清单迅速填满至本十年末。定价策略上未采用低价换量，与平均售价保持一致。\n🚀中子号研发进展：一级贮箱按支持今年首次发射的激进时间表推进。回收策略清晰：首次飞行将测试软溅落及再入发动机点火，第二次飞行计划使用\"Return on Investment\"驳船进行海上回收。\n【太空系统业务：深度参与国防项目，自研与并购双轮驱动垂直整合】\n🛰核心防务项目突破：被选中参与美国太空部队\"金穹（GoldenDome）\"天基拦截器项目，携手雷神公司展示先进导弹防御能力，打开全新增量空间。\n🛰密集并购与推新重塑供应链：在短短四个月内新增7项高价值战略产品和能力。\n1️⃣收购Motiv Space Systems：将火星探测器级别的机器人技术、月球行星表面操作能力以及核心的太阳能电池阵列驱动组件（SADA）收归内部制造，进一步降本增效。\n2️⃣Mynaric收购交割完成：确立欧洲据点，获取关键的激光光通信终端技术。\n3️⃣推出Gauss电推进系统：针对大规模量产自研定制，年产能已达200+，直击供应链短缺痛点。\n📈【长期盈利模型向上：垂直整合护城河日益深厚】\n长线来看，两大催化剂将持续支撑Rocket Lab利润率向上突破：\n1️⃣高度垂直整合的兑现：通过自研（如Gauss电推进）和精准并购（Motiv、Mynaric）。在SDA等大型主承包项目中，强大的垂直整合能力不仅是中标核心，更是维持利润率与防范节点延期的坚实壁垒。\n2️⃣中子号步入收获期：极具竞争力的定价体系加上稳步推进的复用回收进度，预计在中子号首飞及量产落地后的18至24个月内，将形成强劲的现金流，复刻电子号的盈利轨迹。", "preview": "Rocket Lab（RKLB...\nRocket Lab（RKLB）26Q1业绩：营收首破2亿美元大关，HASTE与中子号订单双爆发，垂直整合持续深化\n【财务/订单：营收破历史纪录，在手订单及现金流充裕】\n🌌营收端-强劲超预期：\n1️⃣2026年Q1总营收达到创纪录的2.003亿美元（yoy+63.5%）\n2️⃣26年Q2指引2.25亿-2.40亿美元（中位数环比增长16%），太空系统和发射业务均将实现同比增长。\n3️⃣Q1调整后EB...", "sectors": ["航天"], "companies": ["Rocket Lab"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-10 09:37"]}, {"id": "evidence-191", "content": "[加油]【中航光电】核心领导增...\n[加油]【中航光电】核心领导增持公司股份点评：坚定看好 光电迈入发展新阶段-【长江军工】\n[红包]事件：公司董事长兼总经理李森等7名高管于5月7日—5月8日合计增持公司股份69000股，增持总金额252.21万元；各增持主体承诺自本次增持完成后6个月内不减持所持股份。\n[太阳]点评：\n🚀AI牵引全球连接器格局巨变。泰科电子从1980年至2024年依托在汽车领域的卡位，保持全球连接器第一格局44年，而2025年，AI基建对连接器需求爆发，安费诺依托前瞻布局，收入同比增长 为全球第一且与泰科拉开50亿美金收入差距。\n🔴针对中航光电， ，目前224G高速线缆模组产品在950处于 es": ["东方电气"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-10 11:55"]}, {"id": "evidence-306", "content": "中国中铁（A/H）:讨论参与刚...\n中国中铁（A/H）:讨论参与刚果（金）大型铜矿开发，资源业务成长逻辑持续强化，价值有望加速重估！\n事项:根据彭博社报道，据刚果（金）矿业部发布的声明，中国中铁旗下一家子公司与该国矿业部长LouisWatum会面，讨论开发一个项目，该项目有望成为全球最大的铜矿之一，预计每年将生产20万至50万吨铜。\n矿产业务积极对外扩张，价值有望加速重估。公司当前在手5座现代化矿山生产运营状况良好，主要矿产品包括铜、钴、钼、铅、锌等品种，此前基本专注于已有矿山运营，未对外大规模投资扩张。近期参股公司已竞得内蒙古大型银矿探矿权，此次又积极提议参与刚果（金）大型铜矿项目，表明公司积极扩张资源业务战略持续执行，从“增量角度”打开了未来成长想象空间，资源业务“量价齐升”逻辑补齐，价值有望加快重估。\n资源板块价值具备重估空间：1）预计2026年资源业务净利润50亿元，参考有色龙头紫金矿业2026年PE估算（A/H股均约11X），对应A股/H股价值分别约560/570亿元；2）预计2026年工程业务净利润168亿元，A/H股分别以6X/4XPE估算，对应价值分别为1008/672亿元。A股/H股资源+工程板块合计价值分别为1568/1242亿元，具备25%/30%提升空间。\n投资建议：我们预计公司2026-2028年归母净利润分别为218/214/215亿元，同比-5%/-2%/+0.4%。当前A股股价对应PE分别为5.8/5.9/5.8倍，26年预期股息率3.1%，PB-LF0.39倍；H股股价对应PE分别为3.8/3.9/3.9倍，26年预期股息率4.1%，PB（Lf）仅0.26倍，处于历史底部区间，资源板块具备重估潜力，重点推荐！\n风险提示：项目处于讨论阶段落地不确定、矿产资源价格波动、应收账款减值等", "preview": "中国中铁（A/H）:讨论参与刚...\n中国中铁（A/H）:讨论参与刚果（金）大型铜矿开发，资源业务成长逻辑持续强化，价值有望加速重估！\n事项:根据彭博社报道，据刚果（金）矿业部发布的声明，中国中铁旗下一家子公司与该国矿业部长LouisWatum会面，讨论开发一个项目，该项目有望成为全球最大的铜矿之一，预计每年将生产20万至50万吨铜。\n矿产业务积极对外扩张，价值有望加速重估。公司当前在手5座现代化矿山生产运营状况良好，主要矿产品包括铜、...", "sectors": ["交运"], "companies": ["中国中铁"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-10 20:43"]}, {"id": "evidence-14", "content": "交易台 – 高盛中国午盘\n上...\n交易台 – 高盛中国午盘\n上证综指-0.43% 科创50 -2.90%\n上证50 -1.19%.创业板指 -0.98%\n沪深300 -0.90% 中证500 -0.74%\n中国A股总成交额(万亿人民币)：1.99\n中国股市在连续两日的强势后有所放缓，主要基准指数出现回落。半导体/GPU/CPO板块均出现小幅回调，资金轮动至包括人形机器人和电动车供应链在内的滞后板块。尽管现金成交额较前两天有所下降，但早盘仍保持在2万亿人民币的相对高位。尽管AI主题普遍走弱，但许多人仍认为这只是创下新高前的健康调整。中国PCB制造商胜宏科技今早突破前期压力位，创下历史新高。虽然没有明确的催化剂支撑其走强，但资金从表现优异的板块轮动至这一滞后个股可能是主要驱动力。其他方面，金融板块表现不一，消费股普遍承压，但家电板块因业绩稳健表现优于大盘，投资者也在为618购物节提前布局。\n资金流向：我们是1.1倍的净卖方。我们买入 CPO和 PCB，卖出锂电和半导体。", "preview": "交易台 – 高盛中国午盘\n上...\n交易台 – 高盛中国午盘\n上证综指-0.43% 科创50 -2.90%\n上证50 -1.19%.创业板指 -0.98%\n沪深300 -0.90% 中证500 -0.74%\n中国A股总成交额(万亿人民币)：1.99\n中国股市在  千伏及以下开关设备销售贡献49.7% 的毛利，毛利率达 36.9%。\n2025 年 750 千伏及以下变压器销售贡献25.4% 的毛利，毛利率为 36.4%。\n2025 年保护及自动化产品贡献13.5% 的毛利，毛利率 35.1%。\n公司指引 2026 年开关设备毛利率存在上行空间，变压器业务受 2025 年末收购变压器生产工厂影响，毛利率或略有稀释。\n公司超 95% 的变压器产品用于出口，出口业务毛利率高于国内内销业务。\nH 股上市价值：\n思源电气目前正在推进 H 股上市申请，上市后将发布英文年度报告，有助于提升全球品牌认可度与国际影响力。\n公司预计未来 2 至 3 年新增订单与营业收入保持20%-30% 的年均增速。\n公司核心竞争优势体现在三方面：一是产品布局齐全，涵盖一次运维设备、二次测控设备、储能系统以及工程总承包服务；二是销售分销网络覆盖面广，销售人员规模超 400 人；三是服务中心响应高效、服务能力突出。\n目前公司驻外员工人数已超 100 人。\n国内业务营收增长主要依托电网投资支出扩容以及储能系统需求持续攀升。", "preview": "思源电气：香港投资者交流会要点...\n思源电气：香港投资者交流会要点 —— 业务具备可持续性与高增长潜力\n我们近日举办思源电气香港投资者交流会，与公司财务负责人杨哲荣先生交流后，重申对思源电气的买入评级。\n交流会传递的核心观点整体偏正面，主要包含四大要点：\n第一，思源电气持续推进技术与产品升级，立志打造成为中国版 ABB；\n第二，公司规划未来海外收入营收占比从 2025 年的 37% 提升至50% 以上；\n第三，公司毛利率具备可持续维系...", "sectors": ["AI配电"], "companies": ["思源电气"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-10 11:53"]}, {"id": "evidence-240", "content": "我们写的《英特尔的三板斧：CPU、FAB、EMIB》昨晚嘎嘎验证：\n1）5月8日据苹果与英特尔双方的知情人士透露，两家公司已达成初步协议，由英特尔为苹果代工处理器。《华尔街日报》称，双方的谈判已持续一年有余，且在过去数月里敲定了正式协议的最终条款。\n2）5月8日，英特尔公布EMIB封装良率达90%，竞逐台积电CoWoS替代方案。EMIB作为芯片间桥梁，可提升良率、降低功耗与成本，分EMIB-M（增强功率传输）、EMIB-T（适配AI芯片）两种形态。客户包括Meta（2028年底CPU合作），谷歌、英伟达等亦考虑采用。其EMIB-T扩展能力计划2028年提升至光罩尺寸12倍，封装尺寸超120×180，与台积电CoWoS竞争规模化与成本优势，强调兼容多IP与工艺节点。\n3）其实还有全套光互联，宝藏公司，报告里也有哦～\nIntel报告链接：https://mp.weixin.qq.com/s/Dn54ImhD7SCm9ukIlPwGmg\n4）存储讲了N次了，最重要也最简单的一点：目前市场仍然预期在27年中订单被锁定完了，实际上几个大厂是按2028年意向订单（也会上修）一半准备的产能，所以后面会发现其实28年也得锁定完。见硅谷随笔报告链接：https://mp.weixin.qq.com/s/Di5XSvYZrqaUMA-lplBrUg", "preview": "我们写的《英特尔的三板斧：CPU、FAB、EMIB》昨晚嘎嘎验证：\n1）5月8日据苹果与英特尔双方的知情人士透露，两家公司已达成初步协议，由英特尔为苹果代工处理器。《华尔街日报》称，双方的谈判已持续一年有余，且在过去数月里敲定了正式协议的最终条款。\n2）5月8日，英特尔公布EMIB封装良率达90%，竞逐台积电CoWoS替代方案。EMIB作为芯片间桥梁，可提升良率、降低功耗与成本，分EMIB-M（增强功率传输）、EMIB-T（适配AI芯片...", "sectors": ["半导体"], "companies": ["英特尔"], "sources": ["wechat_group_1"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-05-10 15:00"]}, {"id": "evidence-153", "content": "我们此刻正在见证历史。\n很明...\n我们此刻正在见证历史。\n很明显，我       状态.个股 = 名称 || '';
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', async (事件) => {
      const 板块按钮 = 事件.target.closest('[data-板块]');
      if (板块按钮) {
        设板块(板块按钮.dataset.板块);
        return;
      }
      const 个股按钮 = 事件.target.closest('[data-个股]');
      if (个股按钮) {
        设个股(个股按钮.dataset.个股);
        return;
      }
      const 展开按钮 = 事件.target.closest('[data-展开]');
      if (展开按钮) {
        const 卡片 = document.getElementById(展开按钮.dataset.展开);
        if (卡片) {
          卡片.classList.toggle('展开');
        }
        return;
      }
      const 复制按钮 = 事件.target.closest('[data-复制]');
      if (复制按钮) {
        const 卡片 = document.getElementById(复制按钮.dataset.复制);
        const 文本 = 卡片?.querySelector('.正文')?.textContent || '';
        await navigator.clipboard.writeText(文本);
        复制按钮.textContent = '已复制';
        setTimeout(() => {
          复制按钮.textContent = '复制语料';
        }, 1200);
      }
    });

    元素.板块筛选.addEventListener('change', 事件 => {
      状态.板块 = 事件.target.value;
      重绘();
    });

    元素.跳转个股.addEventListener('click', () => {
      const 词 = 元素.个股搜索.value.trim();
      if (!词) return;
      const 精确 = 数据.companies.find(项 => 项.name === 词);
      if (精确) {
        设个股(精确.name);
        return;
      }
      const 模糊 = 数据.companies.find(项 => 项.name.includes(词));
      if (模糊) {
        元素.个股搜索.value = 模糊.name;
        设个股(模糊.name);
      }
    });

    元素.个股搜索.addEventListener('keydown', 事件 => {
      if (事件.key === 'Enter') {
        元素.跳转个股.click();
      }
    });

    读取地址();
    写入统计();
    写入筛选器();
    重绘();
  </script>
</body>
</html>
