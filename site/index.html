<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语料查证器</title>
  <style>
    :root {
      --背景: #f5f5f7;
      --面板: #ffffff;
      --面板浅: #fbfbfd;
      --边框: #d2d2d7;
      --边框强: #c7c7cc;
      --文字: #1d1d1f;
      --次要: rgba(29,29,31,0.72);
      --强调: #0071e3;
      --强调浅: #e8f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--背景);
      color: var(--文字);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .页面 {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .侧栏 {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--边框);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .标题块, .侧块, .主块 {
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .标题块 {
      padding: 18px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }
    .侧块 {
      margin-top: 16px;
      padding: 14px;
    }
    .侧块标题 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }
    .排行列表 {
      display: grid;
      gap: 8px;
    }
    .排行按钮 {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
      color: var(--文字);
      text-align: left;
      cursor: pointer;
    }
    .排行按钮.选中 {
      border-color: var(--强调);
      background: var(--强调浅);
    }
    .排行主行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 620;
    }
    .排行副行 {
      margin-top: 6px;
      font-size: 12px;
      color: var(--次要);
    }
    .主体 {
      min-width: 0;
      padding: 22px;
    }
    .工具条 {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-bottom: 14px;
      background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.9) 75%, rgba(245,245,247,0) 100%);
    }
    .工具格 {
      display: grid;
      grid-template-columns: minmax(260px, .7fr) minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .字段 {
      display: grid;
      gap: 6px;
    }
    .字段标签 {
      font-size: 13px;
      color: var(--次要);
    }
    .输入框, .下拉框, .按钮 {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 14px;
      outline: none;
    }
    .输入框:focus, .下拉框:focus {
      border-color: var(--强调);
      box-shadow: 0 0 0 3px rgba(0,113,227,.16);
    }
    .按钮 {
      cursor: pointer;
      font-weight: 620;
    }
    .按钮.主按钮 {
      background: var(--强调);
      border-color: var(--强调);
      color: #ffffff;
    }
    .统计栏 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .统计卡 {
      padding: 14px;
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .统计名 {
      font-size: 12px;
      color: var(--次要);
      margin-bottom: 8px;
    }
    .统计值 {
      font-size: 28px;
      font-weight: 700;
    }
    .主块 {
      padding: 18px;
    }
    .主块标题行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .主块标题 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .结果数 {
      color: var(--次要);
      font-size: 15px;
    }
    .语料列表 {
      display: grid;
      gap: 14px;
    }
    .语料卡 {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
    }
    .语料头 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }
    .语料编号 {
      font-size: 16px;
      font-weight: 650;
    }
    .语料统计 {
      color: var(--次要);
      font-size: 13px;
    }
    .信息行 {
      margin: 8px 0 0;
      line-height: 1.7;
      font-size: 14px;
      color: var(--文字);
    }
    .信息标题 {
      color: var(--次要);
    }
    .正文 {
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.78;
      font-size: 15px;
      color: var(--文字);
      max-height: 9.2em;
      overflow: hidden;
      position: relative;
    }
    .语料卡.展开 .正文 {
      max-height: none;
    }
    .正文::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(251,251,253,0), rgba(251,251,253,1));
    }
    .语料卡.展开 .正文::after {
      display: none;
    }
    .操作行 {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .小按钮 {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 13px;
      cursor: pointer;
    }
    .空状态 {
      padding: 28px;
      text-align: center;
      border-radius: 8px;
      border: 1px dashed var(--边框强);
      color: var(--次要);
    }
    @media (max-width: 1200px) {
      .页面 {
        grid-template-columns: 1fr;
      }
      .侧栏 {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--边框);
      }
      .工具格 {
        grid-template-columns: 1fr;
      }
      .统计栏 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      .统计栏 {
        grid-template-columns: 1fr;
      }
      .主体, .侧栏 {
        padding: 16px;
      }
    }
  </style>
</head>

划中的奥运村附近，自身介入的天元港国际中心项目地处北京涉外气氛最浓的区域\n50、西昌电力：凉山州一体化经营电力企业，拥有网内水电装机54.85万千瓦，光伏发电项目权益装机3.94万千瓦\n51、华源控股：公司2025年12月完成对暖芯科技51%股权收购，切入半导体温控设备及配套零配件赛道，并合资设立苏州致源真空科技布局分子泵，形成“核心温控设备+配套零配件”一体化体系，产品已导入华润微电子、拓荆科技、广州芯粤能等头部客户\n52、移远通信：公司机器人方案已落地商业服务、医疗、农业、家用、四足及人形机器人等多个领域\n53、澄星股份：国内磷酸龙头；全固态电池关键原料五硫化二磷需由超纯黄磷+硫磺合成，1GW固态电池需450吨黄磷（135吨超纯黄磷），用量为硫化锂的150%；公司为国内黄磷产能第一（18万吨/年），首家生产电子级磷酸的上市公司\n54、中重科技：公司主要产品为智能装备及生产线，产线中包含了智能打包机器人、智能标识机器人、拆辊机器人、码垛机器人等机器人\n55、一彬科技：公司通过参股共青城民生创新智能投资合伙企业（有限合伙）间接投资法奥意威（苏州）机器人系统有限公司，持股比例为1.28%\n56、大唐电信：中国信息通信科技集团旗下，聚焦集成电路设计和特种通信领域；公司已布局低轨卫星通信领域，产品包括卫星通信终端、相控阵天线，成功进入卫星通信市场\n57、恒星科技：公司已完成机器人用高性能钨丝腱绳产品设计、试制并同步送样测试，目标切入人形机器人灵巧手绳驱方案\n58、世嘉科技：1、公司拟通过增资扩股方式取得光彩芯辰浙江科技有限公司不超过20%股权，布局光通信细分赛道；2、公司通过精密箱体系统业务为储能行业下游客户江苏阿诗特能源科技有限公司供应储能柜，在储能领域有产品供应和业务合作\n59、立昂微：从硅片到芯片的一站式制造平台；公司主营业务主要分三大板块，分别是半导体硅片、半导体功率器件芯片、化合物半导体射频芯片；主要产品包括6-12英寸半导体硅抛光片和硅外延片等\n60、万通发展：SD85系列芯片第二款144通道规格的交换芯片已投片，预计将在2026年内实现市场化销售\n61、黄河旋风：公司自主研发的“金刚石—碳化硅复合材料”项目取得重大阶段性成果，核心性能指标达到国际先进水平，成功破解了长期困扰半导体产业的热膨胀失配难题，为我国高端半导体散热技术自主可控提供了关键支撑\n62、中钨高新：公司旗下子公司金洲公司是PCB微钻领域龙头，具备极小径钻头精磨等核心技术\n63、航天电器：公司华旃在昇腾950 cable tray的前期所有测试已经收尾，今日完成测试工具之后今日就能拿到code，有极小概率明日拿到code，目前是小批量供应code，预计月底拿大批量供应code\n64、联检科技：公司为建工建材检测龙头\n65、上海石化：中国石化上海石化联合上海石油化工研究院成功攻克湿法T1000级高性能碳纤维关键技术，并实现批量化生产\n66、恒盛能源：公司采用MPCVD技术生产20×20毫米金刚石，导热性能优于陶瓷，目标切入高功率芯片、GPU散热市场\n67、通富微电：公司是国内第二、全球第四的封测巨头，掌握多种先进封测技术，为 AMD 等国际巨头及华为海思、寒武纪等国内芯片企业提供封测服务\n68、蓝科高新：公司拟1.31亿元购买中国空分51%股权，标的是一家以技术为核心，工程设计、咨询和工程总承包业务并举的专业工程公司，业务领域涉及工业气体制备、天然气液化、低温液体贮运、环保工程和废水深度处理回用、化工工程和能源综合回收利用、自动化控制等\n69、华远控股：公司实控人北京市西城区国资委正在筹划对下属部分企业集团重组，可能涉及控股股东华远集团\n70、顺景科技：公司并非单纯园林标的，通过顺景光通讯（51%控股）深度绑定苏驼通信（49%技术入股），切入5G前传+高速光模块+数据中心配套优质赛道。苏驼作为国家级高新技术企业，拥有170+专利、千万级光模块年产能，是运营商核心供应商，细分赛道实力远超市场认知", "preview": "20260603今日段子汇总\n...\n20260603今日段子汇总\n1、久之洋：公司星体跟踪器已广泛应用于卫星等航天器，并为中国星网配套星载光纤放大器、短波红外相机等核心模块\n2、亨通光电：公司收购J-Fiber，部署特种光纤和数据中心多模光纤产能。公司空芯光纤也在2025年供应链博览会和联通合作伙伴大会展出，性能达到业内领先水平\n3、四环生物：国内最早从事生物医药的公司之一，公司研发项目包括新型干细胞培养技术，目的为通过对干细胞培养技...", "sectors": ["PCB", "光伏", "光模块", "军工", "化工", "医疗", "半导体材料", "商业航天", "国产算力 信友作为华为的二级供应商，在手机摄像头，手机结构防水，笔记本电池控制板的保护等方面为华为的产品提供胶黏剂的应用和解决方案\n14、火炬电子：国内特种 MLCC (片式多层陶瓷电容器) 领先企业；公司正积极拓展商业航天、低空经济供应链，已参与部分客户在商业航天领域的产品配套\n15、郑州煤电：1、实控人河南省国资委；公司是郑州煤炭龙头，拥有部分火电业务，参股公司复晟铝业（持股40%）拥有氧化铝粉产能；2、两大煤矿有望注入公司，未来或新增可采储量16.2亿吨\"\n16、达实智能：1、公司液冷全局优化节能控制系统已用于深圳光明生命科学城大数据中心，并中标国能商贸云计算中心、前海信息枢纽等项目；2、公司达实久信医用物流机器人目前已在多个试点医院落地运行；3、公司与华为在智慧空间领域一直保持着深度合作\n17、鸿远电子：公司为航天领域多层瓷介电容器（MLCC）的主要供应商之一\n18、长飞光纤：全球光纤光缆行业的领先企业；公司空芯技术产能水平领先，并已在相关项目中标\n19、中化国际：公司拟收购南通星辰100%股权，标的核心业务为环氧树脂和工程塑料，主营产品包括双酚A、环氧树脂、聚苯醚（PPE）、聚对苯二甲酸丁二酯（PBT）及系列改性工程塑料\n20、宇环数控：公司智能装备包括工业机器人及智能化成套装备等，为客户提供数字化、网络化的智能制造技术综合解决方案\n21、群兴玩具：公司孙公司图灵引擎科技与腾讯签订了《算力服务协议》，拟向腾讯提供集群算力服务；一季度业绩同比减亏\n22、安邦护卫：1、公司联合温州理工学院科研团队打造了“智能安防中枢平台”，创新性地应用四足机器人技术；2、下属子公司衢州安邦和衢州通航开展的无人机业务包含无人机驾驶员培训（民航培训、警航培训）、低空管制服务、无人机测绘等，公司自主研发的“零距离”空地一体无人机5G飞行平台还运用到消防救援等，均为低空经济范畴\n23、友发集团：公司全资子公司唐山友发参与投资了砺思星沐基金，砺思星沐基金持有沐曦集成电路公开发行前股份632.15万股，持股比例为1.76%\n24、华盛昌：公司拟收购伽蓝特100%股权，后者专注光通信模块和光芯片测试\n25、中大力德：公司核心零部件减速器主要运用于工业机器人和工业自动化场景，包括RV、谐波减速器\n26、深圳华强：公司是华为海思全系列产品代理商\n27、云汉芯城：目前大多数元器件品类价格处于上涨通道，包括存储、MLCC等，公司凭借全球供应网络及与供应商的长期合作，在涨价行情下能优先获取货源并从中受益\n28、东杰智能：公司智能物流装备融合AI、5G技术，已批量应用物流搬运机器人，助力客户打造无人工厂\n29、实益达：1、公司向ASM PT等全球头部客户提供半导体封装测试设备部件，并切入ABL、Signify供应链；2、公司主营LED智能照明产品、智能可穿戴等产品，海外销售占比超7成\n30、长江通信：1、参股公司长飞光纤是世界领先的光纤预制棒、光纤及光缆供应商之一；2、低轨卫星通信是公司重点开拓的新行业之一，公司背靠中国信科，其在星地融合标准制定上发挥了突出的贡献，自R18开始首次实现中国在3GPPNTN的标准立项，目前已累计牵头16项，是全球牵头卫星NTN立项最多的公司\n31、五方光电：公司表示拓展TGV技术在光学领域的应用\n32、阿莱德：公司主营通信设备零部件， 为5G应用开发的零部件产品拥有业内领先的性能，提供的产品包括射频与透波防护器件、 EMI及IP防护器件和电子导热散热器件等，可应用于光模块\n33、东山精密：全球第三的印刷电路板企业、全球第二的柔性线路板企业；在电子电路领域，公司专注于为行业领先的客户提供全方位电子电路（PCB）产品及服务，PCB 业务涵盖刚性、柔性、刚挠结合板等全系列产品\n34、太极实业：DRAM封装龙头；子公司海太半导体的封测业务主要是为SK海力士的DRAM产品提供后工序服务，对12英寸1Z纳米级晶圆进行集成电路封装\n35、博杰股份：1、子公司博捷芯（深圳）半导体有限公司的划片机具备切割玻璃基板的技术能力，划片机已实现微米级定位精度，崩边率控制在1%以内，支持分层划切工艺，可针对不同厚度的玻璃基板提供定制化解决方案；2、子公司博捷芯（深圳）半导体有限公司的划片机已适用于光通信行业，具备磷化铟衬底切割技术能力；参股公司珠海鼎泰芯源产品主要应用于光纤通信、光探测器等领域；3、公司自研液冷散热方案已植入GPU测试设备，面向英伟达、微软、阿里等全球头部服务器厂商供货，并推进从设备向零部件供应的战略转型\n36、XD博威合：公司开发的高强高导高速连接器材料是目前算力服务器所用铜连接的核心材料\n37、继峰股份：公司为国内乘用车座椅头枕细分市场龙头之一，近日成为某新能源汽车主机厂的座椅总成供应商\n38、锡业股份：1、公司从事锡、铜、锌矿的开采、选矿以及锡、铜、锌金属的冶炼和锡的深加工；2、另外拥有铟资源储量5987吨，铟冶炼产能60吨/年\n39、南山控股：房地产+产城综合性开发商\n40、贵研铂业：云南国资委旗下，国内全产业链铂族贵金属相关产品龙头；全资子公司贵研黄金（云南）有限公司主要从事以黄金为主的加工、销售、仓储及租赁服务等业务\n41、金海高科：公司控股股东拟变更为游戏大佬金丹良\n42、江西铜业：公司为国内最大铜精矿和铜加工厂商，主营业务为铜和黄金的采选、冶炼与加工\n43、模塑科技：公司与国内某机器人公司签订采购框架协议并正式获得人形机器人外覆盖件小批量订单，业务正式切入人形机器人赛道\n44、汇源通信：公司光纤、光缆及相关产品业务主要包括研发生产销售ADSS、OPGW特种光缆、预制光缆、气吹微缆、非金属光缆等\n45、永鼎股份：1、公司已经实现了从光芯片-光器件-光模块-系统集成的全产业链布局；2、公司高温超导带材已应用于超导感应加热、超导磁拉单晶、可控核聚变磁体、超导电力装备等领域\"\n46、韶能股份：子公司韶能算电拟出资10亿元设立乐昌全资孙公司开展源网荷储电源业务\n47、三利谱：国内偏光片行业龙头企业之一，国内少数具备TFT-LCD用偏光片生产能力的企业之一，是华为等全球著名终端品牌显示屏材料供应商\n48、凯迪股份：公司是线性驱动系统龙头，网传资料显示，公司招聘电机研发工程师，工作让内容包括负责机器人用伺服电机电磁方案分析及结构方案设计\n49、大胜达：公司与芯瞳半导体及其原股东已于5月19日正式签署Pre-B轮增资及股权转让协议，公司以5.5亿元取得芯瞳半导体22.9831%股权，标的公司是国内专注于通用高性能图形处理器芯片设计研发与销售的先驱企业\n50、金字火腿：全资子公司拟不超过3亿元取得中晟微电子不超过20%股权，后者专注于高速光模块核心电芯片的研发设计\n51、亨通光电：公司收购J-Fiber，部署特种光纤和数据中心多模光纤产能。公司空芯光纤也在2025年供应链博览会和联通合作伙伴大会展出，性能达到业内领先水平\n52、科瑞技术：公司为国内外客户提供超高精密部件、光耦合设备、共晶设备等多款半导体封装及测试设备，光耦合、共晶、芯片AOI设备均已量产\n53、华锋股份：国内少数能向国际市场出口低压化成箔产品的企业之一；公司在超级电容用材料的研发方面有一定的技术储备\n54、美迪凯：1、公司自主开发TGV 玻璃通孔工艺，通过激光诱导与湿法腐蚀实现最小10μm孔径加工，为半导体封测、MEMS及AI芯片3D堆叠提供核心玻璃基板制程能力；2、公司开发了光刻用掩模版衬底并已开始送样，这是光刻工序中的关键耗材。同时，公司为生产需要引进了先进的光刻设备（如用于新产品开发的12英寸90nm节点KrF光刻机）\n55、东睦股份：公司已布局轴向磁通电机，该类电机适用于人形机器人、四足机器狗等领域\n56、华微电子：公司集功率半导体器件设计研发、芯片加工、封装测试及产品营销为一体，拥有多条功率半导体分立器件及 IC 芯片生产线，产品种类覆盖功率半导体器件全部范围\n57、远东股份：1、公司一季报净利润同比增长110.36%，拟定增募资不超20亿元加码AIDC光纤预制棒项目；2、公司为环首都太行山能源信息技术产业基地项目、“全国一体化算力网络”和林格尔数据中心集群绿色能源供给示范项目、阿里巴巴张北云计算数据中心工程等提供高效、节能、安全、环保的创新解决方案；3、公司人形机器人线缆已应用于优必选产品，并送样智元机器人，采用高柔韧性材料，具备抗弯折和扭转性能\n58、鑫科材料：公司布局高速铜连接领域，产品涵盖800G-1.6T的ACC/AEC高速铜连接，并在研1.6T及3.2T高速铜连接项目，为AI与算力中心提供连接解决方案\n59、达利凯普：公司射频微波MLCC市占率全球前五、中国第一\n60、麦格米特：英伟达给钱联合开发下一代液冷电源&规模突破北美主流CSP和国内前三互联网大厂&在英伟达rubin配套的18.5KW模块测试遥遥领先同行，第一个通过，将获得很大份额\n61、香江控股：公司是以商贸流通为主业的广州优质开发商\n62、北投科技：公司“科宝”交通大模型及智检机器人、无人机机巢等成果已落地\n63、圣泉集团：国内领先的 PCB 基板用电子树脂供应商\n64、意华股份：国内少数实现高速连接器量产的企业之一；公司聚焦于5G、6G和光通讯模块的研发制造，具有完整自主知识产权的5GSFP、SFP+系列产品已陆续研发成功并通过关键客户各项性能测试\n65、华远控股：公司实控人北京市西城区国资委正在筹划对下属部分企业集团重组，可能涉及控股股东华远集团\n66、顺景科技：公司并非单纯园林标的，通过顺景光通讯（51%控股）深 效率可达94-96%，1000A 电流下供电损耗约40-60W，降低 60% 以上。例如Rubin VR200 全面采用 VPD 垂直供电架构，配合纳米晶 TLVR 电感，供电效率提升至 96%，单卡节省供电损耗约 100W。\n传统铁氧体材料因饱和磁通密度低、直流叠加特性差等固有缺陷，正逐步在数据中心AI芯片的供电核心中被淘汰，难以主导AI时代的功率电感市场。传统金属软磁材料目前已成为大功率AI芯片电感的核心选择，其饱和磁通密度通常是铁氧体的2倍以上，具备出色的耐大电流能力和高直流叠加特性，能在同等性能下大幅缩小体积，但在超过 2MHz的极高频下，铁损上升较快。而纳米晶材料拥有魔术般的双相（非晶+纳米晶粒）微观结构，其磁导率是传统铁氧体的5倍以上，且在2MHz-5MHz的高频环境下，其铁损（能量损耗）能比金属软磁粉降低 50% 以上，正加速渗透至高阶 AI 服务器（如最新GB300、VR200系列供应链以及未来的华为韬定律供应链），满足极致的小体积与高频要求。\n未来传统金属软磁粉与纳米晶合金电感并非绝对的“有你没我”，两者是互补而非替代关系，会根据 AI 供电架构的不同，形成分层共生的格局。传统金属软磁粉据 AI 电感中低端基本盘，提供稳健增长；高频超小型看“纳米晶”开辟蓝海，提供快速增长。受益标的包括【云路股份】、【安泰科技】、【东睦股份】、【铂科新材】、【龙磁科技】、【悦安新材】。\n风险提示\n1.技术替代与量产工艺风险；\n2.产业链验证与导入周期风险；\n3.商业化落地与成本风险。\n————————————\n欢迎联系华西有色团队及对口销售：\n晏溶（SACNO:S1120519100004）/陈宇文", "preview": "【华西有色晏溶团队】Rubin...\n【华西有色晏溶团队】Rubin与华为韬定律共振，看好传统金属软磁粉与纳米晶合金电感需求增长\n华为韬定律的核心是 \"以时间缩微替代几何缩微\"，在电源系统层面，就是通过纳米晶电感支撑的 VPD+TLVR 架构，将电源系统的等效时间常数从微秒级压缩至纳秒级，解决了AI 算力的最大瓶颈。而英伟达在2026H2即将出货量产的Rubin VR200，伴随着单颗AI芯片的功率逐步飙升（当前Blackwell一代G...", "sectors": ["功率模拟", "有色", "机器人", "核聚变", "稀土"], "companies": ["东睦股份", "云路股份", "安泰科技", "悦安新材", "铂科新材", "龙磁科技"], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 5, "companyRowCount": 6, "timestampCount": 11, "timestamps": ["2026-06-02 23:57"]}, {"id": "evidence-322", "content": "【国金电新】SOFC最新深度：电力缺口催生刚性替代，SOFC跃升为AI数据中心电源新标配\n[太阳]美国AI算力遭遇电网“卡脖子”，自备分布式电源从可选变必选。电网扩容严重滞后，传统燃气轮机交付排至30年，SOFC凭借快速部署、65~90%发电效率、800V直流原生输出等优势，正成为AI数据中心自备电的主流路径，#补贴下经济性拐点已现，产业链景气度全面上行。\n[礼物]传统电源供给瓶颈明显，SOFC获得差异化替代窗口。BE为甲骨文部署仅用55天，而电网扩容需5-13年，燃气轮机交付排至2029年后，SOFC完美填补等不起的电力缺口。\n[礼物]技术优势显著：发电效率高，#800V直流架构直接实现BOS成本系统性节省，物理层面省去大量输配电等设备，#单GW数据中心可节省配电及电力转换等设备开支约13.5-15亿美元。\n[礼物]ITC补贴叠加规模降本，经济性拐点驱动放量。IRA框架下SOFC可享ITC基础抵免30%，叠加条件最高达50%。当前系统成本约2075美元/kW，DOE目标2030年降至900美元/kW以下。燃气轮机涨价背景下，#SOFC补贴后发电总成本已接近平价，经济性拐点确立。\n[玫瑰]投资建议：北美AI缺电逻辑持续兑现，SOFC产业链景气度全面上行。重点布局：1）Bloom Energy核心供应商：三环集团（隔膜）、春晖智控（BE温度传感器）、京泉华（磁性器件）、振华股份（铬盐龙头，两机+SOFC双重受益）；2）SOFC国内企业：潍柴动力、壹石通等。\n联系人：姚遥/唐雪琪\n🔗报告：https://mp.weixin.qq.com/s/TbS9xOVE2SHZwfcJpatoGg", "preview": "【国金电新】SOFC最新深度：电力缺口催生刚性替代，SOFC跃升为A 奏尚未大规模启动，强扩张集中在AI算力和资源安全，收缩集中在电新、地产和化工。2026Q1，134个跟踪品种中强扩张仅17个、放缓27个、收缩39个，收缩品种数量是强扩张的2.3倍。强扩张集中在AI算力链（AI PCB、覆铜板、高速率光模块、氟制冷剂）和资源安全链（钽、镍、钴），但储能系统、风电、镜头模组等品种毛利率已在下行，反映''以价换量''的竞争性扩产特征。与之相对，新能源链截至2026Q1已有8个品种完成供给出清进入左侧，效果已部分在财务数据上体现。\n4）库存呈现AI链景气型全链累库与化工链上下游博弈的分化特征。2026Q1库存结构呈''两端拥挤、中间稀疏''的哑铃结构。AI链高库存伴随极快周转，本质是供需两旺的繁荣型累库；化工链高库存（尿素、PVC、磷化工）是伊以冲突油价脉冲下的成本博弈，上游被动持有高成本库存、下游借机压价，这类背离往往是2-3个季度的短周期现象，会随油价中枢稳定收敛。此外，新能源中游材料链和光伏制造端出现''上游出货快但下游消化慢''的下游堆积，是终端需求增速边际放缓的前瞻信号。\n5）配置上有三条投资主线，建议重点关注化工、有色、AI电力、存储四条链。一是景气加强——AI链的需求加速与供给自律共振，核心矛盾不在需求扩张而在高位毛利能否被龙头供给纪律持续保护，存储凭借原厂供给自律驱动的涨价位居右侧组合首位，光交换机依托''库存中低位+下游低库存+龙头扩产暂未投产''三重信号紧随其后，PCB需警惕12-18个月后产能集中释放；二是周期反转——筛选须同时满足''供给收缩可见+毛利拐点已现''双重门槛，柴油发电机组确定性较强，新能源链的隔膜/碳酸锂/钨/六氟磷酸锂已实现''周转毛利双升''但中游仍需1-2季度需求验证，涤纶长丝/MDI/饲料加工短期受成本变动影响利润兑现节奏；三是逆向策略——''上游硬出清+下游低库存''的叠加会增加胜率，磷化工（Capex收缩+毛利率历史分位低+下游普遍低库存）赔率最佳，煤炭（毛利率分位9%极低+下游钢铁库存较低）次之。\n泛周期比较系列是中信策略推出的特有的从''板块比较''下沉到''品种比较''的行业比较系列报告。本系列通过核心公司定义了200个泛周期品种（科技+传统品种）的需求敞口、供给弹性、估值位置、短期流动性信号与财报数据，旨在筛选基本面与交易位置兼具的配置标的，被动的泛周期轮动策略在报告外发（3.25）后至今累计收益率近30%，同时也是中信证券亮马组合的基础框架。\n🌹欢迎联系中信策略团队 朱立伟", "preview": "【中信策略】涨价、出清与库存博...\n【中信策略】涨价、出清与库存博弈——132个泛周期品种的财报透视（泛周期行业比较系列2）\n报告核心解决的问题是：如何结合海外对标龙头的财报以产业链的视角判断并跟踪中国资产全链的周期位置以及内部的基本面分化。\n1）泛周期行业已进入''AI链扩张景气顶+传统周期供给出清左侧''的二元结构，K型分化严重，超额收益越来越取决于品种选择。我们用276家龙头公司5年21个季度财务数据构建''需求-供给-库存-情...", "sectors": ["化工", "有色金属", "电力设备", "电子"], "companies": [], "sources": ["知识星球_调研纪要"], "sectorRowCount": 4, "companyRowCount": 0, "timestampCount": 4, "timestamps": ["2026-06-03 17:53"]}, {"id": "evidence-184", "content": "【天风电子】AI的尽头是电力效...\n【天风电子】AI的尽头是电力效率，模拟功率周期共振主升浪\n🌟根据台达董事长表示，生成式 AI 快速发展带动全球数据中心建设潮，市场预估至 2028 年全球将新增约 44GW 电力需求，然而电网新增的供电能力仅25GW，电力缺口高达40%。\n🌟未来 AI 机柜功率已朝 600kW 甚至更高规格发展，SST相较传统变压器转换效率可达 98.5%，并可直接将高压电力转换为资料中心所需的 800V 直流架构，目前台达相关方案已进入美国客户验证阶段。\n🌟AI服务器单机功率密度跃升了6至10倍，直接拉动功率器件的需求成倍增长，更催生了对三代半导体在高压高频场景下的迫切需求；同时为保障高算力集群的稳定与能效，模拟芯片成为了突破电力分配、功耗转换与信号完整性物理极限的关键，价值量大幅提升。\n🌟海外厂商涨价延续下半年，TI与英飞凌已发涨价函预计7月再涨价。两家公司作为模拟功率行业风向标，此举彻底夯实了涨价延续的行业共识。\n🌟结论：模拟功率行业正全面受益于周期回升 + 海外巨头涨价 + AI高算力需求爆发 + 国产替代加速的 2【华福电子罗通团队】重视MLCC新一轮预期差：端侧AI正在打开第二增长曲线》\n近期英伟达公布面向Windows系统个人电脑的全新超级芯片RTXSpark。\n从今年秋季开始，戴尔、联想、华硕等全球主流PC厂商，将推出搭载该芯片的笔记本/台式机产品。\n这进一步验证我们此前判断：\nAI对MLCC的拉动，不会只停留在服务器端，\n后续会逐步向PC、手机、XR、机器人、AI眼镜等端侧消费电子扩散。\nAI服务器拉动高端MLCC紧缺，是本轮涨价周期的主线。\nGB200/GB300、NVL72等AI服务器单机MLCC用量大幅提升，\n尤其高容值、小尺寸、低阻抗、高可靠MLCC需求显著增加。\n高端产能被AI服务器占用后，中低端产线被迫转产，带来产能损耗，进一步放大行业供需缺口，推动MLCC全线涨价。\n更大的预期差在于：AIPC开启消费电子升级新周期。\n过去PC升级主要看CPU、GPU、屏幕和存储，\n但AIPC出现后，整机架构正在从“普通办公电脑”向“小型AI工作站”升级。\n高算力SoC、大容量LPDDR统一内存、高速SSD、USB4/PCIe/高速网口等配置增加，\n本质上都会带来更复杂的供电、更强的电流波动管理、更高的滤波和去耦需求，\n对应MLCC单机用量和单颗价值量都有望提升。\n端侧AI将成为MLCC价格上涨的第二支撑\nAI服务器解决的是云端算力，AIPC、AI手机、AI眼镜、AI玩具、机器人解决的是本地推理。\n只要端侧设备开始跑大模型、多模态交互和本地智能体，消费电子主板就会越来越复杂，\n电源管理、内存供电、高速接口和EMI抑制需求都会提升，\nMLCC不再只是传统消费电子复苏逻辑，而是进入“AI赋能后的规格升级逻辑”。\n产业逻辑正在从“AI服务器缺高端料”扩散到“消费电子也要升级用料”。\n这意味着本轮MLCC行情，不能简单类比过去手机补库存，\n而更类似存储周期中的“服务器需求先拉动、终端需求再扩散”。\n服务器端带来高端MLCC紧缺，端侧AI带来消费电子用量和规格提升，两条线共振，有望延长本轮MLCC景气周期。\n传统笔记本单台MLCC用量2000颗，预期AIPC用量激增80%至3000多颗。\n且随着渗透率提升，整体需求将持续增长，26年AIPC渗透率预计超30%，27年有望突破50%\n建议继续重视MLCC板块。\n本轮MLCC涨价不是单一需求拉动，而是AI服务器高端产能挤占+端侧AI消费电子升级+分销库存重估三重共振。\n重点关注具备MLCC产能弹性、产品升级能力，以及被动元件代理分销高弹性的标的：\n火炬电子、昀冢科技、洁美科技、三环集团、风华高科", "preview": "《20260602【华福电子罗...\n《20260602【华福电子罗通团队】重视MLCC新一轮预期差：端侧AI正在打开第二增长曲线》\n近期英伟达公布面向Windows系统个人电脑的全新超级芯片RTXSpark。\n从今年秋季开始，戴尔、联想、华硕等全球主流PC厂商，将推出搭载该芯片的笔记本/台式机产品。\n这进一步验证我们此前判断：\nAI对MLCC的拉动，不会只停留在服务器端，\n后续会逐步向PC、手机、XR、机器人、AI眼镜等端侧消费电子扩...", "sectors": ["军工", "功率模拟", "消费电子"], "companies": ["三环集团", "昀冢科技", "洁美科技", "火炬电子", "风华高科"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 3, "companyRowCount": 5, "timestampCount": 8, "timestamps": ["2026-06-03 08:07"]}, {"id": "evidence-37", "content": "【招商电新】配储成趋势，中压U...\n【招商电新】配储成趋势，中压UPS有望在数据中心迎来规模应用\n1、Fluence BESS被纳入AI数据中心参考架构。\n6月1日，西门子与英伟达、Fluence联合推出符合UL标准的DSX Vera Rubin NVL72 AI数据中心参考架构。架构总容量为136MW，其中IT负载100MW，涵盖了从公用电网（标称 34.5 千伏）接入到中压配电、模块化低压电源模块，最终到机架接口的完整路径。其中，Fluence Smartstack储能系统具备支撑电压和频率穿越、黑启动、电网需求响应和 AI 负载平滑等关键功能，使得AI数据中心能在电力受限的环境中可靠运行并快速扩展。\n2、中压UPS有望在数据中心迎来规模应用。\n中压UPS直接接入中压配电网络，提升供电效率与电能质量，让储能系统更好地与数据中心负载耦合，提升储能响应速度。 PS 增长 12%—16%，自由现金流至少 45 亿美元。\n[庆祝]HPE 本季度的意义不只在于单季超预期，更在于：\nAI基建的“网络层”开始形成独立景气验证，AI 集群建设正在把数据中心网络从服务器附属环节推到更核心的位置，后续交换机、路由、数据中心互联、网络自动化可能成为 AI 基建链条中独立受益方向。\n企业/主权客户正在成为AI系统需求的重要组成部分。HPE 披露 AI 积压订单中主权及企业客户累计订单占比达到 61%；AI 系统新增及期末在手订单主要由企业及主权客户构成。AI 基建客户结构正在变宽，需求端扩展至企业本地部署、主权 AI 及行业私有化等场景。\n风险提示：AI 基建资本开支不及预期；AI 网络、私有云及企业级 AI 系统订单兑现不及预期；Juniper 整合及协同效应释放不及预期；上游零部件供应受限或价格波动；企业及主权客户 AI 部署进度不及预期；行业竞争加剧。", "preview": "HPE FY26Q2 点评：A...\nHPE FY26Q2 点评：AI 网络层景气显性化，企业/主权客户需求释放\n[庆祝]HPE FY26Q2 业绩超预期，进一步验证 AI 基建需求扩散\nFY26Q2收入、盈利、现金流与订单同步改善。公司实现收入 107 亿美元，同比 +40%，高于此前 96—100 亿美元 的收入指引区间；Non-GAAP EPS 为 0.79 美元，同比 +108%，亦显著高于此前 0.51—0.55 美元指引区间...", "sectors": ["计算机", "通信"], "companies": [], "sources": ["知识星球_黑马调研（免费）"], "sectorRowCount": 2, "companyRowCount": 0, "timestampCount": 2, "timestamps": ["2026-06-03 09:07"]}, {"id": "evidence-357", "content": "高盛销售笔记｜台湾企业交流日与...\n高盛销售笔记｜台湾企业交流日与台北电脑展调研反馈\n调研人员刚刚结束为期 2 天的中国台湾实地行程，全程参与本次台湾企业交流日以及台北电脑展相关走访活动。\n整体来看，场内投资者情绪整体偏向亢奋，市场关注点集中在三大核心方向：第一是下游行业需求进入加速上行阶段；第二是全产业链各类产品供应瓶颈问题持续存在，市场针对内存、片式多层陶瓷电容、基板、各厂商产能扩建规划相关疑问数量较多；第三是产品结构升级带动单机价值持续抬升，该增长逻辑目前依旧被市场低估。\n相关产业长期成长逻辑依旧成立，但调研人员开始逐步产生担忧，在台北电脑展落幕之后，板块缺少新的利好催化，行情存在回调可能性。\n台积电后续行情或具备更强韧性，该标的一直是市场资金的配置洼地，同时场内资金还会持续向估值处于低位的个股轮动切换。\n以下是本次台湾企业交流日里，机构投资者问询热度排名前十的相关公司：\n1、精英材料股份有限公司，对接发言人：王健（副发言人）\n2、欣兴电子股份有限公司，对接负责人：许文龙（总监）\n3、联发科股份有限公司，对接人员：李宜芳（投资者关系主管）\n4、鸿海精密工业股份有限公司，对接人员：翁启胜（发言人兼资深副总裁）、源头信息加微陈淑芬（会计部经理）、林怡君（投资者关系团队成员）\n5、京元电子股份有限公司，对接人员：张立翰（董事）、陈季琪（副董事）、曹维拉（投资者关系经理）\n6、日月光投资控股股份有限公司，对接人员：向可翰（投资者关系主管）、吴宜臻（投资者关系部）、廖佳怡（资深投资者关系专员）\n7、致茂电子股份有限公司，对接人员：简珍珍（董事）\n8、信骅科技股份有限公司，对接人员：吴丽丽（发言人）\n9、FOCI 光纤通讯股份有限公司，对接人员：余女士（财务长兼发言人）\n10、联钧光电股份有限公司，对接人员：杨先生（财务长）\n台北电脑展六大核心实地调研结论，本次展会参展厂商总数创下历史新高，大量投资者是第一次到场参与该展会。\n1⃣本届展会主展区里，人工智能服务器代工厂商展台存在感极强，鸿海、纬颖、和硕、神达、技嘉等头部厂商展台面积、现场人流量领跑全馆。\n各家企业集中展出新一代机架、配套中央处理器、高速光互联交换机等硬件产品。\n紧随服务器赛道之后，电源设备与液冷产业链厂商参展热度同样突出，维谛、台达、光宝、健策均亮相参展。\n随着入局产业链的厂商数量不断增多，市场开始讨论，一线与二线硬件厂商之间的业绩分化是否会进一步拉大。\n2⃣多架构平台与先进系统集成成为行业显著变化，全行业芯片架构朝着多元化方向持续拓展。\n虽然英伟达相关产品仍是全场焦点，但搭载超威、英特尔架构的硬件展品占比持续提升。\n行业正在摆脱单一芯片供应商绑定的模式，转向灵活开放的生态定制路线。\n纬颖同时展出适配英伟达、超威两套芯片方案的机架产品，鸿海落地对应两款人工智能服务器机型，迈达特重点展示高速互联显卡产品线源头信息加微，同时面向企业客户落地多芯片平台多元化方案。\n3⃣液冷相关产品被集成进服务器机架，并且能够按照单一客户需求做高度定制化开发。\n伴随芯片设计复杂程度持续走高，液冷产品平均售价有望同步上行；产品渗透率稳步抬升之后，行业出货量也将同步扩容。\n在基板相关环节，健策表示当下行业核心难点集中在封测端的产品测试与集成工作。\n台达、迈达特、纬颖、健策、技嘉都在现场展出自家自研液冷解决方案。\n4⃣共封装光学产业化进程提速，纬颖和艾亚实验室达成合作，把光学引擎、光源元件集成进核心服务器机架，以此实现规模化量产落地，这套产品专门面向下一代超大规模人工智能算力业务开发。\n鸿海现场展出多款光学硬件，包含适配共封装光学交换机的光源器件、1.6T 光模块；技嘉则展出搭载共封装光学方案的高速交换机托盘。\n5⃣智能体人工智能与边缘人工智能成为全行业热议主线，黄仁勋在开幕主题演讲里花费大量篇幅阐述智能体人工智能落地进展，展会现场也落地多款对应产品演示。\n配套专用处理器产品为满足智能体落地需求应运而生，边缘人工智能同样是高频亮相的细分方向。\n技嘉展出本地人工智能系统硬件，可搭载超 2000 亿参数大模型；宜鼎国际、镁光同步展出适配数据中心算力加速的模块化服务器产品。\n6⃣黄仁勋前一日在机构午餐会上的发言引发全市场热议，整体发言基调极度乐观。\n他公开表态迈威尔科技将会成长为下一家万亿市值的公司，消息落地后迈威尔科技单日股价大涨 32%。\n该利好同样带动中国台湾全产业链盘面情绪回暖，迈威尔对应的台系供应链包含智邦、欣兴、景硕、台积电以及通路商文晔科技，相关信息由高盛中国台湾销售团队黄女士整理。\n分细分赛道市场情绪复盘\n1⃣在全行业所有细分方向中，内存是全市场共识度最高的多头配置赛道，市场针对相关机构调整市盈率估值方法这件事，没有出现明显的质疑声音。\n2⃣内存、片式多层陶瓷电容、基板仍是全产业链核心供给瓶颈。\n片式多层陶瓷电容板块关注度居高不下，村田制作所即将上调产品售价的消息收获市场最为乐观的反馈。\n综合产品品质、估值两项要素考量，机构认为资金从日本、韩国、中国台湾本土厂商转向国内相关标的，性价比不足，不具备配置吸引力。\n3⃣但当前片式多层陶瓷电容板块估值已经来到历史高位区间，市场开始延伸讨论硅片、二极管紧缺问题，涉及相关厂商包含信越、环球晶圆、联电、世界先进、德州仪器、英飞凌、瑞萨电子。\n4⃣亚马逊云科技供应链同样是资金青睐的热门主线，投资者认为自研芯片的产品价值仍被市场低估，产品设计高度契合未来大模型推理端算力需求。\n亚马逊云科技国内配套供应链包含英业达、广达电脑、世芯电子、智邦科技。\n5⃣光学板块市场观点出现明显分歧，源 头 信 息加微一部分投资者依旧看好赛道未来 2 至 3 年具备全市场最大上涨空间，重点看好联亚光电、联钧光电、讯芯科技、上诠光纤等行业龙头。\n还有部分投资者因为上月板块盈利预期抬升、年内股价累计涨幅偏高，开始担忧共封装光学产业落地节奏不及预期。\n联钧光电表示，跟随下游客户量产排产进度，共封装光学芯片封装产能有望在 2026 年下半年逐步放量，现阶段业务重心集中在共封装光学芯片配套插槽产品供应。", "preview": "高盛销售笔记｜台湾企业交流日与...\n高盛销售笔记｜台湾企业交流日与台北电脑展调研反馈\n调研人员刚刚结束为期 2 天的中国台湾实地行程，全程参与本次台湾企业交流日以及台北电脑展相关走访活动。\n整体来看，场内投资者情绪整体偏向亢奋，市场关注点集中在三大核心方向：第一是下游行业需求进入加速上行阶段；第二是全产业链各类产品供应瓶颈问题持续存在，市场针对内存、片式多层陶瓷电容、基板、各厂商产能扩建规划相关疑问数量较多；第三是产品结构升级带动单机...", "sectors": ["电子"], "companies": ["FOCI光纤通讯", "上诠光纤", "世芯电子", "京元电子", "信骅科技", "健策", "光宝", "台积电", "台达", "和硕", "广达电脑", "技嘉", "文晔科技", "日月光投资控股", "景硕", "智邦", "智邦科技", "欣兴电子", "神达", "纬颖", "维谛", "联亚光电", "联发科", "联钧光电", "致茂电子", "英业达", "讯芯科技", "迈达特", "鸿海精密"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 29, "timestampCount %，CPO 属于算力基建赛道，并非小众细分市场。\n多家头部科技公司已经落地相关布局：\n英伟达推出基于 CPO 方案的 Quantum-X Infiniband 交换机，整机带宽 409.6Tb/s，搭载 512 个端口，单端口速率 800Gb/s，产品计划在 2026 年正式商用落地，该产品正在树立行业相关技术标准。\n安费诺联合 Meta 完成 100 万链路小时稳定性测试，实现零链路抖动，产品可靠性完成商业化验证。\n各产业链代表公司布局详情：\n▫POET：全光子集成路线标的，2025 年 5 月完成 4 亿美元机构融资，收获来自 Lumilens 合计 5000 万美元初始采购订单，附带 5 年框架协议总金额 5 亿美元，同期和 LITEON、Lessengers 的合作协议在 2026 年一季度敲定，Blazar 混合激光器成为 CPO 光源的热门选型，产品迭代目标从 800G 向 1.6T 及更高速率升级；\n▫COHR：垂直腔面发射激光器、光电集成芯片、模块龙头；\n▫CRDO：互连层面光学 DSP 与串行解串芯片龙头；\n▫MRVL：面向定制化 AI 专用芯片的光电集成厂商；\n▫AAOI：数据中心收发器核心标的；\n▫IQEPF：覆盖全产业链的化合物半导体晶圆供应商。\n完整 CPO 全产业链技术分层：\n光源环节：POET、COHR、LITE；\n光子中介层：POET 旗下 Optical Interposer 产品；\n先进封装：2.5D/3D 芯片架构；\n交换芯片 + CPO：英伟达、安费诺、MRVL；\n光学 DSP / 串行解串：CRDO、MRVL；\n光模块 + 光收发：AAOI、COHR、LITE；\n晶圆原材料：IQEPF、SIIVF、AXTI。\n产业链每一个细分环节都存在对应投资机会，各环节的投资风险属性各不相同，但全产业链共享同一个产业上行逻辑。\n产业现存潜在风险：行业仍处在发展早期，全场景规模化 CPO 批量部署大概率延后至 2027 至 2028 年；高精度透镜规模化量产落地难度偏大；封装配套方案的标准化统一周期或将延续至 2029 年；零部件供应链存在规格碎片化带来的经营风险。", "preview": "CPO 行业是当下算力产业链里...\nCPO 行业是当下算力产业链里的关键瓶颈环节。\n当下全市场资金目光基本都聚焦在 GPU 产品身上。\n行业关注点集中在半导体、内存硬件，但绝大多数人忽略了各类硬件之间的连接链路，链路互联正是 AI 算力发展的下一个核心瓶颈。\n在超大算力 AI 集群内部，数以万计的 GPU 需要不间断互通数据，AI 算力集群正被海量的数据交互需求制约。\n算力本身已经不再是限制 AI 发展的短板，硬件互联能力才是现阶段的...", "sectors": ["CPO"], "companies": ["AAOI", "COHR", "CRDO", "IQEPF", "MRVL", "POET"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 6, "timestampCount": 7, "timestamps": ["2026-06-03 21:37"]}, {"id": "evidence-291", "content": "【龙头#儒意电影002739与...\n【龙头#儒意电影002739与TME达成深度合作】\n事件：2026年6月3日，儒意电影与腾讯音乐娱乐集团（TME）宣布正式达成深度战略合作。双方将依托各自在影视内容及音乐生态的核心优势，在“影音IP”衍生开发、宣发资源联动、线下场景共建等领域展开多维度合作。\n1、儒意电影+TME，将充分整合儒意电影丰富的影视IP储备与内容创作优势，带来更具沉浸感、更高品质的视听内容体验。儒意电影+TME，将探索“影音IP”双向衍生开发，围绕核心IP开发创新内容形态，共同促进行业内容创新升级。\n2、从万达电影更名为儒意电影，从“地产系院线”向“内容驱动型娱乐集团”的战略转型与新启，打造“超级场景+超级IP”；时光卡藏将作为核心战略平台，#推动TCG卡牌成为继潮玩之后的第二大非票增长极，拟举办全国性TCG赛事，打造“中国影城卡牌第一品牌”，已推出#数字确权平台Rtime Link，通过IP潮玩与数字资产的创新绑定，推动版权运营迈向数智化新阶段。\n3、儒意电影2026-2028年归母净利润拟12.22、15.36、18.08亿元（对应190亿市值的PE分别为15、12、11倍），当下建议积极关注。同时迎暑假经济也可积极关注#恺英网络002517、姚记科技002605、奥飞娱乐002292、美图（6月17日将举办 群体对应的差异化业务增速，开展业绩测算工作。\n🖥️ 维拉中央处理器业务发展机遇\n🌟 黄仁勋指出中央处理器赛道将成为英伟达全新增量市场，对应潜在市场空间规模达2000 亿美元，这也是英伟达此前从未涉足的业务领域。\n📌 他明确表示，传统中央处理器市场发展已久，但适配人工智能智能体的中央处理器属于尚未被挖掘的蓝海市场，而英伟达正在开辟这条赛道。\n🤝 高管在主题演讲中透露，全球头部超大规模云厂商与系统整机厂商均已和英伟达达成合作，推进相关产品落地部署。\n💡 针对本财年 200 亿美元的中央处理器营收目标，本次财报问答环节补充了细节说明，该营收统计范围同时包含前端节点硬件以及用于数据处理器的中央处理器。\n📑 英伟达测算，在布莱克韦尔与鲁宾产品合计超 1 万亿美元增量订单里，中央处理器相关业务位列增量贡献第二名，仅次于后续的 LPX 产品。\n🎮 光线追踪产品线的新动向\n💡 针对本地端人工智能的市场质疑，黄仁勋解释，本地设备搭载智能体运行模式能够重构个人电脑的使用逻辑。\n🖱️ 这类本地端电脑可以依托智能体程序自主完成各类操作任务，他还补充，未来所有的边缘终端设备都会搭载智能体人工智能技术。\n🔗 黄仁勋对迈威尔科技的相关评价\n📰 在台北电脑展同期的场外交流活动中，黄仁勋看好迈威尔科技，称其有潜力成长为下一家万亿市值公司。\n⚙️ 迈威尔的网络与互联芯片是数据中心的刚需产品，数据中心内海量互联芯片需要快速交互数据，离不开这类硬件支撑。\n💵 此前英伟达已经敲定对迈威尔合计 20 亿美元的投资计划。\n📈 迈威尔首席执行官马特・墨菲表示人工智能基础设施发展会接连遭遇多轮技术瓶颈，最先受限的是算力资源，其次是存储硬件。\n🔍 行业下一轮瓶颈将落在互联传输环节，而从铜质互联向光电互联转型，正是迈威尔耗时 10 年打磨的核心创新方向。\n🔌 铜线向光纤的技术迭代：不同传输距离需要差异化的光电互联方案\n📏 机柜级别的互联场景会逐步全面切换为光学方案，铜线材质已经无法满足高带宽传输的长线传输需求。\n🎤 黄仁勋在现场演讲以及财报问答环节中也印证了上述观点，他阐述未来硬件会采用混合架构。\n📌 产品落地将分两个阶段推进，第一阶段先用铜线方案完成规模化量产，待规模进一步铺开后，再全面切换为光学互联方案。", "preview": "📑英伟达公司（维持买入评级）｜...\n📑英伟达公司（维持买入评级）｜台北电脑展第 2 日：资本规划、迈威尔与共封装光学相关要点\n💼 花旗机构观点\n📝 英伟达在 2026 台北电脑展期间举办了由首席执行官黄仁勋出席的金融分析师问答交流会，相关首日核心内容可查阅前一日纪要。\n📞 我们在本次分析师问答环节结束后，还与英伟达负责投资者关系及战略财务的副总裁针谷治进行了沟通交流，下文为本次调研整理得出的全部关键信息。\n💰 股东回报与资本分配相关内...", "sectors": ["半导体"], "companies": ["英伟达", "迈威尔科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 2, "timestampCount": 3, "timestamps": ["2026-06-03 08:35"]}, {"id": "evidence-146", "content": "📰 【通向AGI】2026年0...\n📰 【通向AGI】2026年06月02日 AI大模型晚间速递\n佛罗里达州总检察长Uthmeier对OpenAI及CEO Sam Altman提起全美首例州级诉讼，指控公司明知ChatGPT存在安全风险却隐瞒并推向市场，\"完全漠视人命\"；引用FSU枪击案和USF谋杀案中嫌犯曾向ChatGPT咨询犯罪细节，要求数十亿美元民事罚款及永久禁令。（AP / Reuters | 6月2日）\nProject Glasswing扩展至约150个组织，覆盖15+国家电力、水务、医疗、通信等关键基础设施行业；首批50个合作伙伴已用Mythos发现超10,000个高危零日漏洞，欧盟网络安全局ENISA首次获邀加入。（Anthropic / AFP / The Next Web | 6月2日）\nAnthropic保密向SEC提交S-1注册草案，正式启动IPO进程；此前刚完成650亿美元H轮融资，估值达9,650亿美元。（Anthropic | 6月1日）\nThe Verge评测称Gemini Spark是\"最令人印象深刻也最可怕的AI体验\"，该AI Agent展现出极强自主规划与执行能力。（The Verge | 6月2日）\nAlphabet通过发行股票等方式筹集800亿美元资金用于AI支出计划，包括与B mestampCount": 2, "timestamps": ["2026-06-03 08:11"]}, {"id": "evidence-106", "content": "[福]【奥海科技】：错过了麦格...\n[福]【奥海科技】：错过了麦格米特和欧陆通，不要错过170亿的奥海科技\n[红包]类比24年的麦格米特、25年的欧陆通，奥海科技仍处低位\n◆还记得24年10月17日的麦格米特吗，那天麦米的收盘价是30.75，市值179亿。后续的连续涨停只因为麦米进了英伟达的RVL，24年麦格米特的净利润4.36亿元，期末现金及等价物为13亿元。\n◆还记得25年8月8日的欧陆通吗，那天欧陆通的收盘价是96.97，市值148亿元。后续连续大阳线，是因为欧陆通PSU进入谷歌供应链，25年欧陆通的净利润2.44亿元，期末现金及等价物为8.9亿元。\n◆我们再来看奥海科技，今天收盘价62.00，市值171亿元，25年奥海科技的净利润4.22亿元，期末现金及等价物8.5亿元。\n[红包]AI服务器电源新晋生力军，NV、谷歌均有布局\n◆奥海最近有哪些变化：技术上引入国内Tier 1研发团队（1）NV：2026年4月初董事长带队对接，正在开发30kW PSU产品，目标26Q3进入NV RVL（成功导入后将成为大陆麦格米特后唯二的RVL厂商）（2）谷歌：已在为其定制开发5.5kW模块，该项目2026年启动，5.5kW模块预计2027年底前可实现出货。此前公司已与谷歌在消费电子领域（pixel手机、chromebook笔记本、IoT智能音箱等）合作多年，采购端合作基础良好。\n◆行业最近有哪些变化：MGX整机柜800V核心配电（PDB），光宝落选不在主力供货名单上，那么份额自然落到了麦格米特身上，奥海现在做的是30kW的PSU，按照麦米进入英伟达供应链和拿到订单的时间周期，奥海的30kW PSU针对的是下一代产品，提前根据产业趋势去布局产品，看好未来英伟达PSU的前三供应商出现奥海的名字。同时公司积极对接谷歌，同时具备欧陆通的潜质。", "preview": "[福]【奥海科技】：错过了麦格...\n[福]【奥海科技】：错过了麦格米特和欧陆通，不要错过170亿的奥海科技\n[红包]类比24年的麦格米特、25年的欧陆通，奥海科技仍处低位\n◆还记得24年10月17日的麦格米特吗，那天麦米的收盘价是30.75，市值179亿。后续的连续涨停只因为麦米进了英伟达的RVL，24年麦格米特的净利润4.36亿元，期末现金及等价物为13亿元。\n◆还记得25年8月8日的欧陆通吗，那天欧陆通的收盘价是96.97，市值1...", "sectors": ["消费电子"], "companies": ["奥海科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-06-03 08:16"]}, {"id": "evidence-107", "content": "[红包]【鑫科材料600255...\n[红包]【鑫科材料600255】黄仁勋钦点万亿迈威尔核心伙伴！1.6T DSP+高速铜缆双王炸，低位预期差之王🔥\n1.6T光模块\n核心逻辑：\n黄仁勋重磅喊话：Marvell将成为下一个万亿美元公司，美股一夜暴涨超27%！鑫科材料子公司拓鑫智连，A股唯一深度绑定Marvell+博通双寡头，1.6T高速铜缆+DSP全方案落地，800G量产、1.6T小批量送样，直接吃满AI连接大周期红利，低位严重低估！\n[红包]一、绑定万亿迈威尔，1.6T双DSP方案稀缺到极致\n拓鑫智连是A股极少数拿到Marvell、博通原厂资源的高速互连厂商：\n- ACC 1.6T：与Marvell联合定制开发，已进入样品小批量阶段；\n- AEC 1.6T：同时搭载Marvell 5nm + 博通3nm双顶级DSP，全球稀缺；\n- 400G/800G：全线采用Marvell DSP方案，稳定量产，批量供货海外。\nDSP是光模块第一成本项，单颗1.6T价值近100美金，公司直接卡位产业链最赚钱环节。\n[红包]二、全速率全覆盖，AI算力“能用铜就用铜”最正宗标的\n公司DAC/ACC/AEC三大系列，10G—1.6T全速率打通，完美契合黄仁勋“铜缆优先”战略：\n- DAC：全速率量产，AI机柜短距互连刚需；\n- ACC：400G/800G大批量出货，1.6T与Marvell深度绑定；\n- AEC：400G/800G量产，1.6T双DSP送样验证。\n自研均衡芯片，延迟＜100ps，比同行低50%，成本优 ": ["2026-06-03 08:12"]}, {"id": "evidence-276", "content": "【潍柴动力】深度跟踪——气发后...\n【潍柴动力】深度跟踪——气发后市场潜力广阔，SOFC打开长期成长空间\n#美国电力公司26Q1业绩大面积超预期、龙头上调产能指引\n北美主要电力设备企业如 GEV、Caterpillar、Cummins、Bloom Energy、Generac 等2026年一季度业绩普遍超预期，并同步上调全年收入与利润指引。同时，全球柴发与气发龙头纷纷宣布扩产，卡特彼勒计划到 2030 年将大型发动机产能提升至 2024 年的三倍，康明斯则提出将发电业务产能由 30GW 提升至 55GW。验证了 AIDC带动下的电力需求持续高景气。\n#气发后市场潜力广阔、长期服务利润超过设备利润\n天然气发电机组作为AIDC主供电源，通常全年高负荷运行，气发业务的后市场维保需求显著提升，每年维保费用约占设备初始购置成本的 6%-10%，全生命周期维保价值量可达到设备售价的 60%-150%。国际龙头企业中，服务业务已经成为利润的重要来源，例如 Caterpillar 2024 年服务收入占总收入比重已达到 37%。后市场业务具备持续性强、利润率高、现金流稳定等特点，服务业务有望逐步成为公司长期利润增长的重要支撑。我们测算公司每卖出一台天然气发电机组，其包括后市场服务的现金流的折现值有望达到578万元。\n#SOFC前景广阔、Ceres与Centrica达成数GW战略合作\nCeres已与英国能源巨头 Centrica 达成战略合作，计划在英国和欧洲部署数 GW 独立电网系统，重点面向 AI 数据中心、电力基础设施等场景，并进一步探索“SOFC+氢能+核能”的综合能源体系。公司此前已获得 Ceres 的 SOFC 全面技术授权，并于近期持续扩大 SOFC 研发与人才投入。\n考虑气发有望在明年的快速上量，我们上调公司2026/2027/2028年净利润预测为146/183/225亿元。估值有望对标卡特和康明斯（26E 35、23PE），给与25倍PE，目标价3600亿元。维持重点推荐。\n我们认为潍柴现在是有安全边际的，因为市场的预期没有很满\n当前市场的估值是基于26-27年的，而且估值仅17-20倍。而当前欧美和国内的电力公司很多的估值已经按照28年给30倍估值\n如果按照卡特彼勒类似的28E SOTP估值，则公司的估值有望看到4500亿左右\n气发订单的获取和SOFC的合作都有望成为公司后续市值的重要催化剂", "preview": "【潍柴动力】深度跟踪——气发后...\n【潍柴动力】深度跟踪——气发后市场潜力广阔，SOFC打开长期成长空间\n#美国电力公司26Q1业绩大面积超预期、龙头上调产能指引\n北美主要电力设备企业如 GEV、Caterpillar、Cummins、Bloom Energy、Generac 等2026年一季度业绩普遍超预期，并同步上调全年收入与利润指引。同时，全球柴发与气发龙头纷纷宣布扩产，卡特彼勒计划到 2030 年将大型发动机产能提升至 202...", "sectors": ["AI配电"], "companies": ["潍柴动力"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-06-03 13:01"]}, {"id": "evidence-92", "content": "【瀚蓝环境】并购草案落地，增大...\n【瀚蓝环境】并购草案落地，增大现金收购比例，EPS进一步增厚！\n⭕本次与上次预案 在于收购臻达的粤丰剩余股权由4亿发股+4.38亿现金改为8.38亿纯现金收购！\n⭕ 粤丰环保评估值116.0亿元，较上次收购时对价111.6亿元，增长4.0%。\n⭕交易细节：整体交易对价约30亿元（17亿现金+13亿股票，其中大股东南控全换股，恒健2.16亿换股），引入恒健成为股东，利于后续整合，公司支付臻达的对价为8. 38亿元，为纯现金支付（预案为4亿发股+现金），利于增厚EPS；配套募集资金不超过12亿元维持不变。\n⭕测算得若假设2027年100%并表，此次并购相比2027年并表52.44%的情况，#当年累计收益率增厚6.1%（EPS+5.7%，股息率+0.4%），#较上版预案当年收益率增厚1.9%~\n⭕当前拿至2027年底的累计收益空间由30.5%提升至32.4%，持续看好公司投资价值！", "preview": "【瀚蓝环境】并购草案落地，增大...\n【瀚蓝环境】并购草     };

    function 转义(文本) {
      return String(文本 ?? '').replace(/[&<>"]/g, 字 => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[字]);
    }

    function 写入统计() {
      const 汇总 = 数据.summary;
      元素.去重语料数.textContent = 数字.format(汇总.uniqueEvidenceCount);
      元素.板块输出数.textContent = 数字.format(汇总.sectorRowCount);
      元素.个股输出数.textContent = 数字.format(汇总.companyRowCount);
    }

    function 写入筛选器() {
      元素.板块筛选.innerHTML = ['<option value="">全部板块</option>']
        .concat(数据.sectors.map(项 => `<option value="${转义(项.name)}">${转义(项.name)}</option>`))
        .join('');
      元素.个股列表.innerHTML = 数据.companies
        .map(项 => `<option value="${转义(项.name)}"></option>`)
        .join('');
    }

    function 写入排行() {
      元素.板块排行.innerHTML = 数据.sectors.slice(0, 14).map(项 => `
        <button class="排行按钮 ${状态.板块 === 项.name ? '选中' : ''}" data-板块="${转义(项.name)}">
          <div class="排行主行"><span>${转义(项.name)}</span><span>${数字.format(项.outputCount)} 条</span></div>
          <div class="排行副行">支撑语料 ${数字.format(项.evidenceCount)} 条</div>
        </button>
      `).join('');
      元素.个股排行.innerHTML = 数据.companies.slice(0, 14).map(项 => `
        <button class="排行按钮 ${状态.个股 === 项.name ? '选中' : ''}" data-个股="${转义(项.name)}">
          <div class="排行主行"><span>${转义(项.name)}</span><span>${数字.format(项.outputCount)} 条</span></div>
          <div class="排行副行">支撑语料 ${数字.format(项.evidenceCount)} 条</div>
        </button>
      `).join('');
    }

    function 取结果() {
      return 数据.evidences.filter(语料 => {
        if (状态.板块 && !语料.sectors.includes(状态.板块)) return false;
        if (状态.个股 && !语料.companies.includes(状态.个股)) return false;
        return true;
      });
    }

    function 写入结果() {
      const 结果 = 取结果();
      元素.结果数.textContent = `当前结果 ${数字.format(结果.length)} 条`;
      if (!结果.length) {
        元素.语料列表.innerHTML = '<div class="空状态">没有找到支撑语料。</div>';
        return;
      }
      元素.语料列表.innerHTML = 结果.map((语料, 序号) => `
        <article class="语料卡" id="${语料.id}">
          <div class="语料头">
            <div class="语料编号">语料 ${序号 + 1}</div>
            <div class="语料统计">板块行数 ${数字.format(语料.sectorRowCount)}　个股行数 ${数字.format(语料.companyRowCount)}</div>
          </div>
          <div class="信息行"><span class="信息标题">板块：</span>${转义(语料.sectors.join('、') || '无')}</div>
          <div class="信息行"><span class="信息标题">个股：</span>${转义(语料.companies.join('、') || '无')}</div>
          <div class="正文">${转义(语料.content)}</div>
          <div class="操作行">
            <button class="小按钮" data-展开="${语料.id}">展开 / 收起</button>
            <button class="小按钮" data-复制="${语料.id}">复制语料</button>
          </div>
        </article>
      `).join('');
    }

    function 同步控件() {
      元素.板块筛选.value = 状态.板块;
      元素.个股搜索.value = 状态.个股;
    }

    function 写入地址() {
      const 参数 = new URLSearchParams();
      if (状态.板块) 参数.set('板块', 状态.板块);
      if (状态.个股) 参数.set('个股', 状态.个股);
      history.replaceState(null, '', `${location.pathname}#${参数.toString()}`);
    }

    function 读取地址() {
      const 片段 = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      const 参数 = new URLSearchParams(片段);
      状态.板块 = 参数.get('板块') || '';
      状态.个股 = 参数.get('个股') || '';
    }

    function 重绘() {
      同步控件();
      写入排行();
      写入结果();
      写入地址();
    }

    function 设板块(名称) {
      状态.板块 = 名称 || '';
      if (状态.个股) {
        const 个股 = 数据.companies.find(项 => 项.name === 状态.个股);
        if (个股 && 状态.板块 && !个股.sectors.includes(状态.板块)) {
          状态.个股 = '';
        }
      }
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function 设个股(名称) {
      状态.个股 = 名称 || '';
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', async (事件) => {
      const 板块按钮 = 事件.target.closest('[data-板块]');
      if (板块按钮) {
        设板块(板块按钮.dataset.板块);
        return;
      }
      const 个股按钮 = 事件.target.closest('[data-个股]');
      if (个股按钮) {
        设个股(个股按钮.dataset.个股);
        return;
      }
      const 展开按钮 = 事件.target.closest('[data-展开]');
      if (展开按钮) {
        const 卡片 = document.getElementById(展开按钮.dataset.展开);
        if (卡片) {
          卡片.classList.toggle('展开');
        }
        return;
      }
      const 复制按钮 = 事件.target.closest('[data-复制]');
      if (复制按钮) {
        const 卡片 = document.getElementById(复制按钮.dataset.复制);
        const 文本 = 卡片?.querySelector('.正文')?.textContent || '';
        await navigator.clipboard.writeText(文本);
        复制按钮.textContent = '已复制';
        setTimeout(() => {
          复制按钮.textContent = '复制语料';
        }, 1200);
      }
    });

    元素.板块筛选.addEventListener('change', 事件 => {
      状态.板块 = 事件.target.value;
      重绘();
    });

    元素.跳转个股.addEventListener('click', () => {
      const 词 = 元素.个股搜索.value.trim();
      if (!词) return;
      const 精确 = 数据.companies.find(项 => 项.name === 词);
      if (精确) {
        设个股(精确.name);
        return;
      }
      const 模糊 = 数据.companies.find(项 => 项.name.includes(词));
      if (模糊) {
        元素.个股搜索.value = 模糊.name;
        设个股(模糊.name);
      }
    });

    元素.个股搜索.addEventListener('keydown', 事件 => {
      if (事件.key === 'Enter') {
        元素.跳转个股.click();
      }
    });

    读取地址();
    写入统计();
    写入筛选器();
    重绘();
  </script>
</body>
</html>
