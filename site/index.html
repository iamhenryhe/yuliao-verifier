<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语料查证器</title>
  <style>
    :root {
      --背景: #f5f5f7;
      --面板: #ffffff;
      --面板浅: #fbfbfd;
      --边框: #d2d2d7;
      --边框强: #c7c7cc;
      --文字: #1d1d1f;
      --次要: rgba(29,29,31,0.72);
      --强调: #0071e3;
      --强调浅: #e8f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--背景);
      color: var(--文字);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .页面 {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .侧栏 {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 18px;
      border-right: 1px solid var(--边框);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .标题块, .侧块, .主块 {
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .标题块 {
      padding: 18px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }
    .侧块 {
      margin-top: 16px;
      padding: 14px;
    }
    .侧块标题 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }
    .排行列表 {
      display: grid;
      gap: 8px;
    }
    .排行按钮 {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
      color: var(--文字);
      text-align: left;
      cursor: pointer;
    }
    .排行按钮.选中 {
      border-color: var(--强调);
      background: var(--强调浅);
    }
    .排行主行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 620;
    }
    .排行副行 {
      margin-top: 6px;
      font-size: 12px;
      color: var(--次要);
    }
    .主体 {
      min-width: 0;
      padding: 22px;
    }
    .工具条 {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-bottom: 14px;
      background: linear-gradient(180deg, rgba(245,245,247,.96) 0%, rgba(245,245,247,.9) 75%, rgba(245,245,247,0) 100%);
    }
    .工具格 {
      display: grid;
      grid-template-columns: minmax(260px, .7fr) minmax(320px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .字段 {
      display: grid;
      gap: 6px;
    }
    .字段标签 {
      font-size: 13px;
      color: var(--次要);
    }
    .输入框, .下拉框, .按钮 {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 14px;
      outline: none;
    }
    .输入框:focus, .下拉框:focus {
      border-color: var(--强调);
      box-shadow: 0 0 0 3px rgba(0,113,227,.16);
    }
    .按钮 {
      cursor: pointer;
      font-weight: 620;
    }
    .按钮.主按钮 {
      background: var(--强调);
      border-color: var(--强调);
      color: #ffffff;
    }
    .统计栏 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .统计卡 {
      padding: 14px;
      border: 1px solid var(--边框);
      border-radius: 8px;
      background: var(--面板);
    }
    .统计名 {
      font-size: 12px;
      color: var(--次要);
      margin-bottom: 8px;
    }
    .统计值 {
      font-size: 28px;
      font-weight: 700;
    }
    .主块 {
      padding: 18px;
    }
    .主块标题行 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .主块标题 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .结果数 {
      color: var(--次要);
      font-size: 15px;
    }
    .语料列表 {
      display: grid;
      gap: 14px;
    }
    .语料卡 {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板浅);
    }
    .语料头 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }
    .语料编号 {
      font-size: 16px;
      font-weight: 650;
    }
    .语料统计 {
      color: var(--次要);
      font-size: 13px;
    }
    .信息行 {
      margin: 8px 0 0;
      line-height: 1.7;
      font-size: 14px;
      color: var(--文字);
    }
    .信息标题 {
      color: var(--次要);
    }
    .正文 {
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.78;
      font-size: 15px;
      color: var(--文字);
      max-height: 9.2em;
      overflow: hidden;
      position: relative;
    }
    .语料卡.展开 .正文 {
      max-height: none;
    }
    .正文::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(251,251,253,0), rgba(251,251,253,1));
    }
    .语料卡.展开 .正文::after {
      display: none;
    }
    .操作行 {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .小按钮 {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--边框);
      background: var(--面板);
      color: var(--文字);
      font-size: 13px;
      cursor: pointer;
    }
    .空状态 {
      padding: 28px;
      text-align: center;
      border-radius: 8px;
      border: 1px dashed var(--边框强);
      color: var(--次要);
    }
    @media (max-width: 1200px) {
      .页面 {
        grid-template-columns: 1fr;
      }
      .侧栏 {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--边框);
      }
      .工具格 {
        grid-template-columns: 1fr;
      }
      .统计栏 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      .统计栏 {
        grid-template-columns: 1fr;
      }
      .主体, .侧栏 {
        padding: 16px;
      }
    }
  </style>

tamps": ["2026-04-14 12:47"]}, {"id": "evidence-116", "content": "【华西有色晏溶团队】专项推荐--预期差大的锂矿板块，迎接主升浪\n1、海外锂矿企业2025年第四季度季报已全部披露，受碳酸锂价格大幅波动影响，企业对行业前景持谨慎态度，2026年产量规划不及此前市场预期的激进，且无超预期资本开支计划，预示2027—2028年海外锂矿供给增量有限。\n2、根据SMM，12月19日，江西省宜春招标网发布《江西省宜丰县圳口里-奉新县枧下窝锂矿采矿项目环境影响评价第一次环评信息公示》（下称《公示》），对宜春时代新能源矿业有限公司的江西省宜丰县圳口里-奉新县枧下窝锂矿采矿项目进行第一次环评信息公示，此次环评公示流程结束后，宁德时代枧下窝锂矿复产还需要取得不同部门的许可，还需开展一系列工作，直至取得安全生产许可证，才会允许正常开采。整体来看，2026年枧下窝锂矿项目复产推进或不及市场预期。\n3、2026年2月25日津巴布韦出台的锂矿出口新政，但仅为短期的政策影响。根据该国矿业部长于2025年6月10日公布的政策，津巴布韦计划自2027年1月起禁止锂精矿出口、允许硫酸锂出口，截至目前暂无提前实施的官方公告。本次政策旨在打击走私行为、推动锂资源本地化加工，对2026年锂精矿出口实质影响偏短期，但对市场情绪冲击较大，进一步加剧了市场对关键矿产领域资源民族主义趋势及海外供给安全性的担忧。\n4、需求端，当地时间2月28日以来，美以持续对伊朗实施打击，伊朗不断展开反击，霍尔木兹海峡航运通道面临“封锁”风险，此轮冲突已将全球能源与安全局势推向一触即发的高危边缘。受中东冲突影响，原油价格持续高位，后市来看，若中东冲突继续，原油有继续冲高风险，对光伏+储能来说或将带来加速替代化石燃料的可能性，这将增加全球对锂的需求。\n5、库存方面，据SMM数据，截至4月9日，碳酸锂样本周度库存总计10.18万吨，较4月2日累库1453吨，碳酸锂有所累库。细分来看，上游冶炼厂累库507吨至1.86吨，中下游材料厂去库224吨至4.6万吨，其他环节累库1170吨至3.72万吨。\n6、综合来看，本轮碳酸锂价格或难以回到五六十万的高位，但供给端增量集中于国内企业，海外企业扩产意愿偏弱，叠加需求端动力电池、储能及出口需求高速增长的支撑下，碳酸锂价格在15万元/吨左右中枢维持的时间将显著长于市场前期预期，可按照15万元/吨价格进行长期估值测算。\n我们推荐关注二线新增锂资源量供给较多的公司，受益标的有【大中矿业】、【国城矿业】、【天华新能】、【盛新锂能】、【中矿资源】、【华友钴业】、【盐湖股份】、【藏格矿业】、【永兴材料】、【江特电机】以及【赣锋锂业】、【天齐锂业】。\n风险提示\n1）全球需求量增速不及预期；\n2）全球供给超预期；\n3）地缘政治风险。\n————————————\n欢迎联系华西有色团队及对口销售\n晏溶（SACNO:S1120519100004）/熊颖/陈宇文", "preview": "【华西有色晏溶团队】专项推荐--预期差大的锂矿板块，迎接主升浪\n1、海外锂矿企业2025年第四季度季报已全部披露，受碳酸锂价格大幅波动影响，企业对行业前景持谨慎态度，2026年产量规划不及此前市场预期的激进，且无超预期资本开支计划，预示2027—2028年海外锂矿供给增量有限。\n2、根据SMM，12月19日，江西省宜春招标网发布《江西省宜丰县圳口里-奉新县枧下窝锂矿采矿项目环境影响评价第一次环评信息公示》（下称《公示》），对宜春时代新能...", "sectors": ["农业种植", "有色", "锂电"], "companies": ["中矿资源", "华友钴业", "国城矿业", "大中矿业", "天华新能", "天齐锂业", "永兴材料", "江特电机", "盐湖股份", "盛新锂能", "藏格矿业", "赣锋锂业"], "sources": ["wechat_group_4"], "sectorRowCount": 3, "companyRowCount": 12, "timestampCount": 15, "timestamps": ["2026-04-14 09:46"]}, {"id": "evidence-225", "content": "【天风金属】锂的突破与空间20...\n【天风金属】锂的突破与空间20260414\n我们明确提示❗️【重视锂板块大机会，当前交易津巴禁矿结束是利空“靴子落地”】，供应端扰动持续存在，宜春的换证、美伊战争影响下的澳矿能源问题、甚至后续可能的智利影响，#这也是我们一直强调的在供需基本面反转后，供应端的“故事”只会越来越多。回到本质最重要的是，权益端 不断突破，算力需求当维持高位。\n[玫瑰]从供给端看，算力投入维持高位，但算力供给扩张并不等于供需匹配改善，亟需对算力进行统一的调度及运营。尽管我国算力相关资源建设加速，投入维持高水平，但是有着①算力资源利用率低；②算力的弹性需求高，具体来看，在模型训练、项目交付等阶段性任务推动下，算力需求在短期内快速攀升，而在非高峰阶段又明显回落，导致算力资源易出现阶段性紧缺与长期闲置并存的现象；③算力中心所处区域错配下导致供需不平衡；④异构资源较多导致管控难度较高的特点。在这样的特征下，如何更好的对算力进行调度运营则更显得重要，而算力调度平台则是实现这一点的基础。\n[玫瑰]从产业链的角度出发，总共涉及供给方、需求方以及中间方。需求方主要由政府及企业构成，供给方主要是算力资源提供商，主要为用户提供通算、智算、超算等软硬件计算能力的主体。中间方则是算力运营调度平台主体，主要对接供需，并完成最终的算力互通。按照运营主体来进行分类，则主要包括运营商主导，以及企业或云厂商主导。由运营商主导的平台可依托其全国范围的网络覆盖和基础设施，整合跨区域、跨服务商、跨架构的异构算力资源；由科技企业、行业服务商主导的平台则聚焦垂直领域或特定技术，资源整合范围相对集中。\n[玫瑰]算力调度运营商业模式的核心是通过算力资源池化、智能调度与市场化服务实现价值变现，主要涵盖算力银行、算力超市两大创新形态，辅以算力租赁、调度佣金、增值服务等多元盈利路径。算力银行借鉴金融存贷逻辑，以算力存管、错峰调度、价值变现为核心盈利模式。算力超市是算力领域的“电商平台”，以资源聚合、按需选购、交易撮合为核心盈利逻辑。\n#投资建议。我们建议关注算力调度运营相关企业，如并行科技、思特奇、中科曙光、东方国信、广电运通、云赛智联等。\n详情请参阅完整外发报告，欢迎交流！", "preview": "【广发计算机刘雪峰团队 | 国...\n【广发计算机刘雪峰团队 | 国产算力调度运营的机会】\n[玫瑰]用新形态继续突破，算力需求增强态势不减。以OpenClaw为例，其带来的丰富功能和便捷化操作大大推动了相关Agent应用的落地。AI Agent对于Tokens的消耗远高于AI大模型文字生成任务。我们预期伴随应用的持续发展，以及新形态的不断突破，算力需求当维持高位。\n[玫瑰]从供给端看，算力投入维持高位，但算力供给扩张并不等于供需匹配改善...", "sectors": ["信创", "国产算力"], "companies": ["东方国信", "中科曙光", "云赛智联", "并行科技", "广电运通", "思特奇"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 2, "companyRowCount": 6, "timestampCount": 8, "timestamps": ["2026-04-14 07:25"]}, {"id": "evidence-280", "content": "华工科技称1.6T光模块在手订单40万只\n4月14日凌晨，华工科技发布2026年一季度业绩预告，其光互联业务盈利同比大增约120%，证实了AI算力驱动下400G/800G/1.6T等高速光模块出货量的大幅提升。这一业绩兑现不仅验证了公司在全球高速光模块第一梯队的交付能力，更关键的是其1.6T产品预计在二季度末实现月产5万只的产能规划，为后续订单放量和业绩持续高增长提供了清晰的产能指引。\n关注：华工科技（Q1光模块业务利润翻倍，1.6T产能即将落地）/中际旭创/新易盛（行业龙头，业绩高增长确定性强，形成板块共振）/华懋科技（为华工科技NPO产品提供封装和PCBA，深度绑定下游客户）/源杰科技/长光华芯（作为上游CW激光器核心供应商，受益于高速光模块放量需求）", "preview": "华工科技称1.6T光模块在手订单40万只\n4月14日凌晨，华工科技发布2026年一季度业绩预告，其光互联业务盈利同比大增约120%，证实了AI算力驱动下400G/800G/1.6T等高速光模块出货量的大幅提升。这一业绩兑现不仅验证了公司在全球高速光模块第一梯队的交付能力，更关键的是其1.6T产品预计在二季度末实现月产5万只的产能规划，为后续订单放量和业绩持续高增长提供了清晰的产能指引。\n关注：华工科技（Q1光模块业务利润翻倍，1.6T产...", "sectors": ["OCS", "光模块"], "companies": ["中际旭创", "华工科技", "华懋科技", "新易盛", "源杰科技", "长光华芯"], "sources": ["wechat_group_1"], "sectorRowCount": 2, "companyRowCount": 6, yRowCount": 2, "timestampCount": 3, "timestamps": ["2026-04-13 22:44"]}, {"id": "evidence-240", "content": "柔性太阳翼成为新趋势，封装材料...\n柔性太阳翼成为新趋势，封装材料迎来发展奇点\n1、柔性太阳翼是商业卫星发展的新趋势\n太阳翼是卫星的主要能量来源，随着发电功率持续提升，对应的体积和重量不断增加。太阳翼技术发展趋势是从刚性走向柔性，柔性太阳翼具有重量轻、体积小等优势，有助于大幅降低卫星的发射成本，可减少燃料消耗以及执行更多任务。\n2、柔性太阳翼封装材料体系迎来新变化\n# 中间增强层为玻璃纤维增强复合材料，中间层两侧为胶黏剂层，胶黏剂层外侧为PI膜，PI膜外层还有原子氧防护层。\n# 技术路线多元：UTG技术难度较高，目前已在中国空间站有应用；CPI膜弯曲半径更小，而且可进一步减重；赝形玻璃盖片可以结合高分子聚合物和石英微珠的优点。\n# 在航天领域已普遍应用，并且实现了国产化，未来要提升与PI膜的结合力，同时降低易挥发组分的含量。\n# 金属银已有成熟应用，但抗原子氧能力较弱；钼与可伐均具有良好的耐原子氧性能，可通过镀银来提高可焊性；导电胶互连技术无需采用助焊剂作为辅助材料，而且加热温度较低。\n3、光伏公司加快产业布局打造新增长点\n福斯特拥有电子级PI膜生产能力，规划向柔性太阳翼领域拓展；钧达股份投资参股上海星翼芯能科技有限公司，双方将成立CPI膜、CPI膜与晶硅电池结合产品的生产制造合资企业。国内企业在UTG方面已经实现对下游客户的批量交付，而且逐步掌握技术壁垒更高的一次成型技术。浆料公司持续关注太空光伏领域的应用，部分产品已经应用在商用卫星太阳翼上。", "preview": "柔性太阳翼成为新趋势，封装材料...\n柔性太阳翼成为新趋势，封装材料迎来发展奇点\n1、柔性太阳翼是商业卫星发展的新趋势\n太阳翼是卫星的主要能量来源，随着发电功率持续提升，对应的体积和重量不断增加。太阳翼技术发展趋势是从刚性走向柔性，柔性太阳翼具有重量轻、体积小等优势，有助于大幅降低卫星的发射成本，可减少燃料消耗以及执行更多任务。\n2、柔性太阳翼封装材料体系迎来新变化\n# 中间增强层为玻璃纤维增强复合材料，中间层两侧为胶黏剂层，胶黏剂层外...", "sectors": ["太空算力"], "companies": ["福斯特", "钧达股份"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 2, "timestampCount": 3, "timestamps": ["2026-04-14 18:54"]}, {"id": "evidence-118", "content": "浙江金七门核电项目集中测量工作...\n浙江金七门核电项目集中测量工作正式启动。【混凝土阶段结束、意味着设备要入场了】\n中国核建、中核科技。", "preview": "浙江金七门核电项目集中测量工作...\n浙江金七门核电项目集中测量工作正式启动。【混凝土阶段结束、意味着设备要入场了】\n中国核建、中核科技。", "sectors": ["核聚变"], "companies": ["中国核建", "中核科技"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 2, "timestampCount": 3, "timestamps": ["2026-04-14 09:46"]}, {"id": "evidence-215", "content": "需求侧Token消费指数级增长...\n需求侧Token消费指数级增长叠加高端GPU供给约束，云计算行业有望迎来涨价与算力通胀共振\n#海内外云厂商进入集中提价窗口，覆盖算力、存储、模型Token调用等关键环节，云服务从价格战走向价值定价与资源稀缺定价。（1）海外：AWS于1月对机器学习Capacity Blocks上调约15%；谷歌云自5月起对网络/AI基础设施实行结构性提价（北美出站流量费率提升100%）；（2）国内：阿里云与百度智能云宣布4月18日起对AI算力及智算存储上调5%-34%/5%-30%；腾讯云宣布5月9日起对AI算力、容器TKE与EMR刊例价统一上调5%（年内第二次）。\n#供需驱动定价权切换：需求侧Token“爆量”，供给侧高端算力/存储紧缺。（1）需求端：推理侧成为核心增长引擎，据OpenRouter，头部模型周度Tokens调用自2025/3/24前的1.62T升至2026/3/16前的18T（ nt": 2, "timestamps": ["2026-04-14 08:32"]}, {"id": "evidence-54", "content": "【中信建投大化工】卫星化学20...\n【中信建投大化工】卫星化学2026Q1年报点评：业绩符合预期，油气套利打开盈利空间\n[礼物]事件：\n⭕卫星化学发布2026年一季度报告，2026Q1实现营收126.8亿元，同/环比+2.8%/+12.2%，实现归母净利润21.2亿元，同/环比+35.0%/+36.1%，实现扣非归母净利润19.5亿元，同/环比+15.5%/-4.9%。\n[红包]点评\n⭕C2价差趋势向好，Q1盈利改善\n2026Q1，在地缘局势波动的影响下，公司核心生产环节价差有较大变动，C2方面，乙烷均价为23.4美分/加仑，同/环比-14.5%/-11.9%，乙烷裂解价差为2483.6元/吨，同/环比-2.7%/+45.4%；C3方面，丙烷均价为4988.7元/吨，同/环比+9.6%/+24.1%，PDH价差为834.4元/吨，同/环比-41.4%/-31.3%。乙烷裂解价差环比大幅扩张，推动公司归母净利润环比大幅提升。而一体化的布局则是公司的竞争力所在，给予了公司穿越周期的盈利稳健性，在报表端则体现为价差同比收窄的同时利润端同比改善。\n⭕海外乙烯产能加速退出，乙烷裂解套利空间可期\n乙烯及其下游产品主要由油头定价，伊朗局势导致油价攀升，推动乙烯价格快速上涨。然而进口乙烷价格与美国天然气价格挂钩，在美国天然气出口设施接近满负荷情况下，美国天然气价格易跌难涨，使得乙烷裂解环节套利空间显著。2月28日当周至3月28日当周，乙烷裂解周度平均价差由1633.1元/吨修复至6685.5元/吨，公司将充分受益。另一方面，近几年欧洲石化产能持续退出，韩国计划削减270-370万吨/年乙烯产能，高油价有望推动海外产能加速退出，加速修复乙烯供需平衡表，趋势性改善乙烯价差。\n⭕持续研发投入攻克高端材料，项目不断落地增厚盈利中枢\n卫星化学研发费用率常年处于行业领先水平， 2025年研发费用达16.56亿元，专利数同比增长27%，且公司聚焦关键核心技术攻关与“卡脖子”技术突破，在α-烯烃、POE、碳氢冷却液、多相和均相催化剂等领域多项成果打破国际垄断、填补国内空白。此外，公司注重产业落地，α-烯烃及 POE 产业链、高端聚烯烃等高端产业链建设持续推进，年产16万吨高分子乳液、年产30万吨高吸水性树脂、年产20万吨精丙烯酸、年产26万吨芳烃联合装置等项目有序建设，将持续增厚公司盈利中枢。\n☎欢迎交流：杨晖13717871708/吴宇13248068705", "preview": "【中信建投大化工】卫星化学20...\n【中信建投大化工】卫星化学2026Q1年报点评：业绩符合预期，油气套利打开盈利空间\n[礼物]事件：\n⭕卫星化学发布2026年一季度报告，2026Q1实现营收126.8亿元，同/环比+2.8%/+12.2%，实现归母净利润21.2亿元，同/环比+35.0%/+36.1%，实现扣非归母净利润19.5亿元，同/环比+15.5%/-4.9%。\n[红包]点评\n⭕C2价差趋势向好，Q1盈利改善\n2026Q1，在...", "sectors": ["石油石化"], "companies": ["卫星化学"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-14 08:32"]}, {"id": "evidence-219", "content": "【中泰化工】中国心连心化肥：核...\n【中泰化工】中国心连心化肥：核心产品量价齐升，归母净利润同比大增\n[玫瑰]公司发布业绩预告，26Q1实现收入67-70亿元，同比+15%~20%，归母净利润2.8-3.0亿元，同比+41%~52%。\n[玫瑰]#业绩增长驱动：尿素、三聚氰胺等核心产品量价齐升。产销端，九江二期顺利投产、新乡新材料一期进入试产阶段，产能规模持续扩张；同时九江项目具备显著成本优势，进一步夯实公司盈利基底。价格端，受益于产品结构优化叠加中东局势扰动供给，尿素、三聚氰胺等产品售价同比上行。据百川盈孚，26Q1尿素、三聚氰胺均价分别为1786.8元/吨、5725.5元/吨，同比+ 1.6%、+5.4%；其中#三聚氰胺自3月中旬价格大幅跳涨、截至4月13日已升至9483元/吨，预计Q2将贡献更为显著的涨价红利。\n[玫瑰]关注尿素出口机遇。中东地缘冲突导致全球尿素供应收缩、国际价格飙升（4月13日大颗粒尿素FOB价格810美 l Advisors Pty Ltd、Kestrel Coal（EMR）Limited 、EMR Capital ManagementLimited，以及Adaro Capital Limited（“ACL”），签署具有约束力的交易文件，拟收购红隼煤炭集团100%权益，间接取得红隼煤矿80%权益，交易对价上限为24亿美元，包括18.5亿美元首付现金对价及最高不超过5.5亿美元的或有现金对价。\n红隼煤矿拥有行业领先的生产效率。红隼煤矿位于昆士兰州鲍文盆地，是澳大利亚最大的在产井工煤矿之一，每年可产600万吨商品煤，主产优质硬焦煤(约占80%)，辅以半软焦煤与动力煤，产品以低灰分、高流动性、高塑性、有害元素含量低为特点，主要销往日本、韩国、印度及东南亚等亚洲钢铁企业市场。截至2025年9月1日，红隼煤矿JORC规范可销售储量和资源量分别为1.64亿吨和4.06亿吨(红隼煤矿100%权益口径)，矿山服务年限约25年，并具备进一步延长的潜力。红隼煤矿位于全球海运冶金煤供应利润曲线前35%，离岸单位成本147澳元/吨。\n兖煤澳大利亚储量有望增加17%，产量增加12%，利润增厚6%。收购完成后，兖煤澳大利亚可销售储量增厚17%，原煤产量增加12%，权益可销售煤炭产量增加12%。2025年红隼集团实现税后利润18.1百万美元，以2025年业绩为基数测算，若股权收购完成，兖煤澳大利亚业绩增厚6.2%，兖州煤业利润增厚0.9%。\n资料来源：公司公告\n风险提示：交易仍存在不确定性。\n免责声明：基于公开资料整理，可能存在信息滞后或更新不及时，任何情况下不构成投资建议\n☎联系人：民生能源开采 周泰/李航/王姗姗/卢佳琪", "preview": "【国联民生 能源开采】兖矿能源...\n【国联民生 能源开采】兖矿能源：兖煤澳洲拟收购红隼煤矿80%权益，布局优质冶金煤资源\n[咖啡]事件：公司控股子公司兖煤澳洲于2026年4月14日与EMR Capital Advisors Pty Ltd、Kestrel Coal（EMR）Limited 、EMR Capital ManagementLimited，以及Adaro Capital Limited（“ACL”），签署具有约束力的交易文件...", "sectors": ["煤炭"], "companies": ["兖矿能源"], "sources": ["知识星球_调研纪要"], "sectorRowCount": 1, "companyRowCount": 1, "timestampCount": 2, "timestamps": ["2026-04-14 20:29"]}, {"id": "evidence-196", "content": "【国金新消费】家联科技：AI+...\n【国金新消费】家联科技：AI+消费级3D打印如虎添翼，双主线成长可期\n消费级3D打印26年有望迎来iPhone时刻，家联为海外产能&独家绑定拓竹唯一标的。行业需求高速放量，2026年全球设备总需求预计突破800万台，增速有望保持50%以上。头部设备厂商拓竹科技24年市占率已超30%，25年有望向40%迈进。公司为当前具备3D打印耗材海外产能且独家绑定拓竹的唯一标的，稀缺属性强化合作壁垒，在拓竹整合耗材供应链进程中有望脱颖而出，向一级供应商50%-70%份额目标迈进。泰国生产基地47条产线已于2025年底满产，后续有望扩产供应美国市场，宁波产能承接非美订单。\n非3D打印耗材业务-塑料&纸制品：海外稀缺产能+美国直联双优势，产能爬坡释放利润弹性。传统业务海外产能具备稀缺性，叠加美国渠道直联优势，助力海外大客户份额提升。2021-2025年公司固定资产由4.5亿元扩张至23亿元，但收入仅从12亿元增长至24-26亿元，产能利用率仍有较大提升空间，规模效应待释放。海外市场竞争格局与产品结构更优，凭借泰国基地产能对冲关税影响，美国子公司直连沃尔玛、Costco等核心客户，盈利空间优于国内，伴随产能利用率提升，传统业务利润弹性有望充分兑现。\n公司24年发布限制性股权激励计划，考核目标为25-27年营收不低于29.1/34.9/40.7亿元或净利润不低于1.1/2.0/3.0亿元，彰显长期发展信心。我们预测2025-2027年公司实现营收22.60/34.96/46.76亿元，同比-2.8%/+54.7%/+33.8%，归母净利润-0.76/1.98/3.80亿元，同比-233.8%/+359.7%/+91.9%。考虑到公司海外产能稀缺性及3D打印业务打开增长天花板，具备显著弹性，有望按照远期pe给较高的估值，传统主业具备稀缺产能逻辑复合增速较为可观，分部估值法测算下空间广阔\n家联科技模型拆分、纪要、3D打印行业资     }

    function 写入统计() {
      const 汇总 = 数据.summary;
      元素.去重语料数.textContent = 数字.format(汇总.uniqueEvidenceCount);
      元素.板块输出数.textContent = 数字.format(汇总.sectorRowCount);
      元素.个股输出数.textContent = 数字.format(汇总.companyRowCount);
    }

    function 写入筛选器() {
      元素.板块筛选.innerHTML = ['<option value="">全部板块</option>']
        .concat(数据.sectors.map(项 => `<option value="${转义(项.name)}">${转义(项.name)}</option>`))
        .join('');
      元素.个股列表.innerHTML = 数据.companies
        .map(项 => `<option value="${转义(项.name)}"></option>`)
        .join('');
    }

    function 写入排行() {
      元素.板块排行.innerHTML = 数据.sectors.slice(0, 14).map(项 => `
        <button class="排行按钮 ${状态.板块 === 项.name ? '选中' : ''}" data-板块="${转义(项.name)}">
          <div class="排行主行"><span>${转义(项.name)}</span><span>${数字.format(项.outputCount)} 条</span></div>
          <div class="排行副行">支撑语料 ${数字.format(项.evidenceCount)} 条</div>
        </button>
      `).join('');
      元素.个股排行.innerHTML = 数据.companies.slice(0, 14).map(项 => `
        <button class="排行按钮 ${状态.个股 === 项.name ? '选中' : ''}" data-个股="${转义(项.name)}">
          <div class="排行主行"><span>${转义(项.name)}</span><span>${数字.format(项.outputCount)} 条</span></div>
          <div class="排行副行">支撑语料 ${数字.format(项.evidenceCount)} 条</div>
        </button>
      `).join('');
    }

    function 取结果() {
      return 数据.evidences.filter(语料 => {
        if (状态.板块 && !语料.sectors.includes(状态.板块)) return false;
        if (状态.个股 && !语料.companies.includes(状态.个股)) return false;
        return true;
      });
    }

    function 写入结果() {
      const 结果 = 取结果();
      元素.结果数.textContent = `当前结果 ${数字.format(结果.length)} 条`;
      if (!结果.length) {
        元素.语料列表.innerHTML = '<div class="空状态">没有找到支撑语料。</div>';
        return;
      }
      元素.语料列表.innerHTML = 结果.map((语料, 序号) => `
        <article class="语料卡" id="${语料.id}">
          <div class="语料头">
            <div class="语料编号">语料 ${序号 + 1}</div>
            <div class="语料统计">板块行数 ${数字.format(语料.sectorRowCount)}　个股行数 ${数字.format(语料.companyRowCount)}</div>
          </div>
          <div class="信息行"><span class="信息标题">板块：</span>${转义(语料.sectors.join('、') || '无')}</div>
          <div class="信息行"><span class="信息标题">个股：</span>${转义(语料.companies.join('、') || '无')}</div>
          <div class="正文">${转义(语料.content)}</div>
          <div class="操作行">
            <button class="小按钮" data-展开="${语料.id}">展开 / 收起</button>
            <button class="小按钮" data-复制="${语料.id}">复制语料</button>
          </div>
        </article>
      `).join('');
    }

    function 同步控件() {
      元素.板块筛选.value = 状态.板块;
      元素.个股搜索.value = 状态.个股;
    }

    function 写入地址() {
      const 参数 = new URLSearchParams();
      if (状态.板块) 参数.set('板块', 状态.板块);
      if (状态.个股) 参数.set('个股', 状态.个股);
      history.replaceState(null, '', `${location.pathname}#${参数.toString()}`);
    }

    function 读取地址() {
      const 片段 = location.hash.startsWith('#') ? location.hash.slice(1) : '';
      const 参数 = new URLSearchParams(片段);
      状态.板块 = 参数.get('板块') || '';
      状态.个股 = 参数.get('个股') || '';
    }

    function 重绘() {
      同步控件();
      写入排行();
      写入结果();
      写入地址();
    }

    function 设板块(名称) {
      状态.板块 = 名称 || '';
      if (状态.个股) {
        const 个股 = 数据.companies.find(项 => 项.name === 状态.个股);
        if (个股 && 状态.板块 && !个股.sectors.includes(状态.板块)) {
          状态.个股 = '';
        }
      }
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function 设个股(名称) {
      状态.个股 = 名称 || '';
      重绘();
      document.querySelector('.主块')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('click', async (事件) => {
      const 板块按钮 = 事件.target.closest('[data-板块]');
      if (板块按钮) {
        设板块(板块按钮.dataset.板块);
        return;
      }
      const 个股按钮 = 事件.target.closest('[data-个股]');
      if (个股按钮) {
        设个股(个股按钮.dataset.个股);
        return;
      }
      const 展开按钮 = 事件.target.closest('[data-展开]');
      if (展开按钮) {
        const 卡片 = document.getElementById(展开按钮.dataset.展开);
        if (卡片) {
          卡片.classList.toggle('展开');
        }
        return;
      }
      const 复制按钮 = 事件.target.closest('[data-复制]');
      if (复制按钮) {
        const 卡片 = document.getElementById(复制按钮.dataset.复制);
        const 文本 = 卡片?.querySelector('.正文')?.textContent || '';
        await navigator.clipboard.writeText(文本);
        复制按钮.textContent = '已复制';
        setTimeout(() => {
          复制按钮.textContent = '复制语料';
        }, 1200);
      }
    });

    元素.板块筛选.addEventListener('change', 事件 => {
      状态.板块 = 事件.target.value;
      重绘();
    });

    元素.跳转个股.addEventListener('click', () => {
      const 词 = 元素.个股搜索.value.trim();
      if (!词) return;
      const 精确 = 数据.companies.find(项 => 项.name === 词);
      if (精确) {
        设个股(精确.name);
        return;
      }
      const 模糊 = 数据.companies.find(项 => 项.name.includes(词));
      if (模糊) {
        元素.个股搜索.value = 模糊.name;
        设个股(模糊.name);
      }
    });

    元素.个股搜索.addEventListener('keydown', 事件 => {
      if (事件.key === 'Enter') {
        元素.跳转个股.click();
      }
    });

    读取地址();
    写入统计();
    写入筛选器();
    重绘();
  </script>
</body>
</html>
